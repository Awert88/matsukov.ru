Wir kaufen einen Saugroboter, <strong>um Zeit zu sparen</strong>.</em></p>\n\n<p>Придаточное цели с инфинитивной конструкцией&#160;<em>um … zu</em> присоединяется к главному предложению союзом <em>um</em>. Глагол в придаточном цели стоит в конце предложения в инфинитиве (+ <em>zu</em>) и не спрягается. Если это глагол с отделяемой приставкой, то <em>zu</em> включается в состав глагола&#160;между приставкой и корнем.</p>\n\n<p><em>Ich brauche eine große Tasche, <strong>um die leeren Flaschen weg</strong>zu<strong>bringen</strong>.</em></p>\n\n<p>Придаточное цели с конструкцией <em>um … zu</em> не имеет собственного подлежащего. Поэтому такая структура возможна лишь в том случае, если речь в главном и придаточном предложении идет о&#160;лице, являющемся подлежащим в главном предложении.</p>\n\n<p><strong><em>Ich</em></strong><em> hole einen Besen. <strong>Ich </strong>kehre die Terrasse.</em></p>\n\n<p><strong><em>Ich </em></strong><em>hole einen Besen, um die Terrasse zu kehren.</em></p>\n\n<p>Если речь идет не об одном и том же лице, то придаточное цели вводится при помощи союза <em>damit</em>.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\t\t\tder Infinitiv: Инфинитив – начальная неизменяемая форма глагола. В этой форме глаголы обычно приводятся в словарях и лексиконах. Большинство инфинитивов немецких глаголов заканчивается на <em>-(e)n</em>.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40386289, "shortTitle": "Frage- und Aussagesätze", "name": "Frage- und Aussagesätze", "text": "<p><em>Woher kommst du? – Ich komme aus Spanien.</em></p>\n\n<p><em>Kommst du aus Italien? – Nein, ich komme aus Spanien.</em></p>\n\n\n\n<p><strong>W-Fragen</strong></p>\n\n<p>Man stellt W-Fragen, wenn man seinen Gesprächspartner nach bestimmten Informationen fragt. Diese Fragen kann man nicht mit „Ja“ oder „Nein“ beantworten. Die W-Fragen heißen W-Fragen, weil das erste Wort in der Frage meist mit dem Buchstaben <em>W</em> beginnt, z.B.: <em>Woher …? Wo …? Wie …?</em> Danach folgen das konjugierte Verb und das Subjekt.</p>\n\n\n\n<p><strong>Aussagesatz</strong></p>\n\n<p>In einem einfachen Aussagesatz steht das konjugierte Verb immer an zweiter Position. An der ersten Position steht oft das Subjekt.</p>\n\n\n\n<p><strong>Satzfrage</strong></p>\n\n<p>Satzfragen heißen auch Ja/Nein-Fragen, weil man auf diese Fragen mit „Ja“ oder „Nein“ antworten kann. Hier steht das konjugierte Verb an erster Stelle. Dann folgt das Subjekt.</p>\n\n\n\n<p>Man kann also eine Ja/Nein-Frage bilden, indem man die Position von Subjekt und konjugiertem Verb in einem Aussagesatz vertauscht:</p>\n\n\n\n\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>das Subjekt: Das Subjekt ist ein Sachverhalt, ein Gegenstand oder ein Lebewesen , das im Satz aktiv ist oder im Mittelpunkt des Interesses steht. Das Subjekt wird auch Satzgegenstand genannt. &#160;Es ist meist ein Nomen oder Pronomen.</p>\n\n\t\t\t<p>die W-Frage : W-Fragen sind offene Fragen, die man nicht mit „Ja“ oder „Nein“ beantworten kann. Am Anfang einer W-Frage steht ein Fragewort, das meist mit dem Buchstaben W beginnt.</p>\n\n\t\t\t<p>der Aussagesatz: In einem Aussagesatz wird eine Aussage über einen Sachverhalt getroffen. Der Satz liefert z. B. eine Information oder beschreibt eine Situation.</p>\n\n\t\t\t<p>die Satzfrage : Eine Satzfrage ist eine Frage, die man mit „Ja“ oder „Nein“ beantworten kann.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": null}, {"id": 40472632, "shortTitle": "Fragewörter: wie viel ", "name": "Fragewörter: wie viel ", "text": "<p><strong><em>Wie viel kosten die Gurken? = Was kosten die Gurken? = Wie teuer sind die Gurken?</em></strong></p>\n\n<p>In W-Fragen steht das Fragewort an der ersten Position. An zweiter Stelle steht das konjugierte Verb.</p>\n\n<p>Anstelle eines einzelnen Frageworts kann am Satzanfang aber auch ein Frageadverb (meist: <em>wie ...</em>) stehen, das aus mehreren Teilen besteht. Es handelt sich dann in der Regel um ein Fragewort plus Adjektiv.&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Fragewort/<br>\n\t\t\tFrageadverb<span style=\"background-color:transparent\"></span></p>\n\t\t\t</td>\n\t\t\t<td>Verb</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Was</strong></td>\n\t\t\t<td><strong><em>kostet</em></strong></td>\n\t\t\t<td>das Fleisch?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Wie viel</strong></td>\n\t\t\t<td><strong><em>kostet</em></strong></td>\n\t\t\t<td>das Fleisch?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Wie teuer</strong></td>\n\t\t\t<td><strong><em>ist</em></strong></td>\n\t\t\t<td>das Fleisch?</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Achte bei W-Fragen&#160;besonders auf das Subjekt. Es steht hinter dem Verb, aber du musst trotzdem die passende Verbform wählen:</p>\n\n\n", "ru": {"name": "Вопросительные слова: wie viel", "text": "<p><strong><em>Wie viel kosten die Gurken? = Was kosten die Gurken? = Wie teuer sind die Gurken?</em></strong></p>\n\n<p>В специальных вопросах вопросительное слово стоит на первом месте. На втором месте стоит спрягаемый глагол.</p>\n\n<p>Вместо одного вопросительного слова в начале предложения может стоять вопросительная конструкция, например: вопросительное наречие <em>wie</em> + наречие или прилагательное.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Вопросительное слово/<span style=\"background-color:transparent\">Вопросительное наречие</span></p>\n\t\t\t</td>\n\t\t\t<td>Глагол</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Was</strong></td>\n\t\t\t<td><strong><em>kostet</em></strong></td>\n\t\t\t<td>das Fleisch?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Wie viel</strong></td>\n\t\t\t<td><strong><em>kostet</em></strong></td>\n\t\t\t<td>das Fleisch?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Wie teuer</strong></td>\n\t\t\t<td><strong><em>ist</em></strong></td>\n\t\t\t<td>das Fleisch?</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Особое внимание в специальных вопросах следует уделять подлежащему. Оно стоит после глагола, но, тем не менее, определяет форму спрягаемого глагола.</p>\n\n\n"}}, {"id": 40557072, "shortTitle": "Indirekte Fragesätze", "name": "Indirekte Fragesätze (1)", "text": "<p>Man kann eine Frage direkt oder indirekt stellen. Bei einer indirekten Frage bildet man aus einer direkten Frage einen Nebensatz:</p>\n\n<p>Direkte Frage: <em>Wie <strong>lerne</strong> ich schnell Deutsch?</em></p>\n\n<p>Indirekte Frage: <em>Ich möchte wissen, wie ich schnell Deutsch <strong>lerne</strong>.</em></p>\n\n<p>Der Nebensatz, der mit einem Fragewort eingeleitet wird, ist häufig das Objekt des Hauptsatzes. Man nennt den Nebensatz in diesem Fall auch Objektsatz. In einem Satz aus Haupt- und Objektsatz kann auch der Hauptsatz in der Regel nicht alleine stehen:</p>\n\n<p><strong><em>Was</em></strong><em> möchte Nico wissen?</em></p>\n\n<p><em>Er möchte wissen, <strong>wie er schnell Deutsch lernt</strong>.</em></p>\n\n<p>Wie in anderen Nebensätzen trennt ein Komma den Hauptsatz von dem Nebensatz ab. Das konjugierte Verb steht normalerweise am Satzende.</p>\n\n<p>Der Hauptsatz kann ein Aussagesatz oder ein Fragesatz sein. Sieh dir dazu die Beispiele an. Achte auch auf das Satzzeichen am Satzende: Wenn der Hauptsatz ein Aussagesatz ist, steht am Ende ein Punkt. Wenn der Hauptsatz ein Fragesatz ist, steht am Ende ein Fragezeichen.</p>\n\n<p><strong>Aussagesatz </strong>+ indirekter Fragesatz:<br>\n<strong><em>Bitte sag mir</em></strong><em>, wo eine gute Sprachschule ist.</em></p>\n\n<p><strong>Fragesatz</strong> + <em>indirekter Fragesatz</em>:<br>\n<strong>Weißt du</strong>, <em>was dieses Wort bedeutet?</em></p>\n\n<p>Man verwendet indirekte Fragesätze oft, um Fragen besonders höflich zu formulieren:</p>\n\n<p><em>Ich möchte gerne wissen, wann der Kurs beginnt.<br>\nKönnen Sie mir sagen, welcher Bus zur Sprachschule fährt?</em></p>\n", "ru": {"name": "Косвенные вопросы", "text": "<p>Вопросы бывают прямые и косвенные. В косвенном вопросе прямой вопрос становится придаточным предложением:</p>\n\n<p>Прямой вопрос: <em>Wie <strong>lerne</strong> ich schnell Deutsch?</em></p>\n\n<p>Косвенный вопрос: <em>Ich möchte wissen, wie ich schnell Deutsch <strong>lerne</strong>.</em></p>\n\n<p>Придаточное предложение, которое начинается с вопросительного слова, часто выступает по отношению к главному предложению в роли дополнения. В таком случае придаточное предложение называется придаточным дополнительным. Главное предложение, имеющее при себе придаточное дополнительное, как правило, тоже не может существовать самостоятельно:</p>\n\n<p><strong><em>Was</em></strong><em> möchte Nico wissen?</em></p>\n\n<p><em>Er möchte wissen, <strong>wie er schnell Deutsch lernt</strong>.</em></p>\n\n<p>Как и прочие придаточные предложения, придаточные дополнительные в составе сложного отделяются от главного предложения запятой. Спрягаемый глагол обычно стоит в конце придаточного предложения.</p>\n\n<p>Главное предложение может быть повествовательным или вопросительным. Посмотри на примеры. Обращай особое внимание на знаки препинания в конце предложения: если главное предложение повествовательное, в конце стоит точка, если вопросительное - вопросительный знак. &#160;</p>\n\n\n\n<p><strong>Повествовательное предложение</strong> + <em>косвенный вопрос</em>:</p>\n\n<p><strong><em>Bitte</em></strong> <strong><em>sag</em></strong> <strong><em>mir</em></strong><em>, </em><em>wo</em> <em>eine</em> <em>gute</em> <em>Sprachschule</em> <em>ist</em><em>.</em></p>\n\n\n\n<p><strong>Вопросительное предложение </strong>+<em> косвенный вопрос</em>:</p>\n\n<p><strong>Weißt du</strong>, <em>was dieses Wort bedeutet?</em></p>\n\n\n\n<p>Косвенная речь используется для того, чтобы придать вопросу более вежливый характер:</p>\n\n<p><em>Ich möchte gerne wissen, wann der Kurs beginnt.</em></p>\n\n<p><em>Können Sie mir sagen, welcher Bus zur Sprachschule fährt?</em></p>\n"}}, {"id": 40617990, "shortTitle": "Indirekte Fragesätze: ob", "name": "Indirekte Fragesätze: ob (1)", "text": "<p><strong>Satzfrage</strong></p>\n\n<p>Satzfragen heißen auch Ja/Nein-Fragen, weil man auf diese Fragen mit „Ja“ oder „Nein“ antworten kann. Hier steht das konjugierte Verb an erster Stelle. Dann folgt das Subjekt.</p>\n\n<p><strong><em>Hilfst</em></strong> du<em> mir?</em><br>\n<strong><em>Kannst</em></strong> du<em> mir eine Webseite erstellen?</em></p>\n\n<p><strong>Indirekte Fragesätze, die mit <em>ob</em> eingeleitet werden</strong></p>\n\n<p>Ein <em>ob</em>-Satz ist ein Nebensatz, der mit der Konjunktion <em>ob</em> eingeleitet wird. Mit <em>ob</em>-Sätzen kann man&#160; indirekte Ja-/Nein-Fragen bilden. <em>ob</em>-Sätze sind Objektsätze, die das Objekt des Hauptsatzes bilden. In diesem Fall kann auch der Hauptsatz in der Regel nicht allein stehen. Wie du es von anderen Nebensätzen schon kennst, „wandert“ das konjugierte Verb der Satzfrage ans Ende des Nebensatzes.</p>\n\n<p><em>Ich möchte wissen, <strong>ob</strong> du mir <strong>hilfst</strong>.<br>\nIch habe dich gefragt, <strong>ob</strong> du mir eine Webseite erstellen <strong>kannst</strong>.</em></p>\n\n<p>Man verwendet indirekte Fragesätze oft, um Fragen besonders höflich zu formulieren. Der Hauptsatz kann ein Aussagesatz oder ein Fragesatz sein. Er drückt aus, dass man etwas nicht weiß bzw. etwas wissen möchte. Achte auch auf das Satzzeichen am Satzende: Wenn der Hauptsatz ein Aussagesatz ist, steht am Ende ein Punkt. Wenn der Hauptsatz ein Fragesatz ist, steht am Ende ein Fragezeichen.</p>\n\n<p><em>Können Sie mir sagen, <strong>ob</strong> Sie ein Smartphone <strong>haben</strong>?<br>\nDarf ich Sie fragen, <strong>ob</strong> Sie soziale Netzwerke <strong>nutzen</strong>?<br>\nIch möchte gerne wissen, <strong>ob</strong> es hier eine schnelle Internetverbindung <strong>gibt</strong>.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>die Satzfrage: Eine Satzfrage ist eine Frage, die man mit „Ja“ oder „Nein“ beantworten kann.</p>\n\n\t\t\t<p>der Hauptsatz: Ein Hauptsatz besteht in der Regel mindestens aus einem Subjekt und einem konjugierten Verb. Im Hauptsatz steht das Verb an der zweiten Position.</p>\n\n\t\t\t<p>der Nebensatz: Ein Nebensatz kann normalerweise nicht allein stehen. Er ist von einem übergeordneten Hauptsatz oder einem anderen Nebensatz abhängig. In einem Nebensatz steht das konjugierte Verb fast meistens ganz am Ende. Viele Nebensätze werden durch bestimmte einleitende Wörter mit dem übergeordneten Satz verbunden.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": null}, {"id": 39141284, "shortTitle": "Indirekte Rede", "name": "Indirekte Rede (1)", "text": "<p><strong>Aussagesätze in der indirekten Rede</strong></p>\n\n<p>Wenn man wiederholen möchte, was eine andere Person gesagt hat, benutzt man oft die indirekte Rede.</p>\n\n<p>Direkte Rede:</p>\n\n<p><em>Investor: „Ich will 50 % des Geschäfts haben.“</em></p>\n\n<p>Indirekte Rede:</p>\n\n<p><strong><em>Der Investor hat gesagt</em></strong><em>, <strong>dass er</strong> 50 % des Geschäfts haben <strong>will</strong>. </em><br>\n<br>\nIn der indirekten Rede benutzt man oft andere Personalpronomen als in der direkten Rede, weil sich die Perspektive verändert. Wenn das Personalpronomen das Subjekt ist, verändert sich dadurch auch die konjugierte Verbform.</p>\n\n<p>Direkte Rede: Tarek spricht über sich selbst:</p>\n\n<p><em>Tarek sagt: </em>„<strong><em>Ich</em></strong><em> mach<strong>e</strong> das nicht!“</em></p>\n\n<p>Indirekte Rede: Eine andere Person spricht über Tarek:</p>\n\n\n\n<p>Die Aussage der direkten Rede wird in der indirekten Rede oft zu einem Nebensatz, der mit <em>dass</em> beginnt. Du kannst aber auch einen Satz ohne die Konjunktion <em>dass</em> benutzen. Dann steht das konjugierte Verb an der zweiten Position.</p>\n\n<p>Direkte Rede:</p>\n\n<p><em>Pepe sagt: „Ich arbeite nicht umsonst.“</em></p>\n\n<p>Indirekte Rede mit der Konjunktion <em>dass</em>:</p>\n\n<p><em>Pepe sagt, <strong>dass</strong> <strong>er</strong> nicht umsonst <strong>arbeitet</strong>.</em></p>\n\n<p>Indirekte Rede ohne die Konjunktion <em>dass</em>:</p>\n\n<p><em>Pepe sagt, <strong>er arbeitet</strong> nicht umsonst.</em></p>\n\n<p>Die letzte Variante benutzt man besonders oft in informellen Situationen oder in informellen Texten.</p>\n", "ru": null}, {"id": 39141619, "shortTitle": "Indirekte Rede", "name": "Indirekte Rede (2)", "text": "<p><strong>Fragen in der indirekten Rede</strong></p>\n\n<p>Du hast schon gelernt, wie du indirekte Fragen bilden kannst. Dabei musst du zwischen W-Fragen und Satzfragen unterscheiden.<br>\n<br>\n<strong>W-Fragen in der indirekten Rede</strong></p>\n\n<p>W-Fragen beginnen mit einem Fragewort und enden mit einem Fragezeichen.</p>\n\n<p><em>Tarek fragt<strong>: „Wie viel Prozent</strong> <strong>will </strong>der Investor haben<strong>?“</strong></em></p>\n\n<p>In der indirekten Rede wird aus der direkten Frage ein Nebensatz. Das konjugierte Verb steht normalerweise am Ende. Der Satz endet mit einem Punkt, wenn der Hauptsatz ein Aussagesatz ist.</p>\n\n<p><em>Tarek fragt<strong>,</strong> <strong>wie viel Prozent</strong> der Investor haben <strong>will.</strong></em><br>\n<br>\nAuch bei indirekten Fragen benutzt man oft andere Personalpronomen als in der direkten Rede, wenn sich die Perspektive verändert. Wenn das Personalpronomen das Subjekt ist, verändert sich dadurch auch die konjugierte Verbform.</p>\n\n<p><em>Pepe fragt Tarek: „Warum <strong>willst du</strong> das Geschäft nicht machen?“</em></p>\n\n<p><em>Pepe fragt Tarek, warum <strong>er</strong> das Geschäft nicht machen <strong>will</strong>.</em><br>\n<br>\n<strong>Satzfragen in der indirekten Rede</strong></p>\n\n<p>Satzfragen kann man mit <em>Ja</em> oder <em>Nein</em> beantworten. Sie beginnen nicht mit einem Fragewort.</p>\n\n<p><em>Tarek fragt Max: „<strong>Bist</strong> <strong>du</strong> unzufrieden?“</em></p>\n\n<p>In der indirekten Rede wird aus der Satzfrage ein Nebensatz. Dieser Nebensatz beginnt mit der Konjunktion <em>ob</em>. Das konjugierte Verb steht normalerweise am Ende. Der Satz endet mit einem Punkt, wenn der Hauptsatz ein Aussagesatz ist.</p>\n\n<p><em>Tarek fragt Max, <strong>ob er</strong> unzufrieden <strong>ist</strong>.&#160;&#160; </em></p>\n\n\n\n\n", "ru": null}, {"id": 40563642, "shortTitle": "Konjunktionen: aber", "name": "Konjunktionen: aber", "text": "<p><strong>Hauptsatzverbindung mit <em>aber</em></strong></p>\n\n<p>Die Konjunktion <em>aber</em> kann zwei Hauptsätze miteinander verbinden:</p>\n\n<p><em>Zuerst wollte ich fliegen. Der Flug ist ausgefallen.<br>\nZuerst wollte ich fliegen, </em><strong>aber</strong><em> der Flug ist ausgefallen.</em></p>\n\n<p>Wenn man zwei Sätze mit <em>aber</em> verbindet, schränkt der zweite Satz die Aussage des ersten Satzes ein oder er beschreibt einen Gegensatz. Die Reihenfolge der Wörter verändert sich nicht.</p>\n\n<p>Sind Subjekt und konjugiertes Verb in beiden Hauptsätzen gleich, kann man sie im zweiten Satz weglassen.</p>\n\n<p><em>Ich habe ein Auto. Ich habe kein Fahrrad.<br>\nIch habe ein Auto, <strong>aber</strong> (ich habe) kein Fahrrad.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe&#160;auf Deutsch:</p>\n\n\t\t\t<p>die Konjunktion: Konjunktionen verbinden Sätze oder Satzteile miteinander. &#160;Man unterscheidet zwei Arten von Konjunktionen:</p>\n\n\t\t\t<p>1. Konjunktionen, die gleichrangige Sätze oder Satzteile miteinander verbinden, z. B.: <em>und, oder, aber</em>. Man nennt sie auch nebenordnende Konjunktionen.</p>\n\n\t\t\t<p>2. Konjunktionen, die untergeordnete Sätze &#160;mit übergeordneten Sätzen verbinden, z. B.: <em>weil, dass</em>. Man nennt sie auch unterordnende Konjunktionen.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Союзы: aber", "text": "<p><strong>Сочинительные предложения с союзом </strong><strong><em>aber</em></strong></p>\n\n<p>Союз <em>aber</em> может соединять между собой два главных предложения в составе сложного:</p>\n\n<p><em>Zuerst wollte ich fliegen. Der Flug ist ausgefallen.<br>\nZuerst wollte ich fliegen, </em><strong>aber</strong><em> der Flug ist ausgefallen.</em></p>\n\n<p>Союз <em>aber</em> выражает отношения противопоставления между двумя простыми предложениями, объединенными в одно сложное. Порядок слов в предложениях не меняется.&#160;</p>\n\n<p>Если субъект и спрягаемый глагол в главных предложениях одни и те же, во втором предложении их можно опустить. &#160;</p>\n\n<p><em>Ich habe ein Auto. Ich habe kein Fahrrad.<br>\nIch habe ein Auto, <strong>aber</strong> (ich habe) kein Fahrrad.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>die Konjunktion: Союзы соединяют между собой однородные члены предложения и простые предложения в составе сложного. Различают два типа союзов:</p>\n\n\t\t\t<p>1. Сочинительные союзы соединяют однородные члены предложения и равноправные по смыслу простые предложения. Например: <em>und</em>, <em>oder</em>, <em>aber</em>.</p>\n\n\t\t\t<p>2. Подчинительные союзы соединяют придаточные предложения с главными. Например: <em>weil</em>, <em>dass</em>.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40584479, "shortTitle": "Konjunktionen: denn", "name": "Konjunktionen: denn", "text": "<p><em>Nico möchte nicht studieren, <strong>weil </strong>er lieber mit den Händen arbeiten <strong>möchte</strong>.<br>\nNico möchte nicht studieren, <strong>denn</strong> er <strong>möchte</strong> lieber mit den Händen arbeiten.<br>\nSusanne macht ein Praktikum im Krankenhaus, <strong>weil </strong>sie die Arbeit dort kennenlernen <strong>will</strong>.<br>\nSusanne macht ein Praktikum im Krankenhaus, <strong>denn </strong>sie <strong>will </strong>die Arbeit dort kennenlernen.</em></p>\n\n<p>Du weißt schon, dass man mit <em>weil </em>+ Nebensatz (konjugiertes Verb am Ende) auf die Frage „Warum?“ antworten kann. &#160;Man kann aber auch mit <em>denn</em> + Hauptsatz (konjugiertes Verb auf Position zwei nach dem Subjekt) antworten.<br>\n&#160;<br>\nDer kausale Nebensatz mit der Konjunktion <em>weil</em> kann vor oder nach dem Hauptsatz stehen :<br>\n<em>Ich lerne Deutsch, <strong>weil </strong>ich in Berlin studieren will. </em>(Hauptsatz, Nebensatz)<br>\n<em><strong>Weil </strong>ich in Berlin studieren will, lerne ich Deutsch. </em>(Nebensatz, Hauptsatz)</p>\n\n<p>Ein Hauptsatz mit <em>denn</em> steht nie am Anfang des Gesamtsatzes:<br>\n<em>Ich lerne Deutsch, <strong>denn </strong>ich will in Berlin studieren.</em></p>\n", "ru": {"name": "Союзы: denn", "text": "<p><em>Nico möchte nicht studieren, <strong>weil </strong>er lieber mit den Händen arbeiten <strong>möchte</strong>.<br>\nNico möchte nicht studieren, <strong>denn</strong> er <strong>möchte</strong> lieber mit den Händen arbeiten.<br>\nSusanne macht ein Praktikum im Krankenhaus, <strong>denn</strong> sie <strong>will</strong> die Arbeit dort kennenlernen.<br>\nSusanne macht ein Praktikum im Krankenhaus, <strong>weil </strong>sie die Arbeit dort kennenlernen <strong>will</strong>.</em><br>\n<br>\n<br>\nТы уже знаешь, что на вопрос \"Почему?\" можно ответить с помощью союза <em>weil</em> и придаточного предложения (спрягаемый глагол в конце). Есть еще один вариант ответа: союз <em>denn</em> + главное предложение (спрягаемый глагол на втором месте после подлежащего).<br>\n<br>\nПридаточное причины с союзом <em>weil</em> &#160;может стоять до или после главного предложения:<br>\n<em>Ich lerne Deutsch, <strong>weil </strong>ich in Berlin studieren will. </em>(главное предложение, придаточное предложение)<br>\n<em><strong>Weil</strong> ich in Berlin studieren will, lerne ich Deutsch. </em>(придаточное предложение, главное предложение)<br>\n<br>\nГлавное предложение с союзом <em>denn</em> никогда не стоит в начале сложного предложения:<br>\n<em>Ich lerne Deutsch, <strong>denn </strong>ich will in Berlin studieren.</em></p>\n"}}, {"id": 40563588, "shortTitle": "Konjunktionen: oder", "name": "Konjunktionen: oder", "text": "<p><strong>Hauptsatzverbindung mit <em>oder</em></strong></p>\n\n<p>Die Konjunktion <em>oder</em> kann zwei Hauptsätze miteinander verbinden:</p>\n\n<p><em>Nehmen Sie das Zimmer für eine Nacht? Bleiben Sie länger?<br>\nNehmen Sie das Zimmer für eine Nacht <strong>oder</strong> bleiben Sie länger?</em></p>\n\n<p>Wenn man zwei Sätze mit <em>oder</em> verbindet, beschreibt man zwei verschiedene Möglichkeiten. Diese Möglichkeiten schließen sich oft (aber nicht immer) gegenseitig aus. Die Reihenfolge der Wörter verändert sich nicht.</p>\n\n<p>Sind Subjekt und konjugiertes Verb in beiden Hauptsätzen gleich, kann man sie im zweiten Satz weglassen.</p>\n\n<p><em>Möchten Sie ein Einzelzimmer? Möchten Sie ein Doppelzimmer?<br>\nMöchten Sie ein Einzelzimmer <strong>oder</strong> ein Doppelzimmer?</em></p>\n", "ru": {"name": "Союзы: oder", "text": "<p><strong>Сочинительные предложения с союзом </strong><strong><em>oder</em></strong></p>\n\n<p>Союз <em>oder</em> может соединять два главных предложения в составе сложного:</p>\n\n<p><em>Nehmen Sie das Zimmer für eine Nacht? Bleiben Sie länger?</em></p>\n\n<p><em>Nehmen Sie das Zimmer für eine Nacht <strong>oder</strong> bleiben Sie länger?</em></p>\n\n<p>Союз <em>oder</em> выражает значение выбора между двумя, иногда взаимоисключающими, возможностями. Порядок слов в предложениях не меняется.</p>\n\n<p>Если субъект и спрягаемый глагол в главных предложениях одни и те же, во втором предложении их можно опустить.&#160;</p>\n\n<p><em>Möchten Sie ein Einzelzimmer? Möchten Sie ein Doppelzimmer?</em></p>\n\n<p><em>Möchten Sie ein Einzelzimmer <strong>oder</strong> ein Doppelzimmer?</em></p>\n"}}, {"id": 39121339, "shortTitle": "Konjunktionen: sondern", "name": "Konjunktionen: sondern", "text": "<p><strong>Hauptsatzverbindung mit <em>sondern</em></strong></p>\n\n<p>Die Konjunktion <em>sondern </em>kann zwei Hauptsätze verbinden. Im ersten Satz steht eine Verneinung, meist mit <em>nicht</em> oder <em>kein</em>. Der zweite Satz, der mit <em>sondern</em> beginnt, drückt einen Gegensatz zum ersten Satz aus. In einer Satzkombination mit <em>sondern</em> wird eine Aussage, eine Meinung oder eine Vorstellung korrigiert.</p>\n\n<p><em>Wir hatten <strong>keinen</strong> Streit, <strong>sondern</strong> wir haben uns normal unterhalten.</em></p>\n\n<p><em>Bestimmt ist Selma <strong>nicht</strong> sauer, <strong>sondern</strong> sie hat viel Stress.</em><br>\n<br>\nManchmal sind das Verb und/oder das Subjekt in beiden Hauptsätzen gleich. Dann musst du sie nicht wiederholen:</p>\n\n<p><em>Du sollst Nico <strong>nicht</strong> verunsichern, <strong>sondern</strong> (du sollst) ihm helfen!</em></p>\n\n<p><em>= Du sollst Nico <strong>nicht</strong> verunsichern, <strong>sondern</strong> ihm helfen!</em><br>\n<br>\nVor <em>sondern</em> steht immer ein Komma, auch dann, wenn der zweite Satz verkürzt wird.</p>\n", "ru": null}, {"id": 39121279, "shortTitle": "Konzessive Verbindungen", "name": "Konzessive Verbindungen", "text": "<p><strong>Konzessive&#160;Satzverbindungen mit <em>trotzdem</em></strong></p>\n\n<p>Das Wort <em>trotzdem</em> ist ein Adverb, mit dem man Hauptsätze verbinden kann. Diese Adverbien heißen „Konjunktionaladverbien\" oder „satzverbindende Adverbien\".</p>\n\n<p>Wie die Konjunktion <em>obwohl</em> beschreibt das Adverb <em>trotzdem</em> oft einen Widerspruch. Ein Satz, der mit <em>trotzdem </em>beginnt, beschreibt eine Folge, die man mit den Tatsachen&#160;aus dem ersten Satz nicht erwartet.</p>\n\n<p>Beispiel:</p>\n\n<p><em>Ich bin noch sehr aktiv, obwohl ich 75 Jahre alt bin.</em></p>\n\n<p><em>= Ich bin 75 Jahre alt, trotzdem bin ich noch sehr aktiv.</em></p>\n\n\n\n<p>Wenn jemand 75 Jahre alt ist, denkt man vielleicht, dass er deshalb nicht sehr aktiv ist. Die Information im zweiten Satz (ich bin sehr aktiv) widerspricht der Erwartung, die man nach dem ersten Satz hat (ich bin 75 Jahre alt).<br>\n&#160;</p>\n\n<p><strong>Vergleich: <em>obwohl</em> und <em>trotzdem</em></strong></p>\n\n<p>Sätze mit <em>obwohl</em> und mit <em>trotzdem</em> haben die gleiche Bedeutung. Die Satzstruktur ist aber unterschiedlich:</p>\n\n<p><strong>nicht erwartete Folge </strong>– <em>obwohl</em> + Tatsache/Handlung</p>\n\n<p><em>Viele Leute sind alleine, obwohl sie online einen Partner suchen.</em></p>\n\n<p>Tatsache/Handlung – <em>trotzdem</em> + <strong>nicht erwartete Folge</strong></p>\n\n<p><strong><em>Viele Leute suchen online einen Partner</em></strong><em>, <strong>trotzdem</strong> sind sie alleine.</em><br>\n<br>\n<strong><em>obwohl</em>:</strong></p>\n\n<p>Die Konjunktion <em>obwohl</em> leitet einen Nebensatz ein. Nach <em>obwohl</em> steht das konjugierte Verb am Satzende.<br>\n<br>\n<strong><em>trotzdem</em>:</strong></p>\n\n<p>Das Adverb <em>trotzdem</em> leitet einen Hauptsatz ein. Das konjugierte Verb steht also an der zweiten Position. Zwischen den Sätzen kann ein Komma oder ein Punkt stehen.</p>\n\n<p><em>Ich liebe Abenteuer, <strong>trotzdem</strong> mag ich gemütliche Abende auf dem Sofa.</em></p>\n\n<p><em>Ich liebe Abenteuer. <strong>Trotzdem</strong> mag ich gemütliche Abende auf dem Sofa.</em></p>\n", "ru": null}, {"id": 40584493, "shortTitle": "Nebensätze: als", "name": "Nebensätze: als", "text": "<p><strong><em>Als</em></strong><em> ich jung war, gab es nicht so viele Autos.</em></p>\n\n<p>Die Konjunktion<em> als</em> kann einen temporalen Nebensatz&#160;einleiten. Temporale&#160; Nebensätze mit <em>als</em> beschreiben ein Geschehen oder einen Zustand in der Vergangenheit. Du verwendest sie, wenn etwas einmal in der Vergangenheit passiert ist. Das kann auch eine Zeitdauer sein. Das Verb steht, wie bei allen Nebensätzen, in der Regel am Ende des Satzes.</p>\n\n<p>Beispiele:</p>\n\n<p><strong><em>Als</em></strong><em> Nico am Flughafen angekommen ist, war er allein.</em><br>\n<strong><em>Als</em></strong><em> Inge ein Kind war, hatte sie kein Handy. </em></p>\n", "ru": {"name": "Придаточные предложения: als", "text": "<p><strong><em>Als</em></strong><em> ich jung war, gab es nicht so viele Autos.</em></p>\n\n<p>Союз <em>als</em> вводит придаточное предложение времени. Придаточные предложения времени с <em>als</em> описывают действия или состояния в прошлом. Их используют, когда говорят о единичном событии или временном промежутке в прошлом. Глагол стоит в конце предложения, как и в прочих придаточных предложениях.</p>\n\n<p>Примеры:</p>\n\n<p><strong><em>Als</em></strong><em> Nico am Flughafen angekommen ist, war er allein.</em><br>\n<strong><em>Als</em></strong><em> Inge ein Kind war, hatte sie kein Handy. </em></p>\n"}}, {"id": 39133661, "shortTitle": "Nebensätze: bevor", "name": "Nebensätze: bevor", "text": "<p><strong>Temporale Nebensätze, die mit <em>bevor</em> eingeleitet werden</strong></p>\n\n\n\n<p><strong>Zuerst</strong><em> habe ich als Spüljunge gearbeitet. </em><strong>Dann<em> wurde ich Koch</em></strong><em>.</em></p>\n\n<p>= <em>Ich habe als Spüljunge gearbeitet, </em><strong>bevor</strong><em> <strong>ich Koch wurde</strong>.</em><br>\n<br>\n<strong>Nebensätze mit <em>bevor</em> in der Vergangenheit</strong></p>\n\n<p>Die Konjunktion <em>bevor</em> leitet einen Nebensatz ein, der von einem übergeordneten Satz abhängig ist. Im übergeordneten Satz wird beschrieben, was zuerst passiert ist. Im Nebensatz erklärt man, was danach passiert ist.</p>\n\n<p>Du hast schon gelernt, dass es in der deutschen Sprache eine einfache Vergangenheit (Perfekt oder Präteritum) und eine Vorvergangenheit (Plusquamperfekt) gibt. In Nebensätzen mit <em>nachdem</em> verwendet man oft das <strong>Plusquamperfekt</strong>, weil die Ereignisse nicht gleichzeitig stattfinden.</p>\n\n<p>Beispiel:</p>\n\n<p><em>Nachdem ich als Spüljunge <strong>gearbeitet hatte</strong>, wurde ich Koch.</em></p>\n\n<p>Die Ereignisse in Temporalsätzen mit <em>bevor</em> finden auch nicht gleichzeitig statt. Trotzdem benutzt man in beiden Teilsätzen meistens eine einfache Vergangenheitsform. Du kannst das Perfekt oder das Präteritum verwenden.</p>\n\n<p>Beispiele:</p>\n\n<p><strong>Perfekt + Perfekt</strong></p>\n\n<p><em>Bevor ich das Restaurant <strong>eröffnet habe</strong>, <strong>habe</strong> ich als Koch <strong>gearbeitet</strong>.</em></p>\n\n<p><strong>Perfekt + Präteritum</strong></p>\n\n<p><em>Bevor ich das Restaurant <strong>eröffnet habe</strong>, <strong>musste</strong> ich mir Geld leihen.</em></p>\n\n<p><strong>Präteritum + Perfekt</strong></p>\n\n<p><em>Bevor ich Koch <strong>war</strong>, <strong>habe</strong> ich eine Ausbildung <strong>gemacht</strong>.</em></p>\n\n<p><strong>Präteritum + Präteritum</strong></p>\n\n<p><em>Bevor ich Koch <strong>war</strong>, <strong>musste</strong> ich eine Ausbildung machen.</em></p>\n\n\n\n<p>Das Plusquamperfekt verwendet man in diesen Sätzen nur selten. Wenn man es verwendet, steht es im Hauptsatz.</p>\n\n<p>Beispiel:</p>\n\n<p><em>Bevor ich nach Frankreich zog, <strong>hatte</strong> ich Französisch <strong>gelernt</strong>.</em></p>\n\n<p>Hier möchte Jacques betonen, dass er schon sehr gut Französisch konnte, als er nach Frankreich gezogen ist.</p>\n\n\n\n<p><strong>Nebensätze mit <em>bevor</em> in der Gegenwart</strong></p>\n\n<p>Du kannst Nebensätze mit <em>bevor</em> auch mit dem Präsens verwenden. Der Nebensatz mit <em>bevor</em> bezieht sich dann aber in der Regel auf die Zukunft.</p>\n\n<p>Beispiel:</p>\n\n<p><em>Bevor Jacques zu seinem Restaurant <strong>fährt</strong>, <strong>kauft</strong> er auf dem Großmarkt ein.</em></p>\n", "ru": null}, {"id": 40554819, "shortTitle": "Nebensätze: dass", "name": "Nebensätze: dass", "text": "<p><strong><em>Tarek versteht, dass Nico mit den Händen arbeiten will.</em></strong></p>\n\n<p>Ein <strong>Nebensatz</strong> kann normalerweise nicht allein stehen. Er ist von einem übergeordneten Hauptsatz oder einem Nebensatz abhängig. Zwischen dem übergeordneten Hauptsatz und dem Nebensatz steht ein Komma. In einem Nebensatz steht das konjugierte Verb fast immer am Ende. Häufig werden Nebensätze durch bestimmte einleitende Wörter mit dem übergeordneten Satz verbunden. Eines dieser einleitenden Wörter ist die unterordnende Konjunktion <em>dass</em>.</p>\n\n<p>Nebensätze mit <em>dass</em> können nicht an jeden Haupt- oder Nebensatz angeschlossen werden. Bestimmte Ausdrücke lassen die Konstruktion mit <em>dass</em> zu.</p>\n\n<p>Zu diesen Ausdrücken gehören ...</p>\n\n\n\n<p>... indirekte Aussagesätze, in denen wiedergegeben wird, was jemand z. B. gesagt, gehört oder gelesen hat:<br>\n<strong><em>Nico sagt</em></strong><em>, dass er das Studium hasst.</em></p>\n\n<p><br>\n... Verben der Wahrnehmung, des Denkens, der Gefühlsäußerung, des Wissens und des Wollens:<br>\n<strong><em>Nico glaubt</em></strong><em>, dass seine Eltern ihn nicht verstehen.</em></p>\n\n\n\n<p>... Ausdrücke mit Adjektiv + <em>sein</em>:<br>\n<strong><em>Nico ist sicher</em></strong><em>, dass er in Deutschland bleiben will.</em></p>\n\n\n\n<p>... unpersönliche Ausdrücke:<br>\n<strong><em>Es ist wichtig</em></strong><em>, dass Nico eine Arbeit findet.</em></p>\n\n\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe &#160;auf Deutsch:</p>\n\n\t\t\t<p>die Konjunktion: Konjunktionen verbinden Sätze oder Satzteile miteinander.&#160; Man unterscheidet zwei Arten von Konjunktionen:</p>\n\n\t\t\t<p>1. Konjunktionen, die gleichrangige Sätze oder Satzteile miteinander verbinden, z. B.: <em>und</em>, <em>oder</em>, <em>aber</em>. Man nennt sie auch nebenordnende Konjunktionen.</p>\n\n\t\t\t<p>2. Konjunktionen, die untergeordnete Sätze mit übergeordneten Sätzen verbinden, z. B.: <em>weil</em>, <em>dass</em>. Man nennt sie auch unterordnende Konjunktionen.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Придаточные: dass", "text": "<p><strong><em>Tarek versteht, dass Nico mit den Händen arbeiten will.</em></strong></p>\n\n<p><strong>Придаточное предложение</strong> обычно не может существовать самостоятельно. В составе сложного предложения оно зависит от главного или другого придаточного предложения. Придаточное предложение отделяется от главного запятой. В придаточном предложении спрягаемый глагол обычно стоит в конце. Придаточные предложения соединяются с предложениями, от которых зависят, &#160;при помощи союзов и союзных слов. Например, с помощью союза <em>dass</em>.</p>\n\n<p>Придаточные предложения с <em>dass</em> можно присоединять не ко всем главным и придаточным предложениям. Конструкция с <em>dass</em> возможна только при наличии определенных выражений.</p>\n\n<p>К таким выражениям относятся...</p>\n\n<p>... косвенная речь:</p>\n\n<p><strong><em>Nico sagt</em></strong><em>, dass er das Studium hasst.</em></p>\n\n\n\n<p>... глаголы, обозначающие восприятие, мышление, эмоции, знание и желание:</p>\n\n<p><strong><em>Nico glaubt</em></strong><em>, dass seine Eltern ihn nicht verstehen.</em></p>\n\n\n\n<p>... прилагательные + <em>sein</em>:</p>\n\n<p><strong><em>Nico ist sicher</em></strong><em>, dass er in Deutschland bleiben will.</em></p>\n\n\n\n<p>... безличные выражения:</p>\n\n<p><strong><em>Es ist wichtig</em></strong><em>, dass Nico eine Arbeit findet.</em></p>\n\n\n\n\n\n<table border=\"1\" cellpadding=\"0\" cellspacing=\"0\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td style=\"width:614px\">\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>die Konjunktion: Союзы соединяют между собой однородные члены предложения и простые предложения в составе сложного. Различают два типа союзов:&#160;<br>\n\t\t\t1. Сочинительные союзы соединяют однородные члены предложения и равноправные по смыслу простые предложения. Например: <em>und</em>, <em>oder</em>, <em>aber</em>.</p>\n\n\t\t\t<p>2. Подчинительные союзы соединяют придаточное предложение с главным. Например: <em>weil</em>, <em>dass</em>.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 39121202, "shortTitle": "Nebensätze: obwohl", "name": "Nebensätze: obwohl", "text": "<p><strong>Nebensätze, die mit <em>obwohl</em> eingeleitet werden</strong></p>\n\n<p>Nebensätze sind von anderen Sätzen abhängig. Sie können meistens nicht allein stehen, sondern brauchen einen übergeordneten Hauptsatz oder einen anderen übergeordneten Nebensatz. Viele Nebensätze beginnen mit einem einleitenden Wort, das den Nebensatz mit dem übergeordneten Satz verbindet.</p>\n\n<p>Nebensätze, die mit der Konjunktion <em>obwohl</em> beginnen, drücken eine Tatsache aus, die nicht die erwarteten Folgen hat. Oft gibt es einen Widerspruch zwischen dem Inhalt des übergeordneten Satzes und des Nebensatzes.</p>\n\n<p><em>Frauen bekommen Kinder, <strong>obwohl</strong> <strong>sie große Schmerzen bei der Geburt haben</strong>.</em></p>\n\n<p>Frauen haben bei einer Geburt große Schmerzen. Man könnte erwarten, dass sie keine Kinder bekommen wollen, weil sie Angst vor den Schmerzen haben. Aber sie bekommen doch Kinder.<br>\n<br>\nDer übergeordnete Satz ist oft ein Hauptsatz. Im Hauptsatz steht das Verb an der zweiten Position. Im Nebensatz steht es am Ende.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Position 1</td>\n\t\t\t<td>Position 2</td>\n\t\t\t<td>Nebensatz</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Ibrahim</em></td>\n\t\t\t<td><strong><em>arbeitet</em></strong><em>,</em></td>\n\t\t\t<td><em>obwohl er krank <strong>ist</strong>.</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nDer Nebensatz kann auch vor dem übergeordneten Satz stehen. Dann besetzt der ganze Nebensatz die erste Position und das konjugierte Verb des übergeordneten Satzes steht auf der zweiten Position.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Nebensatz = Position 1</td>\n\t\t\t<td>Position 2</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Obwohl Ibrahim krank <strong>ist</strong>,</em></td>\n\t\t\t<td><strong><em>arbeitet</em></strong></td>\n\t\t\t<td><em>er.</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nDas bedeutet: Das konjugierte Verb des <strong>Neben</strong>satzes steht <strong>vor</strong> dem Komma. Das konjugierte Verb des <strong>übergeordneten </strong>Satzes steht <strong>hinter</strong> dem Komma.</p>\n\n\n", "ru": null}, {"id": 39133511, "shortTitle": "Nebensätze: seit", "name": "Nebensätze: seit", "text": "<p><strong>Temporale Nebensätze, die mit <em>seit</em> eingeleitet werden</strong></p>\n\n<p>Die Konjunktion <em>seit</em> oder <em>seitdem</em> leitet einen temporalen Nebensatz ein, der von einem übergeordneten Satz abhängig ist. Im übergeordneten Satz wird eine Handlung oder ein Zustandbeschrieben. Diese Handlung oder der Zustand ist noch nicht beendet. Der Nebensatz gibt an, wann die Handlung oder der Zustand begonnen hat.<br>\n&#160;</p>\n\n\n\n<p><strong><em>Seit du Nico kennengelernt hast</em></strong><em>, lügst du.</em></p>\n\n<p><strong><em>= Seitdem du Nico kennengelernt hast</em></strong><em>, lügst du.</em><br>\n<br>\nHandlung: &#160;<em>Du lügst.</em></p>\n\n<p>Zeitangabe: <em>Seit(dem) du Nico kennengelernt hast, ...</em><br>\n&#160;</p>\n\n\n\n<p>In diesem Beispiel beginnt die Handlung mit einem Ereignis in der Vergangenheit. Deshalb steht im Nebensatz das <strong>Perfekt</strong> und im Hauptsatz das <strong>Präsens</strong>.</p>\n\n<p>Manchmal kann man auch im Nebensatz das Präsens benutzen.</p>\n\n<p>Beispiel:</p>\n\n<p><em>Seit du dich mit Nico <strong>triffst</strong>, <strong>lügst</strong> du.</em></p>\n\n<p>Hier wird kein einzelnes Ereignis beschrieben. Selma und Nico treffen sich oft. Sie haben in der Vergangenheit damit angefangen und treffen sich jetzt immer noch. Deshalb benutzt man hier das Präsens.</p>\n\n\n\n<p>Mehr Beispiele:</p>\n\n<p><em>Seit wir nach Deutschland <strong>gekommen sind</strong>, verbringt Selma wenig Zeit mit der Familie.</em></p>\n\n<p><em>Seit wir in Deutschland <strong>leben</strong>, verbringt Selma wenig Zeit mit der Familie.<br>\n<br>\nSeit Selma mit dem Praktikum <strong>angefangen hat</strong>, spricht sie viel Deutsch.</em></p>\n\n<p><em>Seit Selma das Praktikum <strong>macht</strong>, spricht sie viel Deutsch.</em></p>\n", "ru": null}, {"id": 40555585, "shortTitle": "Nebensätze: weil", "name": "Nebensätze: weil", "text": "\n\n<p>Ein <strong>Hauptsatz</strong> besteht in der Regel mindestens aus einem Subjekt und einem konjugierten Verb. Er ist grammatisch und inhaltlich vollständig und kann deshalb alleine stehen.</p>\n\n<p>Ein <strong>Nebensatz</strong> kann normalerweise nicht allein stehen. Er ist von einem übergeordneten Hauptsatz oder einem Nebensatz abhängig. Zwischen dem übergeordneten Hauptsatz und dem Nebensatz steht ein Komma. In einem Nebensatz steht das konjugierte Verb meistens ganz am Ende. Viele Nebensätze werden durch bestimmte einleitende Wörter mit dem übergeordneten Satz verbunden. Eines dieser einleitenden Wörter ist die Konjunktion <em>weil</em>. Ein Nebensatz, der mit <em>weil</em> beginnt, antwortet auf die Frage „Warum?“. Mit den Fragewörtern <em>warum</em>, <em>wieso</em> oder <em>weshalb</em> fragt man nach einem Grund.</p>\n\n\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>der Hauptsatz: Ein Hauptsatz besteht in der Regel mindestens aus einem Subjekt und einem konjugierten Verb. Er ist ein selbstständiger Satz, der alleine stehen kann. Im einfachen Aussagesatz steht das Verb an der zweiten Position.</p>\n\n\t\t\t<p>der Nebensatz: Ein Nebensatz kann normalerweise nicht allein stehen. Er ist von einem übergeordneten Hauptsatz oder einem anderen Nebensatz abhängig. In einem Nebensatz steht das konjugierte Verb meistens ganz am Ende. Viele Nebensätze werden durch bestimmte einleitende Wörter mit dem übergeordneten Satz verbunden.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": null}, {"id": 39121657, "shortTitle": "Nebensätze: wenn", "name": "Nebensätze: wenn (2)", "text": "<p><strong>Wiederholung: Konditionale Nebensätze mit <em>wenn</em></strong></p>\n\n<p>Die Konjunktion <em>wenn</em> leitet meistens einen konditionalen&#160;Nebensatz ein. Dieser Nebensatz kann in der Regel nicht allein stehen, sondern ist von einem übergeordneten Satz abhängig. Ein konditionaler Nebensatz drückt eine Bedingung aus. Der übergeordnete Satz beschreibt die Folge.</p>\n\n<p>Bedingung: <em>Wenn man keine Routine hat, ...</em></p>\n\n<p>Folge: ... <em>(dann) ist das Unfallrisiko größer.</em></p>\n\n<p>Du kannst im übergeordneten Satz das Wort <em>dann</em> benutzen, aber du musst es nicht. Du kannst auch sagen:</p>\n\n<p><em>Wenn man keine Routine hat, ist das Unfallrisiko größer.</em></p>\n\n<p>Du kannst auch mit dem Hauptsatz beginnen. Dann wird das Wort <em>dann</em> nicht benutzt.</p>\n\n<p><em>Das Unfallrisiko ist größer, wenn man keine Routine hat.</em></p>\n\n\n\n<p><strong>Temporale Nebensätze mit <em>wenn</em></strong></p>\n\n<p>Manchmal leitet <em>wenn</em> auch einen temporalen Nebensatz ein. Temporale Nebensätze mit <em>wenn </em>verwendet man oft bei einer gleichzeitigen Handlung in der Vergangenheit oder der Gegenwart, die sich wiederholt. Du kannst das daran erkennen, dass du in dem Satz <em>immer … wenn</em> benutzen kannst.</p>\n\n\n\n<p><em>Ich trage (immer) einen Helm auf dem Kopf, wenn ich auf der Baustelle arbeite.</em></p>\n\n<p><em>(Immer) wenn ich auf der Baustelle arbeite, trage ich einen Helm auf dem Kopf.</em><br>\n<br>\nBei einer gleichzeitigen Handlung, die nur einmal passiert, kann man einen temporalen Nebensatz mit <em>wenn</em> nur für die Zukunft oder die Gegenwart, aber nicht für die Vergangenheit benutzen.</p>\n\n<p><em>Ich komme, wenn ich mit der Arbeit fertig bin.</em></p>\n\n<p>Für gleichzeitige Handlungen in der Vergangenheit, die nur einmal passieren, verwendet man die Konjunktion <em>als</em>.</p>\n\n<p><em>Ich bin gekommen, als ich mit der Arbeit fertig war.</em></p>\n", "ru": null}, {"id": 39120340, "shortTitle": "Nebensätze: während", "name": "Nebensätze: während", "text": "<p><strong>Nebensätze mit der Konjunktion <em>während</em></strong></p>\n\n<p>Nebensätze sind von anderen Sätzen abhängig. Sie können meistens nicht allein stehen, sondern brauchen einen übergeordneten Satz&#160;. Das kann ein Hauptsatz oder ein anderer Nebensatz sein. Viele Nebensätze beginnen mit einem einleitenden Wort,&#160;das den Nebensatz mit dem&#160;übergeordneten Satz verbindet.</p>\n\n<p>Temporale Nebensätze, die mit der Konjunktion <em>während</em> beginnen, beschreiben, dass zwei – oder mehr – Dinge gleichzeitig passieren.</p>\n\n\n\n<p><em>Sebastian spricht mit Nina, <strong>während er putzt</strong>.</em></p>\n\n<p>Das konjugierte Verb steht normalerweise am Ende des Nebensatzes.<br>\n<br>\nDer Nebensatz kann auch vor dem übergeordneten Satz stehen. Dann besetzt der ganze Nebensatz die erste Position, und <strong>das konjugierte Verb des übergeordneten Satzes</strong> steht auf der zweiten Position.</p>\n\n<p>Beispiel:</p>\n\n<p><em>Während er putzt, <strong>spricht</strong> Sebastian mit Nina.</em></p>\n\n<p>Das bedeutet: Das konjugierte Verb des Nebensatzes steht vor dem&#160;Komma. Das konjugierte Verb des übergeordneten Satzes steht hinter dem Komma.</p>\n\n\n", "ru": null}, {"id": 40578621, "shortTitle": "Relativsätze verbinden", "name": "Relativsätze verbinden", "text": "<p>Du kannst zwei Relativsätze miteinander verbinden, die sich auf das gleiche Nomen oder Pronomen beziehen.</p>\n\n<p>Dabei können die Relativpronomen unterschiedlich sein:</p>\n\n<p><em>Das ist unser Schokoladenkuchen.</em></p>\n\n<p><strong><em>Er </em></strong><em>ist sehr lecker.</em> (Subjekt: Nominativ)</p>\n\n<p><em>Wir empfehlen <strong>ihn</strong> unseren Gästen sehr.</em> (Akkusativobjekt)</p>\n\n<p>Relativsatz:</p>\n\n<p><em>Das ist unser Schokoladenkuchen, <strong>der</strong> sehr lecker ist und <strong>den</strong> wir unseren Gästen sehr empfehlen.</em></p>\n\n\n\n<p>Wenn die Relativpronomen gleich sind, kann man das zweite Relativpronomen weglassen:</p>\n\n<p><em>Ein Bäcker ist ein Mann.</em></p>\n\n<p><strong><em>Er</em></strong><em> arbeitet nachts. </em>(Subjekt: Nominativ)</p>\n\n<p><strong><em>Er</em></strong><em> schläft am Tag. </em>(Subjekt: Nominativ)</p>\n\n<p><em>Ein Bäcker ist ein Mann, <strong>der</strong> nachts arbeitet und <strong>(der)</strong> am Tag schläft.</em></p>\n\n\n\n<p>Bei Relativpronomen im Akkusativ kann man auch das Subjekt weglassen, wenn es in beiden Relativsätzen identisch ist.</p>\n\n<p><em>Das ist unser Apfelkuchen.</em></p>\n\n<p><em>Wir backen <strong>ihn</strong> frisch. </em>(Akkusativobjekt)</p>\n\n<p><em>Wir servieren <strong>ihn</strong> warm. </em>(Akkusativobjekt)</p>\n\n<p><em>Das ist unser Apfelkuchen, <strong>den</strong> wir frisch backen und (<strong>den</strong> wir) warm servieren.</em></p>\n", "ru": {"name": "Два придаточных в одном", "text": "<p>Ты можешь объединить два придаточных определительных предложения, &#160;которые относятся к одному и тому же определяемому существительному или местоимению.</p>\n\n<p>При этом относительные местоимения в них могут быть разными:<br>\n<em>Das ist unser Schokoladenkuchen.</em><br>\n<strong><em>Er </em></strong><em>ist sehr lecker.</em> (подлежащее в именительном падеже)<br>\n<em>Wir empfehlen <strong>ihn</strong> unseren Gästen sehr.</em> (прямое дополнение)</p>\n\n<p>Придаточное определительное предложение:<br>\n<em>Das ist unser Schokoladenkuchen, <strong>der</strong> sehr lecker ist und <strong>den</strong> wir unseren Gästen sehr empfehlen.</em></p>\n\n\n\n<p>Если относительные местоимения совпадают, второе из них можно опустить:<br>\n<em>Ein Bäcker ist ein Mann.</em><br>\n<strong><em>Er</em></strong><em> arbeitet nachts. </em>(подлежащее в именительном падеже)<br>\n<strong><em>Er</em></strong><em> schläft am Tag. </em>(подлежащее в именительном падеже)<br>\n<em>Ein Bäcker ist ein Mann, <strong>der</strong> nachts arbeitet und <strong>(der)</strong> am Tag schläft.</em></p>\n\n\n\n<p>В предложениях с относительными местоимениями в винительном падеже можно также опустить подлежащее, если в обоих придаточных определительных предложениях оно одно и то же.</p>\n\n<p><em>Das ist unser Apfelkuchen.<br>\nWir backen <strong>ihn</strong> frisch. </em>(прямое дополнение)<br>\n<em>Wir servieren <strong>ihn</strong> warm. </em>(прямое дополнение)<br>\n<em>Das ist unser Apfelkuchen, <strong>den</strong> wir frisch backen und (<strong>den</strong> wir) warm servieren.</em></p>\n"}}, {"id": 40577906, "shortTitle": "Relativsätze: eingeschoben", "name": "Relativsätze: eingeschoben", "text": "<p><strong>Satzkonstruktionen mit Relativsätzen</strong></p>\n\n<p>Relativsätze geben nähere Informationen zu einem Nomen oder Pronomen im übergeordneten Satz. Ein Relativsatz steht in der Regel direkt hinter dem Wort, auf das er sich bezieht, und wird durch ein Komma abgetrennt. Das bedeutet, dass der übergeordnete Satz durch den Relativsatz unterbrochen werden kann. Der Satzbau des übergeordneten Satzes verändert sich dadurch nicht. Sieh dir die Beispiele an. In beiden Sätzen ist <em>Rotwein</em> das Bezugswort. Der Relativsatz steht direkt dahinter.</p>\n\n<p>Relativsatz <strong>nach</strong> dem übergeordneten Satz:</p>\n\n<p><em>Das ist der <strong>Rotwein</strong>, <strong>der</strong> auf der Speisekarte steht.</em></p>\n\n<p>Relativsatz <strong>im</strong> übergeordneten Satz:</p>\n\n<p><em>Der <strong>Rotwein</strong>, <strong>der</strong> aus dieser Region kommt, schmeckt besonders gut.</em></p>\n\n<p>Wenn der übergeordnete Satz nach dem Relativsatz weitergeht, steht auch am Ende des Relativsatzes ein Komma.</p>\n", "ru": null}, {"id": 40415625, "shortTitle": "Satzbau: Akkusativ-Objekt ", "name": "Satzbau: Akkusativ-Objekt ", "text": "<p>Viele Verben können neben dem Subjekt weitere Ergänzungen haben. Manche brauchen solche Ergänzungen, damit ein sinnvoller Satz entsteht. Diese Ergänzungen nennt man Objekte. Das können Lebewesen, Gegenstände oder auch Sachverhalte sein.</p>\n\n\n\n<p>Im Deutschen erfordern viele Verben ein Objekt im Akkusativ. Wenn das Akkusativobjekt einen Artikel hat, hat er eine der folgenden Formen:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>de<strong>n</strong>/ein<strong>en</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin</td>\n\t\t\t<td>die/eine</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral</td>\n\t\t\t<td>das/ein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>die/-</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Das Akkusativobjekt beantwortet die Frage „Wen?“ oder „Was?“ (<em>wen</em> für Personen und <em>was</em> für Gegenstände).</p>\n\n<p>Einige Verben, die ein Akkusativobjekt erfordern, sind: <em>essen, trinken, nehmen, suchen,</em> <em>kennen, machen, lieben, anrufen, besuchen, besichtigen, …</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>das Objekt: Das Objekt bezeichnet ein Lebewesen, einen Gegenstand oder einen Sachverhalt, der das Ziel einer Handlung oder eines Geschehens ist. Das Objekt wird auch Satzergänzung genannt. Es ist meist ein Nomen oder Pronomen.</p>\n\n\t\t\t<p>Ein Nomen kann im Satz unterschiedliche Funktionen haben. Es kann zum Beispiel Subjekt oder Objekt sein.&#160; Je nachdem, welche Funktion das Nomen hat, kann sich seine Form verändern. Am besten kann man eine Veränderung aber an der Form des Artikels erkennen. Man unterscheidet im Deutschen vier verschiedene Formen oder Kategorien, die man auch <em>Fälle</em> oder <em>Kasus</em> nennt.</p>\n\n\t\t\t<p>Einer dieser Fälle ist der Akkusativ.</p>\n\n\t\t\t<p>der Akkusativ: Die meisten Objekte stehen im Akkusativ. Die Artikel haben die Formen: den/einen, die/eine, das/ein, die/-.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": null}, {"id": 40411913, "shortTitle": "Satzbau: Aussagesätze", "name": "Satzbau: Aussagesätze", "text": "<p>Im einfachen Aussagesatz hat <strong>das konjugierte Verb</strong> einen festen Platz. Es steht immer an der zweiten Position. Die Stellung des <strong>Subjekts</strong> ist freier. Es steht oft am Anfang des Satzes, also vor dem konjugierten Verb.</p>\n\n<p>Man kann aber auch andere Satzteile an den Satzanfang stellen, um sie zu betonen. Oft sind das Zeitangaben oder Ortsangaben. Dann steht das Subjekt hinter dem konjugierten Verb, also an der dritten Position.</p>\n\n<p>Beispiel: Zeitangabe: <em>jetzt</em></p>\n\n\n\n\n\n<p>Beispiel: Ortsangabe: <em>in Frankreich</em>*</p>\n\n\n\n\n\n\n\n<p>*In diesem Fall besteht die Ortsangabe aus zwei Wörtern. Weil diese beiden Wörter zusammengehören, stehen sie zusammen auf der ersten Position. Das Verb steht auch hier an der zweiten Position.</p>\n\n\n\n<p>Manchmal können auch andere Satzteile an erster Stelle stehen.</p>\n\n\n", "ru": {"name": "Винительный падеж", "text": "<p><strong>Обзор: Винительный падеж</strong></p>\n\n<p>Винительный падеж может выполнять в предложении разные функции. Чаще всего он используется с дополнениями и после определенных предлогов.</p>\n\n\n\n<p><strong>Прямые дополнения</strong></p>\n\n<p>Некоторые глаголы должны всегда иметь при себе объект, чтобы предложение было осмысленным. Объекты в предложении выполняют функцию дополнения и часто стоят в винительном падеже.</p>\n\n<p><em>Ich habe <strong>einen französischen Namen</strong>.<br>\nDer Mann bestellt sicher wieder <strong>ein Schnitzel</strong>.</em></p>\n\n<p>Ты уже знаешь много глаголов, управляющих винительным падежом:</p>\n\n<p><em>haben, lernen, brauchen, anrufen, essen, trinken, nehmen, suchen,</em> <em>kennen, machen, lieben, hassen, besuchen, besichtigen, bestellen, bekommen, mögen, putzen, kontrollieren, vorbereiten, waschen, öffnen, schließen, reparieren, …</em></p>\n\n\n\n<p><strong>Повторение/продолжение темы: Предлоги, управляющие винительным падежом</strong></p>\n\n<p>Предлоги <em>für</em>, <em>um</em>, <em>durch</em>, <em>ohne</em> и <em>gegen</em> всегда управляют винительным падежом:</p>\n\n<p><em>Das Schnitzel ist <strong>für den Mann</strong> am Nachbartisch.<br>\nInge und Jacques wetten <strong>um eine Verabredung</strong>.<br>\nDer Kellner geht <strong>durch den Flur</strong> von der Küche ins Restaurant.<br>\nInge kann die Speisekarte <strong>ohne ihre Brille</strong> nicht lesen.<br>\nInge entscheidet sich <strong>gegen den Wein</strong>. Sie bestellt ein Glas Wasser.</em></p>\n\n<p>Предлог <em>bis</em> также управляет винительным падежом. Однако после предлога<em> bis</em>, как правило, нет артикля:</p>\n\n<p><em>Jacques und Inge unterhalten sich <strong>bis zwei Uhr</strong>.</em></p>\n\n<p>После предлога <em>bis</em> винительный падеж можно зачастую распознать только, если перед существительным стоит прилагательное.&#160;</p>\n\n<p>Пример: Инге и Жак договариваются о встрече. Они собираются увидеться через месяц. При прощании Жак может сказать Инге:</p>\n\n<p><em>Bis <strong>nächsten Monat</strong>, Inge! </em>(Окончание прилагательного <em>-en</em> указывает на винительный падеж.)</p>\n\n<p>Тебе уже известно, что предлог <em>entlang</em> при описании направления движения также используется с винительным падежом. В этом случае существительное в винительном падеже стоит <strong>перед</strong> предлогом.</p>\n\n<p><em>Inge und Jacques gehen <strong>die Straße entlang</strong>.</em></p>\n\n\n\n<p><strong>Артикли и местоимения в винительном падеже</strong></p>\n\n<p>В винительном падеже изменяется артикль мужского рода. Другие артикли, а также отрицательные и личные местоимения имеют идентичные формы в именительном и винительном падежах.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Именительный падеж</td>\n\t\t\t<td>Винительный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>\n\t\t\t<p><strong>der</strong></p>\n\t\t\t</td>\n\t\t\t<td><strong>den </strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p><strong>ein</strong></p>\n\t\t\t</td>\n\t\t\t<td><strong>einen</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><strong>kein</strong></td>\n\t\t\t<td><strong>keinen</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род</td>\n\t\t\t<td>die</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>eine</td>\n\t\t\t<td>\n\t\t\t<p>eine</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>keine</td>\n\t\t\t<td>keine</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род</td>\n\t\t\t<td>\n\t\t\t<p>das</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>das</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>ein</td>\n\t\t\t<td>\n\t\t\t<p>ein</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>kein</td>\n\t\t\t<td>kein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Множественное число</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>-</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>-</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>keine</td>\n\t\t\t<td>keine</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 39120196, "shortTitle": "Satzbau: Hauptsätze", "name": "Satzbau: Hauptsätze", "text": "<p><strong>Wiederholung: der Hauptsatz</strong></p>\n\n<p>Ein Hauptsatz besteht in der Regel mindestens aus einem <em><strong>Subjekt</strong></em> und einem <strong>konjugierten Verb</strong>. Er ist meistens nicht von einem anderen Satz abhängig und kann deshalb alleine stehen.</p>\n\n<p>Beispiele:</p>\n\n<p><strong><em>Otto</em></strong> <strong>verkauft</strong> ein Fahrrad.</p>\n\n<p><strong><em>Ich</em></strong> <strong>verstehe</strong> das nicht.<br>\n<br>\nIn diesen Beispielen steht das <em><strong>Subjekt </strong></em>am Anfang des Satzes. Es kann aber auch hinter dem <strong>konjugierten Verb</strong> stehen, wenn ein anderer Satzteil am Anfang steht.</p>\n\n<p>Beispiele:</p>\n\n<p><em>Heute </em><strong>verkauft</strong><em> <strong>Otto</strong> ein Fahrrad.</em></p>\n\n<p><em>Das </em><strong>verstehe </strong><em><strong>ich</strong> nicht.</em><br>\n<br>\n<br>\n<strong>Wiederholung: Satzklammer</strong></p>\n\n<p>Wenn ein Hauptsatz mehr als ein Verb oder mehrere Verbteile hat, steht das konjugierte Verb an der zweiten Position. Die anderen Verben oder Verbteile stehen am Ende des Satzes.</p>\n\n<p>Beispiele:</p>\n\n<p><em>Diese Räder </em><strong>werden</strong> <em>nicht mehr </em><strong>gebaut</strong><em>.</em></p>\n\n<p><em>Nach der Wende </em><strong>mussten</strong><em> viele Firmen </em><strong>schließen</strong><em>.</em></p>\n\n\n", "ru": null}, {"id": 39120270, "shortTitle": "Satzbau: Nebensätze", "name": "Satzbau: Nebensätze", "text": "<p><strong>Wiederholung: der Nebensatz</strong></p>\n\n<p>Ein Nebensatz kann normalerweise nicht allein stehen. Er ist von einem übergeordneten Hauptsatz oder Nebensatz abhängig.</p>\n\n<p>Beispiel:</p>\n\n<p><em>…, weil sie mehr Freiheit wollten.</em></p>\n\n<p>Hier fehlt eine Information. Man muss den Nebensatz mit einem anderen Satz verbinden:</p>\n\n<p><em>Viele Ostdeutsche haben demonstriert, weil sie mehr Freiheit wollten.</em></p>\n\n\n\n<p><strong>Wiederholung: Arten von Nebensätzen</strong></p>\n\n<p>Viele Nebensätze werden durch einleitende Wörter&#160;(unterordnende Konjunktionen,&#160;Fragewörter oder Relativpronomen) mit dem übergeordneten Satz verbunden. Sie leiten verschiedene Arten&#160;von Nebensätzen ein. Diese Arten von Nebensätzen kennst du schon:</p>\n\n<ul>\n\t<li>Kausale Nebensätze:</li>\n</ul>\n\n<p><em>Die Fahrräder werden nicht mehr gebaut, <strong>weil</strong> es die Firma nicht mehr gibt.</em></p>\n\n<ul>\n\t<li>Konditionale&#160;Nebensätze:</li>\n</ul>\n\n<p><em>Die Menschen gehen auf die Straße und demonstrieren, <strong>wenn</strong> sie unzufrieden sind.</em></p>\n\n<ul>\n\t<li>Temporale Nebensätze:</li>\n</ul>\n\n<p><em>Viele Produkte aus der DDR gab es nicht mehr, <strong>als</strong> die Grenze weg war.</em></p>\n\n<p><em>Viele Firmen aus Ostdeutschland mussten schließen, <strong>während</strong> aus Ostdeutschland und Westdeutschland ein Land wurde.</em></p>\n\n<ul>\n\t<li>Finale&#160;Nebensätze:</li>\n</ul>\n\n<p><em>Yara repariert das Fahrrad, <strong>damit</strong> es wieder richtig funktioniert.</em></p>\n\n<ul>\n\t<li>Nebensätze mit <em>dass</em> (als Objektsätze):</li>\n</ul>\n\n<p><em>Nico hat in der Schule gelernt, <strong>dass</strong> Deutschland früher geteilt war.</em></p>\n\n<ul>\n\t<li>Indirekte Fragesätze (Objektsätze):</li>\n</ul>\n\n<p><em>Ich möchte wissen, <strong>was</strong> das Wort „Wende“ bedeutet.</em></p>\n\n<ul>\n\t<li>Relativsätze:</li>\n</ul>\n\n<p><em>Das Fahrrad, <strong>das</strong> Yara von Otto gekauft hat, ist ein Klapprad.</em></p>\n\n\n\n<p><strong>Wiederholung: Position des Verbs im Nebensatz</strong></p>\n\n<p>Zwischen dem übergeordneten Satz und dem Nebensatz steht ein Komma. Das konjugierte Verb steht in der Regel am Ende des Nebensatzes. Wenn es in einem Nebensatz mehr als ein Verb gibt, stehen die anderen Verben (Infinitiv, Partizip II) vor dem konjugierten Verb.</p>\n\n<p>Der Infinitiv steht vor dem konjugierten Modalverb:</p>\n\n<p><em>Die Menschen waren unzufrieden, weil sie nicht frei <strong>reisen</strong> <strong>konnten</strong>.</em></p>\n\n<p>Das Partizip II steht vor dem konjugierten Hilfsverb:</p>\n\n<p><em>Yara erzählt, dass die Menschen für mehr Freiheit <strong>demonstriert haben</strong>.</em></p>\n\n<p><em>Die Räder werden nicht mehr gebaut, weil die Firma <strong>geschlossen wurde</strong>.</em></p>\n\n<p>Das Präfix des trennbaren Verbs wird nicht abgetrennt. Das ganze Verb steht am Ende des Satzes und wird konjugiert:</p>\n\n<p><em>Yara hat versprochen, dass sie gut auf das Klapprad <strong>aufpasst</strong>.</em></p>\n", "ru": null}, {"id": 40557186, "shortTitle": "Satzbau: Nebensätze ", "name": "Satzbau: Nebensätze (1)", "text": "<p>Nebensätze haben folgende Merkmale:</p>\n\n<ul>\n\t<li>Sie können normalerweise nicht allein stehen, sondern sind mit einem übergeordneten Satz verbunden.</li>\n\t<li>Zwischen dem übergeordneten Satz und dem Nebensatz steht ein Komma.</li>\n\t<li>Nebensätze beginnen meist mit einem einleitenden Wort, z. B. einer Konjunktion oder einem Fragewort.</li>\n\t<li>Das konjugierte Verb steht im Nebensatz meistens ganz am Ende. Es gibt nur wenige Ausnahmen.</li>\n</ul>\n\n<p>&#160;<br>\nDas konjugierte Verb „wandert“ also ans Ende des Nebensatzes:</p>\n\n\n\n\n\n<p><br>\nDu hast in dieser Einheit schon drei Arten von Nebensätzen kennen gelernt:</p>\n\n<p><em>Kausalsätze mit weil:<br>\nNico hat Yara gesucht, weil er ihre Hilfe braucht.</em></p>\n\n<p><em>Nebensätze mit dass:<br>\nNico sagt, dass er jeden Tag Deutsch lernt.</em></p>\n\n<p><em>Indirekte Fragesätze:<br>\nYara will wissen, wo Nico jetzt wohnt.</em></p>\n", "ru": null}, {"id": 40556102, "shortTitle": "Satzbau: Nebensätze", "name": "Satzbau: Nebensätze (2)", "text": "<p><strong>Nebensätze mit zwei Verben oder zwei Verbteilen</strong></p>\n\n<p>In einem Hauptsatz (Aussagesatz) steht das konjugierte Verb an der zweiten Position. Aber wenn du einen Nebensatz bildest, „wandert“ das konjugierte Verb ans Ende des Nebensatzes:</p>\n\n\n\n<p>Das bedeutet ...</p>\n\n<p>... bei Modalverben:</p>\n\n<p><strong>Das konjugierte Modalverb</strong> steht am Ende hinter dem Infinitiv.</p>\n\n<p><em>Nicos Eltern sind wütend, weil er nicht mehr studieren <strong>will</strong>.</em></p>\n\n<p>... im Perfekt:</p>\n\n<p><strong>Die konjugierte Form von <em>haben</em> oder <em>sein</em></strong> steht am Ende hinter dem Partizip II.</p>\n\n<p><em>Nico freut sich, weil Yara ihm ein Fahrrad geschenkt <strong>hat</strong>.</em></p>\n\n<p>... bei trennbaren Verben:</p>\n\n<p>Das Präfix des trennbaren Verbs wird nicht abgetrennt. <strong>Das ganze Verb</strong> steht am Ende des Satzes und wird konjugiert.</p>\n\n<p><em>Nicos Eltern sind sauer, weil er nicht <strong>zurückkommt</strong>.</em></p>\n", "ru": {"name": "Порядок слов: придаточные", "text": "<p><strong>Придаточные предложения с двумя глаголами или частями глагола</strong></p>\n\n<p>В главном (повествовательном) предложении спрягаемый глагол стоит на втором месте. В придаточном предложении спрягаемый глагол переходит на последнее место.</p>\n\n\n\n<p>Это означает, что в предложениях...</p>\n\n<p>... с модальными глаголами:</p>\n\n<p><strong>Спрягаемый&#160; модальный глагол </strong>стоит в конце предложения после инфинитива.</p>\n\n<p><em>Nicos Eltern sind wütend, weil er nicht mehr studieren <strong>will</strong>.</em></p>\n\n<p>... в прошедшем времени Perfekt:</p>\n\n<p><strong>Глаголы <em>haben</em></strong> или <strong><em>sein</em></strong> в личной форме стоят на последнем месте после причастия Partizip II.</p>\n\n<p><em>Nico freut sich, weil Yara ihm ein Fahrrad geschenkt <strong>hat</strong>.</em></p>\n\n<p>... с глаголами с отделяемой приставкой:</p>\n\n<p>Приставка не отделяется. <strong>Глагол целиком</strong> стоит в конце предложения в одной из своих личных форм.</p>\n\n<p><em>Nicos Eltern sind sauer, weil er nicht <strong>zurückkommt</strong>.</em></p>\n"}}, {"id": 40556148, "shortTitle": "Satzbau: Nebensätze", "name": "Satzbau: Nebensätze (3) ", "text": "<p><strong>Nebensatz vor Hauptsatz</strong></p>\n\n<p>Nebensätze, die mit einer Konjunktion eingeleitet werden, können in der Regel auch vor den Hauptsatz gestellt werden. Dabei ändert sich die Satzstellung im Nebensatz nicht. Im Hauptsatz rückt jedoch das konjugierte Verb nach vorne und steht direkt hinter dem Komma. Der Nebensatz besetzt dann also die erste Position im übergeordneten Satz, das konjugierte Verb im Hauptsatz bleibt somit auf der zweiten Position.</p>\n\n\n\n<p>Wenn der Nebensatz vor dem Hauptsatz steht, gilt also in der Regel: Direkt vor dem Komma steht das konjugierte Verb des Nebensatzes, direkt nach dem Komma steht das konjugierte Verb des Hauptsatzes.</p>\n\n<p>Hier siehst du Beispiele mit verschiedenen Arten von Nebensätzen:</p>\n\n<p><em>Weil Nico mit dem Fahrrad schneller <strong>ist, schenkt</strong> Yara ihm ein Fahrrad.</em></p>\n\n<p><em>Dass Nico das Studium <strong>hasst, verstehen</strong> seine Eltern nicht.</em></p>\n\n<p><em>Wo die Bank <strong>ist, weiß</strong> Nico schon.</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe &#160;auf Deutsch:</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>der Hauptsatz: Ein Hauptsatz besteht in der Regel mindestens aus einem Subjekt und einem konjugierten Verb. Er ist ein selbständiger Satz, der alleine stehen kann. Im einfachen Aussagesatz steht das Verb an der zweiten Position.</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>der Nebensatz: Ein Nebensatz kann normalerweise nicht allein stehen. Er ist von einem übergeordneten Hauptsatz oder einem anderen Nebensatz abhängig. In einem Nebensatz steht das konjugierte Verb meistens ganz am Ende. Viele Nebensätze werden durch bestimmte einleitende Wörter mit dem übergeordneten Satz verbunden.&#160;</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": null}, {"id": 40451010, "shortTitle": "Satzbau: Satzklammer", "name": "Satzbau: Satzklammer", "text": "<p>Wenn es in einem Aussagesatz mehr als ein Verb oder mehrere Verbteile gibt, gelten folgende Regeln:</p>\n\n<ul>\n\t<li>Ein Verb oder Verbteil steht an zweiter Position und wird konjugiert.</li>\n\t<li>Die anderen Verben oder Verbteile stehen am Satzende. Ihre Form wird nicht an das Subjekt angepasst, sondern bleibt immer gleich.</li>\n</ul>\n\n<p>Beispiele für diese Satzstruktur sind Sätze mit Modalverben und Sätze mit trennbaren Verben.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Ich&#160;<strong><em>muss</em></strong></td>\n\t\t\t<td>morgen</td>\n\t\t\t<td><em><strong>arbeiten.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Du&#160;<strong><em>musst</em></strong></td>\n\t\t\t<td>morgen</td>\n\t\t\t<td><em><strong>arbeiten.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ich&#160;<strong><em>stehe</em></strong></td>\n\t\t\t<td>jetzt</td>\n\t\t\t<td><em><strong>auf.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Er&#160;<strong><em>steht</em></strong></td>\n\t\t\t<td>jetzt</td>\n\t\t\t<td><em><strong>auf.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ich&#160;<strong><em>muss</em></strong></td>\n\t\t\t<td>jetzt</td>\n\t\t\t<td><strong><em>aufstehen.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ihr&#160;<strong><em>müsst</em></strong></td>\n\t\t\t<td>jetzt</td>\n\t\t\t<td><strong><em>aufstehen.</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Die Satzteile kann man auch umstellen. Die Stellung vom konjugierten Verb und anderen Verben oder Verbteilen ändert sich aber nicht:</p>\n\n<p><em>Morgen <strong>muss</strong> ich <strong>arbeiten</strong>.<br>\nJetzt <strong>stehe</strong> ich <strong>auf</strong>.<br>\nJetzt <strong>muss</strong> ich <strong>aufstehen</strong>.</em></p>\n", "ru": {"name": "Два глагола в предложении", "text": "<p>Если в повествовательном предложении больше одного глагола или несколько глагольных частей, то действует правило:</p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span>Один глагол или&#160; часть глагола стоит в спрягаемой форме на втором месте.</li>\n\t<li><span dir=\"LTR\"></span>Другие глаголы или части глагола стоят в конце предложения. Их форма не зависит от существительного и остается неизменной.</li>\n</ul>\n\n<p>Примерами такой структуры предложения являются предложения с модальными глаголами и глаголами с отделяемой приставкой.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Ich&#160;<strong><em>muss</em></strong></td>\n\t\t\t<td>morgen</td>\n\t\t\t<td><em><strong>arbeiten.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Du&#160;<strong><em>musst</em></strong></td>\n\t\t\t<td>morgen</td>\n\t\t\t<td><em><strong>arbeiten.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ich&#160;<strong><em>stehe</em></strong></td>\n\t\t\t<td>jetzt</td>\n\t\t\t<td><em><strong>auf.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Er&#160;<strong><em>steht</em></strong></td>\n\t\t\t<td>jetzt</td>\n\t\t\t<td><em><strong>auf.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ich&#160;<strong><em>muss</em></strong></td>\n\t\t\t<td>jetzt</td>\n\t\t\t<td><strong><em>aufstehen.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ihr&#160;<strong><em>müsst</em></strong></td>\n\t\t\t<td>jetzt</td>\n\t\t\t<td><strong><em>aufstehen.</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Члены предложения можно переставлять. Позиция спрягаемого глагола и других глаголов или их частей не изменяется:</p>\n\n<p><em>Morgen <strong>muss</strong> ich <strong>arbeiten</strong>.<br>\nJetzt <strong>stehe</strong> ich <strong>auf</strong>.<br>\nJetzt <strong>muss</strong> ich <strong>aufstehen</strong>.</em></p>\n"}}, {"id": 40415556, "shortTitle": "Satzbau: Subjekt", "name": "Satzbau: Subjekt", "text": "<p>Die meisten deutschen Aussagesätze enthalten mindestens ein konjugiertes Verb und ein Subjekt. Das Subjekt ist das Lebewesen, der Gegenstand oder der Sachverhalt, über den das konjugierte Verb eine Aussage macht. Das Subjekt ist im Satz aktiv oder steht im Mittelpunkt des Interesses. Man nennt es auch Satzgegenstand. Ein Subjekt ist in der Regel ein Nomen, eine Nomengruppe oder ein Personalpronomen:</p>\n\n\n\n<p>Wenn das Subjekt ein Nomen mit Artikel ist, hat der Artikel eine der folgenden Formen:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>der/ein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin</td>\n\t\t\t<td>die/eine</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral</td>\n\t\t\t<td>das/ein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>die/-</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Diese Form nennt man Nominativ.</p>\n\n<p>Das Subjekt beantwortet die Frage „Wer?“ oder „Was?“ (<em>wer </em>für Personen und <em>was</em> für Nicht-Personen, zum Beispiel Tiere oder Sachen) und bestimmt die Form des konjugierten Verbs.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>das Subjekt: Das Subjekt ist die Person oder Sache, die im Satz aktiv ist oder im Mittelpunkt des Interesses steht. Es ist meist ein Nomen oder Pronomen.</p>\n\n\t\t\t<p>Ein Nomen kann im Satz unterschiedliche Funktionen haben. Es kann zum Beispiel Subjekt oder Objekt sein. &#160;Je nachdem, welche Funktion das Nomen hat, kann sich seine Form verändern. Am besten kann man eine Veränderung aber an der Form des Artikels erkennen. Man unterscheidet im Deutschen vier verschiedene Formen oder Kategorien, die man auch <em>Fälle</em> oder <em>Kasus</em> nennt.</p>\n\n\t\t\t<p>Einer dieser Fälle ist der Nominativ.</p>\n\n\t\t\t<p>der Nominativ: Das Subjekt steht immer im Nominativ. Die Artikel haben die Formen: der/ein, die/eine, das/ein, die/-.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": null}, {"id": 40376115, "shortTitle": "W-Fragen", "name": "W-Fragen", "text": "<p>Man stellt eine W-Frage, wenn man seinen Gesprächspartner nach einem unbekannten Sachverhalt fragt. Diese Frage kann man nicht mit „Ja“ oder „Nein“ beantworten. An erster Stelle von W-Fragen steht ein Fragewort, das meist mit dem Buchstaben <em>W</em> beginnt, z. B.:<br>\n<br>\n<em>Woher …?&#160;<br>\nWo …?&#160;<br>\nWie …?</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Fragewort</strong></td>\n\t\t\t<td><strong>konjugiertes Verb</strong></td>\n\t\t\t<td><strong>Subjekt</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Wie</td>\n\t\t\t<td>heißt</td>\n\t\t\t<td>du?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Wie</td>\n\t\t\t<td>heißen</td>\n\t\t\t<td>Sie?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Woher</td>\n\t\t\t<td>kommst</td>\n\t\t\t<td>du?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Woher</td>\n\t\t\t<td>kommen</td>\n\t\t\t<td>Sie?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Wo</td>\n\t\t\t<td>wohnst</td>\n\t\t\t<td>du?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Wo</td>\n\t\t\t<td>wohnen</td>\n\t\t\t<td>Sie?</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Grammatische Begriffe auf Deutsch:<br>\n\t\t\t&#160;<br>\n\t\t\tdie W-Frage: W-Fragen sind offene Fragen, die man nicht mit „Ja“ oder „Nein“ beantworten kann. Sie werden auch <em>Ergänzungsfragen </em>genannt. Am Anfang einer <em>W</em>-Frage steht ein Fragewort, das meist mit dem Buchstaben W beginnt.&#160;</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Специальные вопросы", "text": "<p>Специальный вопрос задают, когда хотят получить от собеседника неизвестную информацию. Такой вопрос задается специально к какому-то слову в предложении. На такой вопрос нельзя ответить \"да\" или \"нет\". На первом месте в специальных вопросах стоит вопросительное слово, которое в немецком языке в большинстве случаев начинается с буквы <strong>W</strong>, например:</p>\n\n<p><em>Woher …? </em></p>\n\n<p><em>Wo …? </em></p>\n\n<p><em>Wie …?</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Вопросительное слово</strong></td>\n\t\t\t<td><strong>Спрягаемый глагол</strong></td>\n\t\t\t<td><strong>Субъект</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Wie</td>\n\t\t\t<td>heißt</td>\n\t\t\t<td>du?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Wie</td>\n\t\t\t<td>heißen</td>\n\t\t\t<td>Sie?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Woher</td>\n\t\t\t<td>kommst</td>\n\t\t\t<td>du?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Woher</td>\n\t\t\t<td>kommen</td>\n\t\t\t<td>Sie?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Wo</td>\n\t\t\t<td>wohnst</td>\n\t\t\t<td>du?</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Wo</td>\n\t\t\t<td>wohnen</td>\n\t\t\t<td>Sie?</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\t\t\tdie W-Frage: Специальные вопросы - это открытые вопросы, на которые нельзя ответить \"да\" или \"нет\". Их также называют &#160;<em>Ergänzungsfragen</em>, поскольку они нацелены на получение дополнительной информации. В начале специальных вопросов стоит вопросительное слово, которое в немецком языке в большинстве случаев начинается c буквы <em>W</em>.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}]}, {"key": "others", "headline": "Sonstiges", "grammars": [{"id": 40378102, "shortTitle": "Formelle Gespräche", "name": "Formelle Gespräche", "text": "<p><strong>Merkmale formeller Gespräche</strong></p>\n\n<p>In Gesprächen auf einem Amt, z. B. dem Einwohnermeldeamt oder der Polizei, verwendet man die formelle Anrede. Merkmale der formellen Anrede sind:</p>\n\n<ul>\n\t<li>Man verwendet eine formelle Grußformel zur Begrüßung. Meist sagt man <em>Guten Tag</em>. Je nach Tageszeit kann man auch <em>Guten Morgen</em> oder <em>Guten Abend</em> sagen.<br>\n\t&#160;</li>\n\t<li>Wenn man den Namen seines Gesprächspartners kennt, spricht man einen Mann mit <em>Herr</em> und dem Familiennamen an, eine Frau spricht man mit <em>Frau</em> und dem Familiennamen an.<br>\n\t<em>Guten Tag, Herr Brunner!</em><br>\n\t<em>Guten Tag, Frau Brunner!</em><br>\n\t&#160;</li>\n\t<li>Man spricht seinen Gesprächspartner mit <em>Sie</em> an:<br>\n\t<em>Wie heißen Sie?<br>\n\tWoher kommen Sie?<br>\n\tWo wohnen Sie?<br>\n\tWie alt sind Sie?</em><br>\n\t&#160;</li>\n\t<li>Statt <em>dein/e</em> verwendet man <em>Ihr/e</em>:<br>\n\t<em>Wie ist Ihr Name?</em><br>\n\t<em>Wie ist Ihre Adresse?</em><br>\n\t<em>Wie ist Ihre Passnummer?</em><br>\n\t<em>Wie ist Ihre Telefonnummer?</em><br>\n\t&#160;</li>\n\t<li>Man verabschiedet sich meist mit <em>Auf Wiedersehen</em>.</li>\n</ul>\n", "ru": {"name": "Формальное общение", "text": "<p><strong>Признаки формального стиля общения </strong></p>\n\n<p>При общении в административных учреждениях, например, в отделе регистрации по месту проживания или в полиции, к собеседнику обращаются в формальном стиле. Признаки формального общения:</p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span>Использование формального приветствия. Чаще всего говорят <em>Guten</em><em> Tag</em>. В зависимости от времени суток можно также сказать <em>Guten</em><em> Morgen</em> или <em>Guten</em><em> Abend</em>.</li>\n</ul>\n\n\n\n<ul>\n\t<li>Если известно, как зовут собеседника, то используют фамилию и обращение&#160;<em>Herr </em>по отношению к мужчине<em>&#160;</em>или <em>Frau </em>по отношению&#160;к женщине.<br>\n\t<em>Guten Tag, Herr Brunner!</em><br>\n\t<em>Guten Tag, Fr
