\n\t\t\t<td>machen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Sie würden</em></td>\n\t\t\t<td>machen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Im Hauptsatz steht die konjugierte Form von <em>werden</em> an der zweiten Position. Der Infinitiv steht am Ende des Satzes.</p>\n\n<p><em>Ich <strong>würde</strong> gerne eine Ausbildung in deinem Fahrradladen <strong>machen</strong>.</em></p>\n\n<p>Im Nebensatz steht die konjugierte Form normalerweise am Ende.</p>\n\n<p><em>Ich <strong>würde</strong> die Prüfung problemlos <strong>bestehen</strong>, wenn ich noch besser Deutsch <strong>sprechen</strong> <strong>würde</strong>.</em></p>\n\n\n", "ru": null}, {"id": 39120885, "shortTitle": "Konjunktiv II: Tipps", "name": "Konjunktiv II: Tipps", "text": "<p><em>Ich bin gestresst. –&#160;Du <strong>könntest</strong> weniger arbeiten.</em></p>\n\n<p><em>Ich bin immer müde. –&#160;Du <strong>müsstest</strong> abends früher ins Bett gehen.</em></p>\n\n<p><em>Wir streiten uns oft über die Hausarbeit. –&#160;Ihr <strong>solltet</strong> einen Haushaltsplan machen.</em></p>\n\n<p>Mit den Modalverben <em>müssen, sollen, können</em> im Konjunktiv II kannst du Tipps und Empfehlungen geben. Dabei drückt <em>können</em> im Konjunktiv II einen allgemeinen Tipp und <em>müssen</em> oder <em>sollen</em> im Konjunktiv II eine stärkere Empfehlung aus:</p>\n\n<p><em>Ich fühle mich nicht gut. – </em></p>\n\n<p><em>Du <strong>könntest</strong> zum Arzt gehen.</em></p>\n\n<p><em>Du <strong>müsstest</strong> zum Arzt gehen.</em></p>\n\n<p><em>Du <strong>solltest</strong> zum Arzt gehen.</em></p>\n", "ru": {"name": "Предлоги: двойное управление", "text": "<p><strong>Предлоги с двойным управлением: винительный падеж</strong></p>\n\n<p>Большинство предлогов управляют одним и тем же падежом. Но есть также предлоги, которые в различных контекстах требуют постановку существительного в разные падежи: иногда в дательный, а иногда в винительный. Такие предлоги называются предлогами с двойным управлением. Предлогов с двойным управлением в немецком языке девять: <em>in</em>,<em> an</em>,<em> unter</em>,<em> über</em>,<em> auf, vor</em>,<em> hinter</em>,<em> neben </em>und<em> zwischen.</em></p>\n\n<p>Предлоги с двойным управлением используются с винительным падежом при указании направления движения в ответе на вопрос <em>Wohin</em><em> …?</em></p>\n\n\n\n<p><strong><em>Wohin</em></strong><em> legen die Männer das Regal?<br>\nSie legen das Regal <strong>in den Lastwagen</strong>.</em></p>\n\n<p>Сельма и ее семья упаковывают свои вещи и загружают их в грузовик:</p>\n\n<p><em>Ibrahim stellt die Kiste <strong>in den Lastwagen</strong>.<br>\nAya stellt den Spiegel <strong>an die Wand</strong>.<br>\nSelma stellt die Tasche <strong>unter den Tisch</strong>.<br>\nAya hängt die Jacken <strong>über den Stuhl</strong>.<br>\nSelma setzt den Teddy <strong>auf die Tasche</strong>.<br>\nIbrahim legt den Teppich <strong>vor den Schrank</strong>.<br>\nSelma stellt die Stühle <strong>hinter das Regal</strong>.<br>\nAya legt die Lampe <strong>neben den Schrank</strong>.<br>\nIbrahim stellt die Kiste <strong>zwischen die Stühle</strong>.</em></p>\n\n\n\n<p><strong>Слияние предлогов с артиклями</strong></p>\n\n<p>Некоторые предлоги сливаются с артиклями, образуя сокращенные формы:</p>\n\n<p><em>in + das = <strong>ins</strong><br>\nan + das = <strong>ans</strong></em></p>\n\n<p>Существуют и другие варианты слияний, которые используются редко.</p>\n\n\n\n<p><strong>Глаголы движения в пространстве </strong></p>\n\n\n\n<p>1. Переходные глаголы <em>legen</em>, <em>stellen</em> и <em>setzen</em> описывают движение в пространстве и почти всегда сопровождаются...</p>\n\n<p>●&#160;&#160;&#160;&#160; ... дополнением в винительном падеже:<br>\n<em>Aya legt <strong>die Bücher</strong> in die Kiste.</em></p>\n\n<p>●&#160;&#160;&#160;&#160; ... обстоятельством места, отвечающим на вопрос <em>Wohin ...?<br>\nAya legt die Bücher <strong>in die Kiste</strong>.</em></p>\n\n<p>С такими глаголами часто используются предлоги с двойным управлением, требующие винительный падеж.</p>\n\n\n\n<p>2. Предлоги с винительным падежом используются также для выражения необходимости изменения местоположения. В таких случаях используются модальный глагол <em>sollen</em> (без второго глагола), а также глаголы <em>kommen</em> и <em>geh</em><em>ören</em>.</p>\n\n<p><em>Die Lampe soll <strong>über den Tisch</strong>.<br>\nDer Teddy kommt <strong>auf das Bett</strong>.<br>\nDas Familienfoto gehört <strong>an die Wand</strong>.</em></p>\n\n\n\n<p><br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>die Wechselpräposition: Некоторые предлоги места&#160;управляют двумя падежами. При указании на местонахождение (<em>Wo</em><em> ...?) </em>они требуют дательный падеж. При указании на направление (<em>Wohin</em><em> ...?)</em> – винительный.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40512332, "shortTitle": "Konjunktiv II: Wünsche", "name": "Konjunktiv II: Wünsche (1)", "text": "<p>Um Sachverhalte auszudrücken, die nicht real sind, bildet man eine spezielle Form des Verbs, den Konjunktiv II. Man verwendet diese Form zum Beispiel, um Wünsche zum Ausdruck zu bringen.</p>\n\n<p>real: <em>Ich <strong>habe</strong> keinen eigenen Fahrradladen.</em></p>\n\n<p>Wunsch: <em>Ich <strong>hätte</strong> gern einen eigenen Fahrradladen.</em><br>\n<br>\n<br>\nDen Konjunktiv II von <em>haben</em> konjugiert man so:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich hätte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du hättest</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es/man hätte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir hätten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr hättet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie hätten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie hätten</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\t\t\tder <span class=\"invalid_placeholder\">Konjunktiv II</span>: Der Konjunktiv II ist eine Verbform, mit der man häufig Sachverhalte ausdrückt, die nicht real sind. Man verwendet ihn zum Beispiel, um Wünsche oder irreale Bedingungen zum Ausdruck zu bringen, aber auch, um eine Bitte besonders höflich zu formulieren oder um Vorschläge zu machen.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Konjunktiv II: желания", "text": "<p>Для выражения нереальности событий используют форму сослагательного наклонения Konjunktiv II. Ее используют также для высказывания еще осуществимых пожеланий.</p>\n\n<p>Реальность: <em>Ich</em> <strong><em>habe</em></strong> <em>keinen</em> <em>eigenen</em> <em>Fahrradladen</em><em>.</em></p>\n\n<p>Желание: <em>Ich <strong>hätte</strong> gern einen eigenen Fahrradladen.</em><br>\n<br>\n<br>\n<br>\nГлагол <em>haben</em> в сослагательном наклонении Konjunktiv II спрягается так:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>ich hätte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>du hättest</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>er/sie/es/man hätte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>wir hätten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>ihr hättet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>sie hätten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><em>Sie hätten</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\t\t\tder Konjunktiv II: Одна из форм сослагательного наклонения, при помощи которой говорящий выражает нереальность событий. В такой форме часто высказываются пожелания и просьбы в вежливой форме.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40512387, "shortTitle": "Konjunktiv II: Wünsche", "name": "Konjunktiv II: Wünsche (2)", "text": "<p>Um auszudrücken, wer, was oder wie man gern sein möchte, verwendet man eine spezielle Form von <em>sein.</em> Diese Form nennt man Konjunktiv II.</p>\n\n<p>real: <em>Ich <strong>bin</strong> nicht verheiratet.</em></p>\n\n<p>Wunsch: <em>Ich <strong>wäre</strong> gern verheiratet.</em><br>\n<br>\n<br>\nDen Konjunktiv II von <em>sein</em> konjugiert man so:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich wäre</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du wärst (du wärest)*</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es/man wäre</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir wären</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr wärt (ihr wäret)*</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie wären</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie wären</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p>* Hier existieren zwei Formen. Die Form in Klammern wird nur noch selten benutzt.</p>\n", "ru": {"name": "Konjunktiv II: желания", "text": "<p>Для высказывания еще осуществимых пожеланий с глаголом <em>sein</em> также используется сослагательное наклонение Konjunktiv II.</p>\n\n<p>Реальность: <em>Ich <strong>bin</strong> nicht verheiratet.</em></p>\n\n<p>Желание: <em>Ich <strong>wäre</strong> gern verheiratet.</em><br>\n<br>\n<br>\n<br>\nГлагол <em>sein</em> в сослагательном наклонении Konjunktiv II спрягается так:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>ich wäre</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>du wärst (du wärest)*</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>er/sie/es/man wäre</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>wir wären</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>ihr wärt (ihr wäret)*</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>sie wären</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><em>Sie wären</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p>* Существует два варианта. В скобках указан редко употребляемый вариант.</p>\n"}}, {"id": 40512461, "shortTitle": "Konjunktiv II: Wünsche", "name": "Konjunktiv II: Wünsche (3)", "text": "<p>Man kann von jedem Verb eine eigene Form des Konjunktivs II bilden. Im Alltag bildet man aber meist nur die Formen von <em>haben</em>, <em>sein </em>und den Modalverben. Bei anderen Verben verwendet man die Form <em>würde</em> + Infinitiv.</p>\n\n\n\n<p>real: Selma <strong><em>besucht</em></strong> ihre Großeltern nicht.</p>\n\n<p>Wunsch: Selma <strong>würde</strong> gern ihre Großeltern <strong>besuchen</strong>.</p>\n\n\n\n<p>real: Emma <strong><em>isst</em></strong> kein Eis.</p>\n\n<p>Wunsch: Emma <strong>würde</strong> gern ein Eis <strong>essen</strong>.</p>\n\n\n\n<p>Die Konjunktivform <em>würde</em> wird konjugiert, das zweite Verb verändert sich nicht:</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich würde</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du würdest</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es/man würde</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir würden</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr würdet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie würden</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie würden</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Konjunktiv II: желания", "text": "<p>Любой глагол можно поставить в форму сослагательного наклонения Konjunktiv II. В устной речи в такой форме используются обычно глаголы <em>haben</em>, <em>sein</em> и модальные глаголы. Все остальные глаголы при выражении пожелания в разговорной речи часто употребляются в конструкции сослагательного наклонения: <em>w</em><em>ü</em><em>rde</em> + инфинитив.<br>\n<br>\nРеальность: Selma <strong><em>besucht</em></strong> ihre Großeltern nicht.<br>\nЖелание: Selma <strong>würde</strong> gern ihre Großeltern <strong>besuchen</strong>.<br>\n<br>\nРеальность: Emma <strong><em>isst</em></strong> kein Eis.<br>\nЖелание: Emma <strong>würde</strong> gern ein Eis <strong>essen</strong>.<br>\n<br>\nФорма <em>würde</em> сослагательного наклонения Konjunktiv II спрягается, второй &#160;глагол остается без изменений.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>ich würde</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>du würdest</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>er/sie/es/man würde</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>wir würden</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>ihr würdet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>sie würden</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><em>Sie würden</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 39135723, "shortTitle": "lassen + Infinitiv", "name": "lassen + Infinitiv", "text": "<p><strong><em>lassen</em> als Hilfsverb</strong></p>\n\n<p><em>Inge und Nico können nicht kochen. Sie <strong>lassen</strong> Tarek <strong>kochen</strong>.</em></p>\n\n<p>Das Verb <em>lassen</em> wird oft als Hilfsverb benutzt. Man verwendet es dann wie ein Modalverb mit einem zweiten Verb im Infinitiv.</p>\n\n<p>Meistens bedeutet es, …</p>\n\n<p>… dass man etwas nicht selbst macht.</p>\n\n<p><em>Inge und Nico <strong>lassen</strong> Tarek <strong>kochen</strong>.</em><br>\n(Inge und Nico haben Tarek gebeten oder aufgefordert, für sie zu kochen.)</p>\n\n<p>Man benutzt <em>lassen</em> in dieser Bedeutung oft, wenn man eine Dienstleistung beschreibt.</p>\n\n<p>Beispiele:</p>\n\n<p><em>Ich gehe zum Friseur. Ich <strong>lasse</strong> mir die Haare <strong>schneiden</strong>.</em></p>\n\n<p><em>Ich fahre zur Werkstatt. Ich <strong>lasse</strong> mein Auto <strong>reparieren</strong>.</em></p>\n\n\n\n<p>… dass man jemandem erlaubt, etwas zu tun, oder etwas nicht verhindert.</p>\n\n<p><em>Nico <strong>lässt</strong> Selma mit seinem Fahrrad <strong>fahren</strong>.</em><br>\n(Selma darf mit Nicos Fahrrad fahren.)</p>\n\n\n\n<p>Das Verb <em>lassen</em> ist unregelmäßig.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich lasse</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du l</em><strong>ä</strong><em>sst</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es l</em><strong>ä</strong><em>sst</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir lassen</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr lasst</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie lassen</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie lassen</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": null}, {"id": 40450970, "shortTitle": "Modalverben", "name": "Modalverben", "text": "<p><strong>Modalverben: <em>können</em> und <em>müssen</em></strong></p>\n\n<p>Die Verben <em>können</em> und <em>müssen</em> sind Modalverben. Modalverben stehen meistens zusammen mit einem zweiten Verb im Satz. Das Modalverb beschreibt das Verhältnis des Subjekts zu der Handlung, die durch das zweite Verb ausgedrückt wird.&#160;&#160;</p>\n\n<p>Sachliche Beschreibung einer Aktivität:</p>\n\n<p><em>Ich stehe auf. </em></p>\n\n<p>Modalverb&#160;<em>können</em>: Beschreibung einer Möglichkeit oder Fähigkeit:</p>\n\n<p><em>Ich kann aufstehen. </em>(Ich bin nicht schwer krank oder verletzt. Ich bin in der Lage&#160;aufzustehen.)</p>\n\n<p>Modalverb <em>müssen</em>: Beschreibung einer Notwendigkeit:</p>\n\n<p><em>Ich muss aufstehen.</em> (Ich habe einen Termin oder muss zur Arbeit. Ich bin gezwungen&#160;aufzustehen.)</p>\n\n\n\n<p>Konjugation der Modalverben</p>\n\n<p>Modalverben werden anders konjugiert als „normale“ Verben:</p>\n\n<ul>\n\t<li>Modalverben haben im Singular oft einen anderen Vokal als im Plural.</li>\n\t<li>Die Form der ersten und der dritten Person Singular ist gleich: Das Verb hat keine Endung.&#160;&#160;</li>\n</ul>\n\n<p>Beispiel: <em>müssen</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich muss</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du <em>m<strong>u</strong>sst</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es&#160;<em>m<strong>u</strong>ss</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir müssen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr müsst</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie müssen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell</em>:</td>\n\t\t\t<td>Sie müssen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Modalverben im Satz</p>\n\n<ul>\n\t<li>In einem einfachen Aussagesatz im Präsens steht das Modalverb in konjugierter Form an der zweiten Position</li>\n\t<li>Das zweite Verb steht im Infinitiv am Satzende. Das heißt, dieses Verb wird nicht konjugiert.</li>\n</ul>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Subjekt und Modalverb</em></td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><em>2. Verb (Infinitiv)</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ich&#160;<em><strong>muss</strong></em></td>\n\t\t\t<td>morgen&#160;</td>\n\t\t\t<td><strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Du&#160;<strong><em>musst</em></strong></td>\n\t\t\t<td>morgen&#160;</td>\n\t\t\t<td><strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Er&#160;<strong><em>muss</em></strong></td>\n\t\t\t<td>morgen&#160;</td>\n\t\t\t<td><strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Wir&#160;<strong><em>müssen</em></strong></td>\n\t\t\t<td>morgen&#160;</td>\n\t\t\t<td><strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ihr&#160;<strong><em>müsst</em></strong></td>\n\t\t\t<td>morgen&#160;</td>\n\t\t\t<td><strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Sie&#160;<strong><em>müssen</em></strong></td>\n\t\t\t<td>morgen&#160;</td>\n\t\t\t<td><strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Die Satzteile kann man auch umstellen. Die Stellung von Modalverb und Infinitiv ändert sich aber nicht: <em>Morgen <strong>muss </strong>ich <strong>arbeiten.</strong></em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>das Modalverb: Modalverben sind Verben, die sich meist auf ein zweites Verb beziehen und dieses genauer bestimmen. Sie geben z. B. an, ob die Möglichkeit oder Notwendigkeit besteht, etwas zu tun. In einem Satz im Präsens wird das Modalverb konjugiert, das zweite Verb steht im Infinitiv.&#160;</p>\n\n\t\t\t<p>der Infinitiv: Der Infinitiv ist die Grundform des Verbs, die nicht konjugiert ist. In dieser Form steht ein Verb normalerweise in Vokabellisten oder im Wörterbuch. Deutsche Verben enden im Infinitiv meist auf <em>-(e)n</em>.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Модальные глаголы ", "text": "<p><strong>Модальные</strong> <strong>глаголы</strong>: <strong><em>können</em></strong> <strong>и</strong> <strong><em>müssen</em></strong></p>\n\n<p>Глаголы <em>k</em><em>ö</em><em>nnen</em> и <em>m</em><em>ü</em><em>ssen</em>&#160;–&#160;модальные. Модальные глаголы, как правило, стоят в предложении в паре с другим глаголом. Модальный глагол описывает отношение субъекта к действию, выраженному вторым глаголом.&#160;&#160;</p>\n\n<p>Объективное описание действия:<br>\n<em>Ich stehe auf. </em></p>\n\n<p>Модальный глагол <em>k</em><em>ö</em><em>nnen</em> указывает на возможность или способность:<br>\n<em>Ich kann aufstehen. (</em>Я не болен и не травмирован. Я могу встать.)</p>\n\n<p>Модальный глагол <em>m</em><em>ü</em><em>ssen</em> указывает на необходимость:<br>\n<em>Ich muss aufstehen.</em> (Мне пора на работу. Я должен вставать.)</p>\n\n\n\n<p>Спряжение модальных глаголов</p>\n\n<p>Модальные глаголы спрягаются не так, как \"нормальные\" глаголы:</p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span>Модальные глаголы имеют различные корневые гласные в единственном числе и множественном числе.</li>\n\t<li><span dir=\"LTR\"></span>Формы первого и третьего лица единственного числа совпадают: у глагола нет окончания.</li>\n</ul>\n\n<p>Пример: <em>müssen</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. лицо</td>\n\t\t\t<td>ich muss</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. &#160;лицо</td>\n\t\t\t<td>du <em>m<strong>u</strong>sst</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. &#160;лицо</td>\n\t\t\t<td>er/sie/es&#160;<em>m<strong>u</strong>ss</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. лицо</td>\n\t\t\t<td>wir müssen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. &#160;лицо</td>\n\t\t\t<td>ihr müsst</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. &#160;лицо</td>\n\t\t\t<td>sie müssen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie müssen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Модальные глаголы в предложении</p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span>В простом повествовательном предложении в настоящем времени спрягаемый глагол стоит на втором месте.</li>\n\t<li><span dir=\"LTR\"></span>Второй глагол в инфинитиве стоит в конце предложения и не спрягается.</li>\n</ul>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Подлежащее и модальный глагол</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Второй глагол (инфинитив)</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ich&#160;<em><strong>muss</strong></em></td>\n\t\t\t<td>morgen&#160;</td>\n\t\t\t<td><strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Du&#160;<strong><em>musst</em></strong></td>\n\t\t\t<td>morgen&#160;</td>\n\t\t\t<td><strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Er&#160;<strong><em>muss</em></strong></td>\n\t\t\t<td>morgen&#160;</td>\n\t\t\t<td><strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Wir&#160;<strong><em>müssen</em></strong></td>\n\t\t\t<td>morgen&#160;</td>\n\t\t\t<td><strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ihr&#160;<strong><em>müsst</em></strong></td>\n\t\t\t<td>morgen&#160;</td>\n\t\t\t<td><strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Sie&#160;<strong><em>müssen</em></strong></td>\n\t\t\t<td>morgen&#160;</td>\n\t\t\t<td><strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Члены предложения можно переставлять. Модальный глагол и инфинитив своих позиций не меняют:&#160;<em>Morgen <strong>muss </strong>ich <strong>arbeiten.</strong></em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>das Modalverb: Модальные глаголы в предложении употребляются, как правило, в паре со смысловым глаголом. Они описывают отношение субъекта к действию, выраженному смысловым глаголом. Они указывают, например, что существует возможность или необходимость действия. В предложении в настоящем времени модальный глагол спрягается, смысловой &#160;глагол стоит в инфинитиве.</p>\n\n\t\t\t<p>der Infinitiv: Инфинитив&#160;- исходная форма глагола, обозначающая действие безотносительно к лицу, числу и времени.&#160;Обычно глаголы приводятся в этой форме в словарях.&#160;Немецкие глаголы в инфинитиве обычно заканчиваются на <em>-(e)n</em>.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40460180, "shortTitle": "Modalverben: Bedeutung", "name": "Modalverben: Bedeutung", "text": "<p>Bis jetzt kennst du drei&#160;Modalverben: <em>können, müssen&#160;</em>und<em> wollen</em>:<br>\n<br>\nDas Modalverb <strong><em>können</em></strong> drückt eine Fähigkeit oder Möglichkeit aus:<br>\n<em>Nico <strong>kann</strong> studieren</em>. (Er hat die geistigen Fähigkeiten und die finanziellen Mittel für ein Studium.)<br>\nIm Singular verändert sich der Vokal <em>ö</em> zu <em>a</em>.<br>\n<br>\nDas Modalverb <em><strong>müssen</strong></em> drückt eine Notwendigkeit oder einen Zwang aus:&#160;<br>\n<em>Nico <strong>muss</strong> studieren.</em> (Seine Eltern üben Druck auf ihn aus. Wenn er nicht studiert, hat das negative Konsequenzen für ihn.)<br>\nIm Singular verändert sich der Vokal <em>ü</em> zu <em>u</em>.<br>\n<br>\nDas Modalverb <em><strong>wollen</strong></em> drückt einen Willen oder eine Absicht aus:&#160;<br>\n<em>Nico <strong>will</strong> studieren.</em> (Er hat den Wunsch oder den Plan, zu studieren.)<br>\nIm Singular verändert sich der Vokal <em>o</em> zu <em>i</em>.<br>\n<br>\nEs gibt&#160;auch&#160;ein anderes&#160;Modalverb, mit dem man&#160;einen Wunsch ausdrücken kann, nämlich&#160;<strong><em>möchten (mögen)</em></strong>:&#160;<br>\n<em>Nico <strong>möchte</strong> studieren.&#160;</em><br>\n<br>\nDie Modalverben <em>wollen</em> und <em>möchten</em>&#160;sind in ihrer Bedeutung ähnlich. Beide beschreiben etwas, das man gerne hätte oder tun würde, allerdings mit unterschiedlicher Betonung.<br>\n•&#160;&#160; &#160;<em>Ich möchte …</em> beschreibt einen Wunsch und klingt höflicher.<br>\n•&#160;&#160; &#160;<em>Ich will …</em> ist stärker und konkreter.<br>\nDas Verb <em>möchten</em> wird anders konjugiert als die anderen Modalverben. Das liegt daran, dass <em>möchten</em> eine spezielle Form des Verbs <em>mögen</em> ist. Aber auch hier sind die 1. und die 3. Person Singular identisch.<br>\n&#160; &#160; &#160;&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich <em>möchte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du möchtest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es&#160;<strong><em>möchte</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir möchten</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr möchtet</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie möchten</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie möchten</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Модальные глаголы: значение", "text": "<p>Ты знаешь уже три модальных глагола: <em>k</em><em>ö</em><em>nnen</em><em>, </em><em>m</em><em>ü</em><em>ssen</em> и <em>wollen:</em></p>\n\n<p>Модальный глагол <strong><em>k</em></strong><strong><em>ö</em></strong><strong><em>nnen</em></strong> выражает способность или возможность:<br>\n<em>Nico</em> <strong><em>kann</em></strong> <em>studieren</em><em>.</em> (Нико обладает необходимыми для учебы умственными способностями и финансовыми возможностями.)<br>\nВ единственном числе корневая гласная <em>ö</em> меняется на <em>a</em>.</p>\n\n<p>Модальный глагол <strong><em>m</em></strong><strong><em>ü</em></strong><strong><em>ssen</em></strong> выражает необходимость или обязанность:<br>\n<em>Nico</em> <strong><em>muss</em></strong> <em>studieren</em><em>.</em> (Родители Нико оказывают на него давление. Если он не будет учиться, то у него могут быть неприятности.)<br>\nВ единственном числе корневая гласная <em>ü</em> меняется на <em>u</em>.</p>\n\n<p>Модальный глагол <strong><em>wollen</em></strong> выражает желание или намерение:<br>\n<em>Nico</em> <strong><em>will</em></strong> <em>studieren</em><em>.</em> (Нико хочет или планирует учиться.)<br>\nВ единственном числе корневая гласная <em>o</em> меняется на <em>i</em>.</p>\n\n<p>Есть еще один модальный глагол, с помощью которого можно выразить&#160;желание –&#160;<em>möchten (mögen).&#160;</em><br>\n<em>Nico</em> <strong><em>m</em></strong><strong><em>ö</em></strong><strong><em>chte</em></strong> <em>studieren</em><em>.</em></p>\n\n<p>По своему значению модальные глаголы <em>wollen</em> и <em>m</em><em>ö</em><em>chten</em> сходны. Оба описывают&#160;нечто, что кто-то хотел бы иметь или сделать, однако они отличаются тональностью.</p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span><em>Ich</em> <em>m</em><em>ö</em><em>chte</em><em> … </em>описывает желание и звучит более вежливо.</li>\n\t<li><span dir=\"LTR\"></span><em>Ich</em> <em>will</em><em> …</em> сильнее и конкретнее.</li>\n</ul>\n\n<p>Глагол <em>m</em><em>ö</em><em>chten</em> спрягается иначе, чем другие модальные глаголы. Это объясняется тем, что <em>m</em><em>ö</em><em>chten</em> – это специальная форма глагола&#160;<em>m</em><em>ö</em><em>gen</em>. Но и здесь первое и второе лицо единственного числа идентичны.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich <em>möchte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du möchtest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es&#160;<strong><em>möchte</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir möchten</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr möchtet</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie möchten</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie möchten</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 39132135, "shortTitle": "Modalverben: sollen", "name": "Modalverben: sollen (4)", "text": "<p><strong>Wiederholung/Erweiterung: Ratschläge&#160;geben </strong></p>\n\n<p>Um anderen Personen einen Rat&#160;zu geben, benutzt man oft das Modalverb <em>sollen</em> im Konjunktiv II.</p>\n\n<p><em>Im Restaurant <strong>sollte</strong> man Rücksicht auf die anderen Gäste nehmen.</em></p>\n\n<p>Im Konjunktiv II von <em>sollen</em> wird nach dem Verbstamm <em>-te-</em> eingefügt. In der ersten und zweiten Person Singular steht danach keine Endung. Alle anderen Formen haben eine Personalendung.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich soll</em><strong>te</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du soll</em><strong>te</strong><em>st</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es soll</em><strong>te</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir soll</em><strong>te</strong><em>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr soll</em><strong>te</strong><em>t</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie soll</em><strong>te</strong><em>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie soll</em><strong>te</strong><em>n</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nMan kann auch Nebensätze mit <em>wenn</em> bilden, um jemandem einen Rat zu geben. Besonders oft verwendet man diese Satzstruktur, wenn man allgemeine Regeln oder Empfehlungen ausdrückt. Das Subjekt ist deshalb oft das unpersönliche Pronomen <em>man</em>.</p>\n\n<p>Beispiele:</p>\n\n<p><strong><em>Wenn </em></strong><em>man im Restaurant keinen Platz findet, <strong>sollte man</strong> den Kellner fragen.</em></p>\n\n<p><strong><em>Wenn </em></strong><em>man sparen will, <strong>sollte man</strong> selbst kochen.</em></p>\n\n<p><strong><em>Wenn</em></strong><em> der Kellner falsch gerechnet hat, <strong>sollte man</strong> es ihm freundlich sagen.</em></p>\n\n\n", "ru": null}, {"id": 39121338, "shortTitle": "Nebensätze: zu + Infinitiv", "name": "Nebensätze: zu + Infinitiv", "text": "<p><strong>Infinitivkonstruktionen mit <em>zu</em></strong></p>\n\n<p>Du kennst schon einige Nebensätze, die mit einem einleitenden Wort mit dem Hauptsatz verbunden werden, z. B. mit einer Konjunktion:</p>\n\n<p><em>Nina möchte nicht putzen, <strong>weil </strong>sie schwanger ist.</em></p>\n\n<p>Manche Nebensätze werden nicht mit einem einleitenden Wort mit dem Hauptsatz verbunden. Ein Beispiel dafür ist eine Infinitivkonstruktion mit <em>zu</em>:</p>\n\n<p><em>Ich fand die Idee super, einen Putzplan <strong>zu erstellen</strong>.</em></p>\n\n<p>Diese Konstruktion bildet man aus <em>zu </em>+ Infinitiv. Sie steht am Ende des Nebensatzes. Der Nebensatz hat kein eigenes Subjekt und kein konjugiertes Verb. Infinitivkonstruktionen mit <em>zu</em> sind verkürzte&#160;Nebensätze, die man oft durch einen dass-Satz ersetzen&#160;kann:</p>\n\n<p><em>Ich fand die Idee super, <strong>dass</strong> <strong>wir</strong> einen Putzplan <strong>erstellen</strong>. </em></p>\n\n<p>Man kann aber nicht aus jedem dass-Satz eine Infinitivkonstruktion mit <em>zu</em> machen. Diese Konstruktionen kann man nur nach bestimmten Ausdrücken verwenden, zum Beispiel:</p>\n\n<ul>\n\t<li>haben + Nomen:</li>\n</ul>\n\n<p><strong><em>Ich habe keine Angst</em></strong><em>, einsam <strong>zu sein</strong>.</em></p>\n\n<ul>\n\t<li>unpersönliche Ausdrücke:</li>\n</ul>\n\n<p><strong><em>Es ist nicht einfach</em></strong><em>, einen Partner <strong>zu finden</strong>.</em></p>\n\n<p><strong><em>Es ist wichtig</em></strong><em>, Versprechen <strong>zu halten</strong>.</em></p>\n\n<p><strong><em>Es ist schön</em></strong><em>, Zeit für den Partner <strong>zu haben</strong>.</em></p>\n\n<ul>\n\t<li>bestimmte Verben, z. B. <em>helfen</em>, <em>versuchen:</em></li>\n</ul>\n\n<p><strong><em>Jacques versucht</em></strong><em>, im Internet eine Partnerin <strong>zu finden</strong>.</em></p>\n\n<p>Bei trennbaren Verben steht das <em>zu</em> zwischen dem Präfix und dem Verbstamm:</p>\n\n<p><em>Jacques hat die Absicht, Inge an<strong>zu</strong>rufen.</em></p>\n\n<p>Zwischen Hauptsatz und Infinitivkonstruktion mit <em>zu</em> steht oft ein Komma. In einigen Fällen kann das Komma aber auch weggelassen werden:</p>\n\n<p><em>Ich helfe dir(,) die Küche zu putzen.</em></p>\n", "ru": null}, {"id": 39131663, "shortTitle": "Partizip I", "name": "Partizip I (1)", "text": "<p><strong>Das Partizip I als Adjektiv</strong></p>\n\n<p>Wenn du ein Verb als Adjektiv benutzen willst, kannst du aus dem Verb ein Partizip&#160;bilden. Als Attribut&#160;steht das Partizip dann vor einem Nomen und erklärt dieses genauer. Das Partizip I kann einen Relativsatz im Aktiv Präsens ersetzen.</p>\n\n\n\n<p>Die Frau, die <strong>lächelt</strong>, ist Selmas Mutter. (<strong>Verb im Aktiv Präsens</strong>)<br>\n= Die <strong>lächelnde</strong> Frau ist Selmas Mutter. (<strong>Partizip I</strong>)</p>\n\n<p>Du kannst das Partizip I verwenden, wenn das Verb eine aktive Handlung oder einen Vorgang&#160;beschreibt (<strong>Aktiv</strong>)&#160;<strong>und</strong>&#160;die Handlung / der Vorgang in der Gegenwart stattfindet&#160;(<strong>Präsens</strong>).<br>\n<br>\nDas Partizip I bildet man aus dem Infinitiv und der Endung <em>-d</em>.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Infinitiv</strong></td>\n\t\t\t<td><strong>Partizip I</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>schlafen</em></td>\n\t\t\t<td><em>schlafen<strong>d</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>lesen</em></td>\n\t\t\t<td><em>lesen<strong>d</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>weinen</em></td>\n\t\t\t<td><em>weinen<strong>d</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>spielen</em></td>\n\t\t\t<td><em>spielen<strong>d</strong></em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nWenn das Partizip I vor einem Nomen steht, hat es die gleiche Endung wie ein Adjektiv.</p>\n\n<p>Beispiele:</p>\n\n<p><strong><em>Der </em></strong><em>schlafend<strong>e </strong>Hund ist braun.<br>\nIch finde <strong>den</strong> schlafend<strong>en </strong>Hund sehr süß.</em></p>\n\n<p><strong><em>Die</em></strong><em> lesend<strong>e</strong> Studentin sitzt auf dem Sofa.<br>\nNeben&#160;<strong>der</strong> lesend<strong>en</strong>&#160;Studentin liegen viele Bücher.</em></p>\n\n<p><strong><em>Das</em></strong><em> weinend<strong>e</strong> Kind sitzt im Garten.<br>\nIch gehe zu <strong>dem</strong> weinend<strong>en</strong> Kind.</em></p>\n\n<p><strong><em>Die</em></strong><em> spielend<strong>en</strong> Kinder wohnen im Nachbarhaus.<br>\nIch schenke <strong>den</strong> spielend<strong>en</strong> Kindern Schokolade.</em></p>\n", "ru": null}, {"id": 39132630, "shortTitle": "Partizip I", "name": "Partizip I (2)", "text": "<p><strong>Erweiterte Partizipialattribute</strong></p>\n\n\n\n<p><em>Die Gastgeber begrüßen die Gäste, die<strong>&#160;nett lächeln</strong>. </em>(<strong>Verb im&#160; Aktiv Präsens</strong>)</p>\n\n<p><em>Die Gastgeber begrüßen die<strong>&#160;nett lächelnden </strong>Gäste. </em>(<strong>Partizip I</strong>)<br>\n<br>\nManchmal sind von dem Verb weitere Wörter oder Satzteile abhängig, zum Beispiel Adverbien oder adverbiale Bestimmungen.</p>\n\n<p>Dann stehen diese Wörter vor dem Partizip I.</p>\n\n\n\n<p>Mehr Beispiele:</p>\n\n<p><em>Ein Paar</em>, das <strong>am Tisch <em>sitzt</em></strong>, isst bei Kerzenlicht.<br>\n<em>Ein</em> <strong>am Tisch <em>sitzendes</em> </strong><em>Paar</em> isst bei Kerzenlicht.</p>\n\n<p><em>Gäste</em>, die <strong>zu früh <em>kommen</em></strong>, sind oft nicht angenehm.<br>\n<strong>Zu früh <em>kommende</em></strong> <em>Gäste</em> sind oft nicht angenehm.</p>\n", "ru": null}, {"id": 40483960, "shortTitle": "Partizip II: regelmäßig", "name": "Partizip II: regelmäßig", "text": "<p>Bei regelmäßigen Verben beginnt das Partizip II meistens mit <em>ge-</em>, dann kommt der Verbstamm und am Ende steht <em>-t</em>.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Infinitiv</td>\n\t\t\t<td>Partizip II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>machen&#160;</td>\n\t\t\t<td><strong>ge</strong>-mach<strong>-t</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>frühstücken&#160;</td>\n\t\t\t<td><strong>ge</strong>-frühstück-<strong>t</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>kochen</td>\n\t\t\t<td><strong>ge</strong>-koch<strong>-t</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><br>\nWenn der Verbstamm auf <em>-t</em> oder <em>-d</em> endet, ergänzt man danach ein zusätzliches <em>e</em>. Auch nach einer Häufung von Konsonanten fügt man manchmal ein <em>e</em> ein. Oft merkst du selbst, dass du ein <em>e</em> brauchst, weil du das Wort sonst nur schwer aussprechen kannst.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Infinitiv</td>\n\t\t\t<td>Partizip II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>arbei<strong><em>t</em></strong>en</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><strong>ge-</strong>arbeit<strong>-<em>e</em>t</strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ö<strong><em>ffn</em></strong>en</td>\n\t\t\t<td><strong>ge-</strong>öffn<strong>-<em>e</em>t</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\n<br>\nEinige Verben bilden das Partizip II ohne <em>ge-</em>:</p>\n\n<ul>\n\t<li>Verben, die auf <em>-ieren</em> enden</li>\n\t<li>Verben mit nicht trennbaren Präfixen, z. B. <em>be-</em>, <em>ent-</em>, <em>er-</em>, <em>ver-</em>, <em>zer-</em></li>\n</ul>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Infinitiv</td>\n\t\t\t<td>Partizip II&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>fotografieren</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>fotografier<strong>-t</strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>reservieren</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>reservier<strong>-t</strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>besuchen</td>\n\t\t\t<td>besuch<strong>-t</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\t\t\tdas Partizip II: Das Partizip II wird aus einem Verb gebildet und ähnelt einem Adjektiv. Man verwendet es in verschiedenen grammatischen Strukturen, beispielsweise zur Bildung des Perfekts.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Partizip II: правильные глаголы", "text": "<p>Правильными (слабыми) в немецком языке называют глаголы, спрягающиеся по общему правилу. Также по общему правилу образуется и причастие Partizip II от таких глаголов: в большинстве случаев при помощи приставки <em>ge</em><em>-</em>, после которой идет корень, а в конце стоит <em>-</em><em>t</em>.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Инфинитив</td>\n\t\t\t<td>Причастие II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>machen</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><strong>ge-</strong>mach<strong>-t</strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>frühstücken</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><strong>ge-</strong>frühstück<strong>-t</strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>kochen</td>\n\t\t\t<td><strong>ge-</strong>koch<strong>-t</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Если корень глагола заканчивается на <em>-</em><em>t</em> или <em>-</em><em>d</em>, то в конце стоит дополнительная буква <em>e</em>. Если идут несколько согласных подряд, также иногда добавляется <em>e</em>. Ты и сам заметишь, что <em>e</em> просто необходима, иначе слово трудно произносить.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Инфинитив</td>\n\t\t\t<td>Причастие II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>arbei<strong><em>t</em></strong>en</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><strong>ge-</strong>arbeit<strong>-<em>e</em>t</strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ö<strong><em>ffn</em></strong>en</td>\n\t\t\t<td><strong>ge-</strong>öffn<strong>-<em>e</em>t</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Некоторые глаголы образуют Partizip II без приставки <em>ge</em><em>-</em>:</p>\n\n<ul>\n\t<li>глаголы на &#160;<em>-</em><em>ieren</em></li>\n\t<li>глаголы с неотделяемой приставкой <em>be</em><em>-</em>, <em>ent</em><em>-</em>, <em>er</em><em>-</em>, <em>ver</em><em>-</em>, <em>zer</em><em>-</em></li>\n</ul>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Инфинитив</td>\n\t\t\t<td>Причастие II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>fotografieren</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>fotografier<strong>-t</strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>reservieren</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>reservier<strong>-t</strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>besuchen</td>\n\t\t\t<td>besuch<strong>-t</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>das Partizip II: Причастие II образуется от глагола и напоминает прилагательное. Partizip II используется в различных грамматических конструкциях, например для образования прошедшего времени Perfekt.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40490528, "shortTitle": "Partizip II: unregelmäßig ", "name": "Partizip II: unregelmäßig ", "text": "<p>Auch das Partizip II der meisten unregelmäßigen Verben beginnt mit <em>ge-</em>. Bei vielen Verben gibt es aber Veränderungen im Verbstamm. Das Partizip eines unregelmäßigen Verbs endet meist auf <em>-en</em>.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Infinitiv</td>\n\t\t\t<td>Partizip II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>f<strong>a</strong>hren</td>\n\t\t\t<td>\n\t\t\t<p><em>ge-</em>f<strong>a</strong>hr<strong><em>-en</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>fl<strong>ie</strong>gen</p>\n\t\t\t</td>\n\t\t\t<td><em>ge-</em>fl<strong>o</strong>g<strong><em>-en</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>s<strong>i</strong>ngen</td>\n\t\t\t<td><em>ge-</em>s<strong>u</strong>ng<strong><em>-en</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>bl<strong>ei</strong>ben</td>\n\t\t\t<td><em>ge-</em>bl<strong>ie</strong>b<strong><em>-en</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Wie du siehst, gibt es kaum eine Regel dafür, ob und wie sich der Stammvokal verändert. Deshalb musst du die Partizipien II der unregelmäßigen Verben auswendig lernen.</p>\n\n\n\n<p>Verben mit nicht trennbaren Präfixen bilden das Partizip II ohne <em>ge-</em>:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Infinitiv</td>\n\t\t\t<td>Partizip II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>beg<strong>i</strong>nnen</td>\n\t\t\t<td>beg<strong>o</strong>nn<strong><em>-en</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>verg<strong>e</strong>ssen</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>verg<strong>e</strong>ss<strong><em>-en</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>verl<strong>ie</strong>ren</td>\n\t\t\t<td>verl<strong>o</strong>r<strong><em>-en</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Es gibt noch einige unregelmäßige Partizipien II, die weitere Besonderheiten aufweisen. Auch diese Formen solltest du auswendig lernen.</p>\n\n<p>Hier siehst du einige Beispiele:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Infinitiv</td>\n\t\t\t<td>Partizip II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>essen</td>\n\t\t\t<td>\n\t\t\t<p><em>ge-</em><strong>g</strong>ess<strong><em>-en</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>g<strong>eh</strong>en</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><em>ge</em>-<strong>gang<em>-en</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>w<strong>i</strong>ssen</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><em>ge-</em>w<strong>u</strong>ss<strong>-<em>t</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>verst<strong>eh</strong>en</td>\n\t\t\t<td>verst<strong>and<em>-en</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>regelmäßig: Eine grammatische Form ist regelmäßig, wenn sie nach einem festen Muster gebildet wird, das auf andere Wörter übertragbar ist.&#160;</p>\n\n\t\t\t<p>unregelmäßig: Unregelmäßige Formen muss man lernen, weil es keine allgemeine Regel gibt, mit deren Hilfe man die korrekte Form aus einer Grundform bilden kann. Unregelmäßige Formen sind anders als die Mehrheit der Formen und/oder weisen Besonderheiten auf, die nicht der Regel entsprechen.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Partizip II: неправильные глаголы", "text": "<p>Причастие Partizip II большинства неправильных (сильных) глаголов также образуется при помощи приставки <em>ge</em><em>-</em>. Однако у многих таких глаголов происходит изменение корневой гласной.&#160; Причастие Partizip II неправильных глаголов в большинстве случаев заканчивается на <em>-</em><em>en</em>.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Инфинитив</td>\n\t\t\t<td>Причастие II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>f<strong>a</strong>hren</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><em>ge-</em>f<strong>a</strong>hr<strong><em>-en</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>fl<strong>ie</strong>gen</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><em>ge-</em>fl<strong>o</strong>g<strong><em>-en</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>s<strong>i</strong>ngen</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><em>ge-</em>s<strong>u</strong>ng<strong><em>-en</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>bl<strong>ei</strong>ben</td>\n\t\t\t<td><em>ge-</em>bl<strong>ie</strong>b<strong><em>-en</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Универсального правила, в соответствии с которым изменяется корневая гласная, не существует. Поэтому Partizip II неправильных глаголов следует учить наизусть.</p>\n\n\n\n<p>От глаголов с неотделяемой приставкой Partizip II образуется без <em>ge</em><em>-</em>:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Инфинитив</td>\n\t\t\t<td>Причастие II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>beg<strong>i</strong>nnen</p>\n\t\t\t</td>\n\t\t\t<td>beg<strong>o</strong>nn<strong><em>-en</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>verg<strong>e</strong>ssen</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>verg<strong>e</strong>ss<strong><em>-en</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>verl<strong>ie</strong>ren</td>\n\t\t\t<td>verl<strong>o</strong>r<strong><em>-en</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Есть еще несколько форм Partizip II, образованных от сильных глаголов, отличающихся особенностями образования.</p>\n\n<p>Вот несколько примеров:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Инфинитив</td>\n\t\t\t<td>Причастие II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>essen</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><em>ge-</em><strong>g</strong>ess<strong><em>-en</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>g<strong>eh</strong>en</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><em>ge</em>-<strong>gang<em>-en</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>w<strong>i</strong>ssen</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><em>ge-</em>w<strong>u</strong>ss<strong>-<em>t</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>verst<strong>eh</strong>en</td>\n\t\t\t<td>verst<strong>and<em>-en</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>regelmäßig: Грамматическая форма считается правильной, если она образуется в соответствии со строгим правилом, действующим и в отношении других слов.</p>\n\t\t\tunregelmäßig: Неправильные грамматические формы необходимо заучивать, поскольку не существует общего правила, с помощью которого из начальной формы&#160; можно образовать правильную производную форму. Неправильные формы отличаются от большинства других форм и имеют особенности, не подчиняющиеся общему правилу.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 39134584, "shortTitle": "Passiv", "name": "Passiv", "text": "<p><strong>Wiederholung: Passiv</strong></p>\n\n<p>Das Passiv ist eine Verbform, mit der man Vorgänge und Zustände&#160;beschreiben kann. Im Aktiv ist die aktiv handelnde Person oder der Verursacher&#160;besonders wichtig. Im Passivsatz ist wichtig, was passiert oder was passiert ist.</p>\n\n<p><strong>Aktiv</strong>: <em>Heute wählen <strong>die Bürger</strong> ein neues Parlament.</em></p>\n\n<p>Die handelnde Person ist das Subjekt. Die Person oder die Sache, mit der etwas geschieht, ist oft das Akkusativobjekt.</p>\n\n<p><strong>Passiv</strong>: <em>Heute wird <strong>ein neues Parlament</strong> gewählt.</em></p>\n\n<p>Die Person oder die Sache, mit der etwas geschieht, ist in der Regel das Subjekt. Die handelnde Person oder der Verursacher wird oft nicht genannt.</p>\n\n<p><br>\nVorgangspassiv: werden + Partizip II</p>\n\n<p>Man bildet das Vorgangspassiv aus der konjugierten Form von <em>werden</em> und dem Partizip II des Vollverbs. Das Hilfsverb&#160;<em>werden</em> steht an der zweiten Position, das Partizip II steht am Satzende.</p>\n\n<p>Beispiel:</p>\n\n<p><em>Vor der Wahl <strong>wird</strong> ein Kandidat <strong>ausgesucht</strong></em>.(Präsens)</p>\n\n<p><em>Vor der Wahl <strong>wurde</strong> ein Kandidat <strong>ausgesucht</strong></em>. (Präteritum)</p>\n\n<p>Hier siehst du noch einmal die Formen des Hilfsverbs <em>werden</em> im Präsens und im Präteritum.</p>\n\n<p>Präsens:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich werde</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du <strong>wirst</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es <strong>wird</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir werden</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr werdet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie werden</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie werden</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Präteritum:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich wurde</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du wurdest</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es wurde</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir wurden</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr wurdet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie wurden</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie wurden</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Im Passiv ist zwar die Handlung am wichtigsten, aber manchmal möchte man trotzdem sagen, wer etwas tut. Diese Information kann man mit <em>von</em> + Dativ geben.</p>\n\n<p>Beispiel:</p>\n\n<p><em>Vor der Wahl wird ein Kandidat <strong>von der Partei</strong> ausgesucht.</em></p>\n\n\n\n<p><strong>Passiversatz: <em>man</em></strong></p>\n\n<p>Wenn die Handlung am wichtigsten ist, braucht man die handelnde Person oder den Verursacher nicht zu nennen. Deshalb benutzt man oft das Passiv. Du kannst aber auch das unpersönliche Pronomen <em>man</em> als Subjekt verwenden. Dann steht das Verb im Aktiv.</p>\n\n<p><strong>Passiv</strong>: <em>Nach der Wahl <strong>werden</strong> die Stimmen <strong>gezählt</strong>.</em></p>\n\n<p><strong>Aktiv</strong>: <em>Nach der Wahl <strong>zählt man</strong> die Stimmen.</em></p>\n", "ru": null}, {"id": 40607923, "shortTitle": "Passiv", "name": "Passiv (1)", "text": "<p>Das Passiv ist eine Verbform, mit der man Vorgänge und Zustände beschreiben kann. Man wechselt mit dem Passiv die Perspektive auf ein Geschehen: Während ein Aktivsatz betont, wer oder was etwas ist oder tut, stellt ein Passivsatz in den Vordergrund, was getan wird oder wurde. Die handelnde Person oder der Verursacher ist in einem Passivsatz weniger wichtig oder unbekannt, der Schwerpunkt liegt auf der Handlung selbst. Das Subjekt des Passivsatzes bildet meist die Person oder Sache, mit der etwas geschieht.</p>\n\n<p>Aktivsatz: <em>Ein Mann liefert das Essen.</em><br>\n(Hier wird beschrieben, wer das Essen liefert. <em>Ein Mann</em> ist das Subjekt.)</p>\n\n<p>Passivsatz: <em>Das Essen wird geliefert.</em><br>\n(Hier wird beschrieben, was passiert. Es ist nicht wichtig, wer das Essen liefert. <em>Das Essen</em> ist das Subjekt.)</p>\n\n<p>Meistens entspricht das Subjekt eines Passivsatzes dem Akkusativobjekt eines Aktivsatzes:</p>\n\n<p>Aktivsatz<em>: Pepes Firma entwickelt <strong>die App</strong>. </em></p>\n\n<p>Passivsatz<em>:<strong> Die App </strong>wird entwickelt. </em></p>\n\n<p>Deshalb bildet man das Passiv in den meisten Fällen mit Verben, die ein Akkusativobjekt haben können.</p>\n\n\n\n<p>Im Passiv steht zwar die Handlung im Mittelpunkt, aber manchmal möchte man trotzdem sagen, wer etwas tut. Dann kann man diese Information mit <em>von</em> + Dativ einfügen:</p>\n\n<p><em>Die App wird von Pepes Firma entwickelt.</em></p>\n\n\n\n<p><strong>Bildung des Vorgangspassivs </strong></p>\n\n<p>Man bildet das Passiv mit dem Hilfsverb <em>werden</em> und dem Partizip II. Dabei steht das Hilfsverb im Satz an der zweiten Position und wird konjugiert. Das Partizip II bleibt unverändert und steht am Satzende.</p>\n\n<p>Das Essen <strong>wird</strong> frisch <strong>gekocht</strong>.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>das Aktiv: Wenn in einem Satz wichtig ist, wer, was oder wie etwas ist bzw. wer oder was etwas tut, verwendet man normalerweise die Aktivform des Verbs. Die Sache oder die Person, die beschrieben wird oder die eine Handlung durchführt, ist das Subjekt.</p>\n\n\t\t\t<p>das Passiv: Das Passiv ist eine Verbform, mit der man Vorgänge und Zustände beschreiben kann. Im Passivsatz steht eine Handlung im Vordergrund. Die handelnde Person oder der Verursacher ist weniger wichtig oder unbekannt. Man bildet das Passiv aus der konjugierten Form des Hilfsverbs <em>werden</em> und dem Partizip II.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": null}, {"id": 40607948, "shortTitle": "Passiv", "name": "Passiv (2)", "text": "<p><strong>Passiv Präsens</strong></p>\n\n<p>Um im Passiv eine Handlung in der Gegenwart zu beschreiben, kombiniert man die Präsensform des Hilfsverbs <em>werden</em> mit dem Partizip II.</p>\n\n<p><em>Das Essen <strong>wird</strong> von den Kunden über eine App <strong>bestellt</strong>.</em></p>\n\n<p><em>Die Gerichte <strong>werden</strong> mit Yaras Fahrrädern <strong>ausgeliefert</strong>.</em></p>\n\n\n\n<p>Das Verb <em>werden</em> ist unregelmäßig:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich werde</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du <strong><em>wirst</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es <strong><em>wird</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir werden</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr werdet</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie werden</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie werden</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Passiv Präteritum</strong></p>\n\n<p>Wird mit dem Passiv eine Handlung beschrieben, die in der Vergangenheit stattgefunden hat, kann man das Präteritum verwenden. Das Passiv Präteritum besteht aus dem Hilfsverb <em>werden</em> im Präteritum und dem Partizip II.</p>\n\n<p><em>Das Restaurant „Hiltl“ <strong>wurde</strong> 1907 von Ambrosius Hiltl <strong>gekauft</strong>.</em></p>\n\n<p><em>Vegetarische Gerichte <strong>wurden</strong> im Restaurant „Hiltl“ schon im Jahr 1898 <strong>angeboten</strong>.</em></p>\n\n\n\n<p>Im Präteritum konjugiert man das Verb <em>werden</em> so:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich wurde</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du wurdest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es wurde</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir wurden</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr wurdet</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie wurden</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie wurden</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Страдательный залог", "text": "<p><strong>Страдательный залог: настоящее время </strong></p>\n\n<p>Для описания действия, происходящего в настоящий момент, в страдательном залоге используют вспомогательный глагол <em>werden</em> в настоящем времени <strong>Pr</strong><strong>ä</strong><strong>sens</strong> в сочетании с причастием Partizip II.</p>\n\n<p><em>Das Essen <strong>wird</strong> von den Kunden über eine App <strong>bestellt</strong>.</em></p>\n\n<p><em>Die Gerichte <strong>werden</strong> mit Yaras Fahrrädern <strong>ausgeliefert</strong>.</em></p>\n\n<p>Глагол <em>werden</em> неправильный. В настоящем времени Präsens <em>werden</em> спрягается так:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich werde</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du <strong><em>wirst</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es <strong><em>wird</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir werden</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr werdet</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie werden</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie werden</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Страдательный залог: простое прошедшее время </strong></p>\n\n<p>Если страдательный залог описывает действие в прошлом, можно использовать простое прошедшее время Präteritum. В страдательном залоге Präteritum образуется с помощью вспомогательного глагола <em>werden</em> в простом прошедшем времени и причастия Partizip II.</p>\n\n<p><em>Das Restaurant „Hiltl“ <strong>wurde</strong> 1907 von Ambrosius Hiltl <strong>gekauft</strong>.</em></p>\n\n<p><em>Vegetarische Gerichte <strong>wurden</strong> im Restaurant „Hiltl“ schon im Jahr 1898 <strong>angeboten</strong>.</em></p>\n\n<p>В простом прошедшем времени Präteritum глагол <em>werden</em> спрягается так:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich wurde</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du wurdest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es wurde</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir wurden</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr wurdet</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie wurden</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie wurden</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40483905, "shortTitle": "Perfekt: Hilfsverb „haben“", "name": "Perfekt: Hilfsverb „haben“", "text": "\n\n<p><em>Gestern <strong>haben</strong> wir eine Wanderung <strong>gemacht</strong>. </em></p>\n\n<p>Dieser Satz steht im Perfekt. In der gesprochenen Sprache benutzt man meistens diese Zeitform, um Vergangenes auszudrücken.</p>\n\n<p>Das Perfekt besteht aus zwei Teilen:</p>\n\n<p>a) An der zweiten Position im Satz steht ein so genanntes Hilfsverb. Das ist meistens das Verb <em>haben</em>. Es wird so konjugiert wie im Präsens.</p>\n\n<p>b) Die Handlung, die im Satz beschrieben wird, drückt man durch das zweite Verb am Satzende aus. Dieses Verb steht in einer speziellen Form, dem Partizip II. Die meisten Partizipien II beginnen mit dem Präfix <em>ge-.</em> Das Partizip II in Perfektsätzen ist eine infinite Verbform, das heißt, es wird nicht konjugiert.</p>\n\n\n\n<p><strong>Perfekt: <em>haben </em></strong>(konjugiert)<strong> + <em>Partizip II:</em></strong></p>\n\n<p><em>Was <strong>habt</strong> ihr gestern <strong>gemacht</strong>?</em></p>\n\n<p><em>Wir <strong>haben</strong> eine Wanderung <strong>gemacht</strong>.&#160;</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:<br>\n\t\t\t<span style=\"background-color:transparent\"></span><span style=\"background-color:transparent\"></span><br>\n\t\t\tdas Perfekt: Das Perfekt ist eine Zeitform des Verbs, mit der Vergangenes ausgedrückt wird. Es wird aus einem konjugierten Hilfsverb (<em>haben</em> oder <em>sein</em>) und dem Partizip II gebildet.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Perfekt: глагол haben", "text": "\n\n<p><em>Gestern <strong>haben</strong> wir eine Wanderung <strong>gemacht</strong>. </em></p>\n\n<p>В этом предложении использовано сложное завершенное прошедшее время Perfekt. Это наиболее распространенная временная форма в разговорной речи.</p>\n\n<p>Perfekt представляет собой сложное по форме время и образуется при помощи двух глагольных форм:</p>\n\n<p>a) На втором месте в предложении стоит так называемый вспомогательный глагол. В большинстве случаев это глагол <em>haben</em>. Он спрягается в настоящем времени Präsens.</p>\n\n<p>b) Действие, описываемое в предложении, выражается смысловым глаголом, который стоит в конце предложения. Смысловой глагол принимает форму причастия Partizip II. Большинство причастий Partizip II начинаются с приставки <em>ge</em><em>-</em><em>. </em>В предложениях с использованием времени Perfekt причастие Partizip II –&#160;это неспрягаемая форма глагола.</p>\n\n<p><strong>Perfekt: <em>haben </em>(спрягается</strong><strong>)</strong><strong> + Partizip</strong> <strong>II</strong></p>\n\n<p><em>Was <strong>habt</strong> ihr gestern <strong>gemacht</strong>?</em></p>\n\n<p><em>Wir <strong>haben</strong> eine Wanderung <strong>gemacht</strong>.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\t\t\tdas Perfekt: Глагольная категория для выражения прошедшего времени. Сложное завершенное прошедшее время Perfekt образуется при помощи спрягаемого вспомогательного глагола (<em>haben</em> или <em>sein</em>) и причастия Partizip II.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40490401, "shortTitle": "Perfekt: Hilfsverb „sein“", "name": "Perfekt: Hilfsverb „sein“", "text": "<p>Das Perfekt wird meistens aus dem Hilfsverb <em>haben</em> und dem Partizip II gebildet. Bestimmte Verben verwendet man aber nicht mit <em>haben</em>, sondern mit dem Hilfsverb <em>sein</em>.&#160;</p>\n\n\n\n<p><strong>Verben, die das Perfekt mit <em>sein </em>bilden, sind ...</strong></p>\n\n<p>... Verben, die eine Bewegung in eine bestimmte Richtung oder einen Ortswechsel ausdrücken, z. B. <em>gehen, fahren, fliegen, schwimmen</em> und &#160;<em>reisen</em>.<br>\n<strong>schwimmen</strong>: <em>Wir <strong>sind </strong>im See <strong>geschwommen</strong>.</em></p>\n\n<p>... Verben, die eine Zustandsveränderung bezeichnen oder einen Vorgang beschreiben, den man nicht kontrollieren kann, z. B. <em>einschlafen</em>, <em>aufwachen&#160;</em>und <em>passieren</em>.<br>\n<strong>einschlafen</strong>: <em>Ich <strong>bin</strong> am Samstag spät <strong>eingeschlafen</strong>.&#160;</em><br>\n<strong>aufwachen</strong>: <em>Am Sonntag <strong>bin </strong>ich erst um 11:00 Uhr <strong>aufgewacht</strong>.</em></p>\n\n<p>... die Verben <em>sein, bleiben</em> und <em>werden</em>.<br>\n<strong>sein</strong>: <em>Wir <strong>sind</strong> in der Nähe von Hamburg <strong>gewesen</strong>.</em> (Aber du weißt ja schon, dass man das Verb sein normalerweise im Präteritum verwendet, wenn man etwas Vergangenes ausdrücken will.)<br>\n<strong>bleiben</strong>:<em> Wir <strong>sind </strong>drei Tage bei meinem Onkel <strong>geblieben</strong>.</em><br>\n<strong>werden</strong>: <em>Am Anfang war es sonnig, aber dann <strong>ist </strong>das Wetter immer schlechter <strong>geworden</strong>.</em></p>\n\n\n\n<p><strong>Verben, die das Perfekt mit <em>haben</em> bilden, sind ...</strong></p>\n\n<p>... alle anderen Verben&#160;</p>\n\n<p>... insbesondere Verben, die ein Akkusativobjekt haben können, z. B. <em>machen</em>.&#160;<br>\n<strong>machen:</strong><em>&#160;Wir <strong>haben</strong> einen Spaziergang <strong>gemacht.</strong></em></p>\n", "ru": {"name": "Perfekt: глагол sein", "text": "<p>Сложное прошедшее время Perfekt в большинстве случаев образуется при помощи вспомогательного глагола <em>haben</em> и причастия Partizip II. Однако некоторые глаголы вместо глагола <em>haben</em> требуют вспомогательного глагола&#160;<em>sein</em>.</p>\n\n\n\n<p><strong>Perfekt</strong><strong> с </strong><strong><em>sein</em></strong> образуют глаголы…</p>\n\n<p>… обозначающие движение в определенном направлении или изменение местонахождения, например, <em>gehen</em>, <em>fahren</em>, <em>fliegen</em>, <em>schwimmen</em> и <em>reisen</em><em>.</em><br>\n<strong>schwimmen</strong><em>: Wir <strong>sind</strong> im See <strong>geschwommen</strong>.</em><br>\n<br>\n... обозначающие изменение состояния или описывающие неконтролируемое действие, например, <em>einschlafen</em><em>,</em> <em>aufwachen</em> и <em>passieren</em>.<br>\n<strong>einschlafen</strong><em>: Ich <strong>bin</strong> am Samstag spät <strong>eingeschlafen</strong>. </em><br>\n<strong>aufwachen</strong><em>: Am Sonntag <strong>bin</strong> ich erst um 11:00 Uhr <strong>aufgewacht</strong>.</em><br>\n<br>\n... <em>sein</em><em>,</em><em> bleiben</em> и <em>werden</em>.</p>\n\n<p><strong>sein</strong><em>: Wir <strong>sind</strong> in der Nähe von Hamburg <strong>gewesen</strong>. </em>(Но ты уже знаешь, что глагол <em>sein</em> обычно используют в форме Präteritum при описании действия или события в прошлом.)<br>\n<strong>bleiben</strong><em>: Wir <strong>sind</strong> drei Tage bei meinem Onkel <strong>geblieben</strong>.</em><br>\n<strong>werden</strong><em>: Am Anfang war es sonnig, aber dann <strong>ist</strong> das Wetter immer schlechter <strong>geworden</strong>.</em></p>\n\n\n\n<p><strong>Perfekt</strong><strong> с </strong><strong><em>haben</em></strong> образуют…</p>\n\n<p>... все остальные глаголы.</p>\n\n<p>... особенно глаголы, требующие прямого дополнения, например, <em>machen</em>.<br>\n<strong>machen:</strong><em> Wir <strong>haben</strong> </em>einen Spaziergang<em> <strong>gemacht</strong>.</em></p>\n"}}, {"id": 40608847, "shortTitle": "Präteritum: Mischverben", "name": "Präteritum: Mischverben", "text": "<p>Einige wenige Verben weisen Merkmale der regelmäßigen und der unregelmäßigen Verben auf: Ihre Endung (<em>-te- </em>+ Personalendung) ist regelmäßig, aber sie haben einen Vokalwechsel. Deshalb nennt man diese Verben „Mischverben“.</p>\n\n<p>Zu diesen Mischverben gehören zum Beispiel <em>wissen</em>, <em>bringen, denken</em> und <em>kennen</em>.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Infinitiv</td>\n\t\t\t<td>Präteritum</td>\n\t\t\t<td>Partizip II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>w<strong><em>i</em></strong>ssen</td>\n\t\t\t<td>w<strong><em>u</em></strong>ss<strong><em>te</em></strong></td>\n\t\t\t<td>gew<strong><em>u</em></strong>ss<strong><em>t</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>br<strong><em>i</em></strong>ngen</td>\n\t\t\t<td>br<strong><em>a</em></strong><em>ch<strong>te</strong></em></td>\n\t\t\t<td>gebr<strong><em>a</em></strong>ch<strong><em>t</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>d<strong><em>e</em></strong>nken</td>\n\t\t\t<td>d<strong><em>a</em></strong><em>ch<strong>te</strong></em></td>\n\t\t\t<td>ged<strong><em>a</em></strong><em>ch<strong>t</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>k<strong><em>e</em></strong>nnen</td>\n\t\t\t<td>k<strong><em>a</em></strong>nn<strong><em>te</em></strong></td>\n\t\t\t<td>gek<strong><em>a</em></strong>nn<strong><em>t</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Präteritum: смешанные глаголы", "text": "<p>Некоторые глаголы имеют признаки как правильных, так и неправильных глаголов: окончание (<em>-</em><em>te</em><em>- </em>+ личное окончание) образуется по общему правилу, но в корне чередуются гласные. Такие глаголы называются смешанными.</p>\n\n<p>К смешанным глаголам относятся, например, <em>wissen</em>, <em>bringen</em><em>, </em><em>denken</em> и <em>kennen</em>.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Infinitiv</td>\n\t\t\t<td>Präteritum</td>\n\t\t\t<td>Partizip II</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>w<strong><em>i</em></strong>ssen</td>\n\t\t\t<td>w<strong><em>u</em></strong>ss<strong><em>te</em></strong></td>\n\t\t\t<td>gew<strong><em>u</em></strong>ss<strong><em>t</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>br<strong><em>i</em></strong>ngen</td>\n\t\t\t<td>br<strong><em>a</em></strong><em>ch<strong>te</strong></em></td>\n\t\t\t<td>gebr<strong><em>a</em></strong>ch<strong><em>t</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>d<strong><em>e</em></strong>nken</td>\n\t\t\t<td>d<strong><em>a</em></strong><em>ch<strong>te</strong></em></td>\n\t\t\t<td>ged<strong><em>a</em></strong><em>ch<strong>t</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>k<strong><em>e</em></strong>nnen</td>\n\t\t\t<td>k<strong><em>a</em></strong>nn<strong><em>te</em></strong></td>\n\t\t\t<td>gek<strong><em>a</em></strong>nn<strong><em>t</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40573088, "shortTitle": "Reflexive Verben", "name": "Reflexive Verben", "text": "<p>Reflexive Verben sind Verben mit zusätzlichen Pronomen, die sich auf das Subjekt zurückbeziehen. Diese Pronomen heißen Reflexivpronomen.</p>\n\n\n\n<p><strong>Unechte Reflexivverben</strong></p>\n\n<p>Bei vielen Verben, die reflexiv gebraucht werden, ist das Reflexivpronomen ein Akkusativobjekt. Das Pronomen kann in diesem Fall durch ein anderes Akkusativobjekt ersetzt werden. Diese Verben werden auch unechte Reflexivverben genannt.</p>\n\n\n\n<p><em>Die Frau schminkt <strong>ihre Mutter</strong>. </em></p>\n\n<p>Eine Person (Subjekt im Nominativ) schminkt eine andere Person (<strong>Objekt</strong> im Akkusativ).</p>\n\n\n\n<p><em>Die Frau schminkt <strong>sich</strong>.</em></p>\n\n<p>Eine Person (Subjekt im Nominativ) schminkt sich selbst (<strong>Reflexivpronomen als Objekt</strong> im Akkusativ).</p>\n\n\n\n<p><strong>Echte Reflexivverben</strong></p>\n\n<p>Es gibt auch Verben, die nur reflexiv gebraucht werden können. Diese Verben bezeichnet man als echte Reflexivverben. Echte reflexive Verben erkennst du daran, dass das Reflexivpronomen nicht weggelassen und auch nicht durch ein anderes Pronomen oder Nomen ausgetauscht werden kann.</p>\n\n<p>Beispiel: <strong>sich</strong> ausruhen</p>\n\n<p><em>Nach der Arbeit ruhe ich <strong>mich</strong> aus.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe &#160;auf Deutsch:</p>\n\n\t\t\t<p>das reflexive Verb: Reflexive Verben sind Verben mit einem Pronomen, das sich auf das Subjekt des Satzes zurückbezieht. In Wörterbüchern sind reflexive Verben dadurch gekennzeichnet, dass vor dem Verb das Reflexivpronomen <em>sich</em> steht.</p>\n\t\t\tdas Reflexivpronomen: Reflexive Verben werden mit einem Reflexivpronomen gebraucht. Dieses Reflexivpronomen bezieht sich auf das Subjekt zurück. In der Grundform lautet das Reflexivpronomen <em>sich</em>.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": nu
