au Brunner</em></li>\n</ul>\n\n\n\n<ul>\n\t<li>К собеседнику обращаются на <em>Sie</em>:<br>\n\t<em>Wie heißen Sie?</em><br>\n\t<em>Woher kommen Sie?</em><br>\n\t<em>Wo wohnen Sie?</em><br>\n\t<em>Wie alt sind Sie?</em></li>\n</ul>\n\n\n\n<ul>\n\t<li>Вместо <em>dein/e</em> используется&#160;<em>Ihr/e</em>:<br>\n\t<em>Wie ist Ihr Name?</em><br>\n\t<em>Wie ist Ihre Adresse?</em><br>\n\t<em>Wie ist Ihre Passnummer?</em><em>Wie ist Ihre Telefonnummer?</em></li>\n</ul>\n\n\n\n<ul>\n\t<li>При прощании говорят&#160;<em>Auf Wiedersehen</em>.</li>\n</ul>\n"}}, {"id": 40323542, "shortTitle": "Informell und formell", "name": "Informell und formell (1)", "text": "<p><strong>Informelle Anrede</strong></p>\n\n<p><br>\n<em>Hey, Lena!</em> – <em>Hallo, </em><em>Opa!<br>\nHallo, Sarah!</em> – <em>Hi, Tom!</em></p>\n\n<ul>\n\t<li>Die informelle Anrede verwendet man in der Familie, unter Freunden und Bekannten, oft auch unter Kollegen.</li>\n\t<li>Freunde, Bekannte und Familienmitglieder spricht man mit dem Vornamen an.</li>\n\t<li>Kinder sagen zu den Eltern meist <em>Mama</em> und <em>Papa</em>, zu den Großeltern <em>Oma</em> und <em>Opa</em>.<br>\n\t&#160;</li>\n</ul>\n\n<p><strong>Formelle Anrede</strong><br>\n<br>\n<em>Guten Tag, Frau Kamp! – Guten Tag!<br>\nGuten Morgen, Herr Müller! </em>–<em> Guten Morgen, Frau Schneider!</em></p>\n\n<ul>\n\t<li>Die formelle Anrede verwendet man bei fremden Erwachsenen, in geschäftlichen Situationen, auf Ämtern oder auch beim Einkaufen.</li>\n\t<li>Formell spricht man Männer mit <em>Herr</em> und dem Familiennamen, Frauen mit <em>Frau</em> und dem Familiennamen an.</li>\n\t<li>Wenn man unsicher ist, ob informell oder formell, wählt man die formelle Anrede.</li>\n</ul>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Guten Morgen!</em></td>\n\t\t\t<td>Begrüßung am Morgen, bis ca. 11:00 Uhr vormittags</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Guten Tag!</em></td>\n\t\t\t<td>Begrüßung tagsüber, etwa zwischen 11:00 Uhr vormittags und 18:00 Uhr abends</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Guten Abend!</em></td>\n\t\t\t<td>Begrüßung am Abend, ab ca. 18:00 Uhr abends</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:<br>\n\t\t\tinformell: Informelle Sprache verwendet man in Gesprächen mit Familie und Freunden.<br>\n\t\t\tformell: Formelle Sprache verwendet man in förmlichen Situationen.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Стили речи", "text": "<p><strong>Неформальное приветствие</strong></p>\n\n\n\n<p><em>Hey, Lena!</em> – <em>Hallo, Opa!</em></p>\n\n<p><em>Hallo, Sarah!</em> – <em>Hi, Tom!</em></p>\n\n<ul>\n\t<li>Неформальное приветствие используется в семье, среди друзей и знакомых, а также зачастую среди коллег.</li>\n\t<li><span dir=\"LTR\"></span>К друзьям, знакомым и членам семьи обращаются по имени.</li>\n\t<li><span dir=\"LTR\"></span>Дети обычно говорят родителям <em>Mama</em> и <em>Papa</em>, бабушке и дедушке <em>Oma</em> и <em>Opa</em>.</li>\n</ul>\n\n\n\n<p><strong>Формальное приветствие</strong></p>\n\n\n\n<p><em>Guten Tag, Frau Kamp! – Guten Tag!</em></p>\n\n<p><em>Guten Morgen, Herr Müller! </em>–<em> Guten Morgen, Frau Schneider!</em></p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span>Формальный стиль приветствия используется в общении с незнакомыми взрослыми людьми, в деловой обстановке, в различных ведомствах и в магазинах.</li>\n\t<li><span dir=\"LTR\"></span>Официально к людям обращаются по фамилии, добавляя <em>Herr</em> в общении с мужчинами и <em>Frau</em> в общении с женщинами.</li>\n\t<li><span dir=\"LTR\"></span>Если не совсем ясно, в каком стиле следует обращаться к человеку, лучше использовать формальный стиль.</li>\n</ul>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Guten Morgen!</em></td>\n\t\t\t<td>Приветствие утром, примерно до 11 часов утра</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Guten Tag!</em></td>\n\t\t\t<td>Приветствие днем, примерно с 11 до 18 часов</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Guten Abend!</em></td>\n\t\t\t<td>Приветствие вечером, примерно с 18 часов</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>informell: Неформальный стиль речи используется в общении с членами семьи и друзьями.</p>\n\n\t\t\t<p>formell: Формальный стиль речи используется в официальной обстановке.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40330711, "shortTitle": "Informell und formell", "name": "Informell und formell (2)", "text": "<p><strong>Informelle Verabschiedung</strong></p>\n\n\n\n<p><em>Tschüss, Martina!</em> – <em>Mach's gut!<br>\nBis bald! – Tschüss!</em></p>\n\n<ul>\n\t<li>Die informelle Verabschiedung verwendet man in der Familie, unter Freunden und Bekannten, oft auch unter Kollegen.</li>\n\t<li>Freunde, Bekannte und Familienmitglieder spricht man mit dem Vornamen an.</li>\n</ul>\n\n<p><br>\n<strong>Formelle Verabschiedung</strong></p>\n\n\n\n<p><em>Auf Wiedersehen, Herr Tillmanns! – Auf Wiedersehen!</em></p>\n\n<ul>\n\t<li>Die formelle Verabschiedung verwendet man bei fremden Erwachsenen, in geschäftlichen Situationen, auf Ämtern oder auch beim Einkaufen.</li>\n\t<li>Formell spricht man Männer mit <em>Herr</em> und dem Familiennamen, Frauen mit <em>Frau</em> und dem Familiennamen an.</li>\n\t<li>Wenn man unsicher ist, ob informell oder formell, wählt man die formelle Verabschiedung.</li>\n</ul>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>informell: Informelle Sprache verwendet man in Gesprächen mit Familie und Freunden.</p>\n\n\t\t\t<p>formell: Formelle Sprache verwendet man in förmlichen Situationen.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": null}, {"id": 40576426, "shortTitle": "Mitteilungen ohne Subjekt", "name": "Mitteilungen ohne Subjekt", "text": "<p><strong>Satzverkürzungen in Kurznachrichten</strong></p>\n\n<p>Wenn man jemandem eine Nachricht schreibt oder schickt, hat man oft wenig Zeit oder möchte schnell auf eine Nachricht des anderen reagieren. Deshalb hält man den Text relativ kurz. Ein typisches Merkmal solcher Texte ist deshalb, dass bestimmte Wörter weggelassen werden können. Besonders oft lässt man das Subjekt „<em>Ich</em>“ am Satzanfang weg und schreibt dann das Verb groß.</p>\n\n<p><em>(Ich) <strong>Bin</strong> gerade im Supermarkt.<br>\n(Ich) <strong>Kann</strong> heute nicht kommen.<br>\n(Ich) <strong>Warte</strong> auf dich.</em></p>\n\n<p>Dies ist nur in informellen kurzen Nachrichten und Notizen üblich. In allen anderen Texten kann man das Subjekt normalerweise nicht weglassen.</p>\n", "ru": null}]}];

const categoriesEl = document.getElementById("categories");
const contentEl = document.getElementById("content");
const searchEl = document.getElementById("search");
const sidebarToggle = document.getElementById("sidebarToggle");
const overlay = document.getElementById("overlay");
const isMobile = () => window.innerWidth <= 768;

document.body.classList.toggle("sidebar-open", !isMobile());
sidebarToggle.addEventListener("click", () => {
  document.body.classList.toggle("sidebar-open");
});
overlay.addEventListener("click", () => {
  document.body.classList.remove("sidebar-open");
});

function stripTags(html) {
  return html.replace(/<[^>]+>/g, " ");
}

function searchableText(g) {
  const parts = [g.shortTitle, g.name, stripTags(g.text)];
  if (g.ru) parts.push(g.ru.name, stripTags(g.ru.text));
  return parts.join(" ");
}

function renderSidebar() {
  categoriesEl.innerHTML = "";
  DATA.forEach((cat, ci) => {
    const catDiv = document.createElement("div");
    catDiv.className = "category";

    const header = document.createElement("div");
    header.className = "category-header";
    header.innerHTML = `<span>${cat.headline}</span><span class="count">${cat.grammars.length}</span>`;

    const itemsDiv = document.createElement("div");
    itemsDiv.className = "items";

    header.addEventListener("click", () => {
      itemsDiv.classList.toggle("collapsed");
    });

    cat.grammars.forEach((g, gi) => {
      const item = document.createElement("div");
      item.className = "item";
      item.textContent = g.shortTitle;
      item.dataset.cat = ci;
      item.dataset.idx = gi;
      item.dataset.search = searchableText(g).toLowerCase();
      item.addEventListener("click", () => selectItem(ci, gi));
      itemsDiv.appendChild(item);
    });

    catDiv.appendChild(header);
    catDiv.appendChild(itemsDiv);
    categoriesEl.appendChild(catDiv);
  });
}

function selectItem(ci, gi) {
  document.querySelectorAll(".item.active").forEach(el => el.classList.remove("active"));
  const el = document.querySelector(`.item[data-cat="${ci}"][data-idx="${gi}"]`);
  if (el) el.classList.add("active");

  const cat = DATA[ci];
  const g = cat.grammars[gi];
  const ruPane = g.ru
    ? `<div class="pane">
         <div class="pane-label">Русский &middot; ${g.ru.name}</div>
         <div class="body">${g.ru.text}</div>
       </div>`
    : `<div class="pane"><div class="pane-label">Русский</div><div class="no-ru">No match found</div></div>`;
  contentEl.innerHTML = `
    <h2>${g.name}</h2>
    <div class="meta">${cat.headline} &middot; #${g.id}</div>
    <div class="panes">
      <div class="pane">
        <div class="pane-label">Deutsch</div>
        <div class="body">${g.text}</div>
      </div>
      ${ruPane}
    </div>
  `;

  if (isMobile()) {
    document.body.classList.remove("sidebar-open");
  }
}

function applyFilter() {
  const q = searchEl.value.trim().toLowerCase();
  document.querySelectorAll(".category").forEach(catDiv => {
    let anyVisible = false;
    catDiv.querySelectorAll(".item").forEach(item => {
      const match = item.dataset.search.includes(q);
      item.classList.toggle("hidden", !match);
      if (match) anyVisible = true;
    });
    const itemsDiv = catDiv.querySelector(".items");
    catDiv.style.display = anyVisible || !q ? "" : "none";
    if (q && anyVisible) itemsDiv.classList.remove("collapsed");
  });
}

searchEl.addEventListener("input", applyFilter);

renderSidebar();
</script>
</body>
</html>
