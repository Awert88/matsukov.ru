n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Grammatische Begriffe auf Deutsch:<br>\n\t\t\tdas Kompositum : Ein Kompositum ist ein zusammengesetztes Wort. Dieses Wort ist häufig ein Nomen, es kann aber zum Beispiel auch ein Verb oder ein Adjektiv sein. Auch die einzelnen Bestandteile eines Kompositums können Wörter unterschiedlicher Wortarten sein. Das Grundwort bestimmt, um welche Wortart es sich bei dem Kompositum handelt.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": null}, {"id": 40482863, "shortTitle": "Zeitangaben: Jahreszeit", "name": "Zeitangaben: Jahreszeit", "text": "<p>Wenn man sagen möchte, in welcher Jahreszeit etwas stattfindet, verwendet man die Präposition <em>in</em>. Die Jahreszeit steht nach der Präposition im Dativ. Da alle Jahreszeiten maskulin sind, wird <em>in</em> zu <em>im</em> (= <em>in + dem</em>):</p>\n\n<p><strong><em>Im Frühling</em></strong><em> ist es manchmal regnerisch.</em></p>\n\n<p><strong><em>Im Sommer</em></strong><em> ist es warm und sonnig.</em></p>\n\n<p><strong><em>Im Herbst</em></strong><em> ist es nass und windig.</em></p>\n\n<p><strong><em>Im Winter</em></strong><em> ist es kalt und dunkel.</em></p>\n\n\n\n<p>Auch vor Zeitangaben mit den Monaten steht <em>im</em>:</p>\n\n<p><strong><em>Im Dezember</em></strong><em> und <strong>im Januar</strong> ist es am kältesten.</em></p>\n", "ru": {"name": "Временные данные: время года", "text": "<p>Для обозначения времени года&#160;используют предлог <em>in</em>. Название времени года после предлога стоит в дательном падеже. Поскольку все времена года мужского рода, <em>in</em> трансформируется в <em>im</em> (= <em>in</em><em> + </em><em>dem</em>):</p>\n\n<p><strong><em>Im Frühling</em></strong><em> ist es manchmal regnerisch.</em></p>\n\n<p><strong><em>Im Sommer</em></strong><em> ist es warm und sonnig.</em></p>\n\n<p><strong><em>Im Herbst</em></strong><em> ist es nass und windig.</em></p>\n\n<p><strong><em>Im Winter</em></strong><em> ist es kalt und dunkel.</em></p>\n\n\n\n<p>Перед названием месяца также стоит <em>im</em>:</p>\n\n<p><strong><em>Im Dezember</em></strong><em> und <strong>im Januar</strong> ist es am kältesten.</em></p>\n"}}]}, {"key": "declination", "headline": "Deklination", "grammars": [{"id": 40578206, "shortTitle": "Akkusativ ", "name": "Akkusativ ", "text": "<p><strong>Zusammenfassung: der Akkusativ</strong><br>\nDer Akkusativ kann verschiedene Funktionen haben. Am häufigsten verwendet man ihn bei Objekten und nach bestimmten Präpositionen.<br>\n&#160;</p>\n\n<p><strong>Akkusativobjekte</strong></p>\n\n<p>Viele Verben brauchen ein Objekt, das den Satz sinnvoll ergänzt. Dieses Objekt steht sehr häufig im Akkusativ.</p>\n\n<p><em>Ich habe <strong>einen französischen Namen</strong>.</em></p>\n\n<p><em>Der Mann bestellt sicher wieder <strong>ein Schnitzel</strong>.</em></p>\n\n<p>Du kennst jetzt schon viele Verben, die ein Akkusativobjekt verlangen:</p>\n\n<p><em>haben, lernen, brauchen, anrufen, essen, trinken, nehmen, suchen,</em> <em>kennen, machen, lieben, hassen, besuchen, besichtigen, bestellen, bekommen, mögen, putzen, kontrollieren, vorbereiten, waschen, öffnen, schließen, reparieren, …</em></p>\n\n\n\n<p><strong>Präpositionen mit Akkusativ</strong></p>\n\n<p>Die Präpositionen <em>für</em>, <em>um</em>, <em>durch</em>, <em>ohne</em> und <em>gegen</em> verlangen immer den Akkusativ:</p>\n\n<p><em>Das Schnitzel ist <strong>für den Mann</strong> am Nachbartisch.<br>\nInge und Jacques wetten <strong>um eine Verabredung</strong>.<br>\nDer Kellner geht <strong>durch den Flur</strong> von der Küche ins Restaurant.<br>\nInge kann die Speisekarte <strong>ohne ihre Brille</strong> nicht lesen.<br>\nInge entscheidet sich <strong>gegen den Wein</strong>. Sie bestellt ein Glas Wasser.<br>\nJacques und Inge unterhalten sich <strong>bis zwei Uhr</strong>.</em></p>\n\n<p>Die Präposition <em>bis</em> verlangt ebenfalls den Akkusativ. Allerdings steht nach <em>bis</em> in der Regel kein Artikel:&#160;Jacques und Inge unterhalten sich <em>bis </em>zwei Uhr.</p>\n\n<p>Nach <em>bis </em>kann man den Akkusativ meist nur erkennen, wenn vor dem Nomen ein Adjektiv steht.</p>\n\n<p>Beispiel: Inge und Jacques verabreden sich. Sie wollen sich einen Monat später treffen. Jacques könnte sich von Inge verabschieden, indem er sagt:</p>\n\n<p><em>Bis <strong>nächsten Monat</strong>, Inge! </em>(Die Adjektivendung <em>-en</em> zeigt hier den Akkusativ an.)</p>\n\n<p>Du hast schon gelernt, dass die Präposition <em>entlang</em> bei Wegbeschreibungen auch mit dem Akkusativ gebraucht wird. Dann steht der Akkusativ <strong>vor</strong> der Präposition.</p>\n\n<p><em>Inge und Jacques gehen <strong>die Straße entlang</strong>.</em></p>\n\n\n\n<p><strong>Die Artikel im Akkusativ</strong></p>\n\n<p>Im Akkusativ verändert sich der maskuline Artikel. Die anderen Artikel bleiben unverändert.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td>Akkusativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>\n\t\t\t<p><strong>der</strong></p>\n\t\t\t</td>\n\t\t\t<td><strong>den </strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p><strong>ein</strong></p>\n\t\t\t</td>\n\t\t\t<td><strong>einen</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><strong>kein</strong></td>\n\t\t\t<td><strong>keinen</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin</td>\n\t\t\t<td>die</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>eine</td>\n\t\t\t<td>\n\t\t\t<p>eine</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>keine</td>\n\t\t\t<td>keine</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral</td>\n\t\t\t<td>\n\t\t\t<p>das</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>das</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>ein</td>\n\t\t\t<td>\n\t\t\t<p>ein</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>kein</td>\n\t\t\t<td>kein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>-</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>-</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>keine</td>\n\t\t\t<td>keine</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Винительный падеж", "text": "<p><strong>Обзор: Винительный падеж</strong></p>\n\n<p>Винительный падеж может выполнять в предложении разные функции. Чаще всего он используется с дополнениями и после определенных предлогов.</p>\n\n\n\n<p><strong>Прямые дополнения</strong></p>\n\n<p>Некоторые глаголы должны всегда иметь при себе объект, чтобы предложение было осмысленным. Объекты в предложении выполняют функцию дополнения и часто стоят в винительном падеже.</p>\n\n<p><em>Ich habe <strong>einen französischen Namen</strong>.<br>\nDer Mann bestellt sicher wieder <strong>ein Schnitzel</strong>.</em></p>\n\n<p>Ты уже знаешь много глаголов, управляющих винительным падежом:</p>\n\n<p><em>haben, lernen, brauchen, anrufen, essen, trinken, nehmen, suchen,</em> <em>kennen, machen, lieben, hassen, besuchen, besichtigen, bestellen, bekommen, mögen, putzen, kontrollieren, vorbereiten, waschen, öffnen, schließen, reparieren, …</em></p>\n\n\n\n<p><strong>Повторение/продолжение темы: Предлоги, управляющие винительным падежом</strong></p>\n\n<p>Предлоги <em>für</em>, <em>um</em>, <em>durch</em>, <em>ohne</em> и <em>gegen</em> всегда управляют винительным падежом:</p>\n\n<p><em>Das Schnitzel ist <strong>für den Mann</strong> am Nachbartisch.<br>\nInge und Jacques wetten <strong>um eine Verabredung</strong>.<br>\nDer Kellner geht <strong>durch den Flur</strong> von der Küche ins Restaurant.<br>\nInge kann die Speisekarte <strong>ohne ihre Brille</strong> nicht lesen.<br>\nInge entscheidet sich <strong>gegen den Wein</strong>. Sie bestellt ein Glas Wasser.</em></p>\n\n<p>Предлог <em>bis</em> также управляет винительным падежом. Однако после предлога<em> bis</em>, как правило, нет артикля:</p>\n\n<p><em>Jacques und Inge unterhalten sich <strong>bis zwei Uhr</strong>.</em></p>\n\n<p>После предлога <em>bis</em> винительный падеж можно зачастую распознать только, если перед существительным стоит прилагательное.&#160;</p>\n\n<p>Пример: Инге и Жак договариваются о встрече. Они собираются увидеться через месяц. При прощании Жак может сказать Инге:</p>\n\n<p><em>Bis <strong>nächsten Monat</strong>, Inge! </em>(Окончание прилагательного <em>-en</em> указывает на винительный падеж.)</p>\n\n<p>Тебе уже известно, что предлог <em>entlang</em> при описании направления движения также используется с винительным падежом. В этом случае существительное в винительном падеже стоит <strong>перед</strong> предлогом.</p>\n\n<p><em>Inge und Jacques gehen <strong>die Straße entlang</strong>.</em></p>\n\n\n\n<p><strong>Артикли и местоимения в винительном падеже</strong></p>\n\n<p>В винительном падеже изменяется артикль мужского рода. Другие артикли, а также отрицательные и личные местоимения имеют идентичные формы в именительном и винительном падежах.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Именительный падеж</td>\n\t\t\t<td>Винительный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>\n\t\t\t<p><strong>der</strong></p>\n\t\t\t</td>\n\t\t\t<td><strong>den </strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p><strong>ein</strong></p>\n\t\t\t</td>\n\t\t\t<td><strong>einen</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><strong>kein</strong></td>\n\t\t\t<td><strong>keinen</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род</td>\n\t\t\t<td>die</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>eine</td>\n\t\t\t<td>\n\t\t\t<p>eine</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>keine</td>\n\t\t\t<td>keine</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род</td>\n\t\t\t<td>\n\t\t\t<p>das</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>das</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>ein</td>\n\t\t\t<td>\n\t\t\t<p>ein</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>kein</td>\n\t\t\t<td>kein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Множественное число</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>-</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>-</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>keine</td>\n\t\t\t<td>keine</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40574864, "shortTitle": "Ausdrücke mit Dativ", "name": "Ausdrücke mit Dativ", "text": "<p><strong>Feste Ausdrücke, die den Dativ verlangen</strong></p>\n\n<p>Nicht nur einzelne Verben, sondern auch Ausdrücke, die aus mehreren Wörtern bestehen, können den Dativ verlangen. Hier findest du einige Beispiele für solche Ausdrücke.</p>\n\n<p>Spaß machen:</p>\n\n<p><em>Fahrradfahren macht <strong>meiner Schwester</strong> Spaß. (= Meine Schwester fährt gern Fahrrad.)<br>\nFahrradfahren macht <strong>mir</strong> Spaß. (= Ich fahre gern Fahrrad.)</em></p>\n\n<p>Angst machen:</p>\n\n<p><em>Spinnen machen <strong>meinem Vater</strong> Angst. (= Mein Vater hat Angst vor Spinnen.)<br>\nSpinnen machen <strong>mir</strong> Angst. (= Ich habe Angst vor Spinnen.)</em></p>\n\n<p>egal sein:</p>\n\n<p><em>Die Hausarbeit ist <strong>meinem Bruder</strong> egal. (= Mein Bruder interessiert sich nicht für die Hausarbeit.)<br>\nDie Hausarbeit ist <strong>mir</strong> egal. (= Ich interessiere mich nicht für die Hausarbeit.)</em></p>\n", "ru": {"name": "Выражения с Dativ", "text": "<p><br>\nНе только отдельные глаголы, но и словосочетания могут требовать после себя дательный падеж. Здесь ты видишь примеры таких устойчивых выражений.<br>\n&#160;</p>\n\n<p>Spaß machen:</p>\n\n<p><em>Fahrradfahren macht <strong>meiner Schwester</strong> Spaß. (= Meine Schwester fährt gern Fahrrad.)<br>\nFahrradfahren macht <strong>mir</strong> Spaß. (= Ich fahre gern Fahrrad.)</em></p>\n\n<p>Angst machen:</p>\n\n<p><em>Spinnen machen <strong>meinem Vater</strong> Angst. (= Mein Vater hat Angst vor Spinnen.)<br>\nSpinnen machen <strong>mir</strong> Angst. (= Ich habe Angst vor Spinnen.)</em></p>\n\n<p>egal sein:</p>\n\n<p><em>Die Hausarbeit ist <strong>meinem Bruder</strong> egal. (= Mein Bruder interessiert sich nicht für die Hausarbeit.)<br>\nDie Hausarbeit ist <strong>mir</strong> egal. (= Ich interessiere mich nicht für die Hausarbeit.)</em></p>\n"}}, {"id": 40459536, "shortTitle": "Dativ", "name": "Dativ", "text": "<p><em>Entschuldigung, <strong>wo</strong> kann ich einen Kaffee trinken? – <strong>In der Cafeteria.</strong></em></p>\n\n<p><em>Und <strong>wo</strong> ist die Cafeteria? – Die Cafeteria ist <strong>in der dritten Etage.</strong></em></p>\n\n\n\n<p><strong>Der Dativ</strong></p>\n\n<p>Du kennst schon zwei Fälle, in denen das Nomen stehen kann: den Nominativ und den Akkusativ. Ein dritter Fall ist der Dativ. Hier verändern sich die Artikel stark.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Dativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(<em>der Flur</em>)</td>\n\t\t\t<td>dem Flur</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>einem Flur</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(<em>die Cafeteria</em>)</td>\n\t\t\t<td>der Cafeteria</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>einer Cafeteria</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(<em>das Büro</em>)</td>\n\t\t\t<td>dem Büro</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>einem Büro</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(<em>die Konferenzräume)</em></td>\n\t\t\t<td>den Konferenzräume<strong><em>n</em></strong>*</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Konferenzräume<strong><em>n*</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>* Im Dativ verändert sich nicht nur der Artikel. Die meisten Nomen erhalten im Plural zusätzlich die Endung <em>-n</em>. Ausnahme: Nomen, die im Plural ohnehin auf <em>-n</em> oder auf <em>-s</em> enden, erhalten kein zusätzliches <em>-n</em>.</p>\n", "ru": {"name": "Дательный падеж", "text": "<p><em>Entschuldigung, <strong>wo</strong> kann ich einen Kaffee trinken? – <strong>In der Cafeteria.</strong></em></p>\n\n<p><em>Und <strong>wo</strong> ist die Cafeteria? – Die Cafeteria ist <strong>in der dritten Etage.</strong></em></p>\n\n\n\n<p><strong>Дательный падеж</strong></p>\n\n<p>Ты знаешь уже два падежа существительных: именительный и винительный. Третий падеж – дательный. В дательном падеже артикли имеют множество различных форм.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Дательный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(<em>der Flur</em>)</td>\n\t\t\t<td>dem Flur</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>einem Flur</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(<em>die Cafeteria</em>)</td>\n\t\t\t<td>der Cafeteria</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>einer Cafeteria</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(<em>das Büro</em>)</td>\n\t\t\t<td>dem Büro</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>einem Büro</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Множественное число</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(<em>die Konferenzräume)</em></td>\n\t\t\t<td>den Konferenzräume<strong><em>n</em></strong>*</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Konferenzräume<strong><em>n*</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>*В дательном падеже изменяется не только артикль. Большинство существительных во множественном числе получают окончание <em>-n</em>. Исключение: существительные, которые во множественном числе заканчиваются на <em>-n</em> или <em>-</em>s, не получают дополнительного окончания <em>-</em><em>n</em>.</p>\n"}}, {"id": 40606453, "shortTitle": "Dativ statt Genitiv", "name": "Dativ statt Genitiv", "text": "<p>In der gesprochenen Sprache verwendet man statt des Genitivs oft die Präposition <em>von</em> + Dativ.</p>\n\n<p>Genitiv:</p>\n\n<p><em>Der Autor <strong>des Buches</strong> ist ein berühmter Schriftsteller.</em></p>\n\n<p><em>von </em>+ Dativ:</p>\n\n<p><em>Der Autor <strong>von dem Buch</strong> ist ein berühmter Schriftsteller.</em><br>\n<br>\nWenn das Nomen, das den Besitz bzw. die Zugehörigkeit angibt, im Plural steht und unbestimmt ist, also keinen Begleiter (Artikel oder Adjektiv) hat, kann man es nicht in den Genitiv setzen. Dann muss man stattdessen <em>von</em> + Dativ verwenden.</p>\n\n<p>Nomen <strong>mit</strong> Artikel: Genitiv</p>\n\n<p><em>Das sind die Mikrofone</em> <strong><em>der Tonassistenten</em></strong>. (Es handelt sich um eine bestimmte Gruppe von Tonassistenten.)</p>\n\n<p>aber:</p>\n\n<p>Nomen <strong>ohne</strong> Artikel: <em>von</em> + Dativ</p>\n\n<p><em>Das sind die Mikrofone von <strong>Tonassistenten</strong>.</em> (Es handelt sich um irgendwelche Tonassistenten.)</p>\n", "ru": {"name": "Дательный вместо родительного", "text": "<p>В устной речи вместо родительного падежа для выражения принадлежности часто используется дательный падеж с предлогом <em>von</em>.</p>\n\n<p>Родительный падеж:</p>\n\n<p><em>Der Autor <strong>des Buches</strong> ist ein berühmter Schriftsteller.</em></p>\n\n<p><em>von </em>+ дательный падеж:</p>\n\n<p><em>Der Autor <strong>von dem Buch</strong> ist ein berühmter Schriftsteller.</em></p>\n\n<p><br>\nЕсли существительное, выражающее принадлежность, стоит во множественном числе и не имеет при себе артикля или прилагательного, родительный падеж не используется. В таких случаях употребляется предлог <em>von</em> + дательный падеж.</p>\n\n<p>Существительные <strong>с </strong>артиклем: родительный падеж</p>\n\n<p><em>Das sind die&#160;Mikrofone</em> <strong><em>der Tonassistenten</em></strong>. (Речь идет об определенной группе ассистентов звукооператора.)</p>\n\n<p>но:</p>\n\n<p>Существительные <strong>без </strong>артикля: <em>von</em> + дательный падеж</p>\n\n<p><em>Das sind die Mikrofone von <strong>Tonassistenten</strong>.</em> (Речь идет о неких ассистентах звукооператора.)</p>\n"}}, {"id": 40606318, "shortTitle": "Genitiv", "name": "Genitiv", "text": "<p>Das Deutsche hat vier Fälle: Nominativ, Akkusativ, Dativ und Genitiv. Mit dem Genitiv kann man Besitz oder Zugehörigkeit ausdrücken.</p>\n\n<p>Man kann ein Nomen durch ein weiteres Nomen im Genitiv, das Genitivattribut, ergänzen. Das Genitivattribut drückt aus, wem oder wozu etwas gehört.</p>\n\n\n\n<p><strong>Nomen als Genitivattribute</strong></p>\n\n<p>Wenn das Genitivattribut kein Eigenname ist, steht es in der Regel hinter dem Nomen, dessen Zugehörigkeit es angibt.</p>\n\n<p><em>Ist das deine Kaffeetasse?<br>\nNein, das ist die Kaffeetasse <strong>des Regisseurs</strong>. </em></p>\n\n<p><em>Ist das Nicos Hut?<br>\nNein, das ist der Hut <strong>der Schauspielerin</strong>. </em></p>\n\n<p><em>Sind das unsere Drehbücher?<br>\nNein, das sind die Drehbücher <strong>des Kamerateams</strong>. </em></p>\n\n<p><em>Sind das eure Mikrofone?<br>\nNein, das sind die Mikrofone <strong>der Tonassistenten</strong>. </em></p>\n\n\n\n<p>Im Genitiv verändern sich die Artikel des Nomens. Außerdem wird an die meisten maskulinen und neutralen Nomen die Endung <em>-s</em> angefügt. Feminine Nomen und Pluralformen erhalten keine Endung.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Genitiv</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>der/ein Regisseur</td>\n\t\t\t<td><em><strong>des/eines</strong></em> Regisseur<em><strong>s</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>die/eine Schauspielerin</td>\n\t\t\t<td><em><strong>der/einer</strong></em> Schauspielerin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>das/ein Kamerateam</td>\n\t\t\t<td><strong><em>des/eines</em><em> </em></strong>Kamerateam<strong><em>s</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Tonassistenten</td>\n\t\t\t<td><strong><em>der</em>&#160;</strong>Tonassistenten</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Nomen, die auf einem s-Laut (<em>-s</em>, <em>-ß</em>, <em>-z </em>oder <em>-x</em>) enden, bilden den Genitiv immer mit der Endung <em>-es</em>.</p>\n\n<p><em>Herr Friese ist der Besitzer <strong>des</strong> Haus<strong>es</strong>.</em><br>\n&#160;</p>\n\n<p>Vor allem bei einsilbigen Nomen sind oft beide Endungen möglich:</p>\n\n<p><em>Das Ende <strong>des</strong> Film<strong>(e)s</strong> ist sehr traurig.</em></p>\n\n<p><em>Der Autor <strong>des </strong>Buch<strong>(e)s</strong> ist ein berühmter Schriftsteller.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>der Genitiv: Im Deutschen gibt es vier verschiedene Formen oder Kategorien des Nomens, die man auch <em>Fälle</em> oder <em>Kasus</em> nennt. Neben dem Nominativ, dem Akkusativ und dem Dativ gibt es auch den Genitiv. Nomen nehmen diese Form zum Beispiel an, wenn sie nach bestimmten Präpositionen stehen oder als Attribut ein anderes Nomen näher bestimmen. Mit einem Genitivattribut kann Besitz oder Zugehörigkeit ausgedrückt werden. Die Artikel haben die Formen: <em>des/eines, der/einer, des/eines, der/-</em>. An maskuline und neutrale Nomen sowie an Eigennamen wird oft ein -<em>s </em>angehängt.<br>\n\t\t\t&#160;</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Родительный падеж", "text": "\n\n<p>В немецком языке четыре падежа: именительный, винительный, дательный и родительный. Родительный падеж выражает обладание или принадлежность.</p>\n\n<p>Существительное можно дополнить другим существительным в родительном падеже. Определение в родительном падеже выражает принадлежность определяемого существительного кому-то или чему-то.</p>\n\n<p><strong>Существительные в функции определения в родительном падеже</strong></p>\n\n<p>Определение в родительном падеже, не являющееся именем собственным, обычно следует за определяемым существительным.</p>\n\n<p><em>Ist das deine Kaffeetasse?<br>\nNein, das ist die Kaffeetasse <strong>des Regisseurs</strong>. </em></p>\n\n<p><em>Ist das Nicos Hut?<br>\nNein, das ist der Hut <strong>der Schauspielerin</strong>. </em></p>\n\n<p><em>Sind das unsere Drehbücher?<br>\nNein, das sind die Drehbücher <strong>des Kamerateams</strong>. </em></p>\n\n<p><em>Sind das eure Mikrofone?<br>\nNein, das sind die Mikrofone <strong>der Tonassistenten</strong>. </em></p>\n\n<p><br>\nВ родительном падеже изменяются артикли. Кроме того, большинство существительных в мужском и среднем роде получают окончание <em>-</em><em>s</em>. Существительные в женском роде и множественном числе не получают дополнительных окончаний.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Родительный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>der/ein Regisseur</td>\n\t\t\t<td><em><strong>des/eines</strong></em> Regisseur<em><strong>s</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>die/eine Schauspielerin</td>\n\t\t\t<td><strong><em>der/einer</em></strong> Schauspielerin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>das/ein Kamerateam</td>\n\t\t\t<td><strong><em>des/eines </em></strong>Kamerateam<strong><em>s</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Множественное число</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Tonassistenten</td>\n\t\t\t<td><strong><em>der</em>&#160;</strong>Tonassistenten</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Существительные, оканчивающиеся на <em>-s</em>, <em>-ß</em>, <em>-z </em>или <em>-x</em>, в родительном падеже всегда получают окончание <em>-es</em>.</p>\n\n<p><em>Herr Friese ist der Besitzer <strong>des</strong> Haus<strong>es</strong>.</em></p>\n\n<p><br>\nК односложным существительным в родительном падеже можно добавлять окончание обоих видов:</p>\n\n<p><em>Das Ende <strong>des</strong> Film<strong>(e)s</strong> ist sehr traurig.</em></p>\n\n<p><em>Der Autor <strong>des </strong>Buch<strong>(e)s</strong> ist ein berühmter Schriftsteller.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>der Genitiv: В немецком языке различают четыре падежа, которые называются <em>Fälle</em> или <em>Kasus</em>.&#160; Помимо именительного, винительного и дательного падежей есть еще родительный падеж. Существительные и местоимения стоят в этом падеже после определенных предлогов или, будучи определением другого существительного. Определение в родительном падеже выражает обладание или принадлежность. Артикли в родительном падеже имеют следующие формы: <em>des/eines, der/einer, des/eines, der/-</em>.&#160; Существительные мужского и среднего рода, а также имена собственные в родительном падеже получают, как правило, окончание <em>-</em><em>s</em>.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 39135857, "shortTitle": "n-Deklination", "name": "n-Deklination", "text": "<p><strong>Nomen der n-Deklination</strong></p>\n\n<p><em>Der Bankangestellte spricht mit einem </em><strong>Kunden</strong><em>. </em><strong>Der Kunde</strong><em> möchte einen Kredit aufnehmen.</em></p>\n\n<p>Einige Nomen werden nach einem besonderen Muster dekliniert. Sie haben im Akkusativ, im Dativ, im Genitiv und im Plural die Endung <em>-(e)n</em>. Deshalb heißt diese Form der Deklination <em>n-Deklination</em>.</p>\n\n<p>Beispiel:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Singular</td>\n\t\t\t<td>Plural</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td><em>der Kunde</em></td>\n\t\t\t<td><em>die Kunde</em><strong>n</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Akkusativ</td>\n\t\t\t<td><em>den Kunde</em><strong>n</strong></td>\n\t\t\t<td><em>die Kunde</em><strong>n</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Dativ</td>\n\t\t\t<td><em>dem Kunde</em><strong>n</strong></td>\n\t\t\t<td><em>den Kunde</em><strong>n</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Genitiv</td>\n\t\t\t<td><em>des Kunde</em><strong>n</strong></td>\n\t\t\t<td><em>der Kunde</em><strong>n</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nFast alle Nomen, die so dekliniert werden, sind maskulin. Meistens sind es Wörter, die Personen (z. B. Beruf oder Nationalität) oder Tiere beschreiben.&#160;</p>\n\n<p>Beispiele:</p>\n\n<p><strong>der Nachbar<em>:</em></strong><em> Ibrahim spricht mit seinem Nachbar</em><strong>n</strong><em>.</em></p>\n\n<p><strong>der Fotograf<em>:</em></strong><em> Sebastian trifft sich mit einem bekannten Fotograf</em><strong>en</strong><em>.</em></p>\n\n<p><strong>der Elefant<em>:</em></strong><em> Otto war schon mal in Indien und ist dort auf einem Elefant</em><strong>en</strong><em><strong> </strong>geritten.</em></p>\n\n<p><strong>der Türke<em>:</em></strong><em> Tarek telefoniert mit einem Türk</em><strong>en</strong><em> aus Ankara.</em><br>\n<br>\nViele dieser Nomen haben die Endung <em>-e</em>, <em>-ent</em>, <em>-ant</em>, <em>-ist</em>, <em>-oge</em> oder <em>-at</em>.<br>\n&#160;</p>\n\n<p>Besonderheiten:</p>\n\n<p>Einige Nomen, die zur Gruppe der n-Deklination gehören, bekommen im Genitiv Singular die Endung <em>-ns</em>, zum Beispiel:</p>\n\n<p>der Buchstabe – des Buchstabe<strong>ns</strong><br>\n&#160;</p>\n", "ru": null}, {"id": 40492580, "shortTitle": "Personalpronomen: Akk.", "name": "Personalpronomen: Akk.", "text": "<p><strong>Personalpronomen&#160;im Akkusativ</strong><br>\n<br>\n<em>Wo ist <strong>der Schlüssel</strong> von Yaras Geschäft? – <strong>Er </strong>ist bei Max und Tarek.<br>\nHaben Max und Tarek <strong>den Schlüssel</strong> von Yaras Geschäft? – Ja, sie haben <strong>ihn</strong>.&#160;</em></p>\n\n<p>Jedes Nomen kann durch ein Pronomen ersetzt werden. Die Personalpronomen können für Lebewesen, Gegenstände oder Sachverhalte stehen. Jedes Pronomen kann nicht nur im Nominativ, sondern auch in den anderen Fällen vorkommen. Beispielsweise steht ein Personalpronomen nach bestimmten Präpositionen oder Verben immer im Akkusativ.<br>\nDie meisten Personalpronomen haben im Akkusativ eine andere Form als im Nominativ, aber einige bleiben auch unverändert.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td>Akkusativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich</td>\n\t\t\t<td><strong><em>mich</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>du</td>\n\t\t\t<td><strong><em>dich</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>er</td>\n\t\t\t<td><strong><em>ihn</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td><em>sie</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>es</td>\n\t\t\t<td><em>es</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir</td>\n\t\t\t<td><strong><em>uns</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ihr</td>\n\t\t\t<td><strong><em>euch</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td><em>sie</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Sie</td>\n\t\t\t<td><em>Sie</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Личные местоимения: Akk.", "text": "<p><strong>Личные местоимения в винительном падеже</strong></p>\n\n<p><em>Wo ist <strong>der Schlüssel</strong> von Yaras Geschäft? – <strong>Er</strong> ist bei Max und Tarek.</em></p>\n\n<p><em>Haben Max und Tarek <strong>den Schlüssel</strong> von Yaras Geschäft? – Ja, sie haben <strong>ihn</strong>. </em></p>\n\n\n\n<p>Любое существительное можно заменить местоимением. Личные местоимения могут обозначать живые существа, предметы или явления. Местоимение может стоять не только в именительном, но и в других падежах. Например, если личное местоимение стоит после предлога или глагола, требующего винительного падежа, то местоимение будет в винительном падеже.</p>\n\n<p>Большинство личных местоимений в винительном падеже имеют форму, отличную от именительного падежа, но есть и такие, которые остаются неизменными.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Именительный падеж</td>\n\t\t\t<td>Винительный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich</td>\n\t\t\t<td><strong><em>mich</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>du</td>\n\t\t\t<td><strong><em>dich</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>er</td>\n\t\t\t<td><strong><em>ihn</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td><em>sie</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>es</td>\n\t\t\t<td><em>es</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir</td>\n\t\t\t<td><strong><em>uns</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ihr</td>\n\t\t\t<td><strong><em>euch</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td><em>sie</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Sie</td>\n\t\t\t<td><em>Sie</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40508994, "shortTitle": "Personalpronomen: Dativ", "name": "Personalpronomen: Dativ", "text": "<p><strong>Personalpronomen im Dativ</strong></p>\n\n<p>Personalpronomen können nicht nur im Nominativ, sondern auch in den anderen Fällen vorkommen. Beispielsweise steht ein Personalpronomen nach bestimmten Präpositionen oder Verben im Akkusativ. Andere Präpositionen oder Verben verlangen den Dativ.</p>\n\n<p>Nominativ: <em>Vermisst <strong>du</strong> spanisches Essen?</em></p>\n\n<p>Akkusativ: <em>Wir haben für <strong>dich</strong> Paella gekocht.</em></p>\n\n<p>Dativ: <em>Schmeckt <strong>dir</strong> die Paella?</em></p>\n\n<p><br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td>Akkusativ</td>\n\t\t\t<td>Dativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich</td>\n\t\t\t<td>mich</td>\n\t\t\t<td>mir</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>du</td>\n\t\t\t<td>dich</td>\n\t\t\t<td>dir</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>er</td>\n\t\t\t<td>ihn</td>\n\t\t\t<td>ihm</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td>sie</td>\n\t\t\t<td>ihr</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>es</td>\n\t\t\t<td>es</td>\n\t\t\t<td>ihm</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir</td>\n\t\t\t<td>uns</td>\n\t\t\t<td>uns</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ihr</td>\n\t\t\t<td>euch</td>\n\t\t\t<td>euch</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td>sie</td>\n\t\t\t<td>ihnen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Sie</td>\n\t\t\t<td>Sie</td>\n\t\t\t<td>Ihnen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Личные местоимения: Dativ", "text": "<p><strong>Личные местоимения в дательном падеже</strong></p>\n\n<p>Личные местоимения могут стоять не только в именительном, но и в других падежах. К примеру, после определенных предлогов или глаголов личные местоимения могут стоять в винительном падеже. Другие предлоги или глаголы требуют дательного падежа. &#160;</p>\n\n<p>Именительный падеж: <em>Vermisst</em> <strong><em>du</em></strong> <em>spanisches</em> <em>Essen</em><em>?</em></p>\n\n<p>Винительный падеж: <em>Wir haben für <strong>dich</strong> Paella gekocht.</em></p>\n\n<p>Дательный падеж: <em>Schmeckt <strong>dir</strong> die Paella?</em><br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Им. падеж</td>\n\t\t\t<td>Вин. падеж</td>\n\t\t\t<td>Дат. падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich</td>\n\t\t\t<td>mich</td>\n\t\t\t<td>mir</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>du</td>\n\t\t\t<td>dich</td>\n\t\t\t<td>dir</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>er</td>\n\t\t\t<td>ihn</td>\n\t\t\t<td>ihm</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td>sie</td>\n\t\t\t<td>ihr</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>es</td>\n\t\t\t<td>es</td>\n\t\t\t<td>ihm</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir</td>\n\t\t\t<td>uns</td>\n\t\t\t<td>uns</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ihr</td>\n\t\t\t<td>euch</td>\n\t\t\t<td>euch</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td>sie</td>\n\t\t\t<td>ihnen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Sie</td>\n\t\t\t<td>Sie</td>\n\t\t\t<td>Ihnen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40510548, "shortTitle": "Präpositionen + Dativ ", "name": "Präpositionen + Dativ ", "text": "<p><strong>Zusammenfassung: Präpositionen mit Dativ</strong></p>\n\n<p>Nach einigen Präpositionen steht immer der Dativ. Folgende Präpositionen kennst du schon:</p>\n\n\n\n<p><strong><em>aus</em></strong><em>: Tarek kommt <strong>aus der Türkei</strong>.</em></p>\n\n<p><strong><em>nach</em></strong><em>: <strong>Nach dem Essen</strong> lerne ich Deutsch.</em></p>\n\n<p><strong><em>von</em></strong><em>: Das Haus ist in der Nähe <strong>vom Bahnhof</strong>. (vom = von + dem)</em></p>\n\n<p><strong><em>bei</em></strong><em>: Selma wohnt <strong>bei ihnen</strong>.</em></p>\n\n<p><strong><em>zu</em></strong><em>: Nico geht <strong>zum Deutschkurs</strong>. (zum = zu + dem)</em></p>\n\n<p><strong><em>mit</em></strong><em>: Nico fährt <strong>mit dem Bus</strong>.</em></p>\n\n<p><strong><em>ab</em></strong><em>: Tarek hat <strong>ab dem ersten Februar</strong> eine Woche Urlaub.</em></p>\n\n\n\n<p>Wechselpräpositionen verlangen den Dativ, wenn sie verwendet werden, um die Frage <em>Wo ...?</em> zu beantworten:</p>\n\n\n\n<p><strong><em>in</em></strong><em>: Nico, Inge und Tarek sind <strong>im Restaurant</strong>. (im = in + dem)</em></p>\n\n<p><strong><em>an</em></strong><em>: Nico und Inge sitzen <strong>am Tisch</strong>. (am = an + dem)</em></p>\n\n<p><strong><em>unter</em></strong><em>: Nicos Füße sind <strong>unter dem Tisch</strong>.</em></p>\n\n<p><strong><em>über</em></strong><em>: Die Lampe hängt nicht <strong>über dem Tisch</strong> von Nico und Inge.</em></p>\n\n<p><strong><em>auf</em></strong><em>: Das Essen steht <strong>auf dem Tisch</strong>.</em></p>\n\n<p><strong><em>vor</em></strong><em>: Die Blumenvase steht <strong>vor dem Teller</strong> von Inge.</em></p>\n\n<p><strong><em>hinter</em></strong><em>: Das Kuchenregal steht <strong>hinter dem Stuhl </strong>von Inge.</em></p>\n\n<p><strong><em>neben</em></strong><em>: Nicos Messer liegt <strong>neben dem Teller</strong>.</em></p>\n\n<p><strong><em>zwischen</em></strong><em>: Der Orangensaft steht <strong>zwischen dem Teller und der Blumenvase</strong>.</em></p>\n", "ru": {"name": "Предлоги + дательный падеж", "text": "<p><strong>Обзор: Предлоги с дательным падежом</strong></p>\n\n\n\n<p>После некоторых предлогов всегда стоит дательный падеж. Тебе уже знакомы следующие предлоги:</p>\n\n<p><strong><em>aus</em></strong><em>: Tarek kommt <strong>aus der Türkei</strong>.</em></p>\n\n<p><strong><em>nach</em></strong><em>: <strong>Nach dem Essen</strong> lerne ich Deutsch.</em></p>\n\n<p><strong><em>von</em></strong><em>: Das Haus ist in der Nähe <strong>vom Bahnhof</strong>. (vom = von + dem)</em></p>\n\n<p><strong><em>bei</em></strong><em>: Selma wohnt <strong>bei ihnen</strong>.</em></p>\n\n<p><strong><em>zu</em></strong><em>: Nico geht <strong>zum Deutschkurs</strong>. (zum = zu + dem)</em></p>\n\n<p><strong><em>mit</em></strong><em>: Nico fährt <strong>mit dem Bus</strong>.</em></p>\n\n<p><strong><em>ab</em></strong><em>: Tarek hat <strong>ab dem ersten Februar</strong> eine Woche Urlaub.</em></p>\n\n\n\n<p>Предлоги, управляющие двумя падежами, требуют дательного падежа, если их используют для ответа на вопрос о местонахождении <em>Wo ...?</em>:</p>\n\n\n\n<p><strong><em>in</em></strong><em>: Nico, Inge und Tarek sind <strong>im Restaurant</strong>. (im = in + dem)</em></p>\n\n<p><strong><em>an</em></strong><em>: Nico und Inge sitzen <strong>am Tisch</strong>. (am = an + dem)</em></p>\n\n<p><strong><em>unter</em></strong><em>: Nicos Füße sind <strong>unter dem Tisch</strong>.</em></p>\n\n<p><strong><em>über</em></strong><em>: Die Lampe hängt nicht <strong>über dem Tisch</strong> von Nico und Inge.</em></p>\n\n<p><strong><em>auf</em></strong><em>: Das Essen steht <strong>auf dem Tisch</strong>.</em></p>\n\n<p><strong><em>vor</em></strong><em>: Die Blumenvase steht <strong>vor dem Teller</strong> von Inge.</em></p>\n\n<p><strong><em>hinter</em></strong><em>: Das Kuchenregal steht <strong>hinter dem Stuhl </strong>von Inge.</em></p>\n\n<p><strong><em>neben</em></strong><em>: Nicos Messer liegt <strong>neben dem Teller</strong>.</em></p>\n\n<p><strong><em>zwischen</em></strong><em>: Der Orangensaft steht <strong>zwischen dem Teller und der Blumenvase</strong>.</em></p>\n"}}, {"id": 40598302, "shortTitle": "Relativsätze + Präposition", "name": "Relativsätze + Präposition (1)", "text": "<p><strong>Relativsätze: Relativpronomen nach Dativpräpositionen</strong></p>\n\n<p>Wenn das Relativpronomen mit einer Präposition mit dem Verb verbunden werden muss, steht diese Präposition im Relativsatz unmittelbar vor dem Relativpronomen. Der Kasus des Relativpronomens richtet sich dann nach der Präposition. Steht das Relativpronomen also nach einer Präposition, die den Dativ verlangt, wird es ebenfalls in den Dativ gesetzt.</p>\n\n<p><em>Pepe ist Nicos <strong>Bruder</strong>. Er hatte mit <strong>ihm</strong> (= <strong>dem Bruder</strong>) schon oft Streit.<br>\nPepe ist Nicos Bruder, mit <strong>dem</strong> er schon oft Streit hatte.</em></p>\n\n<p><em>Pepe hat <strong>Bekannte</strong>. Nico kann bei <strong>ihnen</strong> (= <strong>den Bekannten</strong>) ein Praktikum machen.<br>\nPepe hat <strong>Bekannte</strong>, bei <strong>denen</strong> Nico ein Praktikum machen kann.</em></p>\n\n<p>Erinnerst du dich noch? Nach den Präpositionen <em>aus</em>, <em>von</em>, <em>bei</em>, <em>zu</em>, <em>mit</em>, <em>ab, nach</em> und <em>seit</em> steht immer der Dativ.</p>\n", "ru": {"name": "Придаточное + предлог", "text": "<p><strong>Придаточные определительные: Относительные местоимения с предлогами, управляющими дательным падежом </strong></p>\n\n<p>Если относительное местоимение связано с глаголом с помощью предлога, в придаточном определительном предложении предлог стоит непосредственно перед относительным местоимением. Падеж относительного местоимения зависит от предлога. После предлога, управляющего дательным падежом, относительное местоимение стоит в дательном падеже.</p>\n\n<p><em>Pepe ist Nicos <strong>Bruder</strong>. Er hatte mit <strong>ihm</strong> (= <strong>dem Bruder</strong>) schon oft Streit.<br>\nPepe ist Nicos Bruder, mit <strong>dem</strong> er schon oft Streit hatte.</em><br>\n<br>\n<em>Pepe hat <strong>Bekannte</strong>. Nico kann bei <strong>ihnen</strong> (= <strong>den Bekannten</strong>) ein Praktikum machen.<br>\nPepe hat <strong>Bekannte</strong>, bei <strong>denen</strong> Nico ein Praktikum machen kann.</em></p>\n\n<p>Помнишь ли ты? После предлогов <em>aus</em>, <em>von</em>, <em>bei</em>, <em>zu</em>, <em>mit</em>, <em>ab</em><em>, </em><em>nach</em> и <em>seit</em> всегда употребляется дательный падеж.</p>\n"}}, {"id": 40600782, "shortTitle": "Relativsätze + Präposition", "name": "Relativsätze + Präposition (2)", "text": "<p><strong>Relativsätze mit Wechselpräpositionen</strong></p>\n\n<p>Du kennst bereits Relativsätze, an deren Beginn eine Präposition steht. Diese Präposition bestimmt den Kasus des Relativpronomens. Wenn die Präposition, die am Anfang des Relativsatzes steht, eine lokale Wechselpräposition ist, gelten die Regeln, die du schon kennst: Wird durch die Präposition und das folgende Relativpronomen die Frage <em>Wo ...?</em> beantwortet, steht das Relativpronomen im Dativ. Wenn die Frage <em>Wohin ...?</em> beantwortet wird, verwendest du das Relativpronomen im Akkusativ.</p>\n\n<p>Dativ:</p>\n\n<p><em>Das ist das Theater. <strong>In dem Theater</strong> treten viele berühmte Schauspieler auf.</em><br>\n<strong><em>Wo</em></strong><em> treten viele berühmte Schauspieler auf? – In dem Theater.<br>\nDas ist das Theater, <strong>in dem</strong> viele berühmte Schauspieler auftreten.</em></p>\n\n\n\n<p><em>Das ist die Bühne. <strong>Auf der</strong> Bühne stehen die Schauspieler jeden Abend.</em><br>\n<strong><em>Wo</em></strong><em> stehen die Schauspieler jeden Abend? – Auf der Bühne.<br>\nDas ist die Bühne, <strong>auf der</strong> die Schauspieler jeden Abend stehen.</em></p>\n\n\n\n<p>Akkusativ:</p>\n\n<p><em>Das ist das Theater. <strong>In das Theater</strong> gehen jede Woche mehrere Tausend Menschen.</em><br>\n<strong><em>Wohin</em></strong><em> gehen jede Woche mehrere Tausend Menschen? – In das Theater.<br>\nDas ist das Theater, <strong>in das</strong> jede Woche mehrere Tausend Menschen gehen.</em></p>\n\n\n\n<p><em>Das ist die Bühne. <strong>Auf die Bühne</strong> ist ein Zuschauer geklettert, weil er einer Schauspielerin Blumen schenken wollte.</em><br>\n<strong><em>Wohin</em></strong><em> ist ein Zuschauer geklettert? – Auf die Bühne.<br>\nDas ist die Bühne, <strong>auf die</strong> ein Zuschauer geklettert ist, weil er einer Schauspielerin Blumen schenken wollte.</em></p>\n", "ru": {"name": "Придаточное + предлог", "text": "<p><strong>Придаточные определительные предложения и предлоги с двойным управлением </strong></p>\n\n<p>Тебе уже знакомы придаточные определительные предложения, начинающиеся с предлога. От этого предлога зависит падеж относительного местоимения. Если в начале придаточного определительного стоит предлог места, управляющий двумя падежами, работает уже известное тебе правило: если речь идет о месте в пространстве (<em>Wo</em><em> ...?)</em>, относительное местоимение стоит в дательном падеже. Если речь идет о направлении движения (<em>Wohin</em><em> ...?)</em>, относительное местоимение стоит в винительном падеже.</p>\n\n<p>Дательный падеж:</p>\n\n<p><em>Das ist das Theater. <strong>In dem Theater</strong> treten viele berühmte Schauspieler auf.</em></p>\n\n<p><strong><em>Wo</em></strong><em> treten viele berühmte Schauspieler auf? – In dem Theater.</em></p>\n\n<p><em>Das ist das Theater, <strong>in dem</strong> viele berühmte Schauspieler auftreten.</em></p>\n\n\n\n<p><em>Das ist die Bühne. <strong>Auf der</strong> Bühne stehen die Schauspieler jeden Abend.</em></p>\n\n<p><strong><em>Wo</em></strong><em> stehen die Schauspieler jeden Abend? – Auf der Bühne.</em></p>\n\n<p><em>Das ist die Bühne, <strong>auf der</strong> die Schauspieler jeden Abend stehen.</em></p>\n\n\n\n<p>Винительный падеж:</p>\n\n<p><em>Das ist das Theater. <strong>In das Theater</strong> gehen jede Woche mehrere Tausend Menschen.</em></p>\n\n<p><strong><em>Wohin</em></strong><em> gehen jede Woche mehrere Tausend Menschen? – In das Theater.</em></p>\n\n<p><em>Das ist das Theater, <strong>in das</strong> jede Woche mehrere Tausend Menschen gehen.</em></p>\n\n\n\n<p><em>Das ist die Bühne. <strong>Auf die Bühne</strong> ist ein Zuschauer geklettert, weil er einer Schauspielerin Blumen schenken wollte.</em></p>\n\n<p><strong><em>Wohin</em></strong><em> ist ein Zuschauer geklettert? – Auf die Bühne.</em></p>\n\n<p><em>Das ist die Bühne, <strong>auf die</strong> ein Zuschauer geklettert ist, weil er einer Schauspielerin Blumen schenken wollte.</em></p>\n"}}, {"id": 40586519, "shortTitle": "Relativsätze: Akkusativ", "name": "Relativsätze: Akkusativ", "text": "<p><strong>Relativsätze mit Relativpronomen im Akkusativ</strong></p>\n\n<p>Du hast schon gelernt, dass Relativsätze nähere Informationen zu einem Nomen oder Pronomen in einem übergeordneten Satz geben, dem sogenannten Bezugswort. Dieses Bezugswort bestimmt Genus (= grammatisches Geschlecht) und Numerus (= Singular/Plural) des Relativpronomens, das den Relativsatz&#160; mit dem übergeordneten Satz verbindet. Der Kasus (= Fall), in dem das Relativpronomen steht, hängt hingegen davon ab, welche grammatische Funktion das Relativpronomen im Relativsatz hat.</p>\n\n<p>Im Nominativ und im Akkusativ sehen die Formen des Relativpronomens <em>der</em>, <em>die</em> und <em>das</em> genauso aus wie die bestimmten Artikel:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Genus/Numerus</td>\n\t\t\t<td>Kasus</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td>Akkusativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>der</td>\n\t\t\t<td>den</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin</td>\n\t\t\t<td>die</td>\n\t\t\t<td>die</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral</td>\n\t\t\t<td>das</td>\n\t\t\t<td>das</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>die</td>\n\t\t\t<td>die</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><em>Ein Bäcker ist <strong>ein Mann</strong>.</em> (Nominativ maskulin Singular)</p>\n\n<p><strong><em>Er</em></strong><em> (= <strong>der Mann</strong>) muss sehr früh aufstehen.</em> (Subjekt: Nominativ)</p>\n\n<p><em>Ein Bäcker ist ein Mann, <strong>der</strong> sehr früh aufstehen muss.</em></p>\n\n\n\n<p><em>Ein Bäcker ist <strong>ein Mann</strong>.</em> (Nominativ&#160;maskulin&#160;Singular)</p>\n\n<p><em>Man sieht <strong>ihn</strong> (= <strong>den Mann</strong>) morgens in der Bäckerei.</em> (Akkusativobjekt)</p>\n\n<p><em>Ein Bäcker ist ein Mann, <strong>den</strong> man morgens in der Bäckerei sieht.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>das Genus: Das Genus ist das grammatische Geschlecht eines Nomens. Man erkennt das Genus am bestimmten Artikel des Nomens.</p>\n\n\t\t\t<p>der Numerus: Der Numerus eines Wortes ist der Singular oder der Plural.</p>\n\t\t\tder Kasus<span id=\"ck_editor_caret_marker\" style=\"display:none\"></span>:&#160;Der Kasus ist der Fall, in dem ein Pronomen bzw. ein Nomen mit seinen Begleitern steht, z. B. der Nominativ, der Akkusativ oder der Dativ.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Придаточные: Akkusativ", "text": "<p><strong>Придаточные определительные предложения с относительным местоимением в винительном падеже </strong></p>\n\n<p>Тебе уже известно, что придаточные определительные предложениях характеризуют предмет или явление, называемые существительным или местоимением в главном предложении. Так называемое определяемое слово задает род (Genus)&#160; и число (Numerus) относительного местоимения, которое соединяет придаточное предложение с главным. А вот падеж (Kasus), в котором стоит относительное местоимение, зависит от функции местоимения в придаточном определительном предложении.</p>\n\n<p>В именительном и винительном падежах относительные местоимения <em>der</em>, <em>die</em> и <em>das</em> совпадают по форме с определенными артиклями:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Род/Число</td>\n\t\t\t<td>Падеж</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Именительный</td>\n\t\t\t<td>Винительный</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>der</td>\n\t\t\t<td>den</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род</td>\n\t\t\t<td>die</td>\n\t\t\t<td>die</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род</td>\n\t\t\t<td>das</td>\n\t\t\t<td>das</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Множественное число</td>\n\t\t\t<td>die</td>\n\t\t\t<td>die</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><em>Ein Bäcker ist <strong>ein Mann</strong>.&#160;</em>(именительный падеж, мужской род, единственное число)<br>\n<strong><em>Er</em></strong><em> (= <strong>der Mann</strong>) muss sehr früh aufstehen.</em> (подлежащее в именительном падеже)<br>\n<em>Ein Bäcker ist ein Mann, <strong>der</strong> sehr früh aufstehen muss.</em></p>\n\n\n\n<p><em>Ein Bäcker ist <strong>ein Mann</strong>.</em> (именительный падеж, мужской род, единственное число)<br>\n<em>Man sieht <strong>ihn</strong> (= <strong>den Mann</strong>) morgens in der Bäckerei.</em> (прямое дополнение)<br>\n<em>Ein Bäcker ist ein Mann, <strong>den</strong> man morgens in der Bäckerei sieht.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>das Genus: &#160;Грамматический род существительного можно определить по определенному артиклю существительного.</p>\n\n\t\t\t<p>der Numerus: &#160;Существительные имеют два числа - единственное и множественное.</p>\n\n\t\t\t<p>der Kasus: Падеж выражает синтаксическую и семантическую роль существительного и местоимения, а также сопровождающих их слов в предложении. В немецком языке различаются именительный, родительный, винительный и дательный падежи.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40598255, "shortTitle": "Relativsätze: Dativ", "name": "Relativsätze: Dativ", "text": "<p><strong>Relativsätze: Relativpronomen als Dativobjekt</strong></p>\n\n<p>Ein Relativpronomen kann im Dativ stehen, wenn es das Dativobjekt des Relativsatzes ist.</p>\n\n<p><em>Nico trifft <strong>Pepe</strong>. Die Krimiserie gefällt <strong>ihm</strong> (= <strong>Pepe</strong>) gut.<br>\nNico trifft Pepe, <strong>dem</strong> die Krimiserie gut gefällt.</em></p>\n\n<p><em>Nico trifft <strong>Selma</strong>. Er hat <strong>ihr</strong> (= <strong>Selma</strong>) ein Fahrrad geschenkt.<br>\nNico trifft <strong>Selma</strong>, <strong>der</strong> er ein Fahrrad geschenkt hat.</em></p>\n\n<p>Im Dativ Singular haben die Relativpronomen <em>der</em>, <em>die</em> und <em>das</em> die gleiche Form wie die bestimmten Artikel: <em>dem</em> und <em>der</em>. Im Plural bildet man das Relativpronomen aus dem bestimmten Artikel <em>den </em>+<em> en. </em>Es lautet:<em> denen</em>.</p>\n\n<p><em>Nico trifft <strong>Max und Tarek</strong>. Er hilft <strong>ihnen</strong> (= <strong>Max und Tarek</strong>) im Restaurant.<br>\nNico trifft <strong>Max und Tarek</strong>, <strong>denen</strong> er im Restaurant hilft.</em></p>\n\n\n\n<p><strong>Die Relativpronomen im Dativ:</strong></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Genus/Numerus</strong></td>\n\t\t\t<td><strong>Kasus:</strong> <strong>Dativ</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>maskulin</td>\n\t\t\t<td><em>dem</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin</td>\n\t\t\t<td><em>der</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral</td>\n\t\t\t<td><em>dem</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td><em>den<strong>en</strong></em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Придаточное определительное: Dativ", "text": "<p><strong>Придаточные определительные предложения: Относительное местоимение в дательном падеже</strong></p>\n\n<p>Относительное местоимение употребляется в дательном падеже, если оно является косвенным дополнением в придаточном определительном предложении.</p>\n\n<p><em>Nico trifft <strong>Pepe</strong>. Die Krimiserie gefällt <strong>ihm</strong> (= <strong>Pepe</strong>) gut.<br>\nNico trifft Pepe, <strong>dem</strong> die Krimiserie gut gefällt.</em></p>\n\n<p><em>Nico trifft <strong>Selma</strong>. Er hat <strong>ihr</strong> (= <strong>Selma</strong>) ein Fahrrad geschenkt.<br>\nNico trifft <strong>Selma</strong>, <strong>der</strong> er ein Fahrrad geschenkt hat.</em></p>\n\n<p>В дательном падеже и единственном числе относительные местоимения <em>der</em>, <em>die</em> и <em>das</em> совпадают по форме с определенным артиклем: <em>dem</em> и <em>der</em>. Во множественном числе относительное местоимение в дательном падеже образуется из определенного артикля <em>den</em> + <em>en</em>: <em>denen</em>.</p>\n\n<p><em>Nico trifft <strong>Max und Tarek</strong>. Er hilft <strong>ihnen</strong> (= <strong>Max und Tarek</strong>) im Restaurant.<br>\nNico trifft <strong>Max und Tarek</strong>, <strong>denen</strong> er im Restaurant hilft.</em></p>\n\n\n\n<p><strong>Относительные местоимения в дательном падеже:</strong></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Род/Число</strong></td>\n\t\t\t<td><strong>Падеж:</strong>&#160;<strong>дательный</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td><em>dem</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род</td>\n\t\t\t<td><em>der</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род</td>\n\t\t\t<td><em>dem</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Множественное число</td>\n\t\t\t<td><em>den<strong>en</strong></em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 39134923, "shortTitle": "Relativsätze: Genitiv", "name": "Relativsätze: Genitiv", "text": "<p><strong>Relativsätze im Genitiv</strong></p>\n\n<p>Mit einem Genitiv oder einem Possessivartikel kannst du eine Zugehörigkeit oder einen Besitz ausdrücken. Man kann sich so auf ein Wort in einem früheren Satz beziehen.</p>\n\n<p><strong>Genitiv: </strong></p>\n\n<p><em>Fatih Akin ist Regisseur. </em><strong>Fatih Akins</strong><em><strong> </strong>Eltern kommen aus der Türkei.</em></p>\n\n<p><strong>Possessivartikel:</strong></p>\n\n<p><em>Fatih Akin ist Regisseur. </em><strong>Seine</strong><em> Eltern kommen aus der Türkei.</em></p>\n\n<p><strong>Relativsatz:</strong></p>\n\n<p>In einem Relativsatz kannst du diese Beziehung so ausdrücken:</p>\n\n<p><em>Fatih Akin, </em><strong>dessen</strong> <em>Eltern aus der Türkei kommen, ist Regisseur.</em><br>\n<br>\nWenn das Bezugswort <strong>maskulin</strong> oder <strong>neutral</strong> ist, verwendest du das Relativpronomen <strong><em>dessen</em></strong>.</p>\n\n<p>Wenn das Bezugswort <strong>feminin</strong> ist oder im <strong>Plural</strong> steht, verwendest du das Relativpronomen <strong><em>deren</em></strong>.</p>\n\n\n\n<p>Mehr Beispiele:</p>\n\n<p><em>Der Film „Solino“ erzählt die Geschichte von </em><strong>Familie Amato</strong><em>. </em><strong>Ihr</strong> <em>Traum ist ein besseres Leben in Deutschland.</em></p>\n\n<p><em>Der Film „Solino“ erzählt die Geschichte von Familie Amato, </em><strong>deren</strong> <em>Traum ein besseres Leben in Deutschland ist.</em><br>\n<br>\n<strong>Der Vater</strong><em> ist unzufrieden. </em><strong>Seine</strong> <em>Arbeit im Bergwerk ist hart.</em></p>\n\n<p><em>Der Vater, </em><strong>dessen</strong> <em>Arbeit im Bergwerk hart ist, ist unzufrieden.</em><br>\n<br>\n<strong>Die Söhne Giancarlo und Gigi</strong><em> lernen schnell Deutsch. </em><strong>Ihre</strong> <em>Freunde kommen aus Deutschland.</em></p>\n\n<p><strong>Die Söhne Giancarlo und Gigi</strong><em>, </em><strong>deren</strong> <em>Freunde aus Deutschland kommen, lernen schnell Deutsch.</em></p>\n", "ru": null}, {"id": 40577791, "shortTitle": "Relativsätze: Nominativ", "name": "Relativsätze: Nominativ", "text": "<p><strong>Relativsätze</strong></p>\n\n<p>Relativsätze sind Nebensätze. Sie können in der Regel nicht allein stehen und sind von einem übergeordneten Hauptsatz oder Nebensatz abhängig. Relativsätze geben nähere Informationen zu einem Nomen oder Pronomen im übergeordneten Satz. Ein Relativsatz steht in der Regel direkt hinter dem Wort, auf das er sich bezieht. Das konjugierte Verb steht normalerweise am Ende des Relativsatzes. Der Relativsatz ist durch ein Relativpronomen mit dem übergeordneten Satz verbunden. Dieses Relativpronomen verweist auf das Bezugswort im übergeordneten Satz.</p>\n\n<p><strong>Relativpronomen</strong></p>\n\n<p>Die Formen der Relativpronomen <em>der</em>, <em>die</em> und <em>das</em> stimmen zum größten Teil mit denen des bestimmten Artikels überein. In den Formen <em>der</em>, <em>die</em> und <em>das</em> leiten die Relativpronomen Relativsätze im Nominativ ein. Das Bezugswort im Hauptsatz bestimmt das grammatische Geschlecht des Pronomens&#160;sowie den Numerus (Singular oder Plural). Der Fall wird durch die Rolle des Relativpronomens im Nebensatz bestimmt. Wenn das Relativpronomen im Nebensatz die Funktion eines Subjekts hat, steht es im Nominativ.</p>\n\n<p>Nominativ maskulin Singular (<strong><em>der</em></strong><em> Mann</em>):</p>\n\n<p>Hauptsatz + Hauptsatz:&#160;&#160;&#160;&#160;&#160;&#160;&#160;<br>\n<em>Der Koch ist <strong>der Mann</strong>. <strong>Er</strong> (= <strong>der Mann</strong>) kocht im Restaurant für Gäste. </em></p>\n\n<p>Hauptsatz + Relativsatz:<br>\n<em>Der Koch ist der Mann, <strong>der</strong> im Restaurant für Gäste kocht.</em></p>\n\n<p>Nominativ feminin Singular (<strong><em>die</em></strong><em> Kneipe</em>):</p>\n\n<p><em>Ich gehe gern in <strong>die Kneipe</strong>. <strong>Sie </strong>ist neben meinem Haus.<br>\nIch gehe gern in die Kneipe, <strong>die</strong> neben meinem Haus ist.</em></p>\n\n<p>In diesen Beispielen hat das Bezugswort einen bestimmten Artikel (<em>der, die</em>). Aber auch, wenn vor dem Bezugswort der unbestimmte Artikel oder gar kein Artikel steht, hat das Relativpronomen im Nominativ die Form des bestimmten Artikels.&#160;</p>\n\n<p>Nominativ neutral Singular (das Gericht):</p>\n\n<p><em>Pizza ist <strong>ein Gericht</strong>. <strong>Es</strong> ist nicht besonders gesund.<br>\nPizza ist ein Gericht, <strong>das</strong> nicht besonders gesund ist.</em></p>\n\n<p>Nominativ Plural (<strong><em>die</em></strong><em> Menschen</em>):</p>\n\n<p><em>Feinschmecker sind <strong>Menschen</strong>. <strong>Sie</strong> wissen viel über gutes Essen.<br>\nFeinschmecker sind Menschen, <strong>die</strong> viel über gutes Essen wissen.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>der Relativsatz: Ein Relativsatz ist ein Nebensatz, der nähere Informationen zu einem Nomen oder Pronomen im übergeordneten Satz gibt.</p>\n\t\t\tdas Relativpronomen: Ein Relativpronomen verbindet einen Relativsatz mit dem übergeordneten Satz.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Придаточные: Nominativ", "text": "<p><strong>Придаточные определительные </strong></p>\n\n<p>Придаточные определительные&#160; - это особый вид придаточных предложений.&#160; Как правило, они не могут существовать самостоятельно и зависят от главного или другого придаточного в составе сложносочиненного предложения. Придаточные определительные описывают или дают дополнительную характеристику существительному или местоимению в главном предложении. Придаточное определительное обычно стоит непосредственно после определяемого слова. Спрягаемый глагол обычно стоит в конце придаточного определительного. Оно соединяется с главным предложением посредством относительного местоимения. Относительное местоимение указывает на определяемое слово в главном предложении.</p>\n\n<p><strong>Относительные местоимения</strong></p>\n\n<p>Формы относительных местоимений <em>der</em>, <em>die</em> и <em>das</em> совпадают почти всегда с формами определенного артикля. Относительные местоимения <em>der</em>, <em>die</em> и <em>das</em> &#160;вводят придаточные предложения в именительном падеже. Определяемое слово в&#160; главном предложении задает род и число относительного местоимения. Падеж местоимения зависит от его функции в придаточном предложении. Если относительное местоимение является подлежащим, оно стоит в именительном падеже.</p>\n\n<p>Именительный падеж, мужской род, единственное число (<strong><em>der</em></strong><em> Mann</em>):</p>\n\n<p>Главное предложение + главное предложение:<br>\n<em>Der Koch ist <strong>der Mann</strong>. <strong>Er</strong> (= <strong>der Mann</strong>) kocht im Restaurant für Gäste. </em></p>\n\n<p>Главное предложение + придаточное определительное:<br>\n<em>Der Koch ist der Mann, <strong>der</strong> im Restaurant für Gäste kocht.</em></p>\n\n<p>Именительный падеж, женский род, единственное число (<strong><em>die</em></strong><em> Kneipe</em>):</p>\n\n<p><em>Ich gehe gern in <strong>die Kneipe</strong>. <strong>Sie </strong>ist neben meinem Haus.<br>\nIch gehe gern in die Kneipe, <strong>die</strong> neben meinem Haus ist.</em></p>\n\n<p>В этих примерах перед определяемым словом стоит определенный артикль (<em>der</em>, <em>die</em>). В именительном падеже относительное местоимение совпадает по форме с определенным артиклем и тогда, когда определяемое слово используется с неопределенным или нулевым артиклем.</p>\n\n<p>Именительный падеж, средний род, единственное число (<strong><em>das</em></strong><em> Gericht</em>):</p>\n\n<p><em>Pizza ist <strong>ein Gericht</strong>. <strong>Es</strong> ist nicht besonders gesund.<br>\nPizza ist ein Gericht, <strong>das</strong> nicht besonders gesund ist.</em></p>\n\n<p>Именительный падеж, множественное число (<strong><em>die</em></strong><em> Menschen</em>):</p>\n\n<p><em>Feinschmecker sind <strong>Menschen</strong>. <strong>Sie</strong> wissen viel über gutes Essen.<br>\nFeinschmecker sind Menschen, <strong>die</strong> viel über gutes Essen wissen.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>der Relativsatz: Придаточное определительное - это часть сложносочиненного предложения, характеризующая предмет или явление, называемые в главном предложении. &#160;</p>\n\n\t\t\t<p>das Relativpronomen: Относительное местоимение связывает придаточное определительное с главным.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40601552, "shortTitle": "Satzbau: Pronomen", "name": "Satzbau: Pronomen", "text": "<p><strong>Verben mit Dativ- und Akkusativobjekt: Pronomen als Objekte</strong></p>\n\n<p>Das Dativobjekt oder das Akkusativobjekt kann ein Pronomen sein, wenn der Zuhörer bereits weiß, um welche Person oder welchen Gegenstand es sich handelt.</p>\n\n<p>Ein Pronomen kann das Dativobjekt ersetzen:</p>\n\n<p><em>Was schenkst du <strong>deinem Bruder</strong>?<br>\nIch schenke <strong>ihm</strong> ein Buch.</em></p>\n\n<p><em>Was schenkst du <strong>deiner Schwester</strong>?<br>\nIch schenke <strong>ihr</strong> einen Fußball.</em></p>\n\n<p><em>Was schenkst du <strong>deinen Großeltern</strong>?<br>\nIch schenke <strong>ihnen</strong> ein Familienfoto.</em></p>\n\n\n\n<p>Ebenso kann ein Pronomen das Akkusativobjekt ersetzen. Dabei gibt es eine Besonderheit: Wenn das Akkusativobjekt ein Pronomen ist, steht es vor dem Dativobjekt. Dabei spielt es keine Rolle, ob das Dativobjekt ein Nomen oder ein Pronomen ist.</p>\n\n\n\n\n\n<p>Wiederhole noch einmal die Personalpronomen im Akkusativ, wenn nötig.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td>Akkusativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich</td>\n\t\t\t<td>mich</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>du</td>\n\t\t\t<td>dich</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>er</td>\n\t\t\t<td>ihn</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td>sie</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>es</td>\n\t\t\t<td>es</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir</td>\n\t\t\t<td>uns</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ihr</td>\n\t\t\t<td>euch</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td>sie</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Sie</td>\n\t\t\t<td>Sie</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Местоимение как дополнение", "text": "<p><strong>Глаголы с косвенным&#160;и прямым дополнением: местоимения в роли объектов</strong></p>\n\n<p>Объектом в винительном или дательном падеже при глаголе может быть местоимение,&#160; если из контекста понятно, о ком или о чем идет речь.</p>\n\n<p>Местоимение может заменить существительное в дательном падеже в роли косвенного дополнения:</p>\n\n<p><em>Was schenkst du <strong>deinem Bruder</strong>?<br>\nIch schenke <strong>ihm</strong> ein Buch.</em></p>\n\n<p><em>Was schenkst du <strong>deiner Schwester</strong>?<br>\nIch schenke <strong>ihr</strong> einen Fußball.</em></p>\n\n<p><em>Was schenkst du <strong>deinen Großeltern</strong>?<br>\nIch schenke <strong>ihnen</strong> ein Familienfoto.</em></p>\n\n\n\n<p>Местоимение может заменить также существительное в винительном падеже в роли прямого дополнения. При этом есть одна особенность: местоимение в винительном падеже в роли объекта стоит перед косвенным дополнением вне зависимости от того, какой частью речи является косвенное дополнение – местоимением или существительным.</p>\n\n\n\n\n\n<p>Повтори, если нужно, личные местоимения в винительном падеже.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Именительный падеж</td>\n\t\t\t<td>Винительный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich</td>\n\t\t\t<td>mich</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>du</td>\n\t\t\t<td>dich</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>er</td>\n\t\t\t<td>ihn</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td>sie</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>es</td>\n\t\t\t<td>es</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir</td>\n\t\t\t<td>uns</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ihr</td>\n\t\t\t<td>euch</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td>sie</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Sie</td>\n\t\t\t<td>Sie</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}]}, {"key": "negation", "headline": "Negation", "grammars": [{"id": 40415710, "shortTitle": "Artikel: negativ", "name": "Artikel: negativ", "text": "<p>Mit dem Wort <em>kein</em> verneint man Nomen, die den unbestimmten oder keinen Artikel haben.</p>\n\n\n\n<p><strong>Singular</strong></p>\n\n<p>Die Endungen von <em>kein</em> sind im Singular identisch mit den Endungen des unbestimmten Artikels <em>ein</em>.</p>\n\n\n\n\n\n\n\n\n\n<p>Das gilt auch für den Akkusativ:</p>\n\n\n\n<p><strong>Plural</strong></p>\n\n<p>Ein Nomen, das im Plural ohne Artikel steht, wird mit <em>keine</em> verneint.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td>Akkusativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>maskulin</p>\n\t\t\t(<em>der</em>)</td>\n\t\t\t<td>ein<br>\n\t\t\tkein</td>\n\t\t\t<td>einen<br>\n\t\t\tkeinen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>feminin</p>\n\t\t\t(<em>die</em>)</td>\n\t\t\t<td>eine<br>\n\t\t\tkeine</td>\n\t\t\t<td>eine<br>\n\t\t\tkeine</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>neutral<br>\n\t\t\t<br>\n\t\t\t(<em>das</em>)</p>\n\t\t\t</td>\n\t\t\t<td>ein<br>\n\t\t\tkein</td>\n\t\t\t<td>ein<br>\n\t\t\tkein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Plural</p>\n\t\t\t(<em>die</em>)</td>\n\t\t\t<td>-<br>\n\t\t\tkeine</td>\n\t\t\t<td>-<br>\n\t\t\tkeine</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Singular ohne Artikel</strong></p>\n\n<p>Auch Nomen, die im Singular ohne Artikel stehen, verneint man mit der entsprechenden Form von <em>kein</em>.</p>\n\n<p>Isst Nina Schinken? – Nein, Nina isst <strong>keinen</strong> Schinken.</p>\n\n<p>Trinkst du Cola? – Nein, ich trinke <strong>keine</strong> Cola.</p>\n\n<p>Möchtest du Bier? – Nein, ich möchte <strong>kein</strong> Bier.</p>\n", "ru": {"name": "Артикли: отрицание kein", "text": "<p>В немецком языке для отрицания существительных с неопределенным артиклем или без артикля используется слово&#160;<em>kein</em>. При отрицании существительных с неопределенным артиклем <em>kein</em> заменяет артикль. В единственном числе <em>kein</em> совпадает по форме с неопределенным артиклем, поэтому <em>kein</em> называют также отрицательным артиклем.</p>\n\n<p><strong>Единственное число</strong></p>\n\n<p>Окончания <em>kein</em> в единственном числе совпадают с окончаниями неопределенного артикля <em>ein</em>.</p>\n\n\n\n\n\n\n\n<p>Идентичные окончания в винительном падеже:</p>\n\n\n\n<p><strong>Множественное число</strong></p>\n\n<p>Перед отрицаемым существительным во множественном числе без артикля стоит <em>keine</em>.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Именительный падеж</td>\n\t\t\t<td>Винительный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род<br>\n\t\t\t(<em>der</em>)</td>\n\t\t\t<td>ein<br>\n\t\t\tkein</td>\n\t\t\t<td>einen<br>\n\t\t\tkeinen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род<br>\n\t\t\t(<em>die</em>)</td>\n\t\t\t<td>eine<br>\n\t\t\tkeine</td>\n\t\t\t<td>eine<br>\n\t\t\tkeine</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Средний род<br>\n\t\t\t(<em>das</em>)</p>\n\t\t\t</td>\n\t\t\t<td>ein<br>\n\t\t\tkein</td>\n\t\t\t<td>ein<br>\n\t\t\tkein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Множественное число<br>\n\t\t\t(<em>die</em>)</td>\n\t\t\t<td>-<br>\n\t\t\tkeine</td>\n\t\t\t<td>-<br>\n\t\t\tkeine</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Единственное число без артикля </strong></p>\n\n<p>Перед существительным в единственном числе без артикля <em>kein</em> стоит в форме, соответствующей грамматическому роду существительного.</p>\n\n<p>Isst Nina Schinken? – Nein, Nina isst <strong>keinen</strong> Schinken.</p>\n\n<p>Trinkst du Cola? – Nein, ich trinke <strong>keine</strong> Cola.</p>\n\n<p>Möchtest du Bier? – Nein, ich möchte <strong>kein</strong> Bier.</p>\n"}}, {"id": 40404243, "shortTitle": "Verneinung: nicht", "name": "Verneinung: nicht", "text": "<p>Adjektive verneint man mit <em>nicht</em>.</p>\n\n<p><em>Das Zimmer ist <strong>klein</strong>.<br>\nDas Zimmer ist <strong>nicht groß</strong>.</em></p>\n\n<p><em>Das Zimmer ist <strong>dunkel</strong>.<br>\nDas Zimmer ist <strong>nicht hell</strong>.</em></p>\n", "ru": {"name": "Отрицание: nicht", "text": "<p>Для отрицания прилагательных используется <em>nicht</em>.</p>\n\n<p><em>Das Zimmer ist <strong>klein</strong>.<br>\nDas Zimmer ist <strong>nicht groß</strong>.</em></p>\n\n<p><em>Das Zimmer ist <strong>dunkel</strong>.<br>\nDas Zimmer ist <strong>nicht hell</strong>.</em></p>\n"}}, {"id": 40470637, "shortTitle": "Verneinung: nicht/kein", "name": "Verneinung: nicht/kein", "text": "<p><strong>Verneinung mit <em>nicht</em></strong></p>\n\n<p><br>\nMit <em>nicht </em>kann man einen ganzen&#160;Satz oder nur ein Wort bzw. eine Wortgruppe verneinen.</p>\n\n<p>Wird mit <em>nicht </em>ein Wort oder eine Wortgruppe verneint, dann steht <em>nicht </em>direkt davor.</p>\n\n<p><br>\nBeispiele:</p>\n\n<p>Nomen mit bestimmtem Artikel:&#160;<br>\n<em>Sind das <strong>die Birnen</strong> von Klara? – Nein, das sind <strong>nicht die Birnen </strong>von Klara.</em></p>\n\n<p><br>\nAdjektive:</p>\n\n<p><em>Sind die Birnen <strong>frisch</strong>? – Nein, die Birnen sind <strong>nicht frisch</strong>.</em></p>\n\n<p><br>\nAdverbien:</p>\n\n<p><em>Isst Inge gerne <strong>Birnen</strong>? – Nein, Inge isst<strong> nicht gerne</strong> Birnen.</em></p>\n\n\n\n<p>Bei der Verneinung eines ganzen Satzes steht nicht meist relativ weit hinten im Satz.</p>\n\n<p><br>\n<em>Isst Inge die Birnen? – Nein, Inge isst die Birnen <strong>nicht</strong>.<br>\nMöchte Inge die Birnen essen? – Nein, sie möchte die Birnen <strong>nicht </strong>essen.</em></p>\n\n\n\n<p><br>\n<strong>Verneinung mit <em>kein</em></strong></p>\n\n<p><br>\nMit <em>kein</em> verneint man Nomen mit unbestimmtem Artikel&#160;und meistens auch Nomen ohne Artikel.</p>\n\n<p><br>\nNomen mit unbestimmtem Artikel:<br>\n<em>Ist das <strong>ein </strong>Apfel? – Nein, das ist <strong>kein Apfel</strong>. Das ist eine Birne.</em></p>\n\n<p><br>\nNomen ohne Artikel:<br>\n<em>Isst Inge Birnen? – Nein, Inge isst <strong>keine Birnen</strong>.</em></p>\n\n<p><br>\nDas Wort <em>kein </em>verändert seine Form. Im Singular entsprechen die Formen denen des unbestimmten Artikels.</p>\n", "ru": {"name": "Отрицание: nicht/kein", "text": "<p><strong>Отрицание<em> </em>с помощью</strong> <strong><em>nicht</em></strong></p>\n\n<p><em>nicht</em> может отрицать все предложение, слово или группу слов.</p>\n\n<p>При отрицании слова или группы слов&#160;<em>nicht</em> стоит непосредственно перед ними.</p>\n\n<p>Примеры:</p>\n\n<p>Существительные с определенным артиклем:<br>\n<em>Sind das die Birnen von Klara? – Nein, das sind <strong>nicht</strong> <strong>die Birnen</strong> von Klara.</em></p>\n\n<p>Прилагательные:<br>\n<em>Sind die Birnen frisch? – Nein, die Birnen sind <strong>nicht</strong> <strong>frisch</strong>.</em></p>\n\n<p>Наречия:<br>\n<em>Isst Inge gerne Birnen? – Nein, Inge isst <strong>nicht gerne</strong> Birnen.</em></p>\n\n\n\n<p>При отрицании всего предложения <em>nicht</em> стоит обычно в конце предложения.</p>\n\n<p><em>Isst Inge die Birnen? – Nein, Inge isst die Birnen <strong>nicht</strong>.<br>\nMöchte Inge die Birnen essen? – Nein, sie möchte die Birnen <strong>nicht</strong> essen.</em></p>\n\n\n\n<p><strong>Отрицание с помощью</strong>&#160;<strong><em>kein</em></strong></p>\n\n<p>При&#160;помощи <em>kein</em> отрицаются существительные с неопределенным артиклем и существительные без артикля.</p>\n\n<p>Существительные с неопределенным артиклем:<br>\n<em>Ist das <strong>ein</strong> Apfel? – Nein, das ist <strong>kein</strong> <strong>Apfel</strong>. Das ist eine Birne.</em></p>\n\n<p>Существительные без артикля:<br>\n<em>Isst Inge Birnen? – Nein, Inge isst <strong>keine</strong> <strong>Birnen</strong>.</em></p>\n\n<p>Слово <em>kein</em> изменяет свою форму. В единственном числе его формы совпадают с формами неопределенного артикля.</p>\n"}}]}, {"key": "pronoun", "headline": "Pronomen", "grammars": [{"id": 40589157, "shortTitle": "Fragewörter: Kasus", "name": "Fragewörter: Kasus", "text": "<p><strong><em>Mit wem</em></strong><em> feierst du Silvester? Mit deiner Familie?</em></p>\n\n<p><strong><em>Mit wem</em></strong><em> feiert Sebastian Karneval? - Mit seinen Freunden. </em></p>\n\n<p>Mit dem Fragewort <em>wem</em> fragst du nach Personen im Dativ. Das Fragewort kann auch mit einer Präposition, die Dativ verlangt, kombiniert werden: <em>Mit wem?</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Fall</td>\n\t\t\t<td>Frage</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td><em>Wer?</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Akkusativ</td>\n\t\t\t<td><em>Wen?</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Dativ</td>\n\t\t\t<td><em>Wem?</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Beispiele:</p>\n\n<p><strong><em>Wer</em></strong><em> ist das? – Das ist mein Freund. / Das ist meine Freundin.</em>&#160; (Nominativ)</p>\n\n<p><strong><em>Wen</em></strong><em> triffst du später? – Ich treffe meinen Freund. / Ich treffe meine Freundin.</em> (Akkusativ)</p>\n\n<p><strong><em>Wem</em></strong><em> gehört das? – Das gehört meinem Freund. / Das gehört meiner Freundin. </em>(Dativ)</p>\n\n<p><em>Mit <strong>wem</strong> telefonierst du? – Ich telefoniere mit meinem Freund. / Ich telefoniere mit meiner Freundin.</em> (Dativ)</p>\n", "ru": {"name": "Вопросительные слова: падеж", "text": "<p><strong><em>Mit wem</em></strong><em> feierst du Silvester? Mit deiner Familie?</em></p>\n\n<p><strong><em>Mit wem</em></strong><em> feiert Sebastian Karneval? - Mit seinen Freunden. </em></p>\n\n<p>Вопросительное слово <em>wem</em> используется в вопросах с косвенным дополнением в дательном падеже, если дополнение обозначает живое существо. Вопросительное слово может также употребляться с предлогом, управляющим дательным падежом: <em>Mit</em> <em>wem</em><em>?</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Падеж</td>\n\t\t\t<td>Вопрос</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Именительный</td>\n\t\t\t<td><em>Wer?</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Винительный</td>\n\t\t\t<td><em>Wen?</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Дательный</td>\n\t\t\t<td><em>Wem?</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Примеры:</p>\n\n<p><strong><em>Wer</em></strong><em> ist das? – Das ist mein Freund. / Das ist meine Freundin.</em>&#160; (именительный падеж)</p>\n\n<p><strong><em>Wen</em></strong><em> triffst du später? – Ich treffe meinen Freund. / Ich treffe meine Freundin.</em> (винительный падеж)</p>\n\n<p><strong><em>Wem</em></strong><em> gehört das? – Das gehört meinem Freund. / Das gehört meiner Freundin. </em>(дательный падеж)</p>\n\n<p><em>Mit <strong>wem</strong> telefonierst du? – Ich telefoniere mit meinem Freund. / Ich telefoniere mit meiner Freundin.</em> (дательный падеж)</p>\n"}}, {"id": 40468628,
