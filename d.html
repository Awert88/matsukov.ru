"shortTitle": "Fragewörter: welch-", "name": "Fragewörter: welch-", "text": "<p><strong><em>Welcher </em></strong><em>Salat ist am besten? – <strong>Der</strong> Salat „Fantasia“ schmeckt sehr gut.</em></p>\n\n<p><strong><em>Welchen</em></strong><em> Salat möchten Sie? – <strong>Den</strong> Salat „Fantasia“&#160;bitte.</em></p>\n\n<p>Man verwendet das Fragewort <em>welch-</em>, um nach einer bestimmten Person oder Sache zu fragen oder um etwas aus einer bestimmten Menge auszuwählen.</p>\n\n<p>Das Fragewort <em>welch- </em>steht vor einem Nomen und hat die gleichen Endungen wie der bestimmte Artikel.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td>Akkusativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>maskulin <em>(der)</em></td>\n\t\t\t<td><strong>welcher</strong></td>\n\t\t\t<td><strong>welchen</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin <em>(die)</em></td>\n\t\t\t<td>welche</td>\n\t\t\t<td>welche</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral&#160; <em>(das)</em></td>\n\t\t\t<td>welches</td>\n\t\t\t<td>welches</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural <em>(die)</em></td>\n\t\t\t<td>welche</td>\n\t\t\t<td>welche</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Вопросительные слова: welch-", "text": "<p><strong><em>Welcher </em></strong><em>Salat ist am besten? – <strong>Der</strong> Salat „Fantasia“ schmeckt sehr gut.</em></p>\n\n<p><strong><em>Welchen</em></strong><em> Salat möchten Sie? – <strong>Den</strong> Salat „Fantasia“&#160;bitte.</em></p>\n\n<p>Вопросительное слово <strong><em>welch</em></strong><strong><em>- </em></strong>используют, спрашивая об определенном человеке или предмете, или же выбирая что-либо из определенного количества.</p>\n\n<p>Вопросительное слово <strong><em>welch</em></strong><strong><em>- </em></strong>стоит перед существительным и имеет такое же окончание, как и определенный артикль.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Именительный падеж</td>\n\t\t\t<td>Винительный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской&#160;род <em>(der)</em></td>\n\t\t\t<td><strong>welcher</strong></td>\n\t\t\t<td><strong>welchen</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский&#160;род <em>(die)</em></td>\n\t\t\t<td>welche</td>\n\t\t\t<td>welche</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род &#160;<em>(das)</em></td>\n\t\t\t<td>welches</td>\n\t\t\t<td>welches</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число <em>(die)</em></td>\n\t\t\t<td>welche</td>\n\t\t\t<td>welche</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 41560222, "shortTitle": "Fragewörter: wer, was", "name": "Fragewörter: wer, was", "text": "<p>Wenn man nach <strong>Personen</strong> fragt, verwendet man das Fragewort <strong><em>wer</em></strong>.</p>\n\n\n\n<p>Wenn man <strong>nicht</strong> nach <strong>Personen</strong>&#160;fragt, verwendet man das Fragewort <strong><em>was</em></strong>.</p>\n\n\n", "ru": {"name": "Вопросительные слова: wer, was", "text": "<p>Если вопрос касается&#160;<strong>человека</strong>, используется вопросительное слово <strong><em>wer</em></strong>.</p>\n\n\n\n<p>Если вопрос нацелен <strong>не на человека</strong>, используется вопросительное слово <strong><em>was</em></strong>.</p>\n\n\n"}}, {"id": 40578683, "shortTitle": "Indefinitpronomen", "name": "Indefinitpronomen", "text": "<p><strong>Indefinitpronomen: <em>man</em>, <em>jemand</em>, <em>niemand</em>, <em>etwas</em>, <em>nichts</em>, <em>alles,</em> <em>manche</em>, <em>wenige</em>, <em>viele</em>, <em>alle</em></strong></p>\n\n<p>Indefinitpronomen sind eine Untergruppe der Pronomen. Sie werden verwendet, wenn man nicht weiß, wer oder was etwas macht (<em>man</em>, <em>jemand</em>, <em>niemand, etwas, nichts, alles</em>), oder wenn man nicht genau sagen will oder kann, wie viele etwas machen (<em>manche</em>, <em>wenige</em>, <em>viele</em>, <em>alle</em>).</p>\n\n<p>Einige Indefinitpronomen können nur für Personen stehen, z. B. <em>man</em>, <em>jemand</em> und <em>niemand</em>. Sie kommen nur im Singular vor:</p>\n\n<p><em>Volleyball spielt <strong>man</strong> in einer Mannschaft.</em></p>\n\n<p><em>Mag <strong>jemand</strong> Volleyball?</em></p>\n\n<p><em>Nein, <strong>niemand</strong> mag Volleyball.</em></p>\n\n<p>Andere Indefinitpronomen, z. B. <em>etwas</em>, <em>nichts </em>und<em> alles</em>, werden auch nur im Singular verwendet und stehen für Lebewesen, Dinge oder Sachverhalte:</p>\n\n<p><em>Möchtest du <strong>etwas</strong> essen, Nico?</em></p>\n\n<p><em>Nein danke, ich möchte <strong>nichts</strong>. </em></p>\n\n<p>Die Indefinitpronomen <em>manche</em>, <em>wenige</em>, <em>viele</em> und <em>alle</em> können entweder für Personen oder für Lebewesen, Dinge und Sachverhalte stehen:</p>\n\n<p><em>Yara: Ich liebe Volleyball!</em></p>\n\n<p><em>Max: Okay, nicht <strong>alle</strong> hassen Volleyball, aber nur <strong>wenige</strong> lieben Volleyball. </em></p>\n\n<p><em>Nico: Hast du schon mal einen großen Fisch gefangen? ­</em></p>\n\n<p><em>Tarek: Im See gibt es fast keine großen Fische. <strong>Viele</strong> sind klein, aber <strong>manche</strong> sind trotzdem sehr lecker.</em></p>\n", "ru": {"name": "Неопределенные местоимения", "text": "<p><strong>Неопределенные</strong> <strong>местоимения</strong>: <strong><em>man</em></strong><strong>, </strong><strong><em>jemand</em></strong><strong>, </strong><strong><em>niemand</em></strong><strong>, </strong><strong><em>etwas</em></strong><strong>, </strong><strong><em>nichts</em></strong><strong>, </strong><strong><em>alles</em></strong><strong><em>,</em></strong> <strong><em>manche</em></strong><strong>, </strong><strong><em>wenige</em></strong><strong>, </strong><strong><em>viele</em></strong><strong>, </strong><strong><em>alle</em></strong></p>\n\n<p>Неопределенные местоимения – это вид местоимений, которые используют, когда неизвестен или неточно известен&#160;объект, о котором идет речь (<em>man</em>, <em>jemand</em>, <em>niemand</em><em>,</em> <em>etwas</em><em>,</em> <em>nichts</em><em>,</em> <em>alles</em>), или его свойства, например, количество (<em>manche</em>, <em>wenige</em>, <em>viele</em>, <em>alle</em>).</p>\n\n<p>Некоторые неопределенные местоимения отсылают только к людям, например, <em>man</em>, <em>jemand</em> или <em>niemand</em>. Такие местоимения употребляются всегда в единственном числе:</p>\n\n<p><em>Volleyball spielt <strong>man</strong> in einer Mannschaft.<br>\nMag <strong>jemand</strong> Volleyball?<br>\nNein, <strong>niemand</strong> mag Volleyball.</em></p>\n\n<p>Другие неопределенные местоимения, например, <em>etwas</em>, <em>nichts</em> и <em>alles</em><em>,</em> также используются только в единственном числе, но указывают на живые существа, предметы и явления:</p>\n\n<p><em>Möchtest du <strong>etwas</strong> essen, Nico?<br>\nNein danke, ich möchte <strong>nichts</strong>. </em></p>\n\n<p>Неопределенные местоимения <em>manche</em>, <em>wenige</em>, <em>viele</em> и <em>alle</em> указывают как на людей, так и на прочие живые существа, а также предметы и явления:</p>\n\n<p><em>Yara: Ich liebe Volleyball!<br>\nMax: Okay, nicht <strong>alle</strong> hassen Volleyball, aber nur <strong>wenige</strong> lieben Volleyball. </em></p>\n\n<p><em>Nico: Hast du schon mal einen großen Fisch gefangen? ­<br>\nTarek: Im See gibt es fast keine großen Fische. <strong>Viele</strong> sind klein, aber <strong>manche</strong> sind trotzdem sehr lecker.</em></p>\n"}}, {"id": 40411698, "shortTitle": "Indefinitpronomen: man", "name": "Indefinitpronomen: man", "text": "<p>Das Indefinitpronomen <em>man</em> wird häufig für allgemeine Aussagen verwendet. Man drückt damit aus, dass eine Aussage nicht für eine bestimmte Person gilt, sondern für eine unbestimmte, für eine ganze Gruppe oder sogar für alle. &#160;Auch wenn <em>man</em> Gruppe repräsentiert, steht es im Singular. Die Form des Verbs ist die gleiche wie bei <em>er/sie/es</em>.</p>\n\n<p><em>Nico <strong>isst</strong> gern Gazpacho.</em></p>\n\n<p><em>Er <strong>isst</strong> gern Gazpacho.</em></p>\n\n<p><em>Man <strong>isst</strong> in Spanien gern Gazpacho.</em></p>\n\n\n\n<p><strong><em>man</em> und <em>Mann</em> </strong></p>\n\n<p>Achte auf den Unterschied zwischen dem unpersönlichen Pronomen <em>man</em> und dem Nomen <em>Mann</em>. Das Wort <em>man</em> mit einem <em>n</em> steht für Leute oder Menschen allgemein. <em>Mann</em> mit <em>nn</em> bezeichnet eine männliche Person.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\t\t\tdas Indefinitpronomen: Indefinitpronomen verweisen auf Lebewesen, Gegenstände oder Sachverhalte, die unbestimmt sind. Sie werden verwendet, wenn man nicht weiß oder nicht sagen will, wer genau oder wie viele etwas machen.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": null}, {"id": 40331579, "shortTitle": "Personalpronomen: er, sie", "name": "Personalpronomen: er, sie", "text": "\n\n<p><strong><em>Er</em></strong><em> heißt Nico.</em></p>\n\n\n\n\n\n<p><strong><em>Sie</em></strong><em> heißt Lisa.</em></p>\n\n\n\n<p>3. Person Singular:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>maskulin</td>\n\t\t\t<td><strong>er </strong>heißt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin</td>\n\t\t\t<td><strong>sie </strong>heißt</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Личные местоимения: er, sie", "text": "\n\n<p><strong><em>Er</em></strong><em> heißt Nico.</em></p>\n\n\n\n\n\n<p><strong><em>Sie</em></strong><em> heißt Lisa.</em></p>\n\n\n\n<p>3-е лицо единственного числа:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td><strong>er </strong>heißt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род</td>\n\t\t\t<td><strong>sie </strong>heißt</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40483457, "shortTitle": "Pronomen: es", "name": "Pronomen: es", "text": "<p><strong><em>es</em> als Personalpronomen</strong></p>\n\n<p>Das Pronomen <em>es</em> steht normalerweise für ein neutrales Nomen:</p>\n\n<p><em>Wo ist das Buch? – <strong>Es</strong> ist in der Tasche. (<strong>es</strong> = das Buch)</em></p>\n\n\n\n<p><strong><em>es</em> als formales Subjekt bei unpersönlichen Verben</strong></p>\n\n<p>Es gibt aber noch andere Funktionen von <em>es</em>. Manchmal steht <em>es</em> nicht für ein bestimmtes Nomen, sondern übernimmt formal die Funktion des Subjekts, ohne eine eigentliche Bedeutung zu haben. Diese Konstruktion kommt häufig in unpersönlichen Wendungen vor, in denen es kein anderes Subjekt gibt.</p>\n\n<p>Beispiele dafür sind Sätze, die Wetterphänomene beschreiben:</p>\n\n<p><strong><em>Es</em></strong><em> regnet.</em></p>\n\n<p><strong><em>Es</em></strong><em> schneit.</em></p>\n\n<p><strong><em>Es</em></strong><em> ist sonnig.</em></p>\n\n<p><strong><em>Es</em></strong><em> ist bewölkt.</em></p>\n\n<p><strong><em>Es</em></strong><em> ist neblig.</em></p>\n\n<p>Hier steht <em>es</em> für eine Situation oder einen Zustand, dem kein konkretes Subjekt zugeordnet werden kann.</p>\n", "ru": null}, {"id": 40582337, "shortTitle": "Reflexivpronomen", "name": "Reflexivpronomen", "text": "<p><strong>Zusammenfassung: Personalpronomen und Reflexivpronomen </strong></p>\n\n<p>Die Personalpronomen und die Reflexivpronomen kennst du schon. In der ersten und der zweiten Person Singular und Plural &#160;sind die Personalpronomen und die Reflexivpronomen identisch. Nur in der dritten Person Singular und Plural &#160;gibt es Unterschiede.<br>\nSieh dir noch einmal die Unterschiede an.<br>\n<br>\nAkkusativ:<br>\n<br>\n<strong>Max und Tarek</strong> haben das Jubiläum vergessen. <strong>Nico</strong> erinnert sie daran:<br>\n<strong><em>Nico</em></strong><em> erinnert <strong>sie</strong> an das Jubiläum. </em>(Subjekt ist nicht identisch mit Akkusativobjekt.)<br>\n<br>\n<strong>Max und Tarek</strong> haben das Jubiläum nicht vergessen.&#160;<strong>Max und Tarek</strong> erinnern sich daran:<br>\n<strong><em>Max und Tarek</em></strong><em> erinnern <strong>sich</strong> an das Jubiläum. </em>(Subjekt ist identisch mit Akkusativobjekt.)</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Personal-</p>\n\n\t\t\t<p>pronomen<span style=\"background-color:transparent\"></span></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>Reflexiv-</p>\n\n\t\t\t<p>pronomen<span style=\"background-color:transparent\"></span></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>mich<br>\n\t\t\tdich<br>\n\t\t\t<strong><em>ihn</em></strong><br>\n\t\t\t<strong><em>sie</em></strong><br>\n\t\t\t<strong><em>es</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>mich<br>\n\t\t\tdich<br>\n\t\t\t<strong><em>sich</em></strong><br>\n\t\t\t<strong><em>sich</em></strong><br>\n\t\t\t<strong><em>sich</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>uns<br>\n\t\t\teuch<br>\n\t\t\t<strong><em>sie</em></strong><br>\n\t\t\t<strong><em>Sie</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>uns<br>\n\t\t\teuch<br>\n\t\t\t<strong><em>sich</em></strong><br>\n\t\t\t<strong><em>sich</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Dativ:<br>\n<br>\n<strong>Nico</strong> sucht einen Job. <strong>Tarek</strong> wünscht ihm, dass er bald einen Job findet:<br>\n<strong><em>Tarek </em></strong><em>wünscht <strong>ihm</strong> viel Erfolg. </em>(Subjekt ist nicht identisch mit Dativobjekt.)</p>\n\n<p><br>\n<strong>Nico</strong> hat bald Geburtstag. <strong>Nico</strong> würde gerne eine Party feiern:<br>\n<strong><em>Nico</em></strong><em> wünscht <strong>sich</strong> eine Party mit vielen Gästen – besonders mit Selma! </em>(Subjekt ist identisch mit Dativobjekt.)<br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Personal-</p>\n\n\t\t\t<p>pronomen<span style=\"background-color:transparent\"></span></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>Reflexiv-</p>\n\n\t\t\t<p>pronomen<span style=\"background-color:transparent\"></span></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>mir<br>\n\t\t\tdir<br>\n\t\t\t<strong><em>ihm</em></strong><br>\n\t\t\t<strong><em>ihr</em></strong><br>\n\t\t\t<strong><em>ihm</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>mir<br>\n\t\t\tdir<br>\n\t\t\t<strong><em>sich</em></strong><br>\n\t\t\t<strong><em>sich</em></strong><br>\n\t\t\t<strong><em>sich</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>uns<br>\n\t\t\teuch<br>\n\t\t\t<strong><em>ihnen</em></strong><br>\n\t\t\t<strong><em>Ihnen</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>uns<br>\n\t\t\teuch<br>\n\t\t\t<strong><em>sich</em></strong><br>\n\t\t\t<strong><em>sich</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\n<br>\n<br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe &#160;auf Deutsch:</p>\n\n\t\t\t<p><br>\n\t\t\tDas Personalpronomen: Personalpronomen verweisen auf Lebewesen, Gegenstände oder Sachverhalte. Die Wörter <em>ich,</em> <em>du</em> und <em>Sie</em> sind Beispiele für Personalpronomen.</p>\n\n\t\t\t<p><br>\n\t\t\t<span style=\"background-color:transparent\">Das Reflexivpronomen: </span>Reflexive Verben werden mit einem Reflexivpronomen gebraucht. Dieses Reflexivpronomen bezieht sich auf das Subjekt zurück. In der Grundform lautet das Reflexivpronomen <em>sich</em>.<span style=\"background-color:transparent\"></span></p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Возвратные местоимения", "text": "<p><strong>Обзор: Личные и возвратные местоимения </strong></p>\n\n<p>Личные и возвратные местоимения ты уже знаешь. В первом и втором лице единственного и множественного числа личные и возвратные местоимения совпадают по форме. Отличия есть только в третьем лице единственного и множественного числа.<br>\n<br>\n<br>\nВинительный падеж:<br>\n<strong>Макс и Тарек </strong>забыли о юбилее.<strong> Нико </strong>напоминает им о нем:<br>\n<strong><em>Nico</em></strong><em> erinnert <strong>sie</strong> an das Jubiläum. </em>(Подлежащее и дополнение в винительном падеже не являются одним и тем же лицом.)<br>\n<br>\n<strong>Макс и Тарек </strong>забыли о юбилее.<strong> Макс и Тарек </strong>вспоминают о нем.<br>\n<strong><em>Max und Tarek</em></strong><em> erinnern <strong>sich</strong> an das Jubiläum. </em>(Подлежащее и дополнение в винительном падеже являются одним и тем же лицом.)</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Личные местоимения<span style=\"background-color:transparent\"></span></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>Вовзратные местоимения<span style=\"background-color:transparent\"></span></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>mich<br>\n\t\t\tdich<br>\n\t\t\t<strong><em>ihn</em></strong><br>\n\t\t\t<strong><em>sie</em></strong><br>\n\t\t\t<strong><em>es</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>mich<br>\n\t\t\tdich<br>\n\t\t\t<strong><em>sich</em></strong><br>\n\t\t\t<strong><em>sich</em></strong><br>\n\t\t\t<strong><em>sich</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>uns<br>\n\t\t\teuch<br>\n\t\t\t<strong><em>sie</em></strong><br>\n\t\t\t<strong><em>Sie</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>uns<br>\n\t\t\teuch<br>\n\t\t\t<strong><em>sich</em></strong><br>\n\t\t\t<strong><em>sich</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\n<br>\nДательный падеж:<br>\n<strong>Нико </strong>ищет работу. <strong>Тарек</strong> желает ему удачи в поисках работы:<br>\n<strong><em>Tarek </em></strong><em>wünscht <strong>ihm</strong> viel Erfolg. </em>(Подлежащее и дополнение в дательном падеже не являются одним и тем же лицом.)</p>\n\n<p><br>\n<strong>У Нико </strong>скоро день рождения.<strong> Нико</strong> хочет устроить вечеринку:<br>\n<strong><em>Nico</em></strong><em> wünscht <strong>sich</strong> eine Party mit vielen Gästen – besonders mit Selma! </em>(Подлежащее и дополнение в дательном падеже являются одним и тем же лицом.)</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Личные<br>\n\t\t\tместоимения</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>Возвратные<br>\n\t\t\tместоимения</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>mir<br>\n\t\t\tdir<br>\n\t\t\t<strong><em>ihm</em></strong><br>\n\t\t\t<strong><em>ihr</em></strong><br>\n\t\t\t<strong><em>ihm</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>mir<br>\n\t\t\tdir<br>\n\t\t\t<strong><em>sich</em></strong><br>\n\t\t\t<strong><em>sich</em></strong><br>\n\t\t\t<strong><em>sich</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>uns<br>\n\t\t\teuch<br>\n\t\t\t<strong><em>ihnen</em></strong><br>\n\t\t\t<strong><em>Ihnen</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p>uns<br>\n\t\t\teuch<br>\n\t\t\t<strong><em>sich</em></strong><br>\n\t\t\t<strong><em>sich</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\n<br>\n<br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p><br>\n\t\t\tDas Personalpronomen: Личные местоимения указывают на живые существа, предметы или явления. Примеры личных местоимений -&#160; <em>ich,</em> <em>du</em> или <em>Sie</em>.</p>\n\n\t\t\t<p><span style=\"background-color:transparent\">Das Reflexivpronomen: </span>Возвратные местоимения используются с возвратными глаголами. Возвратное местоимение одновременно указывает на субъект и объект действия. Начальная форма возвратного местоимения - <em>sich</em>.<span style=\"background-color:transparent\"></span></p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40573164, "shortTitle": "Reflexivpronomen", "name": "Reflexivpronomen (1)", "text": "<p>Bei reflexiven Verben steht ein Pronomen, das sich auf das Subjekt zurückbezieht. Dieses Pronomen heißt Reflexivpronomen. Bei echten Reflexivverben ist das Reflexivpronomen ein fester Bestandteil des Verbs, bei unechten Reflexivverben&#160;ist es ein Objekt.</p>\n\n<p>Die Formen des Reflexivpronomens entsprechen zum größten Teil denen des Personalpronomens. Nur in der 3. Person hat das Reflexivpronomen eine andere Form und lautet im Singular und im Plural: <em>sich</em>.</p>\n\n<p>Das Reflexivpronomen steht meistens im Akkusativ und hat dann folgende Formen:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>Reflexivpronomen&#160;<span style=\"background-color:transparent\"><br>\n\t\t\t(Akkusativ)</span></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em><strong>Ich</strong></em></td>\n\t\t\t<td>dusche</td>\n\t\t\t<td><em><strong>mich.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em><strong>Du</strong></em></td>\n\t\t\t<td>duschst</td>\n\t\t\t<td><em><strong>dich.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em><strong>Er/Sie/Es</strong></em></td>\n\t\t\t<td>duscht</td>\n\t\t\t<td><em><strong>sich.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em><strong>Wir</strong></em></td>\n\t\t\t<td>duschen</td>\n\t\t\t<td><em><strong>uns.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em><strong>Ihr</strong></em></td>\n\t\t\t<td>duscht</td>\n\t\t\t<td><em><strong>euch.</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em><strong>Sie</strong></em></td>\n\t\t\t<td>duschen</td>\n\t\t\t<td><em><strong>sich.</strong></em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n\n", "ru": null}, {"id": 40575276, "shortTitle": "Reflexivpronomen", "name": "Reflexivpronomen (2)", "text": "<p><strong>Reflexivpronomen im Dativ</strong></p>\n\n<p>Du hast schon gelernt, dass Reflexivpronomen meistens im Akkusativ stehen. Sie können aber auch im Dativ stehen, und zwar dann, wenn es in dem Satz ein anderes Akkusativobjekt gibt.</p>\n\n<p><em>Ich ziehe <strong>mich</strong> an.<br>\nIch ziehe mir <strong>den Mantel</strong> an.</em></p>\n\n\n\n<p>Manche reflexive Verben erfordern ein Akkusativobjekt und manche Ausdrücke mit reflexiven Verben haben immer eine Ergänzung im Akkusativ. In diesen Fällen steht das Reflexivpronomen automatisch im Dativ.</p>\n\n<p><em>Ich kann mir <strong>kein Auto</strong> leisten. (sich etwas leisten)<br>\nIch mache mir <strong>Sorgen</strong>. (sich Sorgen machen)</em></p>\n\n\n\n<p>Das Akkusativobjekt kann auch ein Nebensatz sein, der mit der Konjunktion <em>dass</em> beginnt.</p>\n\n<p><em>Ich habe mir überlegt, <strong>dass ich in Deutschland bleibe.</strong><br>\nIch kann mir nicht vorstellen, <strong>dass du es ohne Hilfe schaffen kannst.</strong></em></p>\n\n\n\n<p>Hier siehst du noch einmal die Personalpronomen und die entsprechenden Reflexivpronomen im Überblick:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Personalpronomen</td>\n\t\t\t<td>Reflexivpronomen</td>\n\t\t\t<td>Reflexivpronomen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Akkusativ</td>\n\t\t\t<td>Dativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich</td>\n\t\t\t<td>mich</td>\n\t\t\t<td>mir</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>du</td>\n\t\t\t<td>dich</td>\n\t\t\t<td>dir</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>er/sie/es</td>\n\t\t\t<td>sich</td>\n\t\t\t<td>sich</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir</td>\n\t\t\t<td>uns</td>\n\t\t\t<td>uns</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ihr</td>\n\t\t\t<td>euch</td>\n\t\t\t<td>euch</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie/Sie</td>\n\t\t\t<td>sich</td>\n\t\t\t<td>sich</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Возвратные местоимения", "text": "<p><strong>Возвратные местоимения в дательном падеже </strong><br>\nКак ты помнишь из предыдущих уроков, возвратные местоимения обычно употребляются в винительном падеже. Но они могут также стоять в дательном падеже, если в предложении уже есть прямое дополнение.<br>\n<br>\n<em>Ich ziehe <strong>mich</strong> an.<br>\nIch ziehe mir <strong>den Mantel</strong> an.</em><br>\n<br>\nНекоторые возвратные глаголы и некоторые устойчивые выражения с возвратными глаголами всегда имеют при себе объект в винительном падеже. В таких случаях возвратное местоимение автоматически приобретает форму дательного падежа.<br>\n<br>\n<em>Ich kann mir <strong>kein Auto</strong> leisten. (sich etwas leisten)<br>\nIch mache mir <strong>Sorgen</strong>. (sich Sorgen machen)</em><br>\n<br>\nВ роли прямого дополнения может также выступать придаточное предложение, вводимое союзом <em>dass</em>.<br>\n<br>\n<em>Ich habe mir überlegt, <strong>dass ich in Deutschland bleibe.</strong><br>\nIch kann mir nicht vorstellen, <strong>dass du es ohne Hilfe schaffen kannst.</strong></em><br>\n<br>\nЛичные и соответствующие им возвратные местоимения приведены в этой таблице:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Личные местоимения</td>\n\t\t\t<td>Возвратные местоимения</td>\n\t\t\t<td>Возвратные местоимения</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Винительный падеж</td>\n\t\t\t<td>Дательный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich</td>\n\t\t\t<td>mich</td>\n\t\t\t<td>mir</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>du</td>\n\t\t\t<td>dich</td>\n\t\t\t<td>dir</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>er/sie/es</td>\n\t\t\t<td>sich</td>\n\t\t\t<td>sich</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir</td>\n\t\t\t<td>uns</td>\n\t\t\t<td>uns</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ihr</td>\n\t\t\t<td>euch</td>\n\t\t\t<td>euch</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie/Sie</td>\n\t\t\t<td>sich</td>\n\t\t\t<td>sich</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 39135001, "shortTitle": "Relativpronomen: was", "name": "Relativpronomen: was", "text": "<p><strong>Relativsätze, die mit <em>was</em> eingeleitet werden</strong></p>\n\n<p>Manchmal kann man Relativsätze mit dem Pronomen <em>was</em> einleiten. Das ist möglich,&#160;...</p>\n\n<p>... wenn das Bezugswort kein Nomen, sondern ein unbestimmtes neutrales Pronomen oder ein unbestimmtes Zahlwort ist, z. B. <strong>das</strong>, <strong>alles</strong>, <strong>nichts</strong>, <strong>etwas</strong>, <strong>einiges</strong>, <strong>manches</strong>, <strong>vieles</strong> oder <strong>weniges</strong>.</p>\n\n<p>Beispiele:</p>\n\n<p><em>Ein eigenes Geschäft ist </em><strong>das</strong><em>, </em><strong>was</strong> <em>ich mir schon lange wünsche.</em></p>\n\n<p><em>Es gibt </em><strong>vieles</strong><em>, </em><strong>was</strong> <em>man wissen muss, wenn man ein eigenes Geschäft eröffnen möchte.</em></p>\n\n<p><br>\n... wenn das Bezugswort ein nominalisiertes Adjektiv mit einem neutralen Artikel ist. Oft ist das ein Superlativ.</p>\n\n<p>Beispiel:</p>\n\n<p><em>Ein eigenes Geschäft ist </em><strong>das Schönste</strong><em>, </em><strong>was</strong> <em>ich mir vorstellen kann.</em></p>\n\n<p><em>Die Sprache zu lernen ist </em><strong>das Wichtigste</strong><em>, was man tun muss, wenn man in ein neues Land zieht.</em></p>\n\n<p><br>\n... wenn der Relativsatz sich nicht auf ein einzelnes Wort bezieht, sondern auf den ganzen übergeordneten Satz.</p>\n\n<p>Beispiele:</p>\n\n<p><strong>Nabil spricht schon sehr gut Deutsch</strong><em>, </em><strong>was</strong> <em>ein großer Vorteil ist.</em><br>\n<strong><em>(= </em></strong><em>Es ist ein großer Vorteil<strong>, </strong></em><strong>dass Nabil schon sehr gut Deutsch spricht</strong><em><strong>.)</strong></em></p>\n\n<p><strong>Es gibt schon viele Lebensmittelgeschäfte<em>, </em>was </strong><em>Ibrahim problematisch findet<strong>.</strong></em><strong><em>(= </em></strong><em>Ibrahim findet es problematisch<strong>, </strong></em><strong>dass es schon viele Lebensmittelgeschäfte gibt</strong><em><strong>.)</strong></em></p>\n", "ru": null}]}, {"key": "prepositions", "headline": "Präpositionen", "grammars": [{"id": 39127564, "shortTitle": "Präpositionen: wegen", "name": "Kausale Präpositionen: wegen", "text": "<p><strong>Kausale Beziehungen: die Präposition <em>wegen</em></strong></p>\n\n<p>Mit der Präposition <em>wegen</em> kannst du einen Grund angeben.</p>\n\n<p><strong><em>Warum</em></strong><em> hat die Polizei die Straße gesperrt?</em></p>\n\n<p><strong><em>Wegen eines Unfalls</em></strong><em> hat die Polizei die Straße gesperrt.</em><br>\n<br>\nNach der Präposition <em>wegen</em> steht in der Regel der Genitiv. Hier siehst du noch einmal, wie die meisten Nomen im Genitiv dekliniert werden.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p><strong>Genitiv:</strong><br>\n\t\t\t<em>Wegen ...</em></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>maskulin</td>\n\t\t\t<td><strong><em>des/eines</em></strong><br>\n\t\t\tUnfall<strong><em>s</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin</td>\n\t\t\t<td><strong><em>der/einer</em></strong><br>\n\t\t\tBaustelle</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral</td>\n\t\t\t<td><strong><em>des/eines </em></strong><br>\n\t\t\tUnwetter<strong><em>s</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>der<br>\n\t\t\tRegenfälle</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\n*Erinnerst du dich? Der Genitiv braucht einen Artikel oder ein Adjektiv als Begleiter. Deshalb kann man im Plural ohne Artikel oder Adjektiv den Genitiv nicht verwenden. Du musst dann den Dativ benutzen:</p>\n\n<p><em>wegen</em> + Genitiv:</p>\n\n<p><em>Wegen <strong>der</strong> Regenfälle fährt niemand mit dem Fahrrad.</em></p>\n\n<p><em>wegen</em> + Dativ:</p>\n\n<p><em>Wegen Regenfälle<strong>n</strong> fährt niemand mit dem Fahrrad.</em></p>\n\n<p>Besonders in der gesprochenen Sprache hörst du nach <em>wegen</em> auch im Singular manchmal den Dativ. Aber Achtung, viele Menschen sind der Meinung, dass diese Form falsch ist:</p>\n\n<p><em>Wegen eine<strong>m</strong> Unfall bin ich zu spät gekommen.</em></p>\n", "ru": null}, {"id": 40462787, "shortTitle": "Lokale Präpositionen", "name": "Lokale Präpositionen (1)", "text": "<p>Wenn du lokale Präpositionen verwendest, musst du auf zwei Dinge achten:</p>\n\n<ul>\n\t<li>Beantwortet dein Satz die Frage <em>Wo …?</em> (Ortsangabe) oder die Frage <em>Wohin …?</em> (Richtungsangabe)?</li>\n\t<li>Steht nach der Präposition der Akkusativ oder der Dativ?</li>\n</ul>\n\n<p>Hier siehst du noch einmal die Artikel im Akkusativ und im Dativ:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Akkusativ</td>\n\t\t\t<td>Dativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>maskulin:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(der)</td>\n\t\t\t<td>den/einen</td>\n\t\t\t<td>dem/einem</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(die)</td>\n\t\t\t<td>die/eine</td>\n\t\t\t<td>der/einer</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(das)</td>\n\t\t\t<td>das/ein</td>\n\t\t\t<td>dem/einem</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(die)</td>\n\t\t\t<td>die/ -</td>\n\t\t\t<td>den/ -</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Wechselpräpositionen</strong></p>\n\n<p>Die Wechselpräpositionen heißen Wechselpräpositionen, weil der&#160;Kasus des folgenden Nomens unterschiedlich sein&#160;kann: Manchmal stehen sie mit Dativ und manchmal mit Akkusativ.</p>\n\n<p>a) Ortsangabe: <em>Wo …?</em></p>\n\n<p>Wechselpräpositionen <em>in</em> /<em> an</em> /<em> unter</em> /<em> über</em> /<em> auf </em>/<em> vor </em>/<em> hinter</em> /<em> neben </em>/<em> zwischen </em>+ <strong>Dativ</strong></p>\n\n<p>(das Zentrum:)<em> Der Bahnhof ist <strong>im Zentrum</strong>.</em> (im = in + dem)</p>\n\n<p>(die Universität:)<em> Die Oper ist <strong>neben der Universität</strong>.</em></p>\n\n<p>b) Richtungsangabe: <em>Wohin …?</em></p>\n\n<p>Wechselpräpositionen<strong> </strong> <em>in</em> /<em> an</em> /<em> unter</em> /<em> über</em> /<em> auf </em>/<em> vor </em>/<em> hinter</em> /<em> neben </em>/<em> zwischen </em>+ <strong>Akkusativ</strong></p>\n\n<p>(die Goethestraße:)<em> Ihr geht <strong>in die Goethestraße</strong>.</em></p>\n\n<p>(der Marktplatz:)<em> Ihr geht <strong>über den Marktplatz</strong>.</em></p>\n\n\n\n<p><strong>Präpositionen mit festem Kasus </strong></p>\n\n<p>Alle anderen Präpositionen oder präpositionalen Ausdrücke haben einen festen Kasus, das heißt, ihnen folgt immer nur ein Fall, meistens der Dativ oder der Akkusativ. Mit diesen Präpositionen kann z. B. auch der Dativ auf die Frage <em>Wohin …? </em>antworten. Hier findest du einige Beispiele:</p>\n\n<p>a) <em>zu</em> + Dativ</p>\n\n<p>(der Bahnhof:) <em>Ihr geht <strong>zum Bahnhof</strong>.</em> (zum = zu dem)<br>\n(die Touristeninformation:) <em>Ihr geht <strong>zur Touristeninformation</strong>.</em> (zur = zu der)<br>\n(das Schloss:) <em>Ihr geht <strong>zum Schloss</strong>.</em> (zum = zu dem)<br>\n(die Parkplätze:) <em>Ihr geht <strong>zu den Parkplätzen</strong>.</em></p>\n\n<p>Wenn man den Endpunkt einer Strecke besonders betonen möchte, verwendet man <em>bis zu</em>:<br>\n<em>Ihr geht geradeaus <strong>bis zum Bahnhof</strong>. Dann geht ihr links <strong>in die Hauptstraße</strong>.</em></p>\n\n<p>b) <em>an</em> + Dativ + <em>vorbei</em></p>\n\n<p>(der Supermarkt:) <em>Ihr geht <strong>am Supermarkt vorbei</strong>.</em> (am = an + dem)<br>\n(die Sprachschule:) <em>Ihr geht <strong>an der Sprachschule vorbei</strong>.</em>'<br>\n(das Theater:) <em>Ihr geht <strong>am Theater vorbei</strong>. </em>(am = an + dem)<br>\n(die Hochhäuser:) <em>Ihr geht <strong>an den Hochhäusern vorbei</strong>.</em></p>\n\n<p>c) <em>durch</em> + Akkusativ</p>\n\n<p>(der Park:) <em>Ihr geht</em><strong> durch den Park</strong>.<br>\n(die Fußgängerzone:) <em>Ihr geht</em> <strong>durch die Fußgängerzone</strong>.<br>\n(das Tor:) <em>Ihr geht <strong>durch das Tor</strong>.</em><br>\n(die Straßen): <em>Ihr geht <strong>durch die Straßen</strong>.</em></p>\n", "ru": {"name": "Предлоги места", "text": "<p>При использовании предлогов места, следует обращать внимание на два аспекта:</p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span>Отвечает твое предложение на вопрос <em>Wo</em><em> …? </em>(местонахождение) или на вопрос <em>Wohin</em><em> …?</em> &#160;(направление)?</li>\n\t<li><span dir=\"LTR\"></span>Стоит после предлога винительный или дательный падеж?</li>\n</ul>\n\n<p>В таблице приведены артикли в винительном и дательном падежах:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Винительный падеж</td>\n\t\t\t<td>Дательный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(der)</td>\n\t\t\t<td>den/einen</td>\n\t\t\t<td>dem/einem</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(die)</td>\n\t\t\t<td>die/eine</td>\n\t\t\t<td>der/einer</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(das)</td>\n\t\t\t<td>das/ein</td>\n\t\t\t<td>dem/einem</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(die)</td>\n\t\t\t<td>die/ -</td>\n\t\t\t<td>den/ -</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Предлоги </strong><strong>c</strong><strong> двойным управлением</strong></p>\n\n<p>Предлоги с&#160;двойным управлением в различных контекстах требуют постановку существительного в разные падежи: иногда в дательный, а иногда в винительный.</p>\n\n<p>a) Местонахождение: <em>Wo …?</em></p>\n\n<p>Предлоги c двойным управлением <em>in</em> /<em> an</em> /<em> unter</em> /<em> über</em> /<em> auf </em>/<em> vor </em>/<em> hinter</em> /<em> neben</em> / <em>zwischen </em>+ <strong>дательный</strong> <strong>падеж</strong></p>\n\n<p>(das Zentrum:)<em> Der Bahnhof ist <strong>im Zentrum</strong>.</em> (im = in + dem)<br>\n(die Universität:)<em> Die Oper ist <strong>neben der Universität</strong>.</em></p>\n\n<p>b) Направление: <em>Wohin …?</em></p>\n\n<p>Предлоги c двойным управлением <em>in</em> /<em> an</em> /<em> unter</em> /<em> über</em> /<em> auf </em>/<em> vor </em>/<em> hinter</em> /<em> neben</em> / <em>zwischen </em>+ <strong>винительный</strong> <strong>падеж</strong></p>\n\n<p>(die Goethestraße:)<em> Ihr geht <strong>in die Goethestraße</strong>.</em><br>\n(der Marktplatz:)<em> Ihr geht <strong>über den Marktplatz</strong>.</em></p>\n\n\n\n<p><strong>Предлоги с одним падежным управлением </strong></p>\n\n<p>Все прочие предлоги или предложные выражения управляют одним падежом, то есть после них существительное стоит всегда в одном и том же падеже, преимущественно дательном или винительном. Такие предлоги с дательным падежом могут отвечать также на вопрос&#160;<em>Wohin … ?</em>&#160;Вот примеры:</p>\n\n<p>a) <em>zu&#160;</em>+ дательный падеж</p>\n\n<p>(der Bahnhof:) <em>Ihr geht <strong>zum Bahnhof</strong>.</em> (zum = zu dem)<br>\n(die Touristeninformation:) <em>Ihr geht <strong>zur Touristeninformation</strong>.</em> (zur = zu der)<br>\n(das Schloss:) <em>Ihr geht <strong>zum Schloss</strong>.</em> (zum = zu dem)<br>\n(die Parkplätze:) <em>Ihr geht <strong>zu den Parkplätzen</strong>.</em></p>\n\n<p>Если хотят особо выделить конечный пункт пути, используют&#160; <em>bis zu</em>:<br>\n<em>Ihr geht geradeaus <strong>bis zum Bahnhof</strong>. Dann geht ihr links <strong>in die Hauptstraße</strong>.</em></p>\n\n<p>b) <em>an</em> + дательный падеж +&#160;<em>vorbei</em></p>\n\n<p>(der Supermarkt:) <em>Ihr geht <strong>am Supermarkt vorbei</strong>.</em> (am = an + dem)<br>\n(die Sprachschule:) <em>Ihr geht <strong>an der Sprachschule vorbei</strong>.</em>'<br>\n(das Theater:) <em>Ihr geht <strong>am Theater vorbei</strong>. </em>(am = an + dem)<br>\n(die Hochhäuser:) <em>Ihr geht <strong>an den Hochhäusern vorbei</strong>.</em></p>\n\n<p>c) <em>durch</em>&#160;+ винительный падеж</p>\n\n<p>(der Park:) <em>Ihr geht</em> <strong><em>durch den Park</em></strong>.<br>\n(die Fußgängerzone:) <em>Ihr geht</em> <strong><em>durch die Fußgängerzone</em></strong>.<br>\n(das Tor:) <em>Ihr geht <strong>durch das Tor</strong>.</em><br>\n(die Straßen): <em>Ihr geht <strong>durch die Straßen</strong>.</em></p>\n"}}, {"id": 40563597, "shortTitle": "Lokale Präpositionen", "name": "Lokale Präpositionen (2) ", "text": "<p><strong>Präpositionen, die eine Lage oder eine Richtung angeben</strong></p>\n\n<p>Präpositionen verbinden Wörter und Wortgruppen miteinander. Sie bezeichnen ein Verhältnis zwischen Lebewesen, Gegenständen oder Sachverhalten.</p>\n\n<p>Lokale Präpositionen beschreiben räumliche Beziehungen wie die Lage oder die Richtung.</p>\n\n<p>Man kann diese Präpositionen nach verschiedenen Kriterien ordnen:</p>\n\n<ul>\n\t<li>Bedeutung: Gibt die Präposition eine Lage (<em>Wo?</em>) oder eine Richtung (<em>Woher?/Wohin?</em>) an?</li>\n\t<li>Fall: Verlangt die Präposition den Dativ oder den Akkusativ?</li>\n</ul>\n\n<p>Bei den Wechselpräpositionen hängt der Fall mit der Bedeutung zusammen:</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Lage (<em>Wo?</em>):</p>\n\t\t\tDativ</td>\n\t\t\t<td>\n\t\t\t<p>Richtung (<em>Wohin?</em>):</p>\n\t\t\tAkkusativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>in</td>\n\t\t\t<td>in</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>an</td>\n\t\t\t<td>an</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>unter</td>\n\t\t\t<td>unter</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>über</td>\n\t\t\t<td>über</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>auf</td>\n\t\t\t<td>auf</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>vor</td>\n\t\t\t<td>vor</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>hinter</td>\n\t\t\t<td>hinter</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neben</td>\n\t\t\t<td>neben</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>zwischen</td>\n\t\t\t<td>zwischen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Es gibt aber auch Präpositionen, bei denen der Fall von der Bedeutung unabhängig ist. Die folgenden Präpositionen bzw. präpositionalen Ausdrücke können alle eine Bewegung aus einer Richtung oder in eine Richtung angeben. Einige von ihnen stehen immer mit dem Dativ, andere immer mit dem Akkusativ.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Dativ</td>\n\t\t\t<td>Akkusativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>aus</td>\n\t\t\t<td>durch</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>nach</td>\n\t\t\t<td>entlang*</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>zu</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>an ... vorbei</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>* </strong><em>entlang </em>steht nur mit dem Akkusativ, wenn die Präposition hinter dem Nomen steht: <em>die Straße entlang</em>.</p>\n", "ru": null}, {"id": 40563641, "shortTitle": "Lokale Präpositionen", "name": "Lokale Präpositionen (3)", "text": "<p><strong>Lokale Präpositionen in Wegbeschreibungen</strong></p>\n\n<p>Hier findest du die wichtigsten lokalen Präpositionen, die du für Wegbeschreibungen brauchst, mit Beispielen.</p>\n\n\n\n<p>1. Präpositionen, die die Lage eines Ortes angeben:</p>\n\n<p>vor + Dativ</p>\n\n<p><em>Das Zimmer ist vor dem Aufzug / vor der Bar / vor dem Restaurant.</em></p>\n\n<p>hinter + Dativ</p>\n\n<p><em>Der Aufzug ist hinter dem Frühstücksraum / hinter der Rezeption / hinter dem Treppenhaus.</em></p>\n\n<p>neben + Dativ</p>\n\n<p><em>Die Bar ist neben dem Aufzug / der Treppe / dem Restaurant.</em></p>\n\n<p>zwischen + Dativ</p>\n\n<p><em>Der Frühstücksraum ist zwischen dem Aufzug und der Treppe.</em></p>\n\n<p>in + Dativ</p>\n\n<p><em>Das Zimmer ist im Erdgeschoss / in der ersten Etage.</em></p>\n\n<p>auf + Dativ</p>\n\n<p><em>Das Restaurant ist auf der rechten Seite / auf der linken Seite.</em></p>\n\n\n\n<p>2. Präpositionen, die eine Bewegung in eine Richtung beschreiben:</p>\n\n<p>aus + Dativ</p>\n\n<p><em>Gehen Sie aus dem Aufzug / aus der Eingangshalle / aus dem Zimmer.</em></p>\n\n<p>an + Dativ + vorbei*</p>\n\n<p><em>Gehen Sie am Aufzug / an der Rezeption / am Treppenhaus vorbei.</em></p>\n\n<p>nach (+ Dativ):</p>\n\n<p><em>Gehen Sie nach rechts / nach links.</em></p>\n\n<p>Wenn du <em>nach</em> als lokale Präposition verwendest, steht danach in der Regel kein Artikel. Deshalb ist der Dativ nicht zu erkennen.</p>\n\n<p>zu + Dativ:</p>\n\n<p><em>Gehen Sie zum Aufzug / zur Treppe / zum Frühstücksraum.</em></p>\n\n<p>Du kannst den Endpunkt einer Strecke besonders betonen, indem du <em>bis zu</em> verwendest:</p>\n\n<p><em>Gehen Sie bis zum Aufzug und dann nach links.</em></p>\n\n\n\n<p>durch + Akkusativ</p>\n\n<p><em>Gehen Sie durch den Frühstücksraum / durch die rechte Tür / durch das Restaurant.</em></p>\n\n<p>Akkusativ + entlang*</p>\n\n<p><em>Gehen Sie den Flur entlang/die Straße entlang.</em></p>\n\n<p>Das Wort <em>entlang</em> kann unterschiedlich verwendet werden. In der Wegbeschreibung steht es hinter dem Nomen. Nur dann stehen Artikel und Nomen im Akkusativ.<br>\n&#160;</p>\n\n<p><br>\n*<em>entlang</em> (in der Stellung nach dem Nomen) und <em>vorbei </em>(in lokaler Bedeutung) sind oft Präfixe von trennbaren Verben: <em>entlanglaufen, vorbeigehen</em></p>\n", "ru": {"name": "Предлоги места", "text": "<p><strong>Предлоги места&#160;в описании направления движения</strong></p>\n\n<p>Здесь ты найдешь наиболее часто используемые предлоги пространственных отношений, которые тебе понадобятся для того, чтобы описать, что где находится, и как туда доехать или дойти.</p>\n\n\n\n<p>1. Предлоги места:</p>\n\n<p>vor + дательный падеж</p>\n\n<p><em>Das Zimmer ist vor dem Aufzug / vor der Bar / vor dem Restaurant.</em></p>\n\n<p>hinter + дательный падеж</p>\n\n<p><em>Der Aufzug ist hinter dem Frühstücksraum / hinter der Rezeption / hinter dem Treppenhaus.</em></p>\n\n<p>neben + дательный падеж</p>\n\n<p><em>Die Bar ist neben dem Aufzug / der Treppe / dem Restaurant.</em></p>\n\n<p>zwischen + дательный падеж</p>\n\n<p><em>Der Frühstücksraum ist zwischen dem Aufzug und der Treppe.</em></p>\n\n<p>in + дательный падеж</p>\n\n<p><em>Das Zimmer ist im Erdgeschoss / in der ersten Etage.</em></p>\n\n<p>auf + дательный падеж</p>\n\n<p><em>Das Restaurant ist auf der rechten Seite / auf der linken Seite.</em></p>\n\n\n\n<p>2. Предлоги направления движения:</p>\n\n<p>aus + дательный падеж</p>\n\n<p><em>Gehen Sie aus dem Aufzug / aus der Eingangshalle / aus dem Zimmer.</em></p>\n\n<p>an + дательный падеж + vorbei*</p>\n\n<p><em>Gehen Sie am Aufzug / an der Rezeption / am Treppenhaus vorbei.</em></p>\n\n<p>nach (+ дательный падеж)</p>\n\n<p><em>Gehen Sie nach rechts / nach links.</em></p>\n\n<p>После <em>nach</em> в значении предлога места, как правило, не используется артикль. Поэтому здесь трудно распознать дательный падеж.</p>\n\n<p>zu + дательный падеж</p>\n\n<p><em>Gehen</em> <em>Sie</em> <em>zum</em> <em>Aufzug</em><em> / </em><em>zur</em> <em>Treppe</em><em> / </em><em>zum</em> <em>Fr</em><em>ü</em><em>hst</em><em>ü</em><em>cksraum</em><em>.</em></p>\n\n<p>Направление движения до определенного предела в пространстве выражает предлог <em>bis</em> <em>zu</em>:</p>\n\n<p><em>Gehen Sie bis zum Aufzug und dann nach links.</em></p>\n\n<p>durch + винительный падеж</p>\n\n<p><em>Gehen Sie durch den Frühstücksraum / durch die rechte Tür / durch das Restaurant.</em></p>\n\n<p>Винительный падеж + entlang*</p>\n\n<p><em>Gehen Sie den Flur entlang/die Straße entlang.</em></p>\n\n<p>Слово <em>entlang</em> может использоваться по-разному. В описаниях направления движения оно стоит после существительного. Только в этом случае существительное и артикль употребляются в винительном падеже.</p>\n\n\n\n<p>*<em>entlang</em> (в положении после существительного) и <em>vorbei</em> (в значении предлога места) часто являются префиксами глаголов с отделяемой приставкой: <em>entlanglaufen</em><em>, </em><em>vorbeigehen</em></p>\n"}}, {"id": 40376251, "shortTitle": "Präposition: aus", "name": "Lokale Präpositionen: aus", "text": "<p><strong><em>Woher kommst du? – Ich komme aus …</em></strong></p>\n\n<p>Auf die Frage, woher du kommst, kannst du mit verschiedenen Informationen antworten. Meist nennt man sein Heimatland oder seine Heimatstadt. Vor dem Namen des Landes oder der Stadt steht die Präposition <em>aus</em>:</p>\n\n<p><em>Ich komme aus Spanien. </em>(Heimatland)</p>\n\n<p><em>Ich komme aus Sevilla. </em>(Heimatstadt)</p>\n\n\n\n<p>Wenn du sagst, aus welcher Stadt du kommst, sagst du:</p>\n\n<p><em>Ich komme aus</em> + Name der Stadt.</p>\n\n\n\n<p>Bei Ländernamen ist es etwas komplizierter. Meistens sagst du:</p>\n\n<p><em>Ich komme aus</em> + Name des Landes.</p>\n\n\n\n<p>Aber es gibt einige Ausnahmen. Bei maskulinen und femininen Ländernamen oder im Plural brauchst du normalerweise den Artikel.</p>\n\n<p>Du brauchst nicht alle Ausnahmen zu kennen, aber vielleicht gehört dein Heimatland ja zu den folgenden Ländern.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Ich komme …</td>\n\t\t\t<td>\n\t\t\t<p><strong>aus dem</strong> Irak.*</p>\n\n\t\t\t<p><strong>aus dem</strong> Iran.*</p>\n\n\t\t\t<p><strong>aus dem</strong> Jemen.</p>\n\n\t\t\t<p><strong>aus dem</strong> Kongo.</p>\n\n\t\t\t<p><strong>aus dem</strong> Kosovo.</p>\n\n\t\t\t<p><strong>aus dem</strong> Libanon.</p>\n\n\t\t\t<p><strong>aus dem</strong> Niger.</p>\n\n\t\t\t<p><strong>aus dem</strong> Oman.&#160;&#160;&#160;&#160;&#160;&#160;</p>\n\n\t\t\t<p><strong>aus dem</strong> Senegal.</p>\n\n\t\t\t<p><strong>aus dem</strong> Sudan.</p>\n\t\t\t<strong>aus dem</strong> Tschad.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p>* Die maskulinen Ländernamen werden manchmal auch ohne Artikel verwendet, besonders Irak und Iran.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Ich komme …</td>\n\t\t\t<td>\n\t\t\t<p><strong>aus der </strong>Demokratischen Republik Kongo.</p>\n\n\t\t\t<p><strong>aus der </strong>Dominikanischen Republik.</p>\n\n\t\t\t<p><strong>aus der</strong> Elfenbeinküste.</p>\n\n\t\t\t<p><strong>aus der</strong> Mongolei.</p>\n\n\t\t\t<p><strong>aus der</strong> Schweiz.</p>\n\n\t\t\t<p><strong>aus der</strong> Slowakei.</p>\n\n\t\t\t<p><strong>aus der</strong> Türkei.</p>\n\n\t\t\t<p><strong>aus der</strong> Ukraine.</p>\n\t\t\t<strong>aus der</strong> Zentralafrikanischen Republik.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Ich komme …</td>\n\t\t\t<td>\n\t\t\t<p><strong>aus den </strong>Bahamas.*</p>\n\n\t\t\t<p><strong>aus den</strong> Kapverdischen Inseln.*</p>\n\n\t\t\t<p><strong>aus den</strong> Komoren.*</p>\n\n\t\t\t<p><strong>aus den</strong> Malediven.*</p>\n\n\t\t\t<p><strong>aus den</strong> Niederlanden.</p>\n\n\t\t\t<p><strong>aus den</strong> Philippinen.*</p>\n\n\t\t\t<p><strong>aus den</strong> Salomonen.*</p>\n\n\t\t\t<p><strong>aus den</strong> Seychellen.*</p>\n\n\t\t\t<p><strong>aus den </strong>USA/<strong>aus den</strong> Vereinigten Staaten.</p>\n\t\t\t<strong>aus den</strong> Vereinigten Arabischen Emiraten.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>* Wenn du von einer Inselgruppe kommst, kannst du auch sagen:</p>\n\n<p><em>Ich komme von den Bahamas / den Kapverdischen Inseln / den Komoren / den Malediven / den Philippinen / den Salomonen / den Seychellen.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>die Präposition: Präpositionen sind meist kurze Wörter, die Wörter oder Wortgruppen miteinander verbinden. Sie bezeichnen das Verhältnis zwischen Lebewesen, Gegenständen oder Sachverhalten.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Предлоги: aus ", "text": "<p><strong><em>Woher kommst du? – Ich komme aus …</em></strong></p>\n\n<p>На вопрос, откуда ты, можно ответить по-разному. Обычно называется родная страна или родной город. Перед названием страны или города ставится предлог <em>aus</em>:</p>\n\n<p><em>Ich komme aus Spanien.&#160;</em>(страна)</p>\n\n<p><em>Ich komme aus Sevilla.&#160;</em>(город)</p>\n\n\n\n<p>Чтобы сообщить, из какого ты города, надо сказать:</p>\n\n<p><em>Ich komme aus</em> + название города.</p>\n\n\n\n<p>С названиями стран немного сложнее. В большинстве случаев ты говоришь так:</p>\n\n<p><em>Ich komme aus</em> + название страны.</p>\n\n\n\n<p>Иногда перед названием страны мужского или женского рода, а также во множественном числе стоит артикль.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Ich komme …</td>\n\t\t\t<td>\n\t\t\t<p><strong>aus dem</strong> Irak.*</p>\n\n\t\t\t<p><strong>aus dem</strong> Iran.*</p>\n\n\t\t\t<p><strong>aus dem</strong> Jemen.</p>\n\n\t\t\t<p><strong>aus dem</strong> Kongo.</p>\n\n\t\t\t<p><strong>aus dem</strong> Kosovo.</p>\n\n\t\t\t<p><strong>aus dem</strong> Libanon.</p>\n\n\t\t\t<p><strong>aus dem</strong> Niger.</p>\n\n\t\t\t<p><strong>aus dem</strong> Oman.&#160;&#160;&#160;&#160;&#160;&#160;</p>\n\n\t\t\t<p><strong>aus dem</strong> Senegal.</p>\n\n\t\t\t<p><strong>aus dem</strong> Sudan.</p>\n\t\t\t<strong>aus dem</strong> Tschad.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p>*Названия стран мужского рода иногда употребляются и без артикля, например, Irak и Iran.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Ich komme …</td>\n\t\t\t<td>\n\t\t\t<p><strong>aus der </strong>Demokratischen Republik Kongo.</p>\n\n\t\t\t<p><strong>aus der </strong>Dominikanischen Republik.</p>\n\n\t\t\t<p><strong>aus der</strong> Elfenbeinküste.</p>\n\n\t\t\t<p><strong>aus der</strong> Mongolei.</p>\n\n\t\t\t<p><strong>aus der</strong> Schweiz.</p>\n\n\t\t\t<p><strong>aus der</strong> Slowakei.</p>\n\n\t\t\t<p><strong>aus der</strong> Türkei.</p>\n\n\t\t\t<p><strong>aus der</strong> Ukraine.</p>\n\t\t\t<strong>aus der</strong> Zentralafrikanischen Republik.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Ich komme …</td>\n\t\t\t<td>\n\t\t\t<p><strong>aus den </strong>Bahamas.*</p>\n\n\t\t\t<p><strong>aus den</strong> Kapverdischen Inseln.*</p>\n\n\t\t\t<p><strong>aus den</strong> Komoren.*</p>\n\n\t\t\t<p><strong>aus den</strong> Malediven.*</p>\n\n\t\t\t<p><strong>aus den</strong> Niederlanden.</p>\n\n\t\t\t<p><strong>aus den</strong> Philippinen.*</p>\n\n\t\t\t<p><strong>aus den</strong> Salomonen.*</p>\n\n\t\t\t<p><strong>aus den</strong> Seychellen.*</p>\n\n\t\t\t<p><strong>aus den </strong>USA/<strong>aus den</strong> Vereinigten Staaten.</p>\n\t\t\t<strong>aus den</strong> Vereinigten Arabischen Emiraten.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>*Человек родом с островной группы может про себя сказать:</p>\n\n<p><em>Ich komme von den Bahamas / den Kapverdischen Inseln / den Komoren / den Malediven / den Philippinen / den Salomonen / den Seychellen.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>die Präposition: Предлоги - это обычно короткие слова, которые связывают между собой другие слова или группы слов. Они обозначают взаимосвязи между живыми существами, неодушевленными предметами или явлениями.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40376309, "shortTitle": "Präpositionen: in, an", "name": "Lokale Präpositionen: in, an", "text": "<p><strong><em>Wo wohnst du? – Ich wohne in …</em></strong></p>\n\n<p>Wenn jemand dich fragt, wo du wohnst, kannst du z. B. den Namen der Stadt oder der Straße nennen, in der du lebst. Vor dem Namen der Stadt oder der Straße steht die Präposition <em>in</em>:</p>\n\n<p><em>Ich wohne in Berlin.</em></p>\n\n<p><em>Ich wohne in der Adalbert-Stifter-Straße.</em></p>\n\n\n\n<p>Wenn du sagst, in welcher Stadt du lebst, sagst du:</p>\n\n<p><em>Ich wohne in</em> + Name der Stadt.</p>\n\n\n\n<p>Bei Straßennamen sagst du normalerweise:</p>\n\n<p><em>Ich wohne in der</em> + Name der Straße.</p>\n\n<p>Einige Straßennamen enden nicht auf <em>-straße</em>. Dann musst du auf das Ende des Namens achten.</p>\n\n<p>Ich wohne <strong>in der</strong> Adalbert-Stifter-<strong>Straße.</strong><br>\nIch wohne <strong>in der</strong> Adalbert-Stifter-<strong>Gasse.</strong><br>\nIch wohne <strong>in der</strong> Adalbert-Stifter-<strong>Allee.</strong></p>\n\n<p>Ich wohne<strong> im </strong>Adalbert-Stifter-<strong>Weg.</strong></p>\n\n<p>Ich wohne<strong> am </strong>Adalbert-Stifter-<strong>Platz.</strong></p>\n", "ru": {"name": "Предлоги: in, an", "text": "<p><strong><em>Wo wohnst du? – Ich wohne in …</em></strong></p>\n\n<p>Если тебя спрашивают, где ты живешь, ты можешь назвать город или адрес. Перед названием города и улицы ставится предлог <em>in</em>:</p>\n\n<p><em>Ich wohne in Berlin.</em></p>\n\n<p><em>Ich wohne in der Adalbert-Stifter-Straße.</em></p>\n\n\n\n<p>Город, в котором ты живешь, ты называешь так:</p>\n\n<p><em>Ich wohne in</em> + название города.</p>\n\n\n\n<p>Так называют улицу:</p>\n\n<p><em>Ich wohne in der</em> + название улицы.</p>\n\n<p>Не все названия улиц оканчиваются на <em>-stra</em><em>ße</em>. В таких случаях ты должен обращать внимание на род последнего слова в названии и использовать соответствующий артикль.</p>\n\n<p>Ich wohne <strong>in der</strong> Adalbert-Stifter-<strong>Straße.</strong><br>\nIch wohne <strong>in der</strong> Adalbert-Stifter-<strong>Gasse.</strong><br>\nIch wohne <strong>in der</strong> Adalbert-Stifter-<strong>Allee.</strong></p>\n\n<p>Ich wohne<strong> im </strong>Adalbert-Stifter-<strong>Weg.</strong></p>\n\n<p>Ich wohne<strong> am </strong>Adalbert-Stifter-<strong>Platz.</strong></p>\n"}}, {"id": 40461041, "shortTitle": "Präpositionen: in, an", "name": "Lokale Präpositionen: in, an ", "text": "<p><strong>Wiederholung: die Straße/den Platz nennen</strong></p>\n\n<p>Wenn du erklären willst, in welcher Straße sich jemand oder etwas befindet, wählst du die Wechselpräposition <em>in</em> + Dativ. Achte dabei auf den Artikel des Straßennamens:</p>\n\n<p>(die Straße)<em> Frau Kohlhaas wohnt <strong>in der Kälberstraße </strong></em><strong>4</strong>.</p>\n\n<p>(die Allee)<em> Jürgen Brunner wohnt <strong>in der Lindenallee 19.</strong></em></p>\n\n<p>(die Gasse)<em> Die WG ist <strong>in der Wagnergasse</strong> <strong>136.</strong></em></p>\n\n<p>(der Weg)<em> Selma wohnt <strong>im Wiesenweg 8.</strong> </em>(im = in + dem)</p>\n\n\n\n<p>Wenn es sich nicht um eine Straße, sondern um einen Platz handelt, verwende <em>am</em> (= an + dem).</p>\n\n<p>(der Platz)<em> Das Restaurant von Max und Tarek ist <strong>am Friedensplatz 22</strong>.</em></p>\n", "ru": {"name": "Предлоги: in, an", "text": "<p><strong>Повторение: Называем улицу/площадь</strong></p>\n\n<p>Если ты хочешь объяснить, на какой улице кто живет, или что находится, то используй предлог <em>in</em> + дательный падеж. При этом обращай внимание на артикль названия улицы:</p>\n\n<p>(die Straße)<em> Frau Kohlhaas wohnt <strong>in der Kälberstraße </strong></em><strong>4</strong>.</p>\n\n<p>(die Allee)<em> Jürgen Brunner wohnt <strong>in der Lindenallee 19.</strong></em></p>\n\n<p>(die Gasse)<em> Die WG ist <strong>in der Wagnergasse</strong> <strong>136.</strong></em></p>\n\n<p>(der Weg)<em> Selma wohnt <strong>im Wiesenweg 8.</strong> </em>(im = in + dem)</p>\n\n\n\n<p>Если речь не об улице, а о площади, используй <em>am</em> (= an + dem).</p>\n\n<p>(der Platz)<em> Das Restaurant von Max und Tarek ist <strong>am Friedensplatz 22</strong>.</em></p>\n"}}, {"id": 40401701, "shortTitle": "Präpositionen: in, nach", "name": "Lokale Präpositionen: in, nach", "text": "<p><strong><em>Wo</em></strong><em> ist die Semperoper? – Die Semperoper ist <strong>in</strong> Dresden.</em></p>\n\n<p>Wenn jemand mit <em>Wo …?</em> nach Städtenamen fragt, antwortet man mit der lokalen Präposition <em>in</em> + Name der Stadt.</p>\n\n\n\n<p><strong><em>Wohin</em></strong><em> möchte Chi fahren? – Chi möchte <strong>nach</strong> Dresden fahren.</em></p>\n\n<p>Wenn jemand mit <em>Wohin …?</em> nach Städtenamen fragt, antwortet man mit der lokalen Präposition <em>nach</em> + Name der Stadt.</p>\n", "ru": {"name": "Предлоги: in, nach", "text": "<p><strong><em>Wo</em></strong><em> ist die Semperoper? – Die Semperoper ist <strong>in</strong> Dresden.</em></p>\n\n<p>Когда спрашивают о местонахождении, то на вопрос <em>Wo</em><em> …? &#160;</em>отвечают с использованием конструкции: предлог места <em>in</em> + название. В примере это название города.</p>\n\n\n\n<p><strong><em>Wohin</em></strong><em> möchte Chi fahren? – Chi möchte <strong>nach</strong> Dresden fahren.</em></p>\n\n<p>Когда спрашивают о направлении, то на вопрос <em>Wohin</em><em> …?</em> отвечают с использованием конструкции: предлог места <em>nach</em> + название. В примере это название города.</p>\n"}}, {"id": 40555429, "shortTitle": "Ortsnamen ohne Artikel", "name": "Ortsnamen ohne Artikel", "text": "<p><strong>Städte- und Ländernamen ohne Artikel</strong></p>\n\n<p><strong><em>Woher kommst du? – Ich komme aus …</em></strong></p>\n\n<p>Auf die Frage, woher du kommst, kannst du mit verschiedenen Informationen antworten. Meist nennt man sein Heimatland oder seine Heimatstadt.</p>\n\n<p>Vor dem Namen des Landes oder der Stadt steht die Präposition <em>aus</em>.</p>\n\n<p><em>Ich komme <strong>aus</strong> Spanien. </em></p>\n\n<p><em>Ich komme <strong>aus</strong> Sevilla. </em></p>\n\n\n\n<p><strong><em>Wo lebst du? – Ich lebe in ...</em></strong></p>\n\n<p>Auf die Frage, in welcher Stadt oder welchem Land du lebst, antwortest du mit der Präposition <em>in</em>.</p>\n\n<p><em>Ich lebe <strong>in</strong> Spanien.</em></p>\n\n<p><em>Ich lebe <strong>in</strong> Sevilla.</em></p>\n\n\n\n<p><strong><em>Wohin reist du? – Ich reise nach ...</em></strong></p>\n\n<p>Auf die Frage, in welche Stadt oder in welches Land du reist, antwortest du mit der Präposition <em>nach</em>.</p>\n\n<p>Ich reise <strong>nach</strong> Spanien.</p>\n\n<p>Ich reise <strong>nach</strong> Sevilla.</p>\n", "ru": {"name": "Географические названия без артикля", "text": "<p><strong>Названия городов и стран без артикля</strong></p>\n\n<p><strong><em>Woher kommst du? – Ich komme aus …</em></strong></p>\n\n<p>На вопрос, откуда ты родом, можно ответить по-разному. Обычно называют страну или город. Перед названием страны или города стоит предлог <em>aus</em>.</p>\n\n<p><em>Ich</em> <em>komme</em> <strong><em>aus</em></strong> <em>Spanien</em><em>. </em></p>\n\n<p><em>Ich komme <strong>aus</strong> Sevilla. </em></p>\n\n\n\n<p><strong><em>Wo lebst du? – Ich lebe in...</em></strong></p>\n\n<p>В ответе на вопрос, где ты живешь, перед названием страны или города используй предлог <em>in</em>.</p>\n\n<p><em>Ich lebe <strong>in</strong> Spanien.</em></p>\n\n<p><em>Ich lebe <strong>in</strong> Sevilla.</em></p>\n\n\n\n<p><strong><em>Wohin reist du? – Ich reise nach...</em></strong></p>\n\n<p>В ответе на вопрос, куда ты едешь, перед названием страны или города используй предлог <em>nach</em>.</p>\n\n<p>Ich reise <strong>nach</strong> Spanien.</p>\n\n<p>Ich reise <strong>nach</strong> Sevilla.</p>\n"}}, {"id": 40461010, "shortTitle": "Präpositionen: bei, von", "name": "Präpositionen: bei, von", "text": "<p><strong>Wo arbeiten Sie? – Ich arbeite bei …</strong></p>\n\n<p>Wenn man angibt, bei welchem Unternehmen man arbeitet, verwendet man die Präposition <em>bei</em> + Firmenname.</p>\n\n<p><em>Ich arbeite <strong>bei Siemens&#160;</strong>/&#160;<strong>bei Aldi&#160;</strong>/&#160;<strong>bei Auto Müller</strong> / …</em></p>\n\n<p>Wenn der Firmenname einen Artikel hat, setzt man ihn in den Dativ.</p>\n\n<p><em>Ich arbeite <strong>beim Bundesamt für Migration und Flüchtlinge</strong>. </em>(beim = bei + dem)</p>\n\n<p><em>Ich arbeite <strong>bei der Post</strong>.</em></p>\n\n\n\n\n\n<p><strong>Wo ist Potsdam? – Potsdam ist in der Nähe von …</strong></p>\n\n<p>Um zu erklären, wo sich ein unbekannter Ort befindet, nennt man oft einen Ort in der Nähe, der größer oder bekannter ist. Dann verwendet man den Ausdruck <em>in der Nähe von</em>.</p>\n\n<p><em>Potsdam ist <strong>in der Nähe von Berlin</strong>.</em></p>\n\n<p>Wenn der genannte Ort einen Artikel hat, setzt man ihn in den Dativ.</p>\n\n<p><em>Das Kino ist <strong>in der Nähe vom Bahnhof</strong>. </em>(vom = von + dem)</p>\n\n<p><em>Das Museum ist <strong>in der Nähe von der Touristeninformation</strong>.</em></p>\n", "ru": {"name": "Предлоги: bei, von", "text": "<p><strong>Wo arbeiten Sie? – Ich arbeite bei …</strong></p>\n\n<p>Когда говорят о месте работы, используют предлог <em>bei</em> + название предприятия.</p>\n\n<p><em>Ich arbeite <strong>bei Siemens&#160;</strong>/&#160;<strong>bei Aldi&#160;</strong>/&#160;<strong>bei Auto Müller</strong> / …</em></p>\n\n<p>Если перед названием фирмы стоит артикль, то его употребляют в дательном падеже.</p>\n\n<p><em>Ich arbeite <strong>beim Bundesamt für Migration und Flüchtlinge</strong>. </em>(beim = bei + dem)</p>\n\n<p><em>Ich arbeite <strong>bei der Post</strong>.</em></p>\n\n\n\n\n\n<p><strong>Wo ist Potsdam? – Potsdam ist in der Nähe von …</strong></p>\n\n<p>Для того чтобы объяснить, где что находится, можно указать для ориентации на более известное место поблизости. В этом случае используют выражение <em>in der Nähe von</em>.</p>\n\n<p><em>Potsdam ist <strong>in der Nähe von Berlin</strong>.</em></p>\n\n<p>Если указанное для ориентации место употребляется с артиклем, то артикль стоит в дательном падеже.</p>\n\n<p><em>Das Kino ist <strong>in der Nähe vom Bahnhof</strong>. </em>(vom = von + dem)</p>\n\n<p><em>Das Museum ist <strong>in der Nähe von der Touristeninformation</strong>.</em></p>\n"}}, {"id": 40493418, "shortTitle": "Präpositionen: für", "name": "Präpositionen: für", "text": "\n\n<p><em>Ich habe ein Geschenk für <strong>dich</strong>. Hier, ein Notizbuch. Für <strong>alle neuen Wörter</strong> auf Deutsch.</em></p>\n\n<p>Die Präposition&#160;<em>für</em>&#160;wird z. B. benutzt, um einen Empfänger oder das Ziel bzw. den Zweck einer Handlung zu beschreiben.&#160;Sie verlangt den Akkusativ. Pronomen oder Nomen stehen nach <em>für</em> im Akkusativ.</p>\n", "ru": {"name": "Предлоги: für", "text": "\n\n<p><em>Ich habe ein Geschenk für <strong>dich</strong>. Hier, ein Notizbuch. Für <strong>alle neuen Wörter</strong> auf Deutsch.</em></p>\n\n<p>Предлог<em> für</em> используют, например, для описания адресата или цели и назначения какого-либо действия. Этот предлог требует винительного падежа. Местоимения или существительные стоят после<em> für</em> в винительном падеже.</p>\n"}}, {"id": 40463752, "shortTitle": "Präpositionen: mit", "name": "Präpositionen: mit", "text": "<p><em>Wie kommst du zur Arbeit? – Ich fahre <strong>mit dem Fahrrad</strong>.</em></p>\n\n<p>Die Präposition <em>mit</em> kennzeichnet häufig ein Mittel oder die Art und Weise. Sie wird auch bei Verkehrsmitteln verwendet. Die Präposition <em>mit</em> steht immer mit dem Dativ.</p>\n\n<p>maskulin:<em> der Bus, der Zug<br>\nIch fahre <strong>mit dem Bus</strong>.<br>\nIch fahre <strong>mit dem Zug</strong>.</em></p>\n\n<p>feminin:<em> die U-Bahn, die Buslinie<br>\nIch fahre <strong>mit der U-Bahn</strong>.</em><br>\n<em>Ich fahre <strong>mit der Buslinie 11</strong>.</em></p>\n\n<p>neutral:<em> das Auto, das Fahrrad<br>\nIch fahre <strong>mit dem Auto</strong>.<br>\nIch fahre <strong>mit dem Fahrrad</strong>.</em></p>\n\n<p>Plural:<em> </em><em> die Buslinien<br>\nIch fahre <strong>mit den Buslinien 9 und 16</strong>.</em></p>\n", "ru": {"name": "Предлоги: mit", "text": "<p><em>Wie kommst du zur Arbeit? – Ich fahre <strong>mit dem Fahrrad</strong>.</em></p>\n\n<p>Предлог <em>mit</em> часто обозначает средство или способ. Он употребляется и с видами транспорта. Этот предлог всегда требует дательного падежа.</p>\n\n<p>Мужской род: <em> der Bus, der Zug<br>\nIch fahre <strong>mit dem Bus</strong>.<br>\nIch fahre <strong>mit dem Zug</strong>.</em></p>\n\n<p>Женский род:<em> die U-Bahn, die Buslinie<br>\nIch fahre <strong>mit der U-Bahn</strong>.</em><br>\n<em>Ich fahre <strong>mit der Buslinie 11</strong>.</em></p>\n\n<p>Средний род:&#160;<em>das Auto, das Fahrrad<br>\nIch fahre <strong>mit dem Auto</strong>.<br>\nIch fahre <strong>mit dem Fahrrad</strong>.</em></p>\n\n<p>Множ.число: <em> die Buslinien<br>\nIch fahre <strong>mit den Buslinien 9 und 16</strong>.</em></p>\n"}}, {"id": 40443191, "shortTitle": "Präpositionen: an", "name": "Temporale Präposition: an", "text": "<p><em>Wann sieht Emma fern? – &#160;<strong>Am</strong> Freitag.</em></p>\n\n<p>Wenn man angibt, an welchem Tag man etwas macht, verwendet man die Präposition <em>an </em>zusammen mit dem Artikel <em>dem</em>. Die beiden Wörter verschmelzen zu <em>am</em>.</p>\n\n<p>Die Stellung von Adverbien und adverbialen Bestimmungen im Satz ist relativ frei.&#160;Die Zeitangabe mit <em>am</em> steht im Satz häufig an der ersten Position oder direkt hinter dem Subjekt und dem konjugierten Verb.</p>\n\n<p><em><strong>Am Freitag</strong></em> sieht <em>Emma fern.</em></p>\n\n<p><em>Emma</em> sieht<em> <strong>am</strong> <strong>Freitag</strong> fern.</em></p>\n\n<p><em>Manchmal</em> sieht<em> Emma <strong>am</strong> <strong>Freitag</strong> fern.</em></p>\n", "ru": {"name": "Предлоги: an", "text": "<p><em>Wann sieht Emma fern? – &#160;<strong>Am</strong> Freitag.</em></p>\n\n<p>При указании на день недели совершения какого-либо действия используется предлог <em>an</em> и артикль <em>dem</em>. Оба слова сливаются в <em>am</em>.</p>\n\n<p>Место наречий в предложении относительно свободно. Обстоятельство времени с предлогом&#160;<em>am</em> часто стоит в предложении на первом месте или непосредственно после подлежащего и спрягаемого глагола.</p>\n\n<p><em><strong>Am Freitag</strong></em> sieht <em>Emma fern.</em></p>\n\n<p><em>Emma</em> sieht<em> <strong>am</strong> <strong>Freitag</strong> fern.</em></p>\n\n<p><em>Manchmal</em> sieht<em> Emma <strong>am</strong> <strong>Freitag</strong> fern.</em></p>\n"}}, {"id": 41558946, "shortTitle": "Präpositionen: um, von – bis", "name": "Temporale Präpositionen: um, von – bis", "text": "<p>Nach Zeitangaben fragt man oft mit dem Fragewort <em>wann</em>:</p>\n\n<p><em>Wann beginnt der Kurs?</em></p>\n\n<p><em>Wann arbeitest du?</em></p>\n\n\n\n<p>Bei Uhrzeiten antwortet man …</p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span>mit <strong><em>um</em></strong>, wenn es sich um einen <strong>Zeitpunkt</strong> handelt:<br>\n\t<em>Der Kurs beginnt <strong>um</strong> neun.</em></li>\n\t<li><span dir=\"LTR\"></span>mit <strong><em>von … bis …</em></strong>, wenn es sich um einen <strong>Zeitraum</strong> handelt:<br>\n\t<em>Ich arbeite <strong>von</strong> acht <strong>bis</strong> fünf.</em></li>\n</ul>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>die Präposition: Präpositionen sind meist kurze Wörter, die Wörter oder Wortgruppen miteinander verbinden. Sie bezeichnen das Verhältnis zwischen Lebewesen, Gegenständen oder Sachverhalten.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Предлоги: um, von … bis", "text": "<p>О времени спрашивают, используя вопросительное слово&#160;<em>wann</em>:</p>\n\n<p><em>Wann beginnt der Kurs?</em></p>\n\n<p><em>Wann arbeitest du?</em></p>\n\n\n\n<p>Время указывают с помощью предлогов:</p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span><strong><em>um</em></strong>, когда речь идет о конкретном <strong>моменте времени</strong><br>\n\t<em>Der Kurs beginnt <strong>um</strong> neun.</em></li>\n\t<li><span dir=\"LTR\"></span>use <strong><em>von … bis …</em></strong>, когда речь идет о <strong>промежутке времени</strong><br>\n\t<em>Ich arbeite <strong>von</strong> acht <strong>bis</strong> fünf.</em></li>\n</ul>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>die Präposition: Предлоги –&#160;это обычно короткие слова, которые связывают между собой другие слова или группы слов. Они обозначают взаимосвязи между живыми существами, неодушевленными предметами или явлениями.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40510217, "shortTitle": "Präpositionen: vor, nach", "name": "Temporale Präpositionen: vor, nach", "text": "<p>Um eine zeitliche Reihenfolge anzugeben, kannst du die Präpositionen <em>vor</em> und <em>nach</em> benutzen:</p>\n\n\n\n<p><strong><em>Vor dem Frühstück</em></strong><em> duscht Nico.</em></p>\n\n<p><strong><em>Nach dem Frühstück</em></strong><em> geht er zum Sprachkurs.</em></p>\n\n\n\n<p>Wenn man <em>vor</em> und <em>nach</em> verwendet, um eine Zeitangabe zu machen, stehen der Artikel und das Nomen danach immer im Dativ.</p>\n\n<p>der Unterricht:</p>\n\n<p><strong><em>vor/nach dem</em></strong> Unterricht</p>\n\n<p>die Pause:</p>\n\n<p><strong><em>vor/nach der</em></strong> Pause</p>\n\n<p>das Frühstück:</p>\n\n<p><strong><em>vor/nach dem</em></strong> Frühstück</p>\n", "ru": {"name": "Предлоги: vor, nach", "text": "<p>Для указания хронологической последовательности можно использовать предлоги <em>vor</em> и <em>nach</em>:</p>\n\n\n\n<p><strong><em>Vor dem Frühstück</em></strong><em> duscht Nico.</em></p>\n\n<p><strong><em>Nach dem Frühstück</em></strong><em> geht er zum Sprachkurs.</em></p>\n\n\n\n<p>После предлогов <em>vor</em> и <em>nach</em> артикль и следующее за ним существительное в функции обстоятельства времени всегда стоят в дательном падеже.</p>\n\n<p>der Unterricht:<br>\n<strong><em>vor/nach dem</em></strong> Unterricht</p>\n\n<p>die Pause:<br>\n<strong><em>vor/nach der</em></strong> Pause</p>\n\n<p>das Frühstück:<br>\n<strong><em>vor/nach dem</em></strong> Frühstück</p>\n"}}, {"id": 40553729, "shortTitle": "Präpositionen: vor, seit", "name": "Temporale Präpositionen: vor, seit", "text": "<p><strong>Die temporale Präposition&#160;<em>vor</em></strong></p>\n\n<p><em>Nico ist <strong>vor einem Monat</strong> nach Deutschland gekommen.</em></p>\n\n<p>Man benutzt <em>vor</em> als temporale Präposition, wenn man Ereignisse oder Handlungen in der Vergangenheit beschreibt, die <strong>schon beendet</strong> sind. Nach der Präposition <em>vor</em> steht eine Zeitangabe im Dativ. Diese Zeitangabe drückt aus, wie viel Zeit seit der Handlung oder dem Ereignis schon vergangen ist.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>vor + Dativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>der Monat</td>\n\t\t\t<td><em>vor <strong>einem</strong> Monat</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>die Woche</td>\n\t\t\t<td><em>vor <strong>einer</strong> Woche</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>das Jahr</td>\n\t\t\t<td><em>vor <strong>einem</strong> Jahr</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>die Monate</td>\n\t\t\t<td><em>vor drei Monate<strong>n</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>die Wochen</td>\n\t\t\t<td><em>vor drei Wochen</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>die Jahre</td>\n\t\t\t<td><em>vor drei Jahre<strong>n</strong></em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Weil die Handlung/das Ereignis schon beendet ist, verwendet man im Satz eine Vergangenheitsform:</p>\n\n<p>Perfekt:<em> Nawin <strong>ist</strong> vor zwei Wochen nach Frankreich <strong>gezogen</strong>.</em></p>\n\n<p>Präteritum:<em> Lisa <strong>hatte</strong> vor drei Wochen Urlaub.</em></p>\n\n\n\n<p><strong>Die temporale Präposition&#160;<em>seit</em></strong></p>\n\n<p><em>Nico lernt <strong>seit einem Monat</strong> Deutsch.</em></p>\n\n<p>Die Präposition <em>seit</em> signalisiert, dass eine Handlung, ein Ereignis oder ein Zustand in der Vergangenheit begonnen hat und <strong>noch nicht beendet</strong> ist. Nach der Präposition <em>seit</em> steht eine Zeitangabe im Dativ. Diese Zeitangabe drückt aus, wie lange die Handlung, das Ereignis oder der Zustand schon andauert.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>seit + Dativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>der Monat</td>\n\t\t\t<td><em>seit <strong>einem</strong> Monat</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>die Woche</td>\n\t\t\t<td><em>seit <strong>einer</strong> Woche</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>das Jahr</td>\n\t\t\t<td><em>seit <strong>einem</strong> Jahr</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>die Monate</td>\n\t\t\t<td><em>seit drei Monate<strong>n</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>die Wochen</td>\n\t\t\t<td><em>seit drei Wochen</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>die Jahre</td>\n\t\t\t<td><em>seit drei Jahre<strong>n</strong></em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Weil die Handlung/das Ereignis/der Zustand noch nicht beendet ist, verwendet man in einem Satz mit <em>seit</em> normalerweise das Präsens.</p>\n\n<p><em>Nico <strong>wohnt</strong> seit drei Wochen bei Inge.</em></p>\n\n\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe &#160;auf Deutsch:</p>\n\n\t\t\t<p>die Präposition: Präpositionen sind meist kurze Wörter, die Wörter oder Wortgruppen miteinander verbinden. Sie bezeichnen das Verhältnis zwischen Lebewesen, Gegenständen oder Sachverhalten.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Предлоги: vor, seit", "text": "<p><strong>Предлог </strong><strong>времени <em>vor</em></strong></p>\n\n<p><em>Nico ist <strong>vor einem Monat</strong> nach Deutschland gekommen.</em></p>\n\n<p>Предлог времени <em>vor</em><em> </em>используется при описании событий или действий в прошлом, которые <strong>уже завершились</strong>.&#160;За предлогом <em>vor</em> следует обстоятельство времени в дательном падеже. Обстоятельство времени с предлогом <em>vor</em> выражает временной промежуток между событием или действием в прошлом и моментом речи.&#160;</p>\n\n<table border=\"1\" cellpadding=\"0\" cellspacing=\"0\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td style=\"width:92px\">\n\t\t\t\n\t\t\t</td>\n\t\t\t<td style=\"width:132px\">\n\t\t\t<p><em>vor</em> + дательный падеж</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td style=\"height:71px; width:92px\">\n\t\t\t<p>der Monat</p>\n\n\t\t\t<p>die Woche</p>\n\n\t\t\t<p>das Jahr</p>\n\t\t\t</td>\n\t\t\t<td style=\"height:71px; width:132px\">\n\t\t\t<p><em>vor <strong>einem</strong> Monat</em></p>\n\n\t\t\t<p><em>vor <strong>einer</strong> Woche</em></p>\n\n\t\t\t<p><em>vor <strong>einem</strong> Jahr</em></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td style=\"height:25px; width:92px\">\n\t\t\t<p>die Monate</p>\n\n\t\t\t<p>die Wochen</p>\n\n\t\t\t<p>die Jahre</p>\n\t\t\t</td>\n\t\t\t<td style=\"height:25px; width:132px\">\n\t\t\t<p><em>vor drei Monate<strong>n</strong></em></p>\n\n\t\t\t<p><em>vor drei Wochen</em></p>\n\n\t\t\t<p><em>vor drei Jahre<strong>n</strong></em></p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Поскольку действие или событие уже завершились, в предложении используется одна из форм прошедшего времени:</p>\n\n<p>Perfekt:<em> Nawin <strong>ist</strong> vor zwei Wochen nach Frankreich <strong>gezogen</strong>.</em></p>\n\n<p>Präteritum:<em> Lisa <strong>hatte</strong> vor drei Wochen Urlaub.</em></p>\n\n\n\n<p><strong>Предлог </strong><strong>времени <em>seit</em></strong></p>\n\n<p><em>Nico lernt <strong>seit einem Monat</strong> Deutsch.</em></p>\n\n<p>Предлог <em>seit</em> указывает на момент времени, с которого что-либо начинается в прошлом. Действие, событие или ситуация&#160;<strong>еще не завершились</strong>. За предлогом <em>seit</em> следует обстоятельство времени в дательном падеже. Обстоятельство времени с предлогом <em>seit</em> выражает продолжительность действия, события или ситуации.</p>\n\n<table border=\"1\" cellpadding=\"0\" cellspacing=\"0\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td style=\"width:92px\">\n\t\t\t\n\t\t\t</td>\n\t\t\t<td style=\"width:132px\">\n\t\t\t<p><em>seit</em> + дательный падеж</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td style=\"height:77px; width:92px\">\n\t\t\t<p>der Monat</p>\n\n\t\t\t<p>die Woche</p>\n\n\t\t\t<p>das Jahr</p>\n\t\t\t</td>\n\t\t\t<td style=\"height:77px; width:132px\">\n\t\t\t<p><em>seit <strong>einem</strong> Monat</em></p>\n\n\t\t\t<p><em>seit <strong>einer</strong> Woche</em></p>\n\n\t\t\t<p><em>seit <strong>einem</strong> Jahr</em></p>\n
