ll}, {"id": 40574227, "shortTitle": "Trennbare Verben", "name": "Trennbare Verben", "text": "<p><strong>Zusammenfassung: trennbare Verben</strong></p>\n\n<p>Im Deutschen gibt es die Möglichkeit, einfachen Verben ein Präfix voranzustellen und dadurch ein Verb mit einer neuen Bedeutung zu bilden.</p>\n\n<p><em>Präfix + Verb = <strong>neues Verb</strong></em></p>\n\n<p><em>ab + fahren =&#160;<strong>abfahren</strong></em></p>\n\n<p><em>zurück + fahren =<strong> zurückfahren</strong></em></p>\n\n<p>Viele dieser neuen Verben sind trennbar. Das heißt für einen einfachen Aussagesatz im Präsens<a>:</a>&#160;Das ursprüngliche einfache Verb wird konjugiert und steht im Satz an der zweiten Position. Das Präfix steht am Satzende.</p>\n\n<p><strong><em>ab|fahren:</em></strong><br>\n<em>Der Zug <strong>fährt</strong> um 9:45 Uhr <strong>ab</strong>.</em></p>\n\n\n\n<p>In Kombination mit einem Modalverb steht das trennbare Verb im Infinitiv am Satzende. Dann wird das Präfix nicht abgetrennt.</p>\n\n<p><strong><em>um|steigen:</em></strong><br>\n<em>Du <strong>musst</strong> nicht <strong>umsteigen</strong>.</em></p>\n\n\n\n<p>Im Perfekt bildet man aus dem trennbaren Verb ein Partizip II. Zwischen dem Präfix und dem Verbstamm steht <em>-ge-</em>.</p>\n\n<p><strong><em>weg|fahren:</em></strong><br>\n<em>Ich bin schon seit einigen Jahren nicht mehr <strong>weg</strong>ge<strong>fahren</strong>.</em></p>\n\n\n\n<p>Ob ein Verb trennbar ist, erkennst du oft daran, welches Präfix es hat.</p>\n\n<ul>\n\t<li>Verben mit Präfixen wie z. B. <em>ab-, an-, auf-, aus-, ein-, mit-, nach-, weg-, zu- </em>&#160;sind immer trennbar.</li>\n\t<li>Im Gegensatz dazu sind Verben mit Präfixen wie z. B. <em>be-, ent-, er-, ver-, zer- </em><strong>nicht</strong> trennbar.</li>\n\t<li>Verben mit Präfixen wie <em>durch-, über-, um-, unter- </em>können trennbar oder untrennbar sein.</li>\n</ul>\n\n\n\n<p>Du kannst trennbare Verben auch an ihrer Aussprache erkennen. Bei trennbaren Verben ist das Präfix immer betont.</p>\n\n<p><strong><em>auf</em></strong>stehen: trennbar</p>\n\n<p>ver<strong><em>steh</em></strong>en: nicht trennbar</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\t\t\tDas <span class=\"invalid_placeholder\">trennbare Verb</span>:&#160;Trennbare Verben haben ein Präfix, das im Satz abgetrennt werden kann und dann am Ende steht.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Отделяемые приставки", "text": "<p><strong>Обзор: Глаголы с отделяемой приставкой</strong></p>\n\n<p>В немецком языке существует возможность придать глаголу новое значение с помощью префикса, или приставки.</p>\n\n<p>Приставка + глагол = <strong>новый глагол</strong><br>\n<em>ab + fahren =&#160;<strong>abfahren</strong><br>\nzurück + fahren =<strong> zurückfahren</strong></em></p>\n\n<p>Многие из образованных таким образом глаголов имеют отделяемую приставку. В простом повествовательном предложении в настоящем времени исходный глагол спрягается и стоит в предложении на втором месте. Его приставка выносится в конец предложения.</p>\n\n<p><strong><em>ab|fahren:</em></strong><br>\n<em>Der Zug <strong>fährt</strong> um 9:45 Uhr <strong>ab</strong>.</em></p>\n\n\n\n<p>В конструкциях с модальным глаголом глагол с отделяемой приставкой в инфинитиве стоит в конце предложения. Приставка в таком случае не отделяется.</p>\n\n<p><strong><em>um|steigen:</em></strong><br>\n<em>Du <strong>musst</strong> nicht <strong>umsteigen</strong>.</em></p>\n\n\n\n<p>В прошедшем времени Perfekt от глагола с отделяемой приставкой образуется причастие Partizip II. Между приставкой и корнем глагола появляется <em>-ge-</em>.</p>\n\n<p><strong><em>weg|fahren:</em></strong><br>\n<em>Ich bin schon seit einigen Jahren nicht mehr <strong>weg</strong>ge<strong>fahren</strong>.</em></p>\n\n\n\n<p>Глаголы с отделяемой приставкой можно узнать по приставке.</p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span>Приставки ab-, an-, auf-, aus-, ein-, mit-, nach-, weg-, zu-&#160; всегда отделяемые.</li>\n\t<li><span dir=\"LTR\"></span>Приставки <em>be-, ent-, er-, ver-, zer-</em><em> &#160;</em><strong>неотделяемые</strong>. &#160;</li>\n\t<li><span dir=\"LTR\"></span>Приставки <em>durch</em><em>-, ü</em><em>ber</em><em>-, </em><em>um</em><em>-, </em><em>unter</em><em>- </em>могут быть как отделяемыми, так и неотделяемыми.</li>\n</ul>\n\n\n\n<p>Глаголы с отделяемой приставкой можно определить также по произношению. Отделяемая приставка в глаголе всегда стоит под ударением.</p>\n\n<p><strong><em>auf</em></strong>stehen: отделяемая</p>\n\n<p>ver<strong><em>steh</em></strong>en: неотделяемая</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>das trennbare Verb: В глаголах с отделяемой приставкой имеется префикс, который можно отделить и вынести в конец предложения.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40584481, "shortTitle": "Unpersönliche Verben", "name": "Unpersönliche Verben", "text": "<p><strong>Unpersönliche Verben</strong></p>\n\n<p>Unpersönliche Verben sind Verben, die immer mit dem unpersönlichen Pronomen <em>es</em> stehen. Das Pronomen <em>es </em>übernimmt hier nur formal die Funktion des Subjekts, ohne eine eigentliche Bedeutung zu haben. <em>es</em> steht hier also nicht für ein bestimmtes Nomen.</p>\n\n<p>Du kennst schon Sätze, die Wetterphänomene beschreiben:</p>\n\n<p><em>Es <strong>regnet</strong>.<br>\nEs <strong>schneit</strong>.</em></p>\n\n\n\n<p><strong>Unpersönlich verwendete Verben: <em>es gibt / es gab</em></strong></p>\n\n<p>Manche Verben können sowohl persönlich als auch unpersönlich gebraucht werden. Ein Beispiel dafür ist das Verb <em>geben</em>. &#160;<em>geben</em> kann persönlich mit Dativ- und Akkusativobjekt verwendet werden (<em>jemandem etwas geben</em>) oder unpersönlich mit <em>es</em> und Akkusativobjekt. Mit der Wendung &#160;<em>Es gibt</em> + Akkusativ drückt man aus, dass etwas vorhanden ist oder präsentiert wird.</p>\n\n<p><strong><em>Es gibt </em></strong><em>viele Angebote.<br>\nAuf dem Land <strong>gibt es</strong> keine Kinos.</em></p>\n\n\n\n<p>In der Vergangenheit benutzt man statt <em>es gibt</em> die Form <em>es gab</em>:</p>\n\n<p><strong><em>&#160;Gab es</em></strong><em> das Rathaus früher schon? – Ja, das <strong>gab es</strong>.</em><br>\n<strong><em>Es gab</em></strong><em> &#160;früher noch nicht so viele Autos. </em></p>\n", "ru": {"name": "Безличные глаголы", "text": "<p><strong>Безличные глаголы</strong></p>\n\n<p>Безличные глаголы – это глаголы, которые употребляются с безличным местоимением <em>es</em>. Местоимение<em> es</em> здесь&#160;лишь формально выступает в роли подлежащего и не имеет значения. То есть <em>es</em> не замещает какое-то существительное.</p>\n\n<p>Тебе уже знакомы предложения, описывающие погодные явления:</p>\n\n<p><em>Es <strong>regnet</strong>.<br>\nEs <strong>schneit</strong>.</em><br>\n&#160;</p>\n\n<p><strong>Глаголы, используемые как безличные: <em>es gibt/es gab</em></strong></p>\n\n<p>Некоторые глаголы можно использовать как личные и как безличные. Примером может служить глагол<em> geben</em>. Глагол <em>geben</em> используется как личный с прямым и косвенным дополнением (<em>jemandem</em><em> etwas</em><em> geben</em>), а как безличный - с <em>es</em> и объектом в винительном падеже. Конструкция <em>Es</em><em> gibt</em> + винительный падеж указывает на наличие чего-либо.</p>\n\n<p><strong><em>Es gibt </em></strong><em>viele Angebote.<br>\nAuf dem Land <strong>gibt es</strong> keine Kinos.</em><br>\n<br>\nВ прошедшем времени&#160; <em>es gibt</em> принимает форму <em>es gab</em>:<br>\n<strong><em>Gab es</em></strong><em> das Rathaus früher schon? – Ja, das <strong>gab es</strong>.</em><br>\n<strong><em>Es gab</em></strong><em>&#160; früher noch nicht so viele Autos. </em></p>\n"}}, {"id": 40585870, "shortTitle": "Verben + Präposition", "name": "Verben + Präposition (2)", "text": "<p><strong>Reflexive Verben mit Präpositionen</strong></p>\n\n<p>Du hast bereits einige Verben mit festen Präpositionen kennen gelernt. Bei diesen Verben dient die Präposition nur dazu, das Verb mit dem Objekt zu verbinden. Auch einige reflexive Verben werden mit einer festen Präposition gebraucht.</p>\n\n<p>Du weißt schon, dass manche Präpositionen mal mit dem Dativ und mal mit dem Akkusativ stehen können. Wenn diese Präpositionen einem Verb fest zugeordnet sind, ist auch der Fall festgelegt. Du musst diese Verben also so lernen, z. B.:</p>\n\n<p>sich ärgern + <strong>über</strong> + Akkusativ<br>\n<em>Inge ärgert sich über die Werbung.</em></p>\n\n<p>sich informieren + <strong>über</strong> + Akkusativ<br>\n<em>Inge informiert sich über den Ausflug.</em></p>\n\n<p>sich freuen + <strong>über</strong> + Akkusativ (Ereignis in der <strong>Gegenwart</strong>)<br>\n<em>Nico freut sich über das WG-Zimmer.</em></p>\n\n<p>sich freuen + <strong>auf</strong> + Akkusativ (Ereignis in der <strong>Zukunft</strong>)<br>\n<em>Inge freut sich nicht auf den Ausflug.</em></p>\n\n<p>sich verlieben + <strong>in</strong> + Akkusativ<br>\n<em>Nico hat sich in eine junge Syrerin verliebt.</em></p>\n\n<p>sich unterscheiden + <strong>in</strong> + Dativ<br>\n<em>Nico und sein Bruder unterscheiden sich in vielen Dingen.</em></p>\n\n<p>sich interessieren + <strong>für</strong> + Akkusativ<br>\n<em>Inge interessiert sich nicht für das Surfen.</em></p>\n", "ru": {"name": "Глаголы + предлог", "text": "<p><strong>Возвратные </strong><strong>глаголы </strong><strong>с </strong><strong>предлогами</strong></p>\n\n<p>Ты уже выучил несколько устойчивых выражений, состоящих из глаголов с предлогами. &#160;В&#160; таких выражениях предлог играет роль связующего элемента между глаголом и объектом. Некоторые возвратные глаголы также образуют с предлогами устойчивые выражения.</p>\n\n<p>Ты уже знаешь, что некоторые предлоги имеют двойное управление: иногда они употребляются с винительным падежом, иногда с дательным. В устойчивых выражениях с глаголами определенные предлоги требуют определенного падежа. Учить такие устойчивые выражения нужно, запоминая с самого начала глагол, предлог и падеж. Например:</p>\n\n<p>sich ärgern + <strong>über</strong> + винительный падеж<br>\n<em>Inge ärgert sich über die Werbung.</em></p>\n\n<p>sich informieren + <strong>über</strong> + винительный падеж<br>\n<em>Inge informiert sich über den Ausflug.</em></p>\n\n<p>sich freuen + <strong>über</strong> + винительный падеж (событие в <strong>настоящем</strong>)<br>\n<em>Nico freut sich über das WG-Zimmer.</em></p>\n\n<p>sich freuen + <strong>auf</strong> + винительный падеж (событие в <strong>будущем</strong>)<br>\n<em>Inge freut sich nicht auf den Ausflug.</em></p>\n\n<p>sich verlieben + <strong>in</strong> + винительный падеж<br>\n<em>Nico hat sich in eine junge Syrerin verliebt.</em></p>\n\n<p>sich unterscheiden + <strong>in</strong> + дательный падеж<br>\n<em>Nico und sein Bruder unterscheiden sich in vielen Dingen.</em></p>\n\n<p>sich interessieren + <strong>für</strong> + винительный падеж<br>\n<em>Inge interessiert sich nicht für das Surfen.</em></p>\n"}}, {"id": 40610074, "shortTitle": "Verben mit zwei Objekten", "name": "Verben mit zwei Objekten", "text": "<p><strong>Verben mit Dativ- und Akkusativobjekt</strong></p>\n\n<p>Das Zentrum in jedem deutschen Satz ist das konjugierte Verb. Viele Verben brauchen neben dem Subjekt als weitere Ergänzung ein Objekt. Dieses Objekt ist meist ein Akkusativobjekt.<br>\n<br>\nEinige Verben können zusätzlich zum Akkusativobjekt ein zweites Objekt haben. Das zweite Objekt ist oft ein Dativobjekt. Zu dieser Gruppe gehören Verben des Gebens, Nehmens und Sagens, z.B. <em>geben, schenken, schicken, bringen, zeigen</em> und<em> leihen</em>.</p>\n\n\n\n<p><em>Ich schenke dir ein Wörterbuch.</em></p>\n\n<p>Das Subjekt im Nominativ (<em>ich</em>) gibt an, welche Person die Handlung ausführt . (<em>Wer?</em>)<br>\n<br>\nDas Dativobjekt (<em>dir</em>) bestimmt die Person, die etwas erhält. (<em>Wem?</em>)<br>\n<br>\nDas Akkusativobjekt (<em>ein Wörterbuch</em>) beschreibt die Sache, um die es geht. (<em>Was?</em>)<br>\n&#160;</p>\n\n<p>In Sätzen mit zwei Objekten steht das <strong>Dativobjekt</strong> vor dem Akkusativobjekt, wenn das Akkusativobjekt kein Pronomen ist.</p>\n\n<p><em>Ich gebe <strong>dir </strong>einen Stift.</em></p>\n\n<p><em>Ich gebe <strong>meinem</strong> <strong>Vater </strong>Schokolade.<br>\nIch gebe <strong>ihm </strong>Schokolade.</em></p>\n\n<p><em>Ich gebe <strong>meiner Mutter </strong>eine DVD.<br>\nich gebe <strong>ihr </strong>eine DVD.</em></p>\n\n<p><em>Ich gebe <strong>meinen Eltern </strong>ein Bild.<br>\nIch gebe <strong>ihnen </strong>ein Bild.</em></p>\n\n<p>Das Dativobjekt kann ein Pronomen oder ein Nomen sein. Wiederhole noch einmal die Personalpronomen im Dativ, wenn nötig.&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td>Dativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich<br>\n\t\t\tdu<br>\n\t\t\ter<br>\n\t\t\tsie<br>\n\t\t\tes</td>\n\t\t\t<td>mir<br>\n\t\t\tdir<br>\n\t\t\tihm<br>\n\t\t\tihr<br>\n\t\t\tihm</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir<br>\n\t\t\tihr<br>\n\t\t\tsie<br>\n\t\t\tSie</td>\n\t\t\t<td>uns<br>\n\t\t\teuch<br>\n\t\t\tihnen<br>\n\t\t\tIhnen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Глаголы с двумя объектами", "text": "<p><strong>Глаголы с косвенным&#160;и прямым дополнением</strong></p>\n\n<p>Спрягаемый глагол играет в немецком предложении главную роль. Многим глаголам кроме подлежащего в предложении требуется также объект. Как правило, объект стоит в винительном падеже и выполняет функцию прямого дополнения. &#160;</p>\n\n<p>Некоторые глаголы могут иметь при себе второй объект, как правило, в дательном падеже, который выполняет функцию косвенного дополнения. К этой группе относятся, в частности, следующие глаголы: <em>geben</em>, <em>schenken</em>, <em>schicken</em>, <em>bringen</em>, <em>zeigen</em> и <em>leihen</em>.</p>\n\n\n\n<p><em>Ich schenke dir ein Wörterbuch.</em></p>\n\n<p>Подлежащее в именительном падеже (<em>ich</em>) – это субъект действия. (<em>Wer</em><em>?</em>)</p>\n\n<p>Косвенное дополнение в дательном падеже (<em>dir</em>) – это адресат действия. (<em>Wem</em><em>?</em>)</p>\n\n<p>Прямое дополнение в винительном падеже (<em>ein</em><em> W</em><em>örterbuch</em>) – это объект действия. (<em>Was</em><em>?</em>)</p>\n\n\n\n<p>В предложениях с двумя дополнениями <strong>косвенное дополнение </strong>стоит перед прямым, если прямое дополнение не является местоимением.</p>\n\n<p><em>Ich gebe <strong>dir </strong>einen Stift.</em></p>\n\n<p><em>Ich gebe <strong>meinem</strong> <strong>Vater </strong>Schokolade.<br>\nIch gebe <strong>ihm </strong>Schokolade.</em></p>\n\n<p><em>Ich gebe <strong>meiner Mutter </strong>eine DVD.<br>\nich gebe <strong>ihr </strong>eine DVD.</em></p>\n\n<p><em>Ich gebe <strong>meinen Eltern </strong>ein Bild.<br>\nIch gebe <strong>ihnen </strong>ein Bild.</em></p>\n\n<p><br>\nПрямым дополнением может быть местоимение или существительное.</p>\n\n<p>Повтори, если нужно, личные местоимения в дательном падеже.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Именительный падеж</td>\n\t\t\t<td>Дательный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich<br>\n\t\t\tdu<br>\n\t\t\ter<br>\n\t\t\tsie<br>\n\t\t\tes</td>\n\t\t\t<td>mir<br>\n\t\t\tdir<br>\n\t\t\tihm<br>\n\t\t\tihr<br>\n\t\t\tihm</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir<br>\n\t\t\tihr<br>\n\t\t\tsie<br>\n\t\t\tSie</td>\n\t\t\t<td>uns<br>\n\t\t\teuch<br>\n\t\t\tihnen<br>\n\t\t\tIhnen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40585933, "shortTitle": "Verben: Position/Richtung", "name": "Verben: Position/Richtung", "text": "\n\n<p><strong>Positionsverben + Wechselpräposition + Dativ </strong></p>\n\n<p>Zur differenzierten Beschreibung einer Position oder einer räumlichen Lage verfügt das Deutsche über verschiedene Verben. Diesen Verben folgt sehr häufig eine Wechselpräposition mit Dativ.</p>\n\n<p><br>\n<em>Der Teddy <strong>sitzt</strong> auf dem Boden.</em></p>\n\n\n\n<p><br>\n<em>Der Teddy <strong>liegt</strong> auf dem Boden.</em></p>\n\n\n\n<p><br>\n<em>Der Teddy <strong>steht</strong> auf dem Boden.</em></p>\n\n\n\n<p><span id=\"ck_editor_caret_marker\" style=\"display:none\"></span><br>\n<em>Der Teddy <strong>hängt</strong> an der Leine.</em></p>\n\n\n\n<p><strong>Richtungsverben + Akkusativ + Wechselpräposition + Akkusativ </strong><br>\nPassend zu den oben aufgeführten Verben gibt es Verben, die angeben, dass jemand oder etwas irgendwohin bewegt wird.&#160;Die Person oder der Gegenstand, der räumlich bewegt wird,&#160;ist das Akkusativobjekt des Satzes. Nach der Wechselpräposition folgt der Akkusativ.</p>\n\n<p><em>Emma <strong>setzt</strong> den Teddy auf den Boden.</em></p>\n\n<p><em>Selma <strong>legt</strong> den Teddy auf den Boden.</em></p>\n\n<p><em>Nina <strong>stellt</strong> den Teddy auf den Boden.</em></p>\n\n<p><em>Lisa <strong>hängt</strong> den Teddy auf die Leine.</em></p>\n\n\n\n<p><strong>Das Verb <em>hängen</em></strong></p>\n\n<p>Das Verb <em>hängen</em> kann in beiden Fällen verwendet werden: Steht nach der Wechselpräposition der Dativ, gibt es einen Ort an (<em>Wo ...?</em>). Wenn die Wechselpräposition mit Akkusativ verwendet wird, drückt <em>hängen</em> eine Richtung (<em>Wohin ...?</em>) aus.</p>\n\n\n\n<p><strong>Überblick:</strong></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Wo?</strong></td>\n\t\t\t<td><strong>Wohin?</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>sitzen</em></td>\n\t\t\t<td><em>setzen</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>liegen</em></td>\n\t\t\t<td><em>legen</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>stehen</em></td>\n\t\t\t<td><em>stellen</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>hängen</em></td>\n\t\t\t<td><em>hängen</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Глаголы: место/движение", "text": "<p><strong>Глаголы положения в пространстве&#160;+ предлог с двойным управлением + дательный падеж </strong></p>\n\n<p>Ряд глаголов в немецком языке описывает состояние с указанием на положение в пространстве. После таких глаголов используется обычно предлог с двойным управлением и объект в дательном падеже.</p>\n\n<p><br>\n<em>Der Teddy <strong>sitzt</strong> auf dem Boden.</em></p>\n\n\n\n<p><br>\n<em>Der Teddy <strong>liegt</strong> auf dem Boden.</em></p>\n\n\n\n<p><br>\n<em>Der Teddy <strong>steht</strong> auf dem Boden.</em></p>\n\n\n\n<p><span id=\"ck_editor_caret_marker\" style=\"display:none\"></span><br>\n<em>Der Teddy <strong>hängt</strong> an der Leine.</em></p>\n\n\n\n<p><strong>Глаголы движения + винительный падеж + предлог с двойным управлением + винительный падеж </strong></p>\n\n<p>Схожие по своему написанию и произношению с приведенными выше глаголами места, переходные глаголы движения выражают значение перемещения объекта в пространстве. Лицо или предмет, меняющие свое положение в пространстве, являются в предложении прямым дополнением в винительном падеже. Предлог с двойным управлением требует в таком случае обстоятельства места в винительном падеже.</p>\n\n<p><em>Emma <strong>setzt</strong> den Teddy auf den Boden.<br>\nSelma <strong>legt</strong> den Teddy auf den Boden.<br>\nNina <strong>stellt</strong> den Teddy auf den Boden.<br>\nLisa <strong>hängt</strong> den Teddy auf die Leine.</em></p>\n\n\n\n<p><strong>Глагол <em>h</em></strong><strong><em>ängen</em></strong></p>\n\n<p>Глагол <em>h</em><em>ängen</em> может управлять обоими падежами: если после предлога стоит дательный падеж, глагол указывает на место (<em>Wo</em><em> ...?</em>), если винительный – на направление движения (<em>Wohin</em><em> ...?</em>).</p>\n\n\n\n<p><strong>Сводная таблица:</strong></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Wo?</strong></td>\n\t\t\t<td><strong>Wohin?</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>sitzen</em></td>\n\t\t\t<td><em>setzen</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>liegen</em></td>\n\t\t\t<td><em>legen</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>stehen</em></td>\n\t\t\t<td><em>stellen</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>hängen</em></td>\n\t\t\t<td><em>hängen</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40447555, "shortTitle": "Vokalwechsel: a zu ä", "name": "Vokalwechsel: a zu ä", "text": "<p>Verben mit dem Vokalwechsel von <em>e</em> zu <em>i</em> kennst du schon. Eine weitere Gruppe der unregelmäßigen Verben hat einen Vokalwechsel von <em>a</em> zu <em>ä</em>. Diese Unregelmäßigkeit betrifft wieder nur die 2. und 3. Person Singular Präsens.</p>\n\n<p><em>Ich <strong>fahre</strong> nach Berlin. Und wohin <strong>fährst</strong> du, Lisa? – Ich <strong>fahre</strong> nach München.</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>&#160;ich fahre</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>&#160;du <strong>fährst</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>&#160;er/sie/es <strong>fährt</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>&#160;wir fahren</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>&#160;ihr fahrt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>&#160;sie fahren</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>&#160;Sie fahren</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Auch die Verben <em>schlafen</em>, <em>waschen </em>und <em>anfangen </em>haben einen Vokalwechsel von <em>a</em> zu <em>ä</em>.</p>\n\n<p>Das Verb <em>anfangen</em> ist ein trennbares Verb:</p>\n\n<p><em>Ich <strong>fange</strong> um acht Uhr mit der Arbeit <strong>an</strong>. Und wann <strong>fängst</strong> du <strong>an</strong>, Lisa? – Ich <strong>fange</strong> um halb neun <strong>an</strong>.</em></p>\n", "ru": {"name": "Чередование гласных: a - ä", "text": "<p>Тебе уже знакомы глаголы с чередующимися в корне гласными <em>e</em> и <em>i</em> . В другой группе неправильных глаголов в корне меняется <em>a</em> на <em>ä</em>. Происходит это также только во втором и третьем лице единственного числа настоящего времени.</p>\n\n<p><em>Ich <strong>fahre</strong> nach Berlin. Und wohin <strong>fährst</strong> du, Lisa? – Ich <strong>fahre</strong> nach München.</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>&#160;ich fahre</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>&#160;du <strong>fährst</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>&#160;er/sie/es <strong>fährt</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>&#160;wir fahren</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>&#160;ihr fahrt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>&#160;sie fahren</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>&#160;Sie fahren</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>В глаголах <em>schlafen</em>, <em>waschen</em> и <em>anfangen</em> также происходит чередование корневой гласной: <em>a</em> меняется на <em>ä</em>.</p>\n\n<p>Глагол <em>anfangen</em> – это глагол с отделяемой приставкой:</p>\n\n<p><em>Wann <strong>fängt </strong>der Film <strong>an</strong>? – Der Film <strong>fängt </strong>um 15:00 Uhr <strong>an</strong>. Die Kinderfilme <strong>fangen </strong>immer um 15:00 Uhr <strong>an</strong>.</em></p>\n"}}, {"id": 40381578, "shortTitle": "Vokalwechsel: e zu i", "name": "Vokalwechsel: e zu i", "text": "<p><strong>Verben mit Vokalwechsel von <em>e</em> zu <em>i</em></strong></p>\n\n<p>Bei einigen unregelmäßigen Verben verändert sich der Stammvokal <em>e</em>. Er wird in der zweiten&#160;und dritten&#160;Person Singular zu <em>i</em>. Die anderen Formen werden regelmäßig gebildet.</p>\n\n<p><em>Ich <strong>esse</strong> gern Pizza mit Salami. Und was <strong>isst</strong> du gern, Nina? – Ich <strong>esse</strong> gern Pizza Hawaii ohne Schinken.</em><br>\n<br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich esse</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du <strong>isst</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es <strong>isst</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir essen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr esst</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie essen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie essen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n<p><strong><em>Das Verb nehmen</em></strong></p>\n\n<p>Auch das Verb <em>nehmen</em> gehört zu dieser Gruppe. Es hat außerdem eine weitere Besonderheit:</p>\n\n<p>In der 2. und 3. Person Singular verändert sich nicht nur der Vokal, sondern auch der folgende Buchstabe.</p>\n\n<p><em>Ich <strong>nehme</strong> eine Pizza mit Thunfisch. Und was <strong>nimmst</strong> du, Nico? – Ich <strong>nehme</strong> eine Pizza mit Salami.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich nehme</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du <strong>nimmst</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es <strong>nimmt</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir nehmen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr nehmt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie nehmen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie nehmen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Чередование гласных: e-i", "text": "<p><strong>Глаголы с чередованием гласных <em>e</em></strong><strong><em>-i</em></strong><strong> в корне</strong></p>\n\n<p>В некоторых неправильных глаголах при спряжении изменяется корневая гласная <em>e</em>. &#160;Во втором и третьем лице единственного числа <em>e</em> меняется на <em>i</em>. Остальные личные формы образуются по общим правилам без чередования гласных.</p>\n\n<p><em>Ich <strong>esse</strong> gern Pizza mit Salami. Und was <strong>isst</strong> du gern, Nina? – Ich <strong>esse</strong> gern Pizza Hawaii ohne Schinken.</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich esse</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du <strong>isst</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es <strong>isst</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir essen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr esst</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie essen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie essen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong><em>Глагол nehmen</em></strong></p>\n\n<p>Глагол <em>nehmen</em> также относится к этой группе и имеет еще одну особенность: во втором и третьем лице единственного числа меняется не только гласная, но и следующая за ней буква.</p>\n\n<p><em>Ich <strong>nehme</strong> eine Pizza mit Thunfisch. Und was <strong>nimmst</strong> du, Nico? – Ich <strong>nehme</strong> eine Pizza mit Salami.</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich nehme</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du <strong>nimmst</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es <strong>nimmt</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir nehmen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr nehmt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie nehmen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie nehmen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40597456, "shortTitle": "Vorschläge machen", "name": "Vorschläge machen", "text": "<p>Du kennst schon verschiedene Möglichkeiten, Vorschläge auf Deutsch zu machen. Hier kannst du einige Strukturen wiederholen und neue Ausdrucksmöglichkeiten kennenlernen.</p>\n\n<p>Inge hat ein Problem. Jacques weiß nicht, wie schlecht sie kocht.</p>\n\n<p><strong>Imperativ</strong></p>\n\n<p>Lisa rät Inge: <strong><em>Sag</em></strong><em> ihm die Wahrheit!</em></p>\n\n<p>Die Imperativformen bildest du so:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><strong>Imperativ</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>informell</td>\n\t\t\t<td>(Singular)</td>\n\t\t\t<td><em>Sag!</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>informell</td>\n\t\t\t<td>(Plural)</td>\n\t\t\t<td><em>Sagt!</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>formell</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><em>Sagen Sie!</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Vorschläge mit <em>könnte</em></strong></p>\n\n<p>Nico sagt: <strong><em>Du könntest</em></strong><em> das Essen bei Max und Tarek bestellen.</em></p>\n\n<p>Häufig werden Vorschläge mit dem Modalverb <em>können</em> im Konjunktiv II formuliert.&#160;Im Konjunktiv II wird <em>können</em> so konjugiert:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich könn<strong><em>te</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du könn<strong><em>te</em></strong><em>st</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es könn<strong><em>te</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir könn<strong><em>te</em></strong><em>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr könn<strong><em>te</em></strong><em>t</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie könn<strong><em>te</em></strong><em>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie könn<strong><em>te</em></strong><em>n</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nUm Vorschläge zu machen, brauchst du meistens die zweite Person Singular bzw. Plural oder die formelle Anrede:</p>\n\n<p><strong><em>Du könntest</em></strong><em> das Essen bei Max und Tarek bestellen.</em></p>\n\n<p><strong><em>Ihr könntet</em></strong><em> in ein Restaurant gehen.</em></p>\n\n<p><strong><em>Sie könnten</em></strong><em> einen Kochkurs besuchen.</em></p>\n\n<p>Du hast schon ähnliche Formen des Verbs <em>sollen</em> gelernt, die du für Ratschläge verwenden kannst. Vergleiche die beiden Verben:</p>\n\n<p><strong><em>Du könntest</em></strong><em> das Essen bei Max und Tarek bestellen.</em> (Vorschlag)</p>\n\n<p><strong><em>Du solltest</em></strong><em> das Essen bei Max und Tarek bestellen.</em> (nachdrückliche Empfehlung)</p>\n\n\n\n<p><strong>Vorschläge im Plural formulieren</strong></p>\n\n<p>Wenn man etwas mit jemandem zusammen entscheiden möchte, kann man Vorschläge im Plural formulieren.</p>\n\n<p>Inge könnte zu Jacques sagen:</p>\n\n<p><strong><em>Wir könnten </em></strong><em>in ein Restaurant gehen.</em> (Aussagesatz)</p>\n\n<p><strong><em>Sollen/Wollen wir</em></strong><em> in ein Restaurant gehen?</em> (Frage)</p>\n", "ru": {"name": "Советы и рекомендации", "text": "<p>Тебе уже известны различные немецкие конструкции, с помощью которых можно формулировать советы и рекомендации. Здесь ты можешь их повторить. Кроме того, ты узнаешь, какие еще грамматические формы и выражения можно использовать в советах и рекомендациях.</p>\n\n<p>У Инге проблема. Жак не знает, как плохо она готовит.</p>\n\n<p><strong>Повелительное наклонение</strong></p>\n\n<p>Лиза советует Инге: <strong><em>Sag</em></strong><em> ihm die Wahrheit!</em></p>\n\n<p>Повелительное наклонение образуется так:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><strong>Повелительное наклонение</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Неформальная речь</td>\n\t\t\t<td>Единственное число</td>\n\t\t\t<td><em>Sag!</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Неформальная речь</td>\n\t\t\t<td>Множественное число</td>\n\t\t\t<td><em>Sagt!</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Формальная речь</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><em>Sagen Sie!</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Модальный глагол <em>könnte</em></strong></p>\n\n<p>Нико говорит: <strong><em>Du könntest</em></strong><em> das Essen bei Max und Tarek bestellen.</em></p>\n\n<p>Советы и рекомендации часто содержат в себе модальный глагол <em>k</em><em>önnen</em> в сослагательном наклонении Konjunktiv II.&#160; В сослагательном наклонении Konjunktiv II глагол <em>k</em><em>önnen</em> спрягается так:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich könn<strong><em>te</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du könn<strong><em>te</em></strong>st</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es könn<strong><em>te</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir könn<strong><em>te</em></strong>n</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr könn<strong><em>te</em></strong>t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3rd person</td>\n\t\t\t<td>sie könn<strong><em>te</em></strong>n</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie könn<strong><em>te</em></strong><em>n</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>В советах и рекомендациях обычно используются формы второго лица единственного или множественного числа, а также вежливое обращение:</p>\n\n<p><strong><em>Du könntest</em></strong><em> das Essen bei Max und Tarek bestellen.</em><br>\n<strong><em>Ihr könntet</em></strong><em> in ein Restaurant gehen.</em><br>\n<strong><em>Sie könnten</em></strong><em> einen Kochkurs besuchen.</em></p>\n\n<p>Тебе уже знакомы похожие личные формы глагола <em>sollen</em>, которые также можно использовать в советах:</p>\n\n<p><strong><em>Du könntest</em></strong><em> das Essen bei Max und Tarek bestellen.</em> (совет)<br>\n<strong><em>Du solltest</em></strong><em> das Essen bei Max und Tarek bestellen.</em> (настоятельная рекомендация)</p>\n\n<p>Формы первого лица множественного числа используются, если решение принимается сообща.</p>\n\n<p>Инге могла бы предложить Жаку:</p>\n\n<p><strong><em>Wir könnten </em></strong><em>in ein Restaurant gehen.</em> (утверждение)<br>\n<strong><em>Sollen/Wollen wir</em></strong><em> in ein Restaurant gehen?</em> (вопрос)</p>\n"}}, {"id": 39148916, "shortTitle": "Wünsche ausdrücken", "name": "Wünsche ausdrücken", "text": "<p>Du kannst Wünsche mit dem Verb <em>möchten</em> oder (<em>sich</em>) <em>wünschen</em> ausdrücken.<br>\n</p>\n\n<p>Das Verb <em>möchten</em> kann man mit einem Akkusativobjekt oder mit einem zweiten Verb im Infinitiv verwenden.</p>\n\n<p>Otto:</p>\n\n<p><em>Ich <strong>möchte</strong> ein Glas Champagner.</em></p>\n\n<p><em>Ich <strong>möchte</strong> mein Leben mit dir <strong>verbringen</strong>, Inge!</em></p>\n\n<p>Das Verb <em>wünschen</em> wird reflexiv gebraucht, wenn man sich etwas für sich selbst wünscht. Danach folgt ein Akkusativobjekt oder ein dass-Satz. Das Reflexivpronomen steht im Dativ.</p>\n\n<p><em>Ich <strong>wünsche mir</strong> eine Zukunft mit dir.</em></p>\n\n<p><em>Ich <strong>wünsche mir, dass</strong> wir zusammen glücklich sind.</em></p>\n\n\n\n<p>Viele Wünsche kann man mit dem Konjunktiv II von <em>sein</em> oder <em>haben</em> und dem Adverb <em>gern(e)</em> ausdrücken.<br>\n</p>\n\n<p><em>Nico:</em></p>\n\n<p><em>Ich <strong>wäre</strong> <strong>gerne</strong> öfter mit Selma zusammen.</em></p>\n\n<p><em>Ich <strong>hätte</strong> <strong>gerne</strong> eine gute Beziehung zu Selmas Eltern.</em></p>\n\n<p>Im Konjunktiv II konjugierst du <em>sein</em> und <em>haben</em> so:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich wäre</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du wärst<br>\n\t\t\t(du wärest)*</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es wäre</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir wären</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr wärt<br>\n\t\t\t(ihr wäret)*</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie wären</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie wären</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p>* Hier gibt es zwei Formen. Die zweite Form wird nur noch selten benutzt.<br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich hätte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du hättest</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es hätte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir hätten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr hättet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie hätten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie hätten</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Wenn man nicht <em>haben</em> oder <em>sein</em> verwendet, sondern ein anderes Verb, kann man den Konjunktiv mit <em>würde</em> + Infinitiv bilden (+ <em>gern(e)</em>).</p>\n\n<p>Selma:</p>\n\n<p><em>Ich <strong>würde</strong> <strong>gerne</strong> viel Zeit mit Nico <strong>verbringen</strong>.</em></p>\n\n<p>Das Verb <em>werden</em> wird im Konjunktiv II so konjugiert:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich würde</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du würdest</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es würde</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir würden</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr würdet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie würden</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie würden</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nUm einen Wunsch auszudrücken, kann man auch sagen: <em>Ich wünschte, ...</em> Diesen Ausdruck benutzt man, wenn man sich etwas wünscht, was nicht möglich ist. Danach muss das Verb im Konjunktiv II stehen.</p>\n\n<p>Beispiel: Nina ist schwanger. Deshalb kann sie keinen Champagner trinken.<br>\n</p>\n\n<p>Nina:</p>\n\n<p><strong><em>Ich wünschte</em></strong><em>, ich <strong>könnte</strong> jetzt auch ein Glas Champagner trinken.</em></p>\n", "ru": null}]}, {"key": "tenses", "headline": "Zeitformen", "grammars": [{"id": 39125301, "shortTitle": "Das Verb „werden“", "name": "Das Verb „werden“ (2)", "text": "<p><strong>Das Verb <em>werden</em></strong></p>\n\n<p>Das Verb <em>werden</em> wird als Vollverb&#160; und als Hilfsverb verwendet.</p>\n\n<p>1. Als Vollverb&#160;beschreibt <em>werden</em> eine Veränderung oder eine Entwicklung.</p>\n\n<p>Beispiel:</p>\n\n<p><em>Obwohl Thomas Mann ein schlechter Schüler war, <strong>wurde</strong> er ein berühmter Schriftsteller.</em><br>\n<br>\n2. Als Hilfsverb wird <em>werden</em> zum Beispiel im Passiv benutzt.</p>\n\n<p>Beispiel:</p>\n\n<p><em>Inge <strong>wurde</strong> mit sechs Jahren eingeschult.</em></p>\n\n\n\n<p><strong>Konjugation im Präteritum</strong></p>\n\n<p>Das Verb <em>werden</em> ist unregelmäßig. Deshalb verändert sich der Vokal. Im Präteritum konjugierst du <em>werden</em> so:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich w</em><strong>u</strong><em>rde</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du w</em><strong>u</strong><em>rdest</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es w</em><strong>u</strong><em>rde</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir w</em><strong>u</strong><em>rden</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr w</em><strong>u</strong><em>rdet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie w</em><strong>u</strong><em>rden</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie w</em><strong>u</strong><em>rden</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Страдательный залог", "text": "<p><strong>Страдательный залог: настоящее время </strong></p>\n\n<p>Для описания действия, происходящего в настоящий момент, в страдательном залоге используют вспомогательный глагол <em>werden</em> в настоящем времени <strong>Pr</strong><strong>ä</strong><strong>sens</strong> в сочетании с причастием Partizip II.</p>\n\n<p><em>Das Essen <strong>wird</strong> von den Kunden über eine App <strong>bestellt</strong>.</em></p>\n\n<p><em>Die Gerichte <strong>werden</strong> mit Yaras Fahrrädern <strong>ausgeliefert</strong>.</em></p>\n\n<p>Глагол <em>werden</em> неправильный. В настоящем времени Präsens <em>werden</em> спрягается так:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich werde</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du <strong><em>wirst</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es <strong><em>wird</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir werden</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr werdet</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie werden</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie werden</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Страдательный залог: простое прошедшее время </strong></p>\n\n<p>Если страдательный залог описывает действие в прошлом, можно использовать простое прошедшее время Präteritum. В страдательном залоге Präteritum образуется с помощью вспомогательного глагола <em>werden</em> в простом прошедшем времени и причастия Partizip II.</p>\n\n<p><em>Das Restaurant „Hiltl“ <strong>wurde</strong> 1907 von Ambrosius Hiltl <strong>gekauft</strong>.</em></p>\n\n<p><em>Vegetarische Gerichte <strong>wurden</strong> im Restaurant „Hiltl“ schon im Jahr 1898 <strong>angeboten</strong>.</em></p>\n\n<p>В простом прошедшем времени Präteritum глагол <em>werden</em> спрягается так:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich wurde</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du wurdest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es wurde</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir wurden</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr wurdet</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie wurden</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie wurden</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 39128130, "shortTitle": "Futur I", "name": "Futur I", "text": "<p><strong>Das Futur: die Zeitform für die Zukunft</strong></p>\n\n<p>Wenn man über die Zukunft spricht, verwendet man oft das Präsens.</p>\n\n<p><em>Morgen <strong>arbeite</strong> ich in Yaras Fahrradladen.</em></p>\n\n<p>Durch die Zeitangabe (z. B. <em>morgen</em>) versteht man, dass über die Zukunft gesprochen wird. Man braucht deshalb meistens keine Verbform für die Zukunft.</p>\n\n<p>Es gibt aber in der deutschen Sprache eine Verbform, mit der man Zukünftiges ausdrücken kann. Diese Form heißt Futur I. Man benutzt das Futur I, besonders wenn man ...</p>\n\n<ul>\n\t<li>... über Pläne spricht:<br>\n\t<em>Ich <strong>werde</strong> eine Ausbildung in Yaras Fahrradladen <strong>machen</strong>.</em><br>\n\t&#160;</li>\n\t<li>... <span class=\"editable placeholder\" data-fromselection=\"true\" data-id=\"20017065\" data-title=\"Prognose, -n (f.)\" data-type=\"GLOSSARY\" title=\"undefined\">Prognosen</span>oder Vermutungen ausdrücken will:<br>\n\t<em>Das Klima <strong>wird</strong> sich weiter <strong>erwärmen</strong>.</em><br>\n\t&#160;</li>\n\t<li>... ein Versprechen gibt:<br>\n\t<em>Ich <strong>werde</strong> jeden Tag Deutsch <strong>lernen</strong>, Tante Yara!</em></li>\n</ul>\n\n\n\n<p>Man bildet das Futur I aus dem Hilfsverb <em>werden</em> und dem Infinitiv. Auf der zweiten Position im Satz steht die konjugierte Form von <em>werden</em>:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich <strong>werde</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du <strong>wirst</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es <strong>wird</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir <strong>werden</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr <strong>werdet</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie <strong>werden</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie <strong>werden</strong></em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nAm Ende des Satzes steht der Infinitiv.</p>\n\n<p>Beispiele:</p>\n\n<p><em>Der Klimawandel <strong>wird</strong> die Natur <strong>verändern</strong>.</em></p>\n\n<p><em>Treibhausgase <strong>werden</strong> die Welt auch in Zukunft <strong>aufheizen</strong>.</em></p>\n\n\n\n<p>In Nebensätzen steht die konjugierte Form von <em>werden</em> am Satzende, also hinter dem Infinitiv.</p>\n\n<p>Beispiele:</p>\n\n<p><em>Seit vielen Jahren warnen Forscher und Forscherinnen, dass die Temperatur auf der Erde weiter <strong>steigen</strong> <strong>wird</strong>.</em></p>\n\n<p><em>Ich bin sicher, dass es in Zukunft noch mehr Trockenheit <strong>geben wird</strong>.</em></p>\n\n\n", "ru": null}, {"id": 39132746, "shortTitle": "Plusquamperfekt", "name": "Plusquamperfekt", "text": "<p><strong>Die Vorvergangenheit: das Plusquamperfekt</strong></p>\n\n\n\n<p><em>Nachdem ich den Müll in die Tonne <strong>geworfen hatte</strong>, <strong>beschwerte</strong> Frau Moll sich.</em></p>\n\n\n\n<p>Wenn du von einem Ereignis in der Vergangenheit erzählst, benutzt du normalerweise das Perfekt oder das Präteritum:</p>\n\n<p><em>Frau Moll <strong>beschwerte</strong> sich./Frau Moll <strong>hat</strong> sich <strong>beschwert</strong>.</em></p>\n\n<p>Manchmal möchtest du aber auch erzählen, was vorher passiert ist. Dann brauchst du das Plusquamperfekt. Man nennt es auch Vorvergangenheit.</p>\n\n<p><em>Ich <strong>hatte</strong> den Müll in die Tonne <strong>geworfen</strong>.</em><br>\n<br>\nDas Plusquamperfekt bildest du ähnlich wie das Perfekt. Dabei konjugierst du das Hilfsverb (<em>haben</em> oder <em>sein</em>) im Präteritum.</p>\n\n<p><em>Sie <strong>ist</strong> nach Hause <strong>gegangen</strong>. </em>(Perfekt)<br>\n<em>Sie <strong>war</strong> nach Hause <strong>gegangen</strong>. </em>(Plusquamperfekt)</p>\n\n<p><em>Sie <strong>hat</strong> mit dem Vermieter <strong>telefoniert</strong>. </em>(Perfekt)<br>\n<em>Ich <strong>hatte</strong> mit dem Vermieter <strong>telefoniert</strong>. </em>(Plusquamperfekt)</p>\n\n\n\n<p><strong>Nebensätze, die mit <em>nachdem</em> eingeleitet werden</strong></p>\n\n<p>Mit der Konjunktion <em>nachdem</em> kannst die einen Satz im Plusquamperfekt mit einem Satz im Präteritum oder im Perfekt verbinden.</p>\n\n<p>(1)<strong> Frau Moll war nach Hause gegangen.</strong><br>\n(2)<em> Frau Moll </em><strong>telefonierte</strong><em> mit Olgas Vermieter.</em></p>\n\n<p>(1)<strong> Nachdem Frau Moll nach Hause gegangen war</strong><em>, </em>(2) <strong>telefonierte</strong><em> sie mit Olgas Vermieter.</em></p>\n\n<p>oder:</p>\n\n<p>(2)<em> Frau Moll </em><strong>telefonierte</strong><em> mit Olgas Vermieter, </em>(1) <strong>nachdem sie nach Hause gegangen war</strong><em>.</em><br>\n<br>\nIm Nebensatz, der mit <em>nachdem</em> eingeleitet wird, wird das Ereignis beschrieben, das zuerst stattgefunden hat (1). Das Verb steht im <strong>Plusquamperfekt</strong>.</p>\n\n<p>Im Hauptsatz wird beschrieben, was danach passiert ist (2). Das Verb steht im <strong>Präteritum </strong>oder im <strong>Perfekt</strong>.</p>\n", "ru": null}, {"id": 40584881, "shortTitle": "Präteritum müssen, dürfen", "name": "Präteritum müssen, dürfen", "text": "<p><em>Jacques <strong>musste</strong> seinen Eltern früher viel helfen. </em></p>\n\n<p><em>Inge <strong>durfte</strong> früher erst nach der Hausarbeit spielen.</em></p>\n\n\n\n<p><strong>Präteritum</strong></p>\n\n<p><br>\nPräteritum ist eine ist eine grammatische Zeitform, mit der Vergangenes ausgedrückt wird. Man benutzt es überwiegend in der geschriebenen Sprache, z. B. in Zeitungsartikeln und Literatur. Das Präteritum der Hilfsverben <em>sein</em>, <em>haben</em> und der Modalverben wie zum Beispiel <em>müssen</em> und <em>dürfen</em> verwendet man auch in der gesprochenen Sprache.<br>\n<br>\n<strong>Präteritum der Modelverben:</strong> <strong><em>müssen, dürfen</em></strong></p>\n\n<p><br>\nMan bildet das Präteritum der Modalverben, indem man an den Verbstamm <em>-te-</em> und die Personalendung hängt. Modalverben haben im Präteritum keine Umlaute.&#160; Hier siehst du die Formen der Modalverben <em>müssen</em> und <em>dürfen</em> im Präteritum:<br>\n<br>\n<em>müssen </em>(im Präteritum)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich muss<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du muss<strong>te</strong>st</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es muss<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir muss<strong>te</strong>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr muss<strong>te</strong>t</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie muss<strong>te</strong>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie muss<strong>te</strong>n</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\n<em>dürfen </em>(im Präteritum)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich durf<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du durf<strong>te</strong>st</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es durf<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir durf<strong>te</strong>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr durf<strong>te</strong>t</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie durf<strong>te</strong>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie durf<strong>te</strong>n</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Präteritum: müssen, dürfen", "text": "<p><em>Jacques <strong>musste</strong> seinen Eltern früher viel helfen.<br>\nInge <strong>durfte</strong> früher erst nach der Hausarbeit spielen.</em></p>\n\n\n\n<p><strong>Прошедшее время Pr</strong><strong>äteritum</strong></p>\n\n<p><br>\nPräteritum – это грамматическая категория глагола, выражающая действия или состояния, имевшие место в прошлом. Используется преимущественно в письменной речи, например, в газетных статьях или художественной литературе. Прошедшее время Präteritum вспомогательных глаголов <em>sein</em>, <em>haben</em> и модальных глаголов, например, <em>m</em><em>üssen</em> и <em>d</em><em>ürfen</em> используется также в устной речи.<br>\n<br>\n<br>\n<strong>Pr</strong><strong>äteritum</strong><strong>: модальные глаголы <em>m</em></strong><strong><em>üssen</em></strong><strong><em>, d</em></strong><strong><em>ürfen</em></strong><br>\n<br>\nФормы Präteritum модальных глаголов образуются путем присоединения к основе глагола суффикса <em>-te</em><em>-</em> и личного окончания. У модальных глаголов в Präteritum &#160;нет умлаутов. &#160;Здесь представлены формы прошедшего времени Präteritum модальных глаголов <em>m</em><em>üssen</em> и <em>d</em><em>ürfen</em>:<br>\n<br>\n<em>m</em><em>üssen</em> (Präteritum)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>ich muss<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>du muss<strong>te</strong>st</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>er/sie/es muss<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>wir muss<strong>te</strong>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>ihr muss<strong>te</strong>t</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>sie muss<strong>te</strong>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><em>Sie muss<strong>te</strong>n</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><em>d</em><em>ürfen</em> (Präteritum)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>ich durf<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>du durf<strong>te</strong>st</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>er/sie/es durf<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>wir durf<strong>te</strong>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>ihr durf<strong>te</strong>t</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>sie durf<strong>te</strong>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><em>Sie durf<strong>te</strong>n</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40483970, "shortTitle": "Präteritum oder Perfekt?", "name": "Präteritum oder Perfekt?", "text": "<p>Um etwas Vergangenes auszudrücken, kann man das Präteritum oder das Perfekt verwenden. Grundsätzlich sind beide Zeitformen richtig. Meist bevorzugt man aber eine der beiden Formen.</p>\n\n<p><br>\nDas Präteritum …</p>\n\n<ul>\n\t<li>benutzt man überwiegend in der geschriebenen Sprache, z. B. in Zeitungsartikeln und in der Literatur.</li>\n\t<li>von<em> sein</em>, <em>haben</em> und den Modalverben verwendet man auch in der gesprochenen Sprache.</li>\n</ul>\n\n\n\n<p>Das Perfekt …</p>\n\n<ul>\n\t<li>wird vor allem in der gesprochenen Sprache und in informellen Texten (z. B. privaten E-Mails) verwendet.</li>\n\t<li>von <em>sein</em>, <em>haben</em> und den Modalverben verwendet man nur selten.</li>\n</ul>\n", "ru": {"name": "Präteritum или Perfekt?", "text": "<p>События и действия из прошлого можно описывать&#160;с помощью двух форм прошедшего времени: Präteritum и Perfekt. Допустимо использование обеих форм, но в различных контекстах.<br>\n&#160;</p>\n\n<p>Простое прошедшее время Präteritum…</p>\n\n<ul>\n\t<li>преобладает в письменной речи, например, в газетных статьях и в литературе.</li>\n\t<li>глаголов <em>sein</em>, <em>haben</em> и модальных глаголов употребляется и в разговорной речи.</li>\n</ul>\n\n\n\n<p>Сложное прошедшее время Perfekt…</p>\n\n<ul>\n\t<li>используется преимущественно в устной и неформальной письменной речи (например, в частных электронных сообщениях).</li>\n\t<li>глаголов <em>sein</em>, <em>haben</em> и модальных глаголов употребляется редко.</li>\n</ul>\n"}}, {"id": 40448461, "shortTitle": "Präteritum: haben", "name": "Präteritum: haben", "text": "<p>Ein Verb im Präteritum drückt aus, dass eine Handlung in der Vergangenheit stattgefunden hat. Das Präteritum des Verbs <em>sein</em> kennst du schon. Auch das Verb <em>haben</em> benutzt man oft im Präteritum, z. B. wenn man erklärt, warum man zu spät kommt:</p>\n\n<p><em>Tut mir leid, mein Auto <strong>hatte</strong> eine Panne.</em></p>\n\n<p><em>Tut mir leid, der Bus <strong>hatte</strong> Verspätung.</em></p>\n\n\n\n<p>Hier siehst du noch einmal das <strong>Präsens</strong> im Überblick:</p>\n\n<p><em>Mein Auto hat (jetzt) eine Panne.</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>&#160;ich habe</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>&#160;du hast</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>&#160;er/sie/es hat</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>&#160;wir haben</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>&#160;ihr habt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>&#160;sie haben</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell</em></td>\n\t\t\t<td>&#160;Sie haben</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n\n\n<p>Im <strong>Präteritum</strong> sehen die Formen so aus:</p>\n\n<p><em>Mein Auto hatte (gestern) eine Panne.</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>&#160;ich <strong>hatte</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>&#160;du hattest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>&#160;er/sie/es <strong>hatte</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>&#160;wir hatten</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>&#160;ihr hattet</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>&#160;sie hatten</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell</em></td>\n\t\t\t<td>&#160;Sie hatten</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>das Präsens: Das Präsens ist eine Zeitform des Verbs. Man verwendet das Präsens, wenn man über Ereignisse, Aktivitäten oder Zustände spricht, die in der Gegenwart stattfinden bzw. andauern.<br>\n\t\t\t<br>\n\t\t\tdas Präteritum: Das Präteritum ist eine Zeitform des Verbs. Man verwendet das Präteritum vor allem in der Schriftsprache, um Ereignisse, Aktivitäten oder Zustände zu beschreiben, die in der Vergangenheit stattgefunden haben. Das Präteritum bestimmter Verben, z. B. des Verbs haben, verwendet man auch in der gesprochenen Sprache.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Präteritum: глагол haben", "text": "<p>Глагол в простом прошедшем времени Präteritum описывает действие, имевшее место в прошлом.&#160;Спряжение глагола <em>sein</em> в Präteritum тебе уже известно. Глагол <em>haben</em> также часто используется в этом прошедшем времени.</p>\n\n<p>Например, если надо объяснить причины своего опоздания:</p>\n\n<p><em>Tut mir leid, mein Auto <strong>hatte</strong> eine Panne.<br>\nTut mir leid, der Bus <strong>hatte</strong> Verspätung.</em></p>\n\n\n\n<p>Еще раз посмотри, как спрягается глагол <em>haben</em> в настоящем времени <strong>Präsens</strong>:</p>\n\n<p><em>Mein Auto hat (jetzt) eine Panne.</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>&#160;ich habe</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2- е лицо</td>\n\t\t\t<td>&#160;du hast</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>&#160;er/sie/es hat</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>&#160;wir haben</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>&#160;ihr habt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>&#160;sie haben</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>&#160;Sie haben</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Спряжение глагола <em>haben</em> в прошедшем времени <strong>Präteritum</strong>:</p>\n\n<p><em>Mein Auto hatte (gestern) eine Panne.</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>&#160;ich <strong>hatte</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2- е лицо</td>\n\t\t\t<td>&#160;du hattest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>&#160;er/sie/es <strong>hatte</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>&#160;wir hatten</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>&#160;ihr hattet</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>&#160;sie hatten</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>&#160;Sie hatten</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>das Präsens: Категория времени Präsens используется, когда говорят о действиях или состояниях, совпадающих с моментом речи или постоянных по времени.</p>\n\t\t\tdas Präteritum: Категория времени<span style=\"background-color:transparent\"> Präteritum</span><span style=\"background-color:transparent\"> используется в письменной речи при описании прошедших действий или состояний. Некоторые глаголы, например, </span><em>haben</em><span style=\"background-color:transparent\">, употребляются в форме Präteritum</span><span style=\"background-color:transparent\">&#160;и в устной речи.</span></td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40586129, "shortTitle": "Präteritum: können, wollen", "name": "Präteritum: können, wollen", "text": "<p><em>Nicos Großmutter <strong>konnte</strong> nicht studieren.<br>\nSelmas Großmutter <strong>wollte</strong> zur Schule gehen.</em></p>\n\n<p>Man bildet das Präteritum der Modalverben, indem man an den Verbstamm <em>-te</em> und die Personalendung hängt. Modalverben haben im Präteritum keine Umlaute. Hier siehst du die Formen der Modalverben <em>können</em> und <em>wollen</em> im Präteritum:<br>\n<br>\n<em>können </em>(im Präteritum)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich konn<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du konn<strong>test</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es konn<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir konn<strong>ten</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr konn<strong>tet</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie konn<strong>ten</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie konn<strong>ten</strong></em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><em>wollen </em>(in simple past)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich woll<strong>te</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du woll<strong>test</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es woll<strong>te</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir woll<strong>ten</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr woll<strong>tet</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie woll<strong>ten</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie woll<strong>ten</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Präteritum:  können, wollen", "text": "<p><em>Nicos Großmutter <strong>konnte</strong> nicht studieren.<br>\nSelmas Großmutter <strong>wollte</strong> zur Schule gehen.</em></p>\n\n<p>Прошедшее время Präteritum модальных глаголов образуется путем добавления к основе инфинитива суффикса <em>-te</em> и личного окончания. У модальных глаголов в прошедшем времени Präteritum нет умлаутов. Здесь ты видишь формы модальных глаголов <em>k</em><em>önnen</em> и <em>wollen</em> в прошедшем времени Präteritum:</p>\n\n<p><br>\n<em>k</em><em>önnen</em> (Präteritum)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>ich konn<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>du konn<strong>test</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>er/sie/es konn<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>wir konn<strong>ten</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>ihr konn<strong>tet</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>sie konn<strong>ten</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><em>Sie konn<strong>ten</strong></em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><em>wollen </em>(Präteritum)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich woll<strong>te</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du woll<strong>test</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es woll<strong>te</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir woll<strong>ten</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr woll<strong>tet</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie woll<strong>ten</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie woll<strong>ten</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40619383, "shortTitle": "Präteritum: regelmäßig", "name": "Präteritum: regelmäßig (1)", "text": "<p><strong>Das Präteritum der regelmäßigen Verben</strong></p>\n\n<p><br>\nDas Präteritum ist eine Zeitform, mit der Vergangenes ausgedrückt wird. Man benutzt es überwiegend in der geschriebenen Sprache, z. B. in Zeitungsartikeln und Literatur.</p>\n\n<p><br>\nDu kennst bereits die Hilfsverben <em>sein</em> und <em>haben</em> und die Modalverben im Präteritum. Genau wie die Modalverben bilden auch andere regelmäßige Verben das Präteritum mit <em>-te-</em> nach dem Verbstamm und der Personalendung. In der ersten und der dritten Person Singular folgt nach <em>-te-</em> keine weitere Personalendung.</p>\n\n<p><br>\nEin Beispiel für ein regelmäßiges Verb ist das Verb <em>machen</em>. Es wird so konjugiert:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Präsens</td>\n\t\t\t<td>Präteritum</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person&#160;</td>\n\t\t\t<td>ich mache</td>\n\t\t\t<td>ich mach<strong>te</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person&#160;</td>\n\t\t\t<td>du machst</td>\n\t\t\t<td>du mach<strong>te</strong>st</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person&#160;</td>\n\t\t\t<td>er/sie/es macht</td>\n\t\t\t<td>er/sie/es mach<strong>te</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person&#160;</td>\n\t\t\t<td>wir machen</td>\n\t\t\t<td>wir mach<strong>te</strong>n</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person&#160;</td>\n\t\t\t<td>ihr macht</td>\n\t\t\t<td>ihr mach<strong>te</strong>t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person&#160;</td>\n\t\t\t<td>sie machen</td>\n\t\t\t<td>sie mach<strong>te</strong>n</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell</em>:</td>\n\t\t\t<td>Sie machen</td>\n\t\t\t<td>Sie mach<strong>te</strong>n</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Präteritum: правильн. глаголы", "text": "<p><strong>Спряжение правильных глаголов в прошедшем времени Pr</strong><strong>äteritum</strong></p>\n\n<p>Präteritum – это грамматическая категория глагола, выражающая действия или состояния, имевшие место в прошлом. Используется преимущественно в письменной речи, например, в газетных статьях или художественной литературе.</p>\n\n<p>Ты уже знаешь формы вспомогательных глаголов <em>sein</em> и <em>haben</em> и модальных глаголов в Präteritum. Как и модальные глаголы, правильные глаголы в Präteritum образуются путем присоединения к основе глагола суффикса <em>-te-</em> и личного окончания. В первом и третьем лице единственного числа после <em>-te-</em> &#160;личного окончания нет. &#160;</p>\n\n<p>Примером правильного глагола может служить глагол <em>machen</em>. &#160;Он спрягается так:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Настоящее время Präsens</td>\n\t\t\t<td>Прошедшее время Präteritum</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich mache</td>\n\t\t\t<td>ich mach<strong>te</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du machst</td>\n\t\t\t<td>du mach<strong>te</strong>st</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es macht</td>\n\t\t\t<td>er/sie/es mach<strong>te</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir machen</td>\n\t\t\t<td>wir mach<strong>te</strong>n</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr macht</td>\n\t\t\t<td>ihr mach<strong>te</strong>t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie machen</td>\n\t\t\t<td>sie mach<strong>te</strong>n</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie machen</td>\n\t\t\t<td>Sie mach<strong>te</strong>n</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40401653, "shortTitle": "Präteritum: sein", "name": "Präteritum: sein", "text": "<p>Das Präteritum ist eine grammatische Zeitform, mit der Vergangenes ausgedrückt wird. Es wird in der gesprochenen Sprache seltener verwendet und kommt häufiger in der geschriebenen Sprache vor, z. B. in Zeitungsartikeln und in der Literatur.</p>\n\n<p>Die Verben <em>sein</em> und <em>haben</em> werden jedoch auch in der gesprochenen Sprache oft im Präteritum verwendet.</p>\n\n<p><strong>Präsens (Gegenwart): </strong></p>\n\n\n\n<p><strong>Präteritum (Vergangenheit): </strong></p>\n\n\n\n\n\n<p>Hier siehst du noch einmal das <strong>Präsens</strong> im Überblick:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich bin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du bist</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es ist</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir sind</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr seid</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie sind</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie sind</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n<p>Im <strong>Präteritum</strong> sehen die Formen so aus:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich<strong> war</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du<strong> warst</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es<strong> war</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir<strong> waren</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr<strong> wart</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie<strong> waren</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell: </em></td>\n\t\t\t<td>Sie waren</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>das Präsens: Das Präsens ist eine Zeitform des Verbs. Man verwendet das Präsens, wenn man über Ereignisse, Aktivitäten oder Zustände spricht, die in der Gegenwart stattfinden bzw. andauern.</p>\n\t\t\tdas Präteritum: Das Präteritum ist eine Zeitform des Verbs. Man verwendet das Präteritum vor allem in der Schriftsprache, um Ereignisse, Aktivitäten oder Zustände zu beschreiben, die in der Vergangenheit stattgefunden haben. Das Präteritum bestimmter Verben, z. B. des Verbs <em>sein</em>, verwendet man auch in der gesprochenen Sprache häufig.</td>\n\t\t</tr>\n
