<script>
const DATA = [{"key": "verbs", "headline": "Verben", "grammars": [{"id": 40502636, "shortTitle": "Anweisungen", "name": "Anweisungen", "text": "<p>Es gibt verschiedene Möglichkeiten, Anweisungen auszudrücken. Eine häufige Form ist der Imperativ.</p>\n\n\n\n<p><strong>Formeller Imperativ</strong></p>\n\n<p>Wenn man eine Person mit <em>Sie</em> anspricht, verwendet man den formellen Imperativ. Man bildet den formellen Imperativ, indem man das konjugierte Verb an die erste Stelle vor das Personalpronomen setzt.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Schneiden</p>\n\t\t\t</td>\n\t\t\t<td>Sie</td>\n\t\t\t<td>\n\t\t\t<p><em>den Käse in Würfel.</em></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Legen</p>\n\t\t\t</td>\n\t\t\t<td>Sie</td>\n\t\t\t<td>\n\t\t\t<p><em>den Käse auf die Pizza.</em></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Schieben</p>\n\t\t\t</td>\n\t\t\t<td>Sie</td>\n\t\t\t<td><em>die Pizza in den Ofen.</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Infinitiv</strong></p>\n\n<p>In schriftlichen Anweisungen, z. B. in Rezepten oder Gebrauchsanweisungen, wird manchmal auch der Infinitiv verwendet. Dann lässt man das Subjekt weg. Das Verb steht im Infinitiv am Satzende.</p>\n\n<p><em>Den Käse in Würfel <strong>schneiden.</strong><br>\nDen Käse auf die Pizza<strong> legen.</strong><br>\nDie Pizza in den Ofen<strong> schieben.</strong></em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe &#160;auf Deutsch:</p>\n\n\t\t\t<p>der Infinitiv: Der Infinitiv ist die Grundform des Verbs, die nicht konjugiert ist. In dieser Form steht ein Verb normalerweise in Vokabellisten oder im Wörterbuch. Deutsche Verben enden im Infinitiv meist auf <em>-(e)n</em> .</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Указания и инструкции", "text": "<p>Существуют различные способы давать указания. Часто для этих целей используется повелительное наклонение.</p>\n\n<p><strong>Вежливая форма повелительного наклонения</strong></p>\n\n<p>При обращении на \"Вы\" повелительное наклонение надо использовать в формальном стиле с местоимением <em>Sie</em><em>. </em>Повелительное наклонение в формальном стиле образуется так: спрягаемый глагол стоит на первом месте перед личным местоимением. &#160;&#160;&#160;&#160;&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Schneiden</p>\n\t\t\t</td>\n\t\t\t<td>Sie</td>\n\t\t\t<td>\n\t\t\t<p><em>den Käse in Würfel.</em></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Legen</p>\n\t\t\t</td>\n\t\t\t<td>Sie</td>\n\t\t\t<td>\n\t\t\t<p><em>den Käse auf die Pizza.</em></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Schieben</p>\n\t\t\t</td>\n\t\t\t<td>Sie</td>\n\t\t\t<td><em>die Pizza in den Ofen.</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Инфинитив</strong></p>\n\n<p>В письменных указаниях, например, в рецептах или инструкциях, иногда используют&#160; инфинитив. В таком случае в предложении опускается подлежащее. Глагол в инфинитиве стоит в конце предложения.</p>\n\n<p><em>Den Käse in Würfel <strong>schneiden.</strong><br>\nDen Käse auf die Pizza<strong> legen.</strong><br>\nDie Pizza in den Ofen<strong> schieben.</strong></em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>der Infinitiv: Инфинитив – это начальная, неспрягаемая форма глагола. Обычно&#160;именно в этой форме глаголы стоят в словарях. Как правило, немецкие глаголы в инфинитиве заканчиваются на <em>-(e)n</em>.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 39134268, "shortTitle": "brauchen + zu + Infinitiv", "name": "brauchen + zu + Infinitiv", "text": "<p><em>EU-Bürger <strong>brauchen</strong> an der Grenze <strong>keinen</strong> Pass <strong>zu</strong> <strong>zeigen</strong>.</em></p>\n\n<p><br>\nIn einem Satz mit Verneinung kannst du <em>brauchen</em> wie ein Modalverb verwenden. Es bedeutet dann <em>nicht müssen</em>.</p>\n\n<p><em>EU-Bürger <strong>brauchen</strong> an der Grenze <strong>nicht</strong> <strong>zu</strong> <strong>warten</strong>.</em></p>\n\n<p><em>= EU-Bürger <strong>müssen</strong> an der Grenze <strong>nicht</strong> <strong>warten</strong>.</em></p>\n\n\n\n<p><strong><em>brauchen</em> + <em>nicht/kein</em> + <em>zu</em> + Infinitiv</strong></p>\n\n<p>Nach <em>brauchen</em> steht das zweite Verb im Infinitiv. Vor dem Infinitiv steht <strong><em>zu</em></strong>.</p>\n\n<p><em>EU-Bürger brauchen in den meisten EU-Ländern kein Geld <strong>zu</strong> wechseln.</em></p>\n\n\n\n<p><strong><em>müssen</em> + <em>nicht/kein</em> + Infinitiv</strong></p>\n\n<p>Nach <em>müssen</em> steht das zweite Verb im Infinitiv. Vor dem Infinitiv steht <strong>kein</strong> <strong><em>zu</em></strong>.</p>\n\n<p><em>= EU-Bürger müssen in den meisten EU-Ländern kein Geld wechseln.</em></p>\n", "ru": null}, {"id": 40584505, "shortTitle": "Das Verb „werden“", "name": "Das Verb „werden“ (1)", "text": "<p><em>Nico will kein Ingenieur<strong> werden.</strong><br>\nWas willst du<strong> werden? </strong>Willst du gern Koch<strong> werden? </strong></em></p>\n\n\n\n<p>Das Verb <em>werden</em> kann als Hilfsverb oder als Vollverb verwendet werden. Als Hilfsverb braucht man es&#160; z. B., um Aussagen über die Zukunft zu machen.</p>\n\n<p>Als Vollverb drückt <em>werden</em> eine Entwicklung oder Veränderung aus:<br>\n<em>Die Kinder werden größer. </em>(Sie wachsen schnell.)</p>\n\n<p>Besonders häufig verwendet man <em>werden</em>, um einen Berufswunsch auszudrücken.<br>\n<em>Helene will Journalistin werden.</em> (Sie studiert noch.)&#160;</p>\n\n<p>Das Verb <em>werden</em> ist unregelmäßig. Hier siehst du die Formen im Präsens:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich&#160;<strong>werde</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du&#160;<strong>wirst</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es&#160;<strong>wird</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir&#160;<strong>werden</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr&#160;<strong>werdet</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie&#160;<strong>werden</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Formell</em></td>\n\t\t\t<td><em>Sie&#160;<strong>werden</strong></em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Das Perfekt bildet das Verb <em>werden</em> mit dem Hilfsverb <em>sein</em>. Das Partizip II ist unregelmäßig und lautet <em>geworden</em>.</p>\n\n<p><em>Helene <strong>ist </strong>Journalistin <strong>geworden</strong>.<br>\nDie Kinder <strong>sind</strong> größer <strong>geworden</strong>.</em></p>\n", "ru": {"name": "Глагол werden", "text": "<p><em>Nico will kein Ingenieur<strong> werden.</strong><br>\nWas willst du<strong> werden? </strong>Willst du gern Koch<strong> werden? </strong></em></p>\n\n\n\n<p>Глагол <em>werden</em> может быть смысловым и вспомогательным. Как вспомогательный глагол он используется, например, в высказываниях о будущем.</p>\n\n<p>Как самостоятельный глагол <em>werden</em> выражает развитие или изменение:</p>\n\n<p><em>Die Kinder werden größer. </em>(Дети быстро растут.)</p>\n\n<p>Особенно часто глагол <em>werden</em> используется в высказываниях о будущей профессии.</p>\n\n<p><em>Helene will Journalistin werden.</em> (Она еще учится.)&#160;</p>\n\n<p>Глагол <em>werden</em> неправильный. Здесь ты видишь его личные формы в настоящем времени:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>ich&#160;<strong>werde</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>du&#160;<strong>wirst</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>er/sie/es&#160;<strong>wird</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>wir&#160;<strong>werden</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>ihr&#160;<strong>werdet</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>sie&#160;<strong>werden</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><em>Sie&#160;<strong>werden</strong></em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Формы прошедшего времени Perfekt глагол <em>werden</em> образует с помощью вспомогательного глагола <em>sein</em>. Причастие Partizip II <em>geworden</em> образуется не по общим правилам.</p>\n\n<p><em>Helene <strong>ist </strong>Journalistin <strong>geworden</strong>.<br>\nDie Kinder <strong>sind</strong> größer <strong>geworden</strong>.</em></p>\n"}}, {"id": 40532598, "shortTitle": "gehen + Infinitiv", "name": "gehen + Infinitiv", "text": "<p><strong><em>Gehst</em></strong><em> du gerne <strong>schwimmen</strong>? – Ja, ich <strong>gehe</strong> gerne <strong>schwimmen</strong>.</em></p>\n\n<p>Wenn man ausdrücken will, dass man einen Ort verlässt, um an einem anderen Ort etwas zu tun, kombiniert man manchmal das Verb <em>gehen</em> mit einem zweiten Verb. Es gibt eine Reihe von festen Verbkombinationen, die nach diesem Muster gebildet werden:</p>\n\n<p><em>arbeiten gehen<br>\neinkaufen gehen<br>\nspazieren gehen<br>\nangeln gehen<br>\nschwimmen gehen<br>\nschlafen gehen</em></p>\n\n<p>Bei diesen Ausdrücken &#160;wird <em>gehen</em> konjugiert. Das zweite Verb steht als Infinitiv am Satzende.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Ich</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><strong><em>gehe</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>morgen&#160;<strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Inge</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><strong><em>geht</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>im Park&#160;<strong><em>spazieren.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Wir</td>\n\t\t\t<td><strong><em>gehen</em></strong></td>\n\t\t\t<td>gerne&#160;<strong><em>angeln.</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "gehen + инфинитив", "text": "<p><strong><em>Gehst</em></strong><em> du gerne <strong>schwimmen</strong>? – Ja, ich <strong>gehe</strong> gerne <strong>schwimmen</strong>.</em></p>\n\n<p>Если нужно сказать, что покидаешь какое-либо место, для того, чтобы заняться чем-то в другом месте, можно использовать глагол <em>gehen</em> со вторым глаголом. Существует целый ряд глагольных конструкций, формируемых по такому образцу:</p>\n\n<p><em>arbeiten gehen<br>\neinkaufen gehen<br>\nspazieren gehen<br>\nangeln gehen<br>\nschwimmen gehen<br>\nschlafen gehen</em></p>\n\n<p>В этих словосочетаниях <em>gehen</em> спрягается. Второй глагол в инфинитиве стоит в конце предложения.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Ich</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><strong><em>gehe</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>morgen&#160;<strong><em>arbeiten.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Inge</p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><strong><em>geht</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>im Park&#160;<strong><em>spazieren.</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Wir</td>\n\t\t\t<td><strong><em>gehen</em></strong></td>\n\t\t\t<td>gerne&#160;<strong><em>angeln.</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40462960, "shortTitle": "Imperativ: formell", "name": "Imperativ: formell", "text": "<p>Mit dem Imperativ drückt man eine Bitte, eine Aufforderung oder einen Befehl aus. Man benutzt diese Form zum Beispiel, um jemandem zu erklären, wie er zu einem bestimmten Ort gelangt. Wenn man eine Person mit <em>Sie</em> anspricht, verwendet man den formellen Imperativ.</p>\n\n\n\n<p>Man bildet den formellen Imperativ, indem man das konjugierte Verb an die erste Stelle vor das Personalpronomen setzt.</p>\n\n<p>Aussagesatz:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Sie</em></td>\n\t\t\t<td><strong><em>gehen</em></strong></td>\n\t\t\t<td><em>geradeaus.</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Sie</em></td>\n\t\t\t<td><strong><em>überqueren</em></strong></td>\n\t\t\t<td><em>den Schillerplatz.</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nImperativsatz:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p><strong><em>Gehen</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><em>Sie</em></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><em>geradeaus.</em></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong><em>Überqueren</em></strong></td>\n\t\t\t<td>\n\t\t\t<p><em>Sie</em></p>\n\t\t\t</td>\n\t\t\t<td><em>den Schillerplatz.</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n<p>Das Verb <em>sein</em> ist im Imperativ unregelmäßig:</p>\n\n<p>Aussagesatz: <em>Sie <strong>sind</strong> pünktlich.</em></p>\n\n<p>Imperativsatz: <strong><em>Seien</em></strong><em> Sie pünktlich.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\t\t\t<span class=\"invalid_placeholder\">der Imperativ</span>: Der Imperativ ist eine spezielle Form des Verbs. Mit dem Imperativ drückt man eine Bitte, eine Aufforderung oder einen Befehl aus.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Императив: формальная речь", "text": "<p>Повелительное наклонение выражает просьбу, побуждение к действию или приказ. В этой форме объясняют, например, как пройти куда-то. В формальном стиле повелительное наклонение используется, если к адресату обращаются на \"Вы\".</p>\n\n\n\n<p>В формальной речи спрягаемый глагол в повелительном наклонении стоит в предложениях на первом месте, перед личным местоимением.</p>\n\n\n\n<p>Повествовательное предложение:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Sie</em></td>\n\t\t\t<td><strong><em>gehen</em></strong></td>\n\t\t\t<td><em>geradeaus.</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Sie</em></td>\n\t\t\t<td><strong><em>überqueren</em></strong></td>\n\t\t\t<td><em>den Schillerplatz.</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nПобудительное предложение:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p><strong><em>Gehen</em></strong></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><em>Sie</em></p>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t<p><em>geradeaus.</em></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong><em>Überqueren</em></strong></td>\n\t\t\t<td>\n\t\t\t<p><em>Sie</em></p>\n\t\t\t</td>\n\t\t\t<td><em>den Schillerplatz.</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n<p>Глагол <em>sein</em> в повелительном наклонении спрягается как неправильный:</p>\n\n<p>Повествовательное предложение: <em>Sie</em> <strong><em>sind</em></strong> <em>p</em><em>ü</em><em>nktlich</em><em>.</em></p>\n\n<p>Побудительное предложение: <strong><em>Seien</em></strong> <em>Sie</em> <em>p</em><em>ü</em><em>nktlich</em><em>.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические&#160; термины немецкого языка:</p>\n\n\t\t\t<p>der Imperativ: Повелительное наклонение – одна из форм глагола, выражающая&#160;модальность. Повелительное наклонение&#160;выражает просьбу, побуждение к действию или приказ.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40504800, "shortTitle": "Imperativ: informell ", "name": "Imperativ: informell", "text": "<p><strong>Informeller Imperativ: Singular</strong></p>\n\n<p><strong>a) Formen ohne Endung</strong></p>\n\n<p>Im informellen Imperativ unterscheidet man eine Singularform und eine Pluralform. Die Singularform wird aus der Verbform der 2. Person Singular Präsens gebildet. Das Personalpronomen und die Personalendung <em>-st</em> lässt man weg. Bei Verben, deren Stamm auf <em>-s, -ß, -z</em> oder <em>-x</em> endet, wird nur das <em>-t</em> weggelassen. &#160;Im Singular hat der informelle Imperativ also meist keine Endung.<br>\n&#160;</p>\n\n<p><em>(Du) mach(st) viel Sport. -&gt; </em><strong>I<strong>mperati</strong>v:</strong><em> <strong>Mach</strong> viel Sport!</em></p>\n\n<p><em>(Du) geh(st) oft spazieren. -&gt; </em><strong>Imperativ:</strong><em> <strong>Geh</strong> oft spazieren!</em></p>\n\n<p><em>(Du) putz(t) regelmäßig die Zähne. -&gt;<strong> </strong></em><strong>Imperativ:</strong><em><strong> Putz</strong> regelmäßig die Zähne!</em></p>\n\n<p><em>(Du) iss(t) mehr Obst. -&gt; </em><strong>Imperativ:<em> Iss</em></strong><em> mehr Obst!</em></p>\n\n<p>Verben mit einem Vokalwechsel von <strong>a</strong> zu&#160;<strong>ä</strong><em>&#160;haben im&#160;Imperativ keinen Umlaut</em>.</p>\n\n<p><em>(Du) f<strong>ä</strong>hr(st) mit dem Fahrrad zur Arbeit. -&gt; </em><strong>I<strong>m</strong>perativ:<em> Fahr</em></strong><em> mit dem Fahrrad zur Arbeit!</em></p>\n\n<p><em>(Du) schl<strong>ä</strong>f(st) genug. -&gt;</em><strong><em> </em>I<strong>m</strong>perativ: <em>Schlaf</em></strong><em> genug!</em></p>\n\n\n\n<p><strong>b) Sonderformen mit Endung -e</strong></p>\n\n<p>Viele Imperativformen kann man auch mit der Endung <em>-e</em> bilden. Oft ist es nur ein stilistischer Unterschied, ob man sagt:&#160;</p>\n\n<p><em>Mach jeden Tag Sport!&#160;</em><br>\noder:&#160;<br>\n<em>Mache jeden Tag Sport!</em><br>\n&#160;<br>\nDie erste Variante ist in der gesprochenen Sprache üblicher . Die zweite Variante findet man vor allem in der Schriftsprache. Manche Imperativformen klingen altmodisch oder belehrend, wenn man sie mit der Endung <em>-e</em> bildet.</p>\n\n<p>Wenn das Verb in der zweiten Person Singular die Endung <em>-est</em> hat, bleibt das <em>-e </em>im Imperativ stehen.&#160;</p>\n\n<p><em>(Du) arbeite(st) nicht zu viel. -&gt; </em><strong>Imperativ:</strong> <em><strong>Arbeite </strong>nicht zu viel!<br>\n(Du) öffne(st) das Fenster. -&gt;<strong> </strong></em><strong>Imperativ:</strong> <em><strong>Öffne </strong>das Fenster!</em></p>\n\n<p>Bei einem Vokalwechsel von <em>e</em> zu <em>i</em> (z. B. <em>essen</em> -&gt; <em>Iss!</em>) kann man die Endung <em>-e</em> nicht verwenden.&#160;</p>\n\n\n\n<p><strong>Informeller Imperativ: Plural</strong></p>\n\n<p>Wenn man mit dem Imperativ mehrere Personen ansprechen möchte, verwendet man die Pluralform. Diese bildet man aus der 2. Person Plural Präsens. Das Personalpronomen fällt weg, aber die Endung bleibt unverändert.</p>\n\n<p><em>(Ihr) macht viel Sport. -&gt; </em><strong>Imperativ:<em> Macht</em></strong><em> viel Sport!</em></p>\n\n<p><em>(Ihr) esst mehr Obst. -&gt; </em><strong>Imperativ:<em> Esst</em></strong><em> mehr Obst! </em></p>\n\n<p><em>(Ihr) fahrt mit dem Fahrrad zur Arbeit. -&gt; </em><strong>Imperativ:<em> Fahrt</em></strong><em> mit dem Fahrrad zur Arbeit!</em></p>\n\n<p><em>(Ihr) arbeitet nicht zu viel. -&gt; </em><strong>Imperativ:<em> Arbeitet</em></strong><em> nicht zu viel.</em></p>\n\n\n\n<p><strong>Überblick: Imperativ&#160;</strong></p>\n\n<p>Die regelmäßigen Formen des Imperativs sehen so aus:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>informell (Singular)</td>\n\t\t\t<td><strong><em>Trink(e)</em></strong><em> viel Wasser!</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>informell (Plural)</td>\n\t\t\t<td><strong><em>Trinkt</em></strong><em> viel Wasser!</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>formell</td>\n\t\t\t<td><strong><em>Trinken Sie</em></strong><em> viel Wasser!</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Unregelmäßig sind die Formen des Verbs <em>sein</em>:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>informell (Singular)</td>\n\t\t\t<td><strong><em>Sei </em></strong><em>fair!</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>informell (Plural)</td>\n\t\t\t<td><strong><em>Seid </em></strong><em>fair!</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>formell</td>\n\t\t\t<td><strong><em>Seien </em></strong><em>Sie fair!</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>der Imperativ: Der Imperativ ist eine spezielle Form des Verbs. Mit dem Imperativ drückt man eine Bitte, eine Aufforderung oder einen Befehl aus.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Повелительное наклонение", "text": "<p><strong>Повелительное наклонение в неформальной речи: единственное число</strong></p>\n\n<p><strong>а) Формы без окончаний</strong></p>\n\n<p>В неформальной речи существуют формы единственного и множественного числа повелительного наклонения. Форма единственного числа образуется из глагольной формы второго лица единственного числа настоящего времени. Личное местоимение и личное окончание <em>-</em><em>st</em> опускают. В глаголах, корень которых заканчивается на -<em>s</em>, -<em>ß</em>, -<em>z</em> или<em> -</em><em>x</em> &#160;опускается только -<em>t</em><em>.&#160; </em>Получается, что формы повелительного наклонения единственного числа в неформальной речи почти всегда не имеют окончаний.</p>\n\n<p><em>(Du) mach(st) viel Sport. -&gt; </em><strong>Imperativ:</strong><em> <strong>Mach</strong> viel Sport!</em></p>\n\n<p><em>(Du) geh(st) oft spazieren. -&gt; </em><strong>Imperativ:</strong><em> <strong>Geh</strong> oft spazieren!</em></p>\n\n<p><em>(Du) putz(t) regelmäßig die Zähne. -&gt; <strong>Imperativ: Putz</strong> regelmäßig die Zähne!</em></p>\n\n<p><em>(Du) iss(t) mehr Obst. -&gt; </em><strong>Imperativ:<em> Iss</em></strong><em> mehr Obst!</em></p>\n\n<p>В глаголах с умлаутом <em>a</em><em> -</em> <em>ä</em> в повелительном наклонении не происходит изменения корневой гласной начальной формы слова.</p>\n\n<p><em>(Du) f<strong>ä</strong>hr(st) mit dem Fahrrad zur Arbeit. -&gt; </em><strong>Imperativ:<em> Fahr</em></strong><em> mit dem Fahrrad zur Arbeit!</em></p>\n\n<p><em>(Du) schl<strong>ä</strong>f(st) genug. -&gt; </em><strong>Imperativ: <em>Schlaf</em></strong><em> genug!</em></p>\n\n\n\n<p><strong>b</strong><strong>) Особые формы с окончанием </strong><strong><em>-</em></strong><strong><em>e</em></strong></p>\n\n<p>Повелительное наклонение образуются также при помощи окончания <em>-</em><em>e</em>. Различие между формами стилистическое:</p>\n\n<p><em>Mach jeden Tag Sport!</em></p>\n\n<p>или:</p>\n\n<p><em>Mach<strong>e</strong></em> <em>jeden</em> <em>Tag</em> <em>Sport</em><em>!</em></p>\n\n<p>Первый вариант часто встречается в разговорной речи. Второй вариант характерен для письменной речи. Некоторые формы повелительного наклонения, образованные при помощи окончания <em>-</em><em>e</em>, звучат старомодно или поучительно.</p>\n\n<p>Если во втором лице единственного числа у глагола окончание <em>-</em><em>est</em>, в повелительном наклонении сохраняется <em>-</em><em>e</em>.</p>\n\n<p><em>(Du) arbeit<strong>e</strong>(st) nicht zu viel. -&gt; </em><strong>Imperativ: </strong><em>Arbeit<strong>e</strong> nicht zu viel!</em></p>\n\n<p><em>(Du) öffn<strong>e</strong>(st) das Fenster. -&gt; </em><strong>Imperativ:</strong><em> Öffn<strong>e</strong> das Fenster!</em></p>\n\n<p>При изменении корневой гласной с <em>e</em> на <em>i</em> (напр. <em>essen</em> -&gt; <em>Iss</em><em>!</em>) окончание <em>-</em><em>e</em> не используется.</p>\n\n\n\n<p><strong>Повелительное наклонение в неформальной речи: множественное число</strong></p>\n\n<p>Если в повелительном наклонении обращаются к нескольким лицам, используют форму множественного числа. Ее образуют из глагольной формы второго лица множественного числа настоящего времени. Личное местоимение опускают, а окончание остается неизменным.</p>\n\n<p><em>(</em><em>Ihr</em><em>) </em><em>macht</em> <em>viel</em> <em>Sport</em><em>. -&gt; </em><strong>Imperativ</strong><strong>: </strong><strong><em>Macht</em></strong> <em>viel</em> <em>Sport</em><em>!</em></p>\n\n<p><em>(Ihr) esst mehr Obst. -&gt; </em><strong>Imperativ:<em> Esst</em></strong><em> mehr Obst! </em></p>\n\n<p><em>(Ihr) fahrt mit dem Fahrrad zur Arbeit. -&gt; </em><strong>Imperativ:<em> Fahrt</em></strong><em> mit dem Fahrrad zur Arbeit!</em></p>\n\n<p><em>(Ihr) arbeitet nicht zu viel. -&gt; </em><strong>Imperativ:<em> Arbeitet</em></strong><em> nicht zu viel.</em></p>\n\n\n\n<p><strong>Обзор: Повелительное наклонение</strong></p>\n\n<p>Общие правила образования повелительного наклонения:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Неформальная речь (ед. число)</td>\n\t\t\t<td><strong><em>Trink(e)</em></strong><em> viel Wasser!</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Неформальная речь (мн. число)</td>\n\t\t\t<td><strong><em>Trinkt</em></strong><em> viel Wasser!</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Вежливое&#160;обращение:</td>\n\t\t\t<td><strong><em>Trinken Sie</em></strong> <em>viel Wasser!</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Формы повелительного наклонения глагола <em>sein</em> образуются не по общим правилам:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t</tbody>\n</table>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Неформальная речь (ед. число)</td>\n\t\t\t<td><strong><em>Sei </em></strong><em>fair!</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Неформальная речь (мн. число)</td>\n\t\t\t<td><strong><em>Seid </em></strong><em>fair!</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Вежливое&#160;обращение:</td>\n\t\t\t<td><strong><em>Seien </em></strong><em>Sie fair!</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\t\t\tder Imperativ: Повелительное наклонение – одна из форм глагола, выражающая модальность. Повелительное наклонение выражает просьбу, побуждение к действию или приказ.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40331765, "shortTitle": "Konjugation Präsens", "name": "Konjugation Präsens (2)", "text": "<p>Das Präsens ist die Gegenwartsform des Verbs. Im Präsens werden die meisten Verben wie folgt konjugiert:</p>\n\n<p>Beispiel: <em>kommen</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><strong>ich</strong> komm<strong>e</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><strong>du</strong> komm<strong>st</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><strong>er</strong>/<strong>sie</strong>/<strong>es </strong>komm<strong>t</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><strong>wir </strong>komm<strong>en</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><strong>ihr</strong> komm<strong>t</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><strong>sie </strong>komm<strong>en</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>formell:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><strong>Sie </strong>komm<strong>en</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><br>\nDie 3. Person Plural und die formelle Anrede unterscheiden sich nur durch die Großschreibung Sie bei der formellen Anrede.&#160;</p>\n\n<p>Wenn der Stamm eines Verbs auf <em>-d</em> oder <em>-t</em> endet, wird in der 2. und 3. Person Singular sowie in der 2. Person Plural vor der Personalendung ein <em>-e-</em> eingefügt.</p>\n\n\n\n<p>Beispiel: <em>arbeiten</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><strong>ich</strong> arbeit<strong>e</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><strong>du</strong> arbeit<strong>e</strong><strong>st</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><strong>er</strong>/<strong>sie</strong>/<strong>es </strong>arbeit<em><strong>e</strong></em><strong>t</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><strong>wir </strong>arbeit<strong>en</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><strong>ihr</strong> arbeit<em><strong>e</strong></em><strong>t</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><strong>sie </strong>arbeit<strong>en</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>formell:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><strong>Sie </strong>arbeit<strong>en</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n<p>Manche Verben werden unregelmäßig konjugiert.</p>\n\n<p>Example: <em>sein</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><strong>ich bin</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><strong>du bist</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><strong>er/sie/es ist</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><strong>wir sind</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><strong>ihr seid</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><strong>sie sind</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>formell:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><strong>Sie sind</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Спряжение в Präsens", "text": "<p>Категория настоящего времени немецких глаголов называется Präsens. Большинство глаголов спрягаются в настоящем времени следующим образом:</p>\n\n<p>Пример:&#160;<em>kommen</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><strong>ich</strong> komm<strong>e</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong>du</strong> komm<strong>st</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><strong>er</strong>/<strong>sie</strong>/<strong>es </strong>komm<strong>t</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><strong>wir </strong>komm<strong>en</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong>ihr</strong> komm<strong>t</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><strong>sie </strong>komm<strong>en</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><strong>Sie </strong>komm<strong>en</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Третье лицо&#160;множественного&#160;числа и официальное обращение различаются только&#160;написанием&#160;–&#160;в вежливой форме <em>Sie</em> пишется&#160;с большой буквы.</p>\n\n<p>Если основа глагола оканчивается на <em>-d</em> или <em>–</em>t, во втором и третьем лице единственного&#160;числа, а также во втором лице множественного&#160;числа перед личным окончанием &#160;добавляется <em>-</em><em>e-</em>.</p>\n\n\n\n<p>Пример: <em>arbeiten</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><strong>ich</strong> arbeit<strong>e</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong>du</strong> arbeit<strong><em>e</em>st</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><strong>er</strong>/<strong>sie</strong>/<strong>es </strong>arbeit<strong><em>e</em>t</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><strong>wir </strong>arbeit<strong>en</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong>ihr</strong> arbeit<strong><em>e</em>t</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><strong>sie </strong>arbeit<strong>en</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><strong>Sie </strong>arbeit<strong>en</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n<p>Иначе спрягаются неправильные глаголы.</p>\n\n<p>Пример:&#160; <em>sein</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><strong>ich bin</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong>du bist</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><strong>er/sie/es ist</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><strong>wir sind</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong>ihr seid</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><strong>sie sind</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><strong>Sie sind</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40561233, "shortTitle": "Konjugation: bügeln", "name": "Konjugation: bügeln", "text": "<p><strong>Verben, die auf <em>-eln</em> enden</strong></p>\n\n<p>Verben, die im Infinitiv auf <em>-eln</em> enden, haben eine Besonderheit: In der ersten Person Singular entfällt das <em>-e-</em>, das <strong>vor</strong> der Personalendung steht. Man könnte auch sagen: Das <em>-e-</em> des Verbstamms „wandert“ als Personalendung ans Ende.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1st person</td>\n\t\t\t<td>ich <em>büg<strong>le</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2nd person</td>\n\t\t\t<td>du bügelst</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3rd person</td>\n\t\t\t<td>er/sie/es bügelt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1st person</td>\n\t\t\t<td>wir bügeln</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2nd person</td>\n\t\t\t<td>ihr bügelt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3rd person</td>\n\t\t\t<td>sie bügeln</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie bügeln</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Спряжение: bügeln", "text": "<p><strong>Глаголы</strong> <strong>на</strong> <strong><em>-eln</em></strong></p>\n\n<p>Глаголы, оканчивающиеся в инфинитиве на <strong><em>-</em></strong><em>eln</em>, имеют одну особенность: в единственном числе первого лица исчезает <em>-e- </em><strong>перед</strong> личным окончанием. Можно также сказать, что корневая <em>-e- </em>\"перебирается\" в конец слова и становится личным окончанием.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich <em>büg<strong>le</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du bügelst</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es bügelt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir bügeln</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr bügelt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie bügeln</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie bügeln</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40377995, "shortTitle": "Konjugation: haben", "name": "Konjugation: haben", "text": "<p><em>Welche Nummer <strong>hast</strong> du? – Ich <strong>habe</strong> die Nummer vier, eins, acht, sieben. </em></p>\n\n\n\n\n\n<p><strong>Konjugation des Verbs <em>haben</em></strong></p>\n\n<p>Das Verb <em>haben</em> ist in der 2. und 3. Person Singular unregelmäßig: Das <em>b</em> fällt weg.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich habe</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du <strong>hast</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es <strong>hat</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir haben</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr habt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie haben</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie haben</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n\n", "ru": {"name": "Спряжение: haben", "text": "<p><em>Welche Nummer <strong>hast</strong> du? – Ich <strong>habe</strong> die Nummer vier, eins, acht, sieben.</em></p>\n\n\n\n<p><strong>Спряжение </strong><strong>глагола <em>haben</em></strong></p>\n\n<p>Глагол <em>haben</em> во втором и третьем лице единственного числа спрягается как неправильный: согласная <em>b</em> исчезает.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich habe</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du <strong>hast</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es <strong>hat</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir haben</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr habt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie haben</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie haben</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n\n"}}, {"id": 40459342, "shortTitle": "Konjugation: können ", "name": "Konjugation: können", "text": "<p><strong><em>Kannst</em></strong><em> du am Montag? – Nein, am Montag <strong>kann</strong> ich nicht.</em></p>\n\n<p>Das Verb <em>können</em> gehört zu einer Gruppe besonderer Verben, die „Modalverben“ heißen. Diese Verben werden anders konjugiert als die Verben, die du schon kennst:</p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span>Modalverben haben im Singular oft einen anderen Vokal als im Plural.</li>\n\t<li><span dir=\"LTR\"></span>Die Form der ersten und der dritten Person Singular ist gleich: Das Verb hat keine Endung.</li>\n</ul>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular: </em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>&#160;ich <em>k<strong>a</strong>nn</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>&#160;du <em>k<strong>a</strong>nnst</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>&#160;er/sie/es <em>k<strong>a</strong>nn</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>&#160;wir können</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>&#160;ihr könnt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>&#160;sie können</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>&#160;Sie können</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Спряжение: können", "text": "<p><strong><em>Kannst</em></strong><em> du am Montag? – Nein, am Montag <strong>kann</strong> ich nicht.</em></p>\n\n<p>Глагол <em>k</em><em>ö</em><em>nnen</em> относится к группе модальных глаголов. Эти глаголы спрягаются иначе, нежели уже известные тебе глаголы.</p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span>У модальных глаголов в единственном и множественном числе в корне происходит чередование гласной.</li>\n\t<li><span dir=\"LTR\"></span>Формы первого и третьего лица единственного числа одинаковы: у глагола нет окончания.</li>\n</ul>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число: </em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>&#160;ich <em>k<strong>a</strong>nn</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>&#160;du <em>k<strong>a</strong>nnst</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>&#160;er/sie/es <em>k<strong>a</strong>nn</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е &#160;лицо</td>\n\t\t\t<td>&#160;wir können</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е &#160;лицо</td>\n\t\t\t<td>&#160;ihr könnt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е &#160;лицо</td>\n\t\t\t<td>&#160;sie können</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>&#160;Sie können</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40400943, "shortTitle": "Konjugation: lesen", "name": "Konjugation: lesen", "text": "<p><strong><em>Liest</em></strong><em> du gern? – Ja, ich <strong>lese</strong> gern.</em></p>\n\n<p>Ähnlich wie bei anderen Verben verändert sich bei der Konjugation des Verbs lesen der Stammvokal in der 2. und 3. &#160;Person Singular. Aus dem Stammvokal e wird ein ie. Man spricht das ie wie ein langes i aus.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich lese</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du liest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es liest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir lesen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr lest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie lesen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell</em></td>\n\t\t\t<td>Sie lesen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Спряжение: lesen", "text": "<p><strong><em>Liest</em></strong><em> du gern? – Ja, ich <strong>lese</strong> gern.</em></p>\n\n<p>Так же, как и в других глаголах подобного типа, в корне глагола <em>lesen</em> при спряжении происходит чередование гласных: во втором и третьем лице единственного числа <em>e</em> меняется на <em>ie</em>. Сочетание гласных <em>ie</em> произносится как долгий звук <em>i</em>.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich lese</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du liest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es liest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir lesen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr lest</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie lesen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie lesen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40468147, "shortTitle": "Konjugation: mögen", "name": "Konjugation: mögen", "text": "<p><strong>Magst</strong> du Kohlrabi? – Nein, ich <strong>mag</strong> <em>keinen Kohlrabi</em><strong>.</strong></p>\n\n<p>Das Verb <em>mögen</em> gehört zur Gruppe der Modalverben. Anders als andere Verben wird es in dieser Form aber meist nicht mit einem zweiten Verb im Infinitiv kombiniert, sondern mit einem Akkusativobjekt.</p>\n\n<p>Wie bei den Modalverben <em>können</em>, <em>müssen</em> und <em>wollen</em> ändert sich der Stammvokal im Singular.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich m<strong>a</strong>g</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du &#160;m<strong>a</strong>gst</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es m<strong>a</strong>g</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir mögen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr mögt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie mögen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie mögen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Спряжение: mögen", "text": "<p><strong>Magst</strong> du Kohlrabi? – Nein, ich <strong>mag</strong> <em>keinen Kohlrabi</em><strong>.</strong></p>\n\n<p>Глагол <em>m</em><em>ö</em><em>gen</em> относится к группе модальных глаголов. В отличие от других модальных глаголов он обычно используется не со вторым глаголом, а с прямым дополнением.</p>\n\n<p>Как и у глаголов <em>k</em><em>ö</em><em>nnen</em>, <em>m</em><em>ü</em><em>ssen</em> и <em>wollen</em><em>,</em> в единственном числе у него изменяется корневая гласная.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число: </em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich m<strong>a</strong>g</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du &#160;m<strong>a</strong>gst</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es m<strong>a</strong>g</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir mögen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr mögt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie mögen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое&#160;обращение:</em></td>\n\t\t\t<td>Sie mögen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40400581, "shortTitle": "Konjugation: sprechen", "name": "Konjugation: sprechen ", "text": "<p><em>Welche Sprachen <strong>sprichst</strong> du, Lisa? – Ich <strong>spreche</strong> Deutsch, Englisch und Italienisch.</em></p>\n\n<p>Wie <em>essen</em> und <em>nehmen</em> gehört auch das Verb <em>sprechen</em> zu den Verben mit einem Vokalwechsel von <em>e</em> zu <em>i</em> in der 2. und 3. Person Singular.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich spreche</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du spr<strong>i</strong>chst</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es spr<strong>i</strong>cht</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir sprechen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr sprecht</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie sprechen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie sprechen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Спряжение: sprechen", "text": "<p><em>Welche Sprachen <strong>sprichst</strong> du, Lisa? – Ich <strong>spreche</strong> Deutsch, Englisch und Italienisch.</em></p>\n\n<p>Так же, как глаголы <em>essen</em> и <em>nehmen</em>, глагол <em>sprechen</em> относится к группе глаголов с чередующимися гласными <em>e</em>-<em>i</em> во втором и третьем лице единственного числа.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich spreche</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du spr<strong>i</strong>chst</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es spr<strong>i</strong>cht</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir sprechen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr sprecht</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie sprechen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie sprechen</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40596475, "shortTitle": "Konjunktiv II: Bitten", "name": "Konjunktiv II: Bitten (1)", "text": "<p>Der Konjunktiv II ist eine Verbform, mit der man z. B. Wünsche ausdrücken kann. Man kann den Konjunktiv II aber auch verwenden, um Bitten oder Fragen besonders höflich zu formulieren. Oft benutzt man dazu das Modalverb <em>können</em>. Bitten mit <em>können</em> sind meistens Fragesätze:</p>\n\n<p><em>Könnte ich bitte mit Herrn Thoma sprechen?<br>\nKönnten Sie Herrn Thoma bitte etwas ausrichten?</em></p>\n\n\n\n<p>Nützliche Fragen, die du oft im Alltag gebrauchen kannst, sind z. B.:</p>\n\n<p><em>Könnten Sie bitte etwas lauter/langsamer sprechen?<br>\nKönnten Sie das bitte wiederholen?<br>\nKönnten Sie mir bitte helfen?</em></p>\n\n\n\n<p>Hier siehst du die Formen von <em>können</em> im Konjunktiv II:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><strong><em>ich könnte</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em><strong>du könntest</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em><strong>er/sie/es könnte</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em><strong>wir könnten</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><strong><em>ihr könntet</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em><strong>sie könnten</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Formal</em></td>\n\t\t\t<td><strong><em>Sie könnten</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>der Konjunktiv II<span class=\"invalid_placeholder\"></span>: Der Konjunktiv II ist eine Verbform, mit der man häufig Sachverhalte ausdrückt, die nicht real sind. Man verwendet ihn zum Beispiel, um Wünsche oder irreale Bedingungen zum Ausdruck zu bringen, aber auch, um eine Bitte besonders höflich zu formulieren oder um Vorschläge zu machen.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Konjunktiv II: просьбы", "text": "<p>С помощью сослагательного наклонения Konjunktiv II можно выразить, например, пожелание. Konjunktiv II также придает просьбам и вопросам более вежливый характер. В сослагательном наклонении в таких случаях часто используется модальный глагол <em>k</em><em>ö</em><em>nnen</em>. Просьбы с глаголом <em>k</em><em>ö</em><em>nnen</em> обычно являются вопросительными предложениями:</p>\n\n<p><em>Könnte ich bitte mit Herrn Thoma sprechen?<br>\nKönnten Sie Herrn Thoma bitte etwas ausrichten?</em></p>\n\n<p>В повседневной жизни ты можешь часто использовать, например, следующие вопросы:</p>\n\n<p><em>Könnten Sie bitte etwas lauter/langsamer sprechen?<br>\nKönnten Sie das bitte wiederholen?<br>\nKönnten Sie mir bitte helfen?</em></p>\n\n<p>В таблице приведены формы глагола <em>k</em><em>ö</em><em>nnen</em> в Konjunktiv II:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><strong><em>ich könnte</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em><strong>du könntest</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em><strong>er/sie/es könnte</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em><strong>wir könnten</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong><em>ihr könntet</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em><strong>sie könnten</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><strong><em>Sie könnten</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n\n\n\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>der Konjunktiv II: Сослагательное наклонение Konjunktiv II – это форма глагола, с помощью которой часто выражают явления условного характера. Ее используют, например, для выражения пожеланий или невыполнимых условий, а также особенно вежливой просьбы или предложения.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 41582339, "shortTitle": "Konjunktiv II: Bitten", "name": "Konjunktiv II: Bitten (2)", "text": "<p><em>Wir <strong>hätten gern</strong> die Rechnung.</em><br>\n<strong><em>Hätten</em></strong><em> Sie kurz Zeit? Ich <strong>würde gern</strong> etwas mit Ihnen besprechen.</em><br>\n<strong><em>Es wäre nett</em></strong><em>, wenn Sie mir einen Kaffee mitbringen.</em></p>\n\n<p>Für höfliche Fragen oder Bitten kannst du auch den Konjunktiv II von <em>haben</em>, <em>werden </em>oder <em>sein</em> verwenden. Bitten mit diesen Verben können Frage- oder Aussagesätze sein. Bei Bestellungen, z. B. im Restaurant, benutzt man häufig die Formulierung:<br>\n<em>Ich hätte gern + </em>etwas (Akkusativ)</p>\n\n<p>Wenn du höflich ausdrücken willst, was du gerne machen willst, kannst du sagen:<br>\n<em>Ich würde gern + </em>Verb</p>\n\n<p>Höfliche Bitten mit <em>sein</em> formuliert man oft mit dem unpersönlichen Pronomen <em>es</em> und einem Nebensatz mit <em>wenn:<br>\nEs wäre nett/schön/toll …, wenn …</em></p>\n\n<p>Hier siehst du die Formen im Konjunktiv II von <em>haben, werden </em>und <em>sein</em>.</p>\n\n<p><em>haben </em>(im Konjunktiv II)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em><strong>ich hätte</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><strong><em>du hättest</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><strong><em>es/sie/es hätte</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><strong><em>wir hätten</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><strong><em>ihr hättet</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><strong><em>sie hätten</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><strong><em>Sie hätten</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><em>werden </em>(im Konjunktiv II)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1st person</td>\n\t\t\t<td><strong><em>ich würde</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2nd person</td>\n\t\t\t<td><strong><em>du würdest</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3rd person</td>\n\t\t\t<td><strong><em>er/sie/es würde</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1st person</td>\n\t\t\t<td><em><strong>wir würden</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2nd person</td>\n\t\t\t<td><strong><em>ihr würdet</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3rd person</td>\n\t\t\t<td><strong><em>sie würden</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><strong><em>Sie würden</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><em>sein </em>(im Konjunktiv II)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1st person</td>\n\t\t\t<td><strong><em>ich wäre</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2nd person</td>\n\t\t\t<td><strong><em>du wär(e)st</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3rd person</td>\n\t\t\t<td><strong><em>er/sie/es wäre</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1st person</td>\n\t\t\t<td>\n\t\t\t<p><strong><em>wir wären</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2nd person</td>\n\t\t\t<td><strong><em>ihr wär(e)t</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3rd person</td>\n\t\t\t<td><strong><em>sie wären</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><strong><em>Sie wären</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Tipp:&#160;&#160;&#160;&#160;&#160;&#160;&#160;</p>\n\n<p>Vergleiche bei diesen Verben Präteritum und Konjunktiv II:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Präteritum</td>\n\t\t\t<td><strong>Konjunktiv II</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>ich konnte</em></td>\n\t\t\t<td><strong><em>ich könnte</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>ich war</em></td>\n\t\t\t<td><strong><em>ich wäre</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>ich wurde</em></td>\n\t\t\t<td><strong><em>ich würde</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>ich hatte</em></td>\n\t\t\t<td><strong><em>ich hätte</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Konjunktiv II: просьбы", "text": "<p><em>Wir <strong>hätten gern</strong> die Rechnung.</em><br>\n<strong><em>Hätten</em></strong><em> Sie kurz Zeit? Ich <strong>würde gern</strong> etwas mit Ihnen besprechen.</em><br>\n<strong><em>Es wäre nett</em></strong><em>, wenn Sie mir einen Kaffee mitbringen.</em></p>\n\n<p>В вежливых вопросах или просьбах ты можешь использовать сослагательное наклонение Konjunktiv II глаголов <em>haben</em>, <em>werden</em> или <em>sein</em>. Просьбы с этими глаголами могут иметь форму повествовательных или вопросительных предложений. Например, при заказе в ресторане часто используется следующая формулировка:</p>\n\n<p><em>Ich</em> <em>h</em><em>ä</em><em>tte</em> <em>gern</em> + заказ (в винительном падеже)</p>\n\n<p>Если ты в вежливой форме выражаешь пожелание что-то сделать, ты можешь сказать:</p>\n\n<p><em>Ich</em> <em>w</em><em>ü</em><em>rde</em> <em>gern</em> + глагол</p>\n\n<p>Вежливые просьбы с глаголом <em>sein</em> часто формулируют, используя безличное местоимение <em>es</em> и придаточное предложение с союзом <em>wenn</em>:</p>\n\n<p><em>Es wäre nett/schön/toll …, wenn …</em></p>\n\n<p>В таблице приведены формы Konjunktiv II глаголов <em>haben</em><em>, </em><em>werden</em> и <em>sein</em>.</p>\n\n<p><em>haben </em>(Konjunktiv II)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо&#160;</td>\n\t\t\t<td><em><strong>ich hätte</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong><em>du hättest</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><strong><em>es/sie/es hätte</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо&#160;</td>\n\t\t\t<td><strong><em>wir hätten</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong><em>ihr hättet</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><strong><em>sie hätten</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><strong><em>Sie hätten</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><em>werden </em>(Konjunktiv II)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо&#160;</td>\n\t\t\t<td><strong><em>ich würde</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong><em>du würdest</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><strong><em>er/sie/es würde</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо&#160;</td>\n\t\t\t<td><em><strong>wir würden</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong><em>ihr würdet</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><strong><em>sie würden</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><strong><em>Sie würden</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><em>sein </em>(Konjunktiv II)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо&#160;</td>\n\t\t\t<td><strong><em>ich wäre</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong><em>du wär(e)st</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><strong><em>er/sie/es wäre</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо&#160;</td>\n\t\t\t<td>\n\t\t\t<p><strong><em>wir wären</em></strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><strong><em>ihr wär(e)t</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><strong><em>sie wären</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><strong><em>Sie wären</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Рекомендация:</p>\n\n<p>Сравни форму прошедшего времени Präteritum и сослагательного наклонения Konjunktiv II этих глаголов:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Präteritum</td>\n\t\t\t<td><strong>Konjunktiv II</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>ich konnte</em></td>\n\t\t\t<td><strong><em>ich könnte</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>ich war</em></td>\n\t\t\t<td><strong><em>ich wäre</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>ich wurde</em></td>\n\t\t\t<td><strong><em>ich würde</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>ich hatte</em></td>\n\t\t\t<td><strong><em>ich hätte</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 39120995, "shortTitle": "Konjunktiv II: Modalverben", "name": "Konjunktiv II: Modalverben", "text": "<p>Hier siehst du die Formen von <em>können</em>,&#160;<em>müssen </em>und<em> sollen</em> im Konjunktiv II:</p>\n\n<p><em>können&#160;</em>(im Konjunktiv II):</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich könnte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du könntest</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es könnte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir könnten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr könntet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie könnten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie könnten</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><em>müssen </em>(im Konjunktiv II):</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich müsste</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du müsstest</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es müsste</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir müssten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr müsstet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie müssten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie müssten</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><em>sollen </em>(im Konjunktiv II):</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>ich sollte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>du solltest</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>er/sie/es sollte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td><em>wir sollten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td><em>ihr solltet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td><em>sie sollten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td><em>Sie sollten</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Präteritum: müssen, dürfen", "text": "<p><em>Jacques <strong>musste</strong> seinen Eltern früher viel helfen.<br>\nInge <strong>durfte</strong> früher erst nach der Hausarbeit spielen.</em></p>\n\n\n\n<p><strong>Прошедшее время Pr</strong><strong>äteritum</strong></p>\n\n<p><br>\nPräteritum – это грамматическая категория глагола, выражающая действия или состояния, имевшие место в прошлом. Используется преимущественно в письменной речи, например, в газетных статьях или художественной литературе. Прошедшее время Präteritum вспомогательных глаголов <em>sein</em>, <em>haben</em> и модальных глаголов, например, <em>m</em><em>üssen</em> и <em>d</em><em>ürfen</em> используется также в устной речи.<br>\n<br>\n<br>\n<strong>Pr</strong><strong>äteritum</strong><strong>: модальные глаголы <em>m</em></strong><strong><em>üssen</em></strong><strong><em>, d</em></strong><strong><em>ürfen</em></strong><br>\n<br>\nФормы Präteritum модальных глаголов образуются путем присоединения к основе глагола суффикса <em>-te</em><em>-</em> и личного окончания. У модальных глаголов в Präteritum &#160;нет умлаутов. &#160;Здесь представлены формы прошедшего времени Präteritum модальных глаголов <em>m</em><em>üssen</em> и <em>d</em><em>ürfen</em>:<br>\n<br>\n<em>m</em><em>üssen</em> (Präteritum)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>ich muss<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>du muss<strong>te</strong>st</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>er/sie/es muss<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>wir muss<strong>te</strong>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>ihr muss<strong>te</strong>t</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>sie muss<strong>te</strong>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><em>Sie muss<strong>te</strong>n</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><em>d</em><em>ürfen</em> (Präteritum)<em>:</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>ich durf<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>du durf<strong>te</strong>st</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>er/sie/es durf<strong>te</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td><em>wir durf<strong>te</strong>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td><em>ihr durf<strong>te</strong>t</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td><em>sie durf<strong>te</strong>n</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td><em>Sie durf<strong>te</strong>n</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 39125065, "shortTitle": "Konjunktiv II: Präsens", "name": "Konjunktiv II: Präsens", "text": "<p>Mit dem Konjunktiv II kann man ausdrücken, dass etwas nicht real&#160;ist. Man verwendet diese Form in verschiedenen Situationen.</p>\n\n<ul>\n\t<li>Wünsche/Träume</li>\n</ul>\n\n<p>Beispiele:</p>\n\n<p><em>Ich <strong>würde</strong> gerne eine Ausbildung als Zweiradmechatroniker machen.</em></p>\n\n<p><em>Ich <strong>hätte</strong> gerne meinen eigenen Fahrradladen.</em><br>\n&#160;</p>\n\n<ul>\n\t<li>Irreale Bedingungen mit <em>wenn</em></li>\n</ul>\n\n<p>Beispiele:</p>\n\n<p><em>Wenn du die B1-Prüfung schon hinter dir <strong>hättest</strong>, <strong>könntest</strong> du mit der Ausbildung anfangen.</em></p>\n\n<p><em>Wenn du die Ausbildung bei mir <strong>machen</strong> <strong>würdest</strong>, <strong>hätte</strong> ich einen guten Mitarbeiter.</em><br>\n&#160;</p>\n\n<ul>\n\t<li>Höfliche Bitten und Fragen</li>\n</ul>\n\n<p>Beispiele:</p>\n\n<p><em>Ich <strong>hätte</strong> gerne eine Linsensuppe.</em></p>\n\n<p><em><strong>Könntest </strong>du mir im Restaurant helfen?</em></p>\n\n\n\n<ul>\n\t<li>Vorschläge/Empfehlungen (mit Modalverben)</li>\n</ul>\n\n<p>Beispiele:</p>\n\n<p><em>Du <strong>könntest</strong> deine Ausbildung in meinem Laden machen.</em></p>\n\n<p><em>Du <strong>solltest</strong> die B1-Prüfung machen.</em><br>\n&#160;</p>\n\n<p>Den Konjunktiv II bildet man ähnlich wie das Präteritum.</p>\n\n<p>Unregelmäßige Verben bilden den Konjunktiv meistens mit einem <strong>Umlaut</strong>. In der ersten und der dritten Person Singular haben sie außerdem die <strong>Endung -e</strong>.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Präteritum</strong></td>\n\t\t\t<td><strong>Konjunktiv II</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich war</td>\n\t\t\t<td><em>ich w</em><strong>ä</strong><em>r</em><strong>e</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>du warst</td>\n\t\t\t<td><em>du w</em><strong>ä</strong><em>rst*</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>er/sie/es war</td>\n\t\t\t<td><em>er/sie/es w</em><strong>ä</strong><em>r</em><strong>e</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir waren</td>\n\t\t\t<td><em>wir w</em><strong>ä</strong><em>ren</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ihr wart</td>\n\t\t\t<td><em>ihr w</em><strong>ä</strong><em>rt*</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie waren</td>\n\t\t\t<td><em>sie w</em><strong>ä</strong><em>ren</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Sie waren</td>\n\t\t\t<td><em>Sie w</em><strong>ä</strong><em>ren</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p>* Manchmal benutzt man auch die Formen: <em>du wärest </em>/ <em>ihr wäret</em>.<br>\n<br>\n<strong>Regelmäßige Verben</strong> (und die Modalverben <em>sollen</em> und <em>wollen</em>) haben im Konjunktiv II oft die gleiche Form wie das Präteritum.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Präteritum</strong></td>\n\t\t\t<td><strong>Konjunktiv II</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich sollte</td>\n\t\t\t<td><em>ich sollte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>du solltest</td>\n\t\t\t<td><em>du solltest</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>er/sie/es sollte</td>\n\t\t\t<td><em>er/sie/es sollte</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir sollten</td>\n\t\t\t<td><em>wir sollten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ihr solltet</td>\n\t\t\t<td><em>ihr solltet</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie sollten</td>\n\t\t\t<td><em>sie sollten</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Sie sollten</td>\n\t\t\t<td><em>Sie sollten</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nMan kann von jedem Verb den Konjunktiv II bilden, aber man benutzt nur bestimmte Verben in dieser Form.</p>\n\n<p>Diese Formen verwendet man oft:</p>\n\n<p>sein -&gt; <em>ich wäre</em></p>\n\n<p>haben -&gt; <em>ich hätte</em></p>\n\n<p>können -&gt; <em>ich könnte</em></p>\n\n<p>müssen -&gt; <em>ich müsste</em></p>\n\n<p>dürfen -&gt; <em>ich dürfte</em></p>\n\n<p>wollen -&gt; <em>ich wollte</em></p>\n\n<p>sollen -&gt; <em>ich sollte</em></p>\n\n<p>brauchen -&gt; <em>ich bräuchte</em></p>\n\n<p>wissen -&gt; <em>ich wüsste</em></p>\n\n<p>kommen -&gt; <em>ich käme</em><br>\n<br>\nBei anderen Verben verwendet man meistens das Verb <em>werden</em> im Konjunktiv II und den Infinitiv.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Konjunktiv II</strong></td>\n\t\t\t<td><strong>+ Infinitiv</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>ich würde</em></td>\n\t\t\t<td>machen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>du würdest</em></td>\n\t\t\t<td>machen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>er/sie/es würde</em></td>\n\t\t\t<td>machen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>wir würden</em></td>\n\t\t\t<td>machen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>ihr würdet</em></td>\n\t\t\t<td>machen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>sie würden</em></td>
