\t</tbody>\n</table>\n\n\n", "ru": {"name": "Präteritum: глагол sein", "text": "<p>Глагольная категория времени Präteritum выражает прошедшие события. Она мало употребляется в разговорной речи и чаще встречается в художественной литературе или газетных статьях.</p>\n\n<p>Глаголы <em>sein</em> и <em>haben</em>, тем не менее, часто употребляются и в устной речи в прошедшем времени&#160;<strong>Pr</strong><strong>äteritum</strong>.</p>\n\n<p><strong>Präsens (настоящее время): </strong></p>\n\n\n\n<p><strong>Präteritum&#160;(прошедшее время): </strong></p>\n\n\n\n<p>В таблице еще раз представлено спряжение глагола <em>sein</em>&#160;в настоящем времени:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich bin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du bist</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es ist</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir sind</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr seid</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie sind</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie sind</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nЛичные формы глагола <em>sein</em>&#160;в прошедшем времени <strong>Pr</strong><strong>äteritum</strong>:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich <strong>war</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du <strong>warst</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es <strong>war</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir <strong>waren</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr <strong>wart</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie <strong>waren</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie waren</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>das Präsens: Глагольная категория времени Präsens выражает действие или состояние , совпадающее с моментом речи или постоянное по времени.</p>\n\n\t\t\t<p>das Präteritum: Глагольная категория времени Präteritum используется обычно в письменной речи для выражения действий или состояний, имевших место в прошлом. Некоторые глаголы, например, глагол <em>sein</em>, часто используются также в устной речи в форме прошедшего времени Präteritum.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 50661414, "shortTitle": "Präteritum: unregelmäßig", "name": "Präteritum: unregelmäßig", "text": "<p><strong>Das Präteritum der unregelmäßigen Verben</strong></p>\n\n<p>Die unregelmäßigen Verben kennst du schon. Als du das Perfekt gelernt hast, hast du gelernt, dass das Partizip II unregelmäßiger Verben auf <em>-en</em> endet und dass es im Stamm dieser Verben oft einen Vokalwechsel gibt.</p>\n\n<p>Der Stammvokal dieser Verben verändert sich auch im Präteritum:</p>\n\n<p>schr<strong>ei</strong>ben: <em>Johann Wolfgang Goethe schr<strong>ie</strong>b viele Gedichte und Theaterstücke.</em></p>\n\n<p>Im Gegensatz zu den regelmäßigen Verben wird bei den unregelmäßigen Verben zwischen dem Stamm und den Personalendungen kein <em>-(e)te-</em> eingefügt. In der ersten und der dritten Person Singular gibt es keine Personalendung.</p>\n\n<p>Das Verb wird dann so konjugiert:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich schrieb</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du schrieb<strong><em>st</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es schrieb</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir schrieb<strong><em>en</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr schrieb<strong><em>t</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie schrieb<strong><em>en</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie schrieb<strong><em>en</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nBeachte, dass die Stammvokale unregelmäßiger Verben im Präteritum und beim Partizip II gleich sein können, sich aber auch oft unterscheiden: <em>schreiben – schrieb – geschrieben</em>, aber: <em>finden – fand – gefunden.</em> Diese sogenannten Stammformen musst du also für jedes unregelmäßige Verb lernen.</p>\n\n<p>In wenigen Fällen verändern sich auch einzelne oder mehrere Konsonanten:</p>\n\n<p>k<strong>omm</strong>en:<em> Nach seiner Italienreise k<strong>am</strong> Goethe 1778 zurück nach Weimar.</em></p>\n\n<p>g<strong>eh</strong>en: <em>Goethe g<strong>ing</strong> gerne spazieren, weil er sich für die Natur interessierte.</em></p>\n\n<p><strong>essen</strong>:<em> Goethe liebte gutes Essen und <strong>aß</strong> gerne Fleisch.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>regelmäßig: Eine grammatische Form ist regelmäßig, wenn sie nach einem festen Muster gebildet wird, das auf andere Wörter übertragbar ist.</p>\n\n\t\t\t<p>unregelmäßig: Unregelmäßige Formen muss man lernen, weil es keine allgemeine Regel gibt, mit deren Hilfe man die korrekte Form aus einer Grundform bilden kann. Unregelmäßige Formen sind anders als die Mehrheit der Formen und/oder weisen Besonderheiten auf, die nicht der Regel entsprechen.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Präteritum: неправильные глаголы", "text": "\n\n<p>Тебе уже знакомы неправильные глаголы. Как ты помнишь, причастие Partizip II, составную часть формы сложного прошедшего времени Perfekt, неправильные глаголы образуют с помощью окончания <em>–en,</em> а в корне этих глаголов часто изменяется гласная. &#160;</p>\n\n<p>Корневая гласная&#160;этих глаголов меняется также в прошедшем времени Präteritum:</p>\n\n<p>schr<strong>ei</strong>ben: <em>Johann Wolfgang Goethe schr<strong>ie</strong>b viele Gedichte und Theaterstücke.</em></p>\n\n<p>В отличие от правильных глаголов, неправильные глаголы образуют Präteritum без <em>-(</em><em>e</em><em>)</em><em>te</em><em>- </em>между основой и личным окончанием. При спряжении неправильные глаголы в первом и третьем лице единственного числа не имеют личных окончаний.&#160;</p>\n\n<p>Глагол спрягается так:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich schrieb</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du schrieb<strong><em>st</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es schrieb</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir schrieb<strong><em>en</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr schrieb<strong><em>t</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie schrieb<strong><em>en</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie schrieb<strong><em>en</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Имей в виду, что формы прошедшего времени Präteritum &#160;и причастия Partizip II неправильных глаголов могут иметь как идентичные корневые гласные, так и разные: <em>schreiben</em><em> – </em><em>schrieb</em><em> – </em><em>geschrieben</em>, но: &#160;<em>finden</em><em> – </em><em>fand</em><em> – </em><em>gefunden</em><em>. </em>Так называемые корневые формы неправильных глаголов надо учить наизусть.</p>\n\n<p>В некоторых редких&#160;случаях изменяются также одна или несколько согласных:</p>\n\n<p>k<strong>omm</strong>en:<em> Nach seiner Italienreise k<strong>am</strong> Goethe 1778 zurück nach Weimar.</em></p>\n\n<p>g<strong>eh</strong>en:<em> Goethe g<strong>ing</strong> gerne spazieren, weil er sich für die Natur interessierte.</em></p>\n\n<p><strong>essen</strong>: <em>Goethe liebte gutes Essen und <strong>aß</strong> gerne Fleisch.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>regelmäßig: Грамматическая форма слова является правильной, если она образуется по правилу, которое применимо и к другим словам.</p>\n\n\t\t\t<p>unregelmäßig: Неправильные грамматические формы надо учить наизусть, поскольку они образуются из начальных форм слов не по общим правилам. Неправильные формы слов отличаются от большинства форм и/или имеют особенности, которые не отвечают общим правилам.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40608840, "shortTitle": "Präteritum: unregelmäßig", "name": "Präteritum: unregelmäßig", "text": "<p>Die unregelmäßigen Verben kennst du schon. Als du das Perfekt gelernt hast, hast du gelernt, dass das Partizip II unregelmäßiger Verben auf <em>-en</em> endet und dass es im Stamm dieser Verben oft einen Vokalwechsel gibt.</p>\n\n<p>Der Stammvokal dieser Verben verändert sich auch im Präteritum:</p>\n\n<p>schr<strong>ei</strong>ben: <em>Johann Wolfgang Goethe schr<strong>ie</strong>b viele Gedichte und Theaterstücke.</em></p>\n\n<p>Im Gegensatz zu den regelmäßigen Verben wird bei den unregelmäßigen Verben zwischen dem Stamm und den Personalendungen kein <em>-(e)te-</em> eingefügt. In der ersten und der dritten Person Singular gibt es keine Personalendung.</p>\n\n<p>Das Verb wird dann so konjugiert:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Singular:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>ich schrieb</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>du schrieb<strong><em>st</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>er/sie/es schrieb</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Plural:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1. Person</td>\n\t\t\t<td>wir schrieb<strong><em>en</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2. Person</td>\n\t\t\t<td>ihr schrieb<strong><em>t</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3. Person</td>\n\t\t\t<td>sie schrieb<strong><em>en</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>formell:</em></td>\n\t\t\t<td>Sie schrieb<strong><em>en</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nBeachte, dass die Stammvokale unregelmäßiger Verben im Präteritum und beim Partizip II gleich sein können, sich aber auch oft unterscheiden: <em>schreiben – schrieb – geschrieben</em>, aber: <em>finden – fand – gefunden.</em> Diese sogenannten Stammformen musst du also für jedes unregelmäßige Verb lernen.</p>\n\n<p>In wenigen Fällen verändern sich auch einzelne oder mehrere Konsonanten:</p>\n\n<p>k<strong>omm</strong>en:<em> Nach seiner Italienreise k<strong>am</strong> Goethe 1778 zurück nach Weimar.</em></p>\n\n<p>g<strong>eh</strong>en: <em>Goethe g<strong>ing</strong> gerne spazieren, weil er sich für die Natur interessierte.</em></p>\n\n<p><strong>essen</strong>:<em> Goethe liebte gutes Essen und <strong>aß</strong> gerne Fleisch.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>regelmäßig: Eine grammatische Form ist regelmäßig, wenn sie nach einem festen Muster gebildet wird, das auf andere Wörter übertragbar ist.</p>\n\n\t\t\t<p>unregelmäßig: Unregelmäßige Formen muss man lernen, weil es keine allgemeine Regel gibt, mit deren Hilfe man die korrekte Form aus einer Grundform bilden kann. Unregelmäßige Formen sind anders als die Mehrheit der Formen und/oder weisen Besonderheiten auf, die nicht der Regel entsprechen.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Präteritum: неправильные глаголы", "text": "\n\n<p>Тебе уже знакомы неправильные глаголы. Как ты помнишь, причастие Partizip II, составную часть формы сложного прошедшего времени Perfekt, неправильные глаголы образуют с помощью окончания <em>–en,</em> а в корне этих глаголов часто изменяется гласная. &#160;</p>\n\n<p>Корневая гласная&#160;этих глаголов меняется также в прошедшем времени Präteritum:</p>\n\n<p>schr<strong>ei</strong>ben: <em>Johann Wolfgang Goethe schr<strong>ie</strong>b viele Gedichte und Theaterstücke.</em></p>\n\n<p>В отличие от правильных глаголов, неправильные глаголы образуют Präteritum без <em>-(</em><em>e</em><em>)</em><em>te</em><em>- </em>между основой и личным окончанием. При спряжении неправильные глаголы в первом и третьем лице единственного числа не имеют личных окончаний.&#160;</p>\n\n<p>Глагол спрягается так:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><em>Единственное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>ich schrieb</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>du schrieb<strong><em>st</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>er/sie/es schrieb</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Множественное число:</em></td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>1-е лицо</td>\n\t\t\t<td>wir schrieb<strong><em>en</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>2-е лицо</td>\n\t\t\t<td>ihr schrieb<strong><em>t</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>3-е лицо</td>\n\t\t\t<td>sie schrieb<strong><em>en</em></strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>Вежливое обращение:</em></td>\n\t\t\t<td>Sie schrieb<strong><em>en</em></strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Имей в виду, что формы прошедшего времени Präteritum &#160;и причастия Partizip II неправильных глаголов могут иметь как идентичные корневые гласные, так и разные: <em>schreiben</em><em> – </em><em>schrieb</em><em> – </em><em>geschrieben</em>, но: &#160;<em>finden</em><em> – </em><em>fand</em><em> – </em><em>gefunden</em><em>. </em>Так называемые корневые формы неправильных глаголов надо учить наизусть.</p>\n\n<p>В некоторых редких&#160;случаях изменяются также одна или несколько согласных:</p>\n\n<p>k<strong>omm</strong>en:<em> Nach seiner Italienreise k<strong>am</strong> Goethe 1778 zurück nach Weimar.</em></p>\n\n<p>g<strong>eh</strong>en:<em> Goethe g<strong>ing</strong> gerne spazieren, weil er sich für die Natur interessierte.</em></p>\n\n<p><strong>essen</strong>: <em>Goethe liebte gutes Essen und <strong>aß</strong> gerne Fleisch.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>regelmäßig: Грамматическая форма слова является правильной, если она образуется по правилу, которое применимо и к другим словам.</p>\n\n\t\t\t<p>unregelmäßig: Неправильные грамматические формы надо учить наизусть, поскольку они образуются из начальных форм слов не по общим правилам. Неправильные формы слов отличаются от большинства форм и/или имеют особенности, которые не отвечают общим правилам.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}]}, {"key": "nounsAndArticles", "headline": "Nomen und Artikel", "grammars": [{"id": 41560560, "shortTitle": "Artikel: bestimmt", "name": "Artikel: bestimmt", "text": "<p><strong>Die drei bestimmten Artikel:<em> der, die, das</em></strong></p>\n\n<p>Im Deutschen unterscheidet man zwischen maskulinen, femininen und neutralen Nomen. Das grammatische Geschlecht eines Nomens, das Genus, erkennt man an seinem Begleiter, dem Artikel. Da es in den meisten Fällen keine Regeln dafür gibt, welches grammatische Geschlecht ein Nomen hat, muss man die Nomen zusammen mit ihren Artikeln lernen. Der Artikel steht vor einem Nomen.</p>\n\n\n\n<p>Maskuline Nomen haben den bestimmten Artikel <em>der</em>.</p>\n\n<p><em>Wo ist <strong>der</strong> Stift? – <strong>Der</strong> Stift ist hier.</em></p>\n\n<p>Feminine Nomen haben den bestimmten Artikel <em>die</em>.</p>\n\n<p><em>Wo ist <strong>die</strong> Brille? – <strong>Die</strong> Brille ist hier.</em></p>\n\n<p>Neutrale Nomen haben den bestimmten Artikel <em>das</em>.</p>\n\n<p><em>Wo ist <strong>das</strong> Buch? – <strong>Das</strong> Buch ist hier.</em></p>\n\n\n\n<p>Im Plural haben alle Nomen den bestimmten Artikel <em>die</em>.</p>\n\n<p><em>Wo sind <strong>die</strong> Stifte? – <strong>Die</strong> Stifte sind hier.</em></p>\n\n<p><em>Wo sind <strong>die</strong> Brillen? – <strong>Die</strong> Brillen sind hier.</em></p>\n\n<p><em>Wo sind <strong>die</strong> Bücher? – <strong>Die</strong> Bücher sind hier.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Singular</td>\n\t\t\t<td>Plural</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>maskulin</td>\n\t\t\t<td><strong>der</strong> Stift</td>\n\t\t\t<td><strong>die</strong> Stifte</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin</td>\n\t\t\t<td><strong>die</strong> Brille</td>\n\t\t\t<td><strong>die</strong> Brillen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral</td>\n\t\t\t<td><strong>das</strong> Buch</td>\n\t\t\t<td><strong>die</strong> Bücher</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Man benutzt den bestimmten Artikel vor allem dann, wenn man über eine Sache oder eine Person spricht, die dem Gesprächspartner schon bekannt ist.</p>\n\n<p>Lisa sagt:<em> Wo ist die Brille?</em></p>\n\n<p>Der Zuhörer versteht, dass sie nicht irgendeine Brille sucht. Sie sucht eine bestimmte Brille, nämlich ihre eigene.</p>\n", "ru": {"name": "Артикли: определенные", "text": "<p><strong>Три определенных артикля:</strong><strong><em> der</em></strong><strong><em>, die</em></strong><strong><em>, das</em></strong></p>\n\n<p>В немецком языке существительные распределяются по родам: мужскому, женскому и среднему. Грамматический род можно определить по артиклю. Поскольку универсальных правил определения рода в немецком языке нет, существительные надо учить вместе с артиклями. Артикль ставится перед существительным.</p>\n\n\n\n<p>Существительные мужского рода имеют определенный артикль <em>der</em>.</p>\n\n<p><em>Wo ist <strong>der</strong> Stift? – <strong>Der</strong> Stift ist hier.</em></p>\n\n<p>Существительные женского рода имеют определенный артикль <em>die</em>.</p>\n\n<p><em>Wo ist <strong>die</strong> Brille? – <strong>Die</strong> Brille ist hier.</em></p>\n\n<p>Существительные среднего рода имеют определенный артикль <em>das</em>.</p>\n\n<p><em>Wo ist <strong>das</strong> Buch? – <strong>Das</strong> Buch ist hier.</em></p>\n\n\n\n<p>Во множественном числе все существительные имеют определенный артикль <em>die</em>.</p>\n\n<p><em>Wo sind <strong>die</strong> Stifte? – <strong>Die</strong> Stifte sind hier.</em></p>\n\n<p><em>Wo sind <strong>die</strong> Brillen? – <strong>Die</strong> Brillen sind hier.</em></p>\n\n<p><em>Wo sind <strong>die</strong> Bücher? – <strong>Die</strong> Bücher sind hier.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Ед. ч.</td>\n\t\t\t<td>Мн. ч.</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td><strong>der</strong> Stift</td>\n\t\t\t<td><strong>die</strong> Stifte</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род</td>\n\t\t\t<td><strong>die</strong> Brille</td>\n\t\t\t<td><strong>die</strong> Brillen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род</td>\n\t\t\t<td><strong>das</strong> Buch</td>\n\t\t\t<td><strong>die</strong> Bücher</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Определенный артикль стоит перед существительным, если называемый предмет или человек уже известны собеседникам. &#160;</p>\n\n<p>Лиза говорит: <em>Wo ist die Brille?</em></p>\n\n<p>Слушатель понимает, что Лиза ищет не какие-то абстрактные очки, а весьма конкретные – свои собственные.</p>\n"}}, {"id": 40400525, "shortTitle": "Artikel: unbestimmt", "name": "Artikel: unbestimmt", "text": "<p><strong>Die unbestimmten Artikel:<em> ein, eine</em></strong></p>\n\n<p>Wenn man nicht über einen bestimmten Gegenstand oder eine bestimmte Person spricht, verwendet man den unbestimmten Artikel.</p>\n\n<p><em>Was ist das? – Das ist <strong>ein</strong> Stift.</em></p>\n\n<p>Es spielt keine Rolle, welcher Stift das genau ist oder wem er gehört, ob er blau, schwarz, groß oder klein ist. Der Satz könnte auf jeden Stift zutreffen. Deshalb benutzt man den unbestimmten Artikel <em>ein</em> und nicht den bestimmten Artikel <em>der</em>.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>bestimmt</td>\n\t\t\t<td>unbestimmt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>maskulin</td>\n\t\t\t<td><strong>der</strong> Stift</td>\n\t\t\t<td><strong>ein</strong> Stift</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin</td>\n\t\t\t<td><strong>die</strong> Brille</td>\n\t\t\t<td><strong>eine</strong> Brille</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral</td>\n\t\t\t<td><strong>das</strong> Buch</td>\n\t\t\t<td><strong>ein</strong> Buch</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Im Plural gibt es keinen unbestimmten Artikel. Wenn ein unbestimmtes Nomen im Plural steht, steht davor kein Artikel.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>bestimmt</td>\n\t\t\t<td>unbestimmt</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td><strong>die </strong>Stifte</td>\n\t\t\t<td>Stifte</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td><strong>die </strong>Brillen</td>\n\t\t\t<td>Brillen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td><strong>die </strong>Bücher</td>\n\t\t\t<td>Bücher</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Артикли: неопределенные", "text": "<p><strong>Неопределенные артикли:</strong><strong><em> ein</em></strong><strong><em>, eine</em></strong></p>\n\n<p>Когда впервые называется некий неопределенный предмет или человек, используется неопределенный артикль. &#160;</p>\n\n<p><em>Was ist das? – Das ist <strong>ein</strong> Stift.</em></p>\n\n<p>Не имеет значения, что это за ручка и кому она принадлежит, синяя она или черная, большая или маленькая. Любая ручка может быть предметом данного высказывания. Поэтому используется неопределенный артикль <em>ein</em>, а не определенный артикль <em>der</em>.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Определенное существительное</td>\n\t\t\t<td>Неопределенное существительное</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td><strong>der</strong> Stift</td>\n\t\t\t<td><strong>ein</strong> Stift</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род</td>\n\t\t\t<td><strong>die</strong> Brille</td>\n\t\t\t<td><strong>eine</strong> Brille</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род</td>\n\t\t\t<td><strong>das</strong> Buch</td>\n\t\t\t<td><strong>ein</strong> Buch</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>У неопределенного артикля нет формы множественного числа. Перед неопределенным существительным во множественном числе артикль отсутствует.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Определенное существительное</td>\n\t\t\t<td>Неопределенное существительное</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. ч.&#160;&#160;</td>\n\t\t\t<td><strong>die</strong> Stifte</td>\n\t\t\t<td>Stifte</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. ч.&#160;&#160;</td>\n\t\t\t<td><strong>die</strong> Brillen</td>\n\t\t\t<td>Brillen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. ч.&#160;&#160;</td>\n\t\t\t<td><strong>die</strong> Bücher</td>\n\t\t\t<td>Bücher</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40484958, "shortTitle": "Demonstrativartikel: dies-", "name": "Demonstrativartikel: dies-", "text": "<p><strong>Demonstrativartikel <em>dies-</em></strong></p>\n\n<p>Mit dem Demonstrativartikel weist man auf etwas hin, bestimmt es genauer oder hebt es aus einer Gruppe hervor. Manchmal zeigt man dabei mit dem Finger auf das, was man meint.</p>\n\n\n\n<p><strong><em>Dieses</em></strong><em> Kleid finde ich schön.</em></p>\n\n<p>Wie das Fragewort <em>welch-</em> hat auch der Demonstrativartikel <em>dies-</em> die gleichen Endungen wie der bestimmte Artikel.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td>Akkusativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>maskulin&#160;<em>(der)</em></td>\n\t\t\t<td><strong>dieser</strong></td>\n\t\t\t<td><strong>diesen</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin&#160;<em>(die)</em></td>\n\t\t\t<td>diese</td>\n\t\t\t<td>diese</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral&#160;<em>(das)</em></td>\n\t\t\t<td>dieses</td>\n\t\t\t<td>dieses</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural <em>(die)</em></td>\n\t\t\t<td>diese</td>\n\t\t\t<td>diese</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong><em>Welcher</em></strong> Pullover ist am teuersten? – <strong><em>Dieser</em></strong> Pullover ist am teuersten.</p>\n\n<p><strong><em>Welchen</em></strong> Pullover findest du am schönsten? – <strong><em>Diesen</em></strong> Pullover finde ich am schönsten.</p>\n\n<p><strong><em>Welche</em></strong> Hose ist am billigsten? – <strong><em>Diese</em></strong> Hose ist am billigsten.</p>\n\n<p><strong><em>Welches</em></strong> Kleid möchten Sie? – Ich möchte <strong><em>dieses</em></strong> Kleid, bitte.</p>\n\n<p><strong><em>Welche</em></strong> Turnschuhe nehmen Sie? – Ich nehme <strong><em>diese</em></strong> Turnschuhe hier.</p>\n", "ru": {"name": "Указательное местоимение: dies-", "text": "<p>Указательные местоимения&#160; выделяют определенное лицо или предмет из группы подобных. Говорящий может даже показать пальцем на то, что он имеет в виду. Указательные местоимения более точно указывают на лицо или предмет, чем определенный артикль, и употребляются вместо определенного артикля. Поэтому указательные местоимения в немецком языке называют также указательными артиклями.</p>\n\n<p><strong><em>Dieses</em></strong><em> Kleid finde ich schön.</em></p>\n\n<p>Как и вопросительное слово <em>welch-,&#160;</em>указательный артикль <em>dies-</em> имеет то же окончание, что и определенный артикль.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Именительный падеж</td>\n\t\t\t<td>Винительный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род <em>(der)</em></td>\n\t\t\t<td><strong>dieser</strong></td>\n\t\t\t<td><strong>diesen</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род <em>(die)</em></td>\n\t\t\t<td>diese</td>\n\t\t\t<td>diese</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род <em>(das)</em></td>\n\t\t\t<td>dieses</td>\n\t\t\t<td>dieses</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число <em>(die)</em></td>\n\t\t\t<td>diese</td>\n\t\t\t<td>diese</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong><em>Welcher</em></strong> Pullover ist am teuersten? – <strong><em>Dieser</em></strong> Pullover ist am teuersten.</p>\n\n<p><strong><em>Welchen</em></strong> Pullover findest du am schönsten? – <strong><em>Diesen</em></strong> Pullover finde ich am schönsten.</p>\n\n<p><strong><em>Welche</em></strong> Hose ist am billigsten? – <strong><em>Diese</em></strong> Hose ist am billigsten.</p>\n\n<p><strong><em>Welches</em></strong> Kleid möchten Sie? – Ich möchte <strong><em>dieses</em></strong> Kleid, bitte.</p>\n\n<p><strong><em>Welche</em></strong> Turnschuhe nehmen Sie? – Ich nehme <strong><em>diese</em></strong> Turnschuhe hier.</p>\n"}}, {"id": 40577986, "shortTitle": "Gleichsetzungsnominativ", "name": "Gleichsetzungsnominativ", "text": "<p>Das Subjekt eines Satzes steht immer im Nominativ.</p>\n\n<p><strong><em>Der Mann</em></strong><em> kommt aus Frankreich.</em></p>\n\n<p>Manchmal gibt es auch einen zweiten Nominativ im Satz, z. B. mit dem Verb <em>sein</em>:</p>\n\n<p><strong><em>Der Mann </em></strong><em>ist<strong> ein Feinschmecker.</strong></em></p>\n\n<p>Der zweite Nominativ beschreibt das Subjekt näher. Man nennt ihn auch Gleichsetzungsnominativ. Die Gleichsetzungsnominative können nur bei wenigen Verben stehen. Neben <em>sein</em> sind das z. B. <em>werden</em> und <em>bleiben</em>. Diese Verben verbinden das Subjekt mit einem Nomen im Nominativ.</p>\n\n\n\n<p><strong>Die Artikel im Nominativ</strong></p>\n\n<p>Hier siehst du noch einmal eine Übersicht über einige Artikelwörter im Nominativ, die du schon kennst.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Nominativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>\n\t\t\t<p><strong>der</strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p><strong>ein</strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p><strong>kein</strong></p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td><strong>mein</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>feminin</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>eine</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>keine</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>meine</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>neutral</td>\n\t\t\t<td>\n\t\t\t<p>das</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>ein</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>kein</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>mein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>-</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>keine</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>meine</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Предикативное существительное", "text": "<p>Подлежащее в предложении всегда стоит в именительном падеже.</p>\n\n<p><strong><em>Der Mann</em></strong><em> kommt aus Frankreich.</em></p>\n\n<p>Иногда в предложении есть еще одно слово в именительном падеже, например, в конструкциях с глаголом <em>sein</em>:</p>\n\n<p><strong><em>Der Mann </em></strong><em>ist<strong> ein Feinschmecker.</strong></em></p>\n\n<p>Второе существительное в именительном падеже уточняет подлежащее. Его называют предикативным существительным или именной частью составного именного сказуемого. С предикативами могут сочетаться лишь некоторые глаголы. Помимо <em>sein</em>, это глаголы <em>werden</em> и<em> bleiben</em>. Они связывают подлежащее с предикативным существительным.</p>\n\n\n\n<p><strong>Артикли и местоимения в именительном падеже </strong></p>\n\n<p>В этой таблице приведены формы уже известных тебе определенных и неопределенных артиклей, а также отрицательных и притяжательных местоимений в именительном падеже.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Именительный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>\n\t\t\t<p>der</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>ein</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>kein</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>mein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>eine</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>keine</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>meine</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род</td>\n\t\t\t<td>\n\t\t\t<p>das</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>ein</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>kein</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>mein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Множественное число</td>\n\t\t\t<td>\n\t\t\t<p>die</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>-</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>\n\t\t\t<p>keine</p>\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>meine</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 39134691, "shortTitle": "Nomen auf -chen", "name": "Nomen auf -chen", "text": "<p><strong>Die Verkleinerungsform</strong></p>\n\n\n\n<p><em>Die kleinen <strong>Städtchen</strong> verwandelten sich in Großstädte.</em><br>\n<br>\nMit dem Suffix <em>-chen</em> kann man die Verkleinerungsform von Nomen bilden. Ein <em>Städtchen</em> ist zum Beispiel eine kleine Stadt. Diese Form heißt auch Diminutiv.</p>\n\n<p>Ein Nomen im Diminutiv ist immer neutral.</p>\n\n<p>Beispiele:</p>\n\n<p><strong>der</strong><em> Tisch – </em><strong>das</strong><em> Tisch</em><strong>chen</strong></p>\n\n<p><strong>die</strong><em> Tür – </em><strong>das</strong><em> Tür</em><strong>chen</strong></p>\n\n<p><strong>das</strong><em> Fenster – </em><strong>das</strong><em> Fenster</em><strong>chen</strong><br>\n<br>\nWenn man ein Nomen mit der Endung <em>-chen</em> bildet, verändert sich oft der Stammvokal.</p>\n\n<p>Beispiele:</p>\n\n<p><em>der Fl</em><strong>u</strong><em>ss – das Fl</em><strong>ü</strong><em>sschen</em></p>\n\n<p><em>die Str</em><strong>a</strong><em>ße – das Str</em><strong>ä</strong><em>ßchen</em></p>\n\n<p><em>das Br</em><strong>o</strong><em>t – das Br</em><strong>ö</strong><em>tchen</em><br>\n<br>\nNomen, die auf <em>-chen</em> enden, haben keine Pluralendung.</p>\n\n<p>Beispiele:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Singular:</strong></td>\n\t\t\t<td><strong><em>das</em></strong><em> Städtchen</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Plural:</strong></td>\n\t\t\t<td><strong><em>die</em></strong><em> Städtchen</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Singular:</strong></td>\n\t\t\t<td><strong><em>das</em></strong><em> Häuschen</em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Plural:</strong></td>\n\t\t\t<td><strong><em>die</em></strong><em> Häuschen</em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": null}, {"id": 39134346, "shortTitle": "Nomen auf -heit/-keit ", "name": "Nomen auf -heit/-keit ", "text": "<p><strong>Wortbildung: Nomen, die auf <em>-heit</em>/<em>-keit</em> enden</strong></p>\n\n\n\n<p><em>Du bestehst die Prüfung mit <strong>Sicherheit</strong>.</em><br>\n<br>\nAus vielen Adjektiven kannst du Nomen mit der Endung <em>-heit</em> oder <em>-keit</em> bilden. Nomen mit dieser Endung sind immer feminin. Wie alle Nomen schreibt man sie groß.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Adjektiv</td>\n\t\t\t<td>Nomen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>frei</em></td>\n\t\t\t<td><strong><em>die </em></strong><em>Frei<strong>heit</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>gesund</em></td>\n\t\t\t<td><strong><em>die </em></strong><em>Gesund<strong>heit</strong></em></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><em>möglich</em></td>\n\t\t\t<td><strong><em>die </em></strong><em>Möglich<strong>keit</strong></em></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n<p><br>\nAus Adjektiven mit der Endung „-ig“, „-lich“, „-bar“ und „-sam“ bildet man normalerweise Nomen mit der Endung „-keit“. Aber für viele andere Adjektive gibt es keine Regel.</p>\n", "ru": {"name": "Предлоги: двойное управление", "text": "<p><strong>Предлоги с двойным управлением: винительный падеж</strong></p>\n\n<p>Большинство предлогов управляют одним и тем же падежом. Но есть также предлоги, которые в различных контекстах требуют постановку существительного в разные падежи: иногда в дательный, а иногда в винительный. Такие предлоги называются предлогами с двойным управлением. Предлогов с двойным управлением в немецком языке девять: <em>in</em>,<em> an</em>,<em> unter</em>,<em> über</em>,<em> auf, vor</em>,<em> hinter</em>,<em> neben </em>und<em> zwischen.</em></p>\n\n<p>Предлоги с двойным управлением используются с винительным падежом при указании направления движения в ответе на вопрос <em>Wohin</em><em> …?</em></p>\n\n\n\n<p><strong><em>Wohin</em></strong><em> legen die Männer das Regal?<br>\nSie legen das Regal <strong>in den Lastwagen</strong>.</em></p>\n\n<p>Сельма и ее семья упаковывают свои вещи и загружают их в грузовик:</p>\n\n<p><em>Ibrahim stellt die Kiste <strong>in den Lastwagen</strong>.<br>\nAya stellt den Spiegel <strong>an die Wand</strong>.<br>\nSelma stellt die Tasche <strong>unter den Tisch</strong>.<br>\nAya hängt die Jacken <strong>über den Stuhl</strong>.<br>\nSelma setzt den Teddy <strong>auf die Tasche</strong>.<br>\nIbrahim legt den Teppich <strong>vor den Schrank</strong>.<br>\nSelma stellt die Stühle <strong>hinter das Regal</strong>.<br>\nAya legt die Lampe <strong>neben den Schrank</strong>.<br>\nIbrahim stellt die Kiste <strong>zwischen die Stühle</strong>.</em></p>\n\n\n\n<p><strong>Слияние предлогов с артиклями</strong></p>\n\n<p>Некоторые предлоги сливаются с артиклями, образуя сокращенные формы:</p>\n\n<p><em>in + das = <strong>ins</strong><br>\nan + das = <strong>ans</strong></em></p>\n\n<p>Существуют и другие варианты слияний, которые используются редко.</p>\n\n\n\n<p><strong>Глаголы движения в пространстве </strong></p>\n\n\n\n<p>1. Переходные глаголы <em>legen</em>, <em>stellen</em> и <em>setzen</em> описывают движение в пространстве и почти всегда сопровождаются...</p>\n\n<p>●&#160;&#160;&#160;&#160; ... дополнением в винительном падеже:<br>\n<em>Aya legt <strong>die Bücher</strong> in die Kiste.</em></p>\n\n<p>●&#160;&#160;&#160;&#160; ... обстоятельством места, отвечающим на вопрос <em>Wohin ...?<br>\nAya legt die Bücher <strong>in die Kiste</strong>.</em></p>\n\n<p>С такими глаголами часто используются предлоги с двойным управлением, требующие винительный падеж.</p>\n\n\n\n<p>2. Предлоги с винительным падежом используются также для выражения необходимости изменения местоположения. В таких случаях используются модальный глагол <em>sollen</em> (без второго глагола), а также глаголы <em>kommen</em> и <em>geh</em><em>ören</em>.</p>\n\n<p><em>Die Lampe soll <strong>über den Tisch</strong>.<br>\nDer Teddy kommt <strong>auf das Bett</strong>.<br>\nDas Familienfoto gehört <strong>an die Wand</strong>.</em></p>\n\n\n\n<p><br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>die Wechselpräposition: Некоторые предлоги места&#160;управляют двумя падежами. При указании на местонахождение (<em>Wo</em><em> ...?) </em>они требуют дательный падеж. При указании на направление (<em>Wohin</em><em> ...?)</em> – винительный.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 41560012, "shortTitle": "Nomen: Genus", "name": "Nomen: Genus", "text": "<p><strong>Die drei Artikel</strong></p>\n\n\n\n\n\n\n\n<p>Deutsche Nomen haben ein Genus, ein grammatisches Geschlecht. Sie sind maskulin, feminin oder neutral. Welches Geschlecht ein Nomen hat, erkennt man an dem Artikel, der vor dem Nomen steht:</p>\n\n<p>maskulin: <strong>der</strong><em><strong> </strong>Kaffee, </em><strong>der</strong><em> Tee, </em><strong>der</strong><em> Saft</em></p>\n\n<p>feminin: <strong>die</strong><em> Milch, </em><strong>die</strong><em> Limo, </em><strong>die</strong><em> Cola</em></p>\n\n<p>neutral: <strong>das</strong><em> Wasser, </em><strong>das</strong><em> Bier</em></p>\n\n<p>Leider gibt es kaum allgemeine Regeln dafür, welches Nomen welchen Artikel hat. Deshalb musst du jedes Nomen zusammen mit seinem Artikel lernen.</p>\n\n<p>In einem Wörterbuch findest du Informationen über das Geschlecht eines Nomens. Dort steht entweder der bestimmte Artikel oder <em>m.</em> (= maskulin), <em>f.</em> (= feminin),<em> n.</em> (= neutral).<br>\n<br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>das Nomen : Als Nomen bezeichnet man Lebewesen, Gegenstände oder Sachverhalte. Sie werden auch Substantive oder Hauptwörter&#160; genannt.</p>\n\n\t\t\t<p>der Artikel: Artikel sind Begleitwörter, die vor den Nomen stehen können. Die Wörter der, die und das&#160; sind die drei bestimmten Artikel, an denen man das grammatische Geschlecht eines Nomens erkennt.</p>\n\n\t\t\t<p>das Genus: Jedes Nomen hat ein Genus, das heißt, es hat ein bestimmtes grammatisches Geschlecht. Die Geschlechter sind maskulin, feminin und neutral. Maskuline oder männliche Nomen haben den Artikel der, feminine oder weibliche den Artikel die und neutrale Nomen den Artikel das.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": null}, {"id": 40400871, "shortTitle": "Nomen: Plural", "name": "Nomen: Plural", "text": "<p>Wenn man von zwei oder mehreren Personen oder Gegenständen der gleichen Art spricht, verwendet man die Mehrzahl – den Plural.</p>\n\n<p>Singular: <em>Das ist <strong>ein Stift</strong>. <strong>Der Stift</strong> kostet 1,50 Euro.</em></p>\n\n<p>Plural: <em>Das sind <strong>fünf Stifte</strong>. <strong>Die Stifte</strong> kosten 7,50 Euro.</em></p>\n\n<p>Es gibt im Deutschen verschiedene Formen der Pluralbildung. Es ist sehr schwierig, allgemeingültige Regeln dafür aufzustellen, welche Nomen welche Pluralendungen haben – und noch schwieriger, sich diese Regeln zu merken und anzuwenden. Deshalb lernst du jedes Nomen am besten mit dem bestimmten Artikel und dem Plural. Diese Informationen findest du in einem Wörterbuch. Meistens wird der Plural dort nicht als ganzes Wort geschrieben, sondern nur die Endung angegeben.</p>\n\n\n\n<p>Der Plural von <em>Stift</em> wird also mit der Endung <em>-e</em> gebildet, er lautet: <em>die</em> <em>Stifte.</em></p>\n\n\n\n<p>Der Plural von Buch wird also mit Umlaut (das Zeichen dafür ist ein Strich mit zwei Punkten darüber, wie du ihn in dem Bild oben siehst) &#160;und der Endung -er gebildet, er lautet: die Bücher.</p>\n\n<p>Es gibt fünf verschiedene Pluralendungen:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Endung</td>\n\t\t\t<td>Beispiel</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>-n</td>\n\t\t\t<td>die Brille, die Brillen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>-en</td>\n\t\t\t<td>die Zahl, die Zahlen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>-e</td>\n\t\t\t<td>der Stift, die Stifte</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>-er</td>\n\t\t\t<td>das Kind, die Kinder</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>-s</td>\n\t\t\t<td>das Foto, die Fotos</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Einige Nomen haben im Plural keine Endung.</p>\n\n<p>Beispiel:</p>\n\n<p><em>der Lehrer, die Lehrer</em></p>\n\n\n\n<p>Einige Nomen erhalten im Plural außerdem einen Umlaut auf einem Vokal innerhalb des Wortes</p>\n\n<p>Beispiele:</p>\n\n<p><em>der Notizbl<strong>o</strong>ck, die Notizbl<strong>ö</strong>cke</em></p>\n\n<p><em>das B<strong>u</strong>ch, die B<strong>ü</strong>cher</em></p>\n\n<p><em>der Flugh<strong>a</strong>fen, die Flugh<strong>ä</strong>fen</em></p>\n\n\n\n<p>Manche Wörter haben zwei mögliche Pluralformen.</p>\n\n<p>Ein Beispiel dafür ist: <em>die Pizza, die Pizzen/die Pizzas.</em></p>\n\n<p>Beide Pluralformen sind richtig und haben die gleiche Bedeutung.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>der Singular: Man verwendet den Singular, wenn man von einer einzelnen Person oder Sache spricht.</p>\n\n\t\t\t<p>der Plural: Man verwendet den Plural, wenn man von mehreren Personen oder Sachen spricht.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Существительное: множественное число", "text": "<p>Когда речь идет о двух и более лицах или предметах одного и того же рода, используется грамматическое число <em>Plural</em>, то есть множественное число.</p>\n\n<p>Единственное число: <em>Das ist <strong>ein Stift</strong>. <strong>Der Stift</strong> kostet 1,50 Euro.</em></p>\n\n<p>Множественное число: <em>Das sind <strong>fünf Stifte</strong>. <strong>Die Stifte</strong> kosten 7,50 Euro.</em></p>\n\n<p>В немецком языке существуют различные способы образования множественного числа. Одного правила на все случаи нет. Поэтому учить немецкие существительные надо всегда с артиклем и формой множественного числа. Эту информацию можно найти в любом словаре. Чаще всего словари приводят не полную форму множественного числа, а лишь соответствующее окончание.</p>\n\n\n\n<p>Так, множественное число слова <em>Stift</em> образуется путем добавления окончания <em>-e</em>: <em>die</em> <em>Stifte</em><em>.</em></p>\n\n\n\n<p>Множественное число слова <em>Buch</em> образуется путем добавления&#160;умлаута (на рисунке вверху ты видишь значок умлаута – две точки над штрихом) и&#160;окончания <em>-er</em>: <em>die</em> <em>B</em><em>ücher</em><em>.</em></p>\n\n<p>Существует пять разных окончаний множественного числа:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Окончание</td>\n\t\t\t<td>Пример</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>-n</td>\n\t\t\t<td>die Brille, die Brillen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>-en</td>\n\t\t\t<td>die Zahl, die Zahlen</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>-e</td>\n\t\t\t<td>der Stift, die Stifte</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>-er</td>\n\t\t\t<td>das Kind, die Kinder</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>-s</td>\n\t\t\t<td>das Foto, die Fotos</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>У некоторых существительных во множественном числе нет окончания.</p>\n\n<p>Пример:</p>\n\n<p><em>der Lehrer, die Lehrer</em></p>\n\n\n\n<p>Кроме того, у некоторых существительных в корне происходит смена гласной на умлаут.</p>\n\n<p>Примеры:</p>\n\n<p><em>der Notizbl<strong>o</strong>ck, die Notizbl<strong>ö</strong>cke</em></p>\n\n<p><em>das B<strong>u</strong>ch, die B<strong>ü</strong>cher</em></p>\n\n<p><em>der Flugh<strong>a</strong>fen, die Flugh<strong>ä</strong>fen</em></p>\n\n\n\n<p>Некоторые существительные имеют две формы множественного числа.</p>\n\n<p>Пример:</p>\n\n<p><em>die Pizza, die Pizzen/die Pizzas.</em></p>\n\n<p>Обе формы множественного числа правильны и имеют одинаковое значение.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>der Singular: Единственное число используется, когда речь идет об одном лице или предмете.</p>\n\n\t\t\t<p>der Plural: &#160;Множественное число используется, когда речь идет о нескольких лицах или предметах.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40510223, "shortTitle": "Nominalisierung", "name": "Nominalisierung (1) ", "text": "<p>Verben beschreiben normalerweise eine Handlung, einen Vorgang oder einen Zustand. Man kann Verben auch nominalisieren. Das heißt, man kann sie als eigenständige Nomen verwenden, indem man dem Infinitiv einen Artikel voranstellt. Nominalisierte Infinitive sind immer neutral. Wie andere Nomen auch werden sie großgeschrieben und dekliniert.</p>\n\n\n\n<p>Beispiele:</p>\n\n<p><strong>grillen -&gt; das Grillen</strong></p>\n\n<p><em>Yanis findet das Grillen wichtiger als das Training.</em></p>\n\n<p><strong>essen -&gt; das Essen</strong></p>\n\n<p><em>Nico soll die Tabletten nach dem Essen nehmen.</em></p>\n\n<p><strong>schlafen gehen -&gt; das Schlafengehen</strong></p>\n\n<p><em>Nico soll die Salbe vor dem Schlafengehen benutzen.</em></p>\n", "ru": {"name": "Субстантивация", "text": "<p>Глаголы обычно выражают действие, процесс или состояние. Глаголы можно субстантивировать, то есть преобразовывать их в существительные, ставя артикль перед инфинитивом. Субстантивированные глаголы (отглагольные существительные) всегда имеют средний род. Как и прочие существительные, они пишутся с заглавной буквы и склоняются.<br>\n&#160;</p>\n\n<p>Примеры:</p>\n\n<p><strong>grillen -&gt; das Grillen</strong></p>\n\n<p><em>Yanis findet das Grillen wichtiger als das Training.</em></p>\n\n<p><strong>essen -&gt; das Essen</strong></p>\n\n<p><em>Nico soll die Tabletten nach dem Essen nehmen.</em></p>\n\n<p><strong>schlafen gehen -&gt; das Schlafengehen</strong></p>\n\n<p><em>Nico soll die Salbe vor dem Schlafengehen benutzen.</em></p>\n"}}, {"id": 39120185, "shortTitle": "Nominalisierung", "name": "Nominalisierung (2)", "text": "<p><strong>Wiederholung: Finalsätze mit <em>um ... zu</em></strong></p>\n\n<p>Du kennst schon Finalsätze, die mit <em>um ... zu</em> gebildet werden.</p>\n\n<p>Beispiel:</p>\n\n<p><em>Max und Tarek brauchen Zeit, <strong>um zu planen</strong>.</em><br>\n<br>\n<br>\n<strong>Präposition <em>zu</em> + nominalisierter<span id=\"ck_editor_caret_marker\" style=\"display:none\"></span> Infinitiv</strong></p>\n\n<p>Man kann aus dem Verb auch ein Nomen bilden. Dann wird der Satz kürzer und manchmal auch einfacher. Man benutzt dann nicht <em>um ... zu</em>, sondern die Präposition <em>zu</em>.</p>\n\n<p>Ein nominalisierter Infinitiv ist immer neutral:<br>\n<strong><em>planen -&gt; das Planen</em></strong></p>\n\n<p>Nach der Präposition <em>zu</em> steht der Dativ:<br>\n<strong><em>zu + dem Planen -&gt; zum Planen</em></strong></p>\n\n<p><em>Max und Tarek brauchen Zeit <strong>zum Planen</strong>.</em></p>\n\n<p><br>\nWenn ein Satz länger ist, wird es komplizierter:</p>\n\n<p><em>Max und Tarek brauchen Zeit, <strong>um die Küche auszubauen</strong>.</em></p>\n\n<p><em>Max und Tarek brauchen Zeit <strong>zum Ausbauen der Küche</strong>.</em></p>\n\n<p>Das Akkusativobjekt im Nebensatz (<em>die Küche</em>) wird als Genitiv (<em>der Küche</em>) mit dem „neuen“ Nomen verbunden.<br>\n<br>\nBeide Sätze sind richtig und werden oft benutzt. Du kannst entscheiden, ob du lieber den Finalsatz oder <em>zu</em> + Nomen benutzen möchtest.</p>\n\n\n\n<p>Auch nach den Präpositionen <em>bei</em> und <em>von</em> steht manchmal ein nominalisierter Infinitiv.</p>\n\n<p>Beispiele:</p>\n\n<p><em>Tarek hört <strong>beim Kochen</strong> Musik.</em></p>\n\n<p><em>Max bekommt <strong>vom Joggen</strong> Rückenschmerzen.</em></p>\n\n\n", "ru": null}, {"id": 39121788, "shortTitle": "Nominalisierung", "name": "Nominalisierung (3)", "text": "<p><strong>Präposition <em>bei</em> + nominalisierter Infinitiv</strong></p>\n\n<p>Temporale Beziehungen drückt man oft mit einem Nebensatz aus. Solche Nebensätze, die zum Beispiel mit <em>als</em>, <em>während</em> oder <em>wenn</em> beginnen, kennst du schon.</p>\n\n<p>Wenn das Subjekt im Hauptsatz und im Nebensatz gleich ist, kannst du aber auch die Präposition <em>bei</em> und einen nominalisierten Infinitiv verwenden. Das ist manchmal einfacher.<br>\n<br>\nBeispiele:</p>\n\n<p>Temporaler Nebensatz mit <em>als</em>:</p>\n\n<p><strong><em>Als ich eingekauft habe,</em></strong><em> hatte ich einen Unfall.</em></p>\n\n<p><strong><em>Beim Einkaufen</em></strong><em> hatte ich einen Unfall.</em><br>\n<br>\nTemporaler Nebensatz mit <em>während</em>:</p>\n\n<p><strong><em>Während wir essen,</em></strong><em> unterhalten wir uns.</em></p>\n\n<p><strong><em>Beim Essen</em></strong><em> unterhalten wir uns.</em><br>\n<br>\nTemporaler Nebensatz mit <em>wenn</em>:</p>\n\n<p><strong><em>Wenn sie putzt,</em></strong><em> hört Aya immer Radio.</em></p>\n\n<p><strong><em>Beim Putzen</em></strong><em> hört Aya immer Radio.</em><br>\n<br>\nWenn ein Satz länger ist, wird es komplizierter:</p>\n\n<p><strong><em>Wenn sie das Badezimmer putzt,</em></strong><em> hört Aya immer Radio.</em></p>\n\n<p><strong><em>Beim Putzen des Badezimmers</em></strong><em> hört Aya immer Radio.</em></p>\n\n<p>Das Akkusativobjekt des wenn-Satzes (<em>das Badezimmer</em>) wird als Genitiv (<em>des Badezimmers</em>) mit dem „neuen“ Nomen verbunden.<br>\n<br>\nAchte darauf, dass nach dem nominalisierten Infinitiv kein Komma steht.</p>\n", "ru": null}, {"id": 40555477, "shortTitle": "Ortsnamen mit Artikel", "name": "Ortsnamen mit Artikel", "text": "<p>Einige Ländernamen haben einen Artikel. Gehört dein Heimatland dazu?</p>\n\n<p>maskulin:</p>\n\n<p><em>der Irak</em>*<em>, der Iran</em>*<em>, der Jemen, der Kongo, der Libanon, der Niger, der Oman, der Senegal, der Sudan, der Tschad</em></p>\n\n<p>feminin:</p>\n\n<p><em>die Demokratische Republik Kongo, die Dominikanische Republik, die Elfenbeinküste, die Mongolei, die Schweiz, die Slowakei, die Türkei, die Ukraine, die Zentralafrikanische Republik</em></p>\n\n<p>neutral:</p>\n\n<p><em>das Kosovo</em></p>\n\n<p>Plural:</p>\n\n<p><em>die Bahamas, die Kapverdischen Inseln, die Komoren, die Malediven, die Niederlande, die Philippinen, die Salomonen, die Seychellen, die USA / die Vereinigten Staaten, die Vereinigten Arabischen Emirate</em></p>\n\n\n\n<p>* Die maskulinen Ländernamen werden manchmal auch ohne Artikel verwendet, besonders <em>Irak</em> und <em>Iran</em>.<br>\n&#160;</p>\n\n<p>Wenn man über diese Länder spricht, muss man einige Besonderheiten beachten.&#160;</p>\n\n<p><strong><em>Woher kommst du?</em></strong></p>\n\n<p>Nach der Präposition <em>aus </em>steht der Artikel im Dativ:</p>\n\n<p><em>Ich komme <strong>aus dem Irak&#160;</strong>/&#160;<strong>aus der Schweiz&#160;</strong>/&#160;<strong>aus dem Kosovo</strong>&#160;/&#160;<strong>aus den USA</strong>.</em></p>\n\n<p>Wenn du von einer Inselgruppe kommst, kannst du auch die Präposition <em>von </em>+ Dativ benutzen:</p>\n\n<p><em>Ich komme <strong>von den Philippinen</strong>.</em></p>\n\n\n\n<p><strong><em>Wo lebst du?</em></strong></p>\n\n<p>Nach der Präposition <em>in </em>steht der Artikel im Dativ. Aus <em>in dem</em> wird <em>im</em>.</p>\n\n<p><em>Ich lebe <strong>im Irak&#160;</strong>/&#160;<strong>in der Schweiz&#160;</strong>/&#160;<strong>im Kosovo&#160;</strong>/&#160;<strong>in den USA</strong>.</em></p>\n\n<p>Wenn du von einer Inselgruppe kommst, kannst du auch die Präposition <em>auf </em>+ Dativ benutzen:</p>\n\n<p><em>Ich lebe <strong>auf den Philippinen</strong>.</em></p>\n\n\n\n<p><strong><em>Wohin reist du?</em></strong></p>\n\n<p>Hier verwendet man nicht die Präposition <em>nach</em>, sondern die Präposition <em>in </em>+ Akkusativ:</p>\n\n<p><em>Ich reise <strong>in den Irak&#160;</strong>/&#160;<strong>in die Schweiz&#160;</strong>/&#160;<strong>ins Kosovo</strong> (ins = in + das)/<strong>in die USA</strong>.</em></p>\n\n<p>Wenn du auf eine Insel reist, kannst du auch die Präposition <em>auf </em>+ Akkusativ benutzen:</p>\n\n<p><em>Ich reise <strong>auf die Philippinen</strong>.</em></p>\n\n\n\n<p><strong>Überblick Ländernamen&#160; </strong></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>ohne Artikel</td>\n\t\t\t<td>mit Artikel</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Woher ...?</strong></td>\n\t\t\t<td>aus</td>\n\t\t\t<td>aus + Dativartikel</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Wo ...?</strong></td>\n\t\t\t<td>in</td>\n\t\t\t<td>in + Dativartikel</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Wohin …?</strong></td>\n\t\t\t<td>nach</td>\n\t\t\t<td>in + Akkusativartikel</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Географические названия с артиклем", "text": "<p><strong>Названия стран с артиклем</strong></p>\n\n<p>Немецкие названия некоторых стран употребляются с артиклем. Твоя страна к ним относится?</p>\n\n<p>Мужской род:</p>\n\n<p><em>der Irak</em>*<em>, der Iran</em>*<em>, der Jemen, der Kongo, der Libanon, der Niger, der Oman, der Senegal, der Sudan, der Tschad</em></p>\n\n<p>Женский род:</p>\n\n<p><em>die Demokratische Republik Kongo, die Dominikanische Republik, die Elfenbeinküste, die Mongolei, die Schweiz, die Slowakei, die Türkei, die Ukraine, die Zentralafrikanische Republik</em></p>\n\n<p>Средний род:</p>\n\n<p><em>das</em> <em>Kosovo</em></p>\n\n<p>Множественное число:</p>\n\n<p><em>die Bahamas, die Kapverdischen Inseln, die Komoren, die Malediven, die Niederlande, die Philippinen, die Salomonen, die Seychellen, die USA/die Vereinigten Staaten, die Vereinigten Arabischen Emirate</em></p>\n\n\n\n<p>* Названия стран мужского рода иногда используют без артикля, например: <em>Irak</em> и <em>Iran</em>.</p>\n\n\n\n<p>Говоря о странах, название которых употребляется с артиклем, необходимо учитывать некоторые особенности.</p>\n\n<p><strong><em>Woher</em></strong> <strong><em>kommst</em></strong> <strong><em>du</em></strong><strong><em>?</em></strong></p>\n\n<p>После предлога <em>aus</em> артикль стоит в дательном падеже:</p>\n\n<p><em>Ich komme <strong>aus dem Irak</strong>/<strong>aus der Schweiz</strong>/<strong>aus dem Kosovo</strong> /<strong>aus den USA</strong>.</em></p>\n\n<p>Если ты говоришь о группе островов, ты можешь также использовать предлог <em>von</em> + дательный падеж:</p>\n\n<p><em>Ich komme <strong>von den Philippinen</strong>.</em></p>\n\n\n\n<p><strong><em>Wo</em></strong> <strong><em>lebst</em></strong> <strong><em>du</em></strong><strong><em>?</em></strong></p>\n\n<p>После предлога <em>in</em> артикль стоит в дательном падеже.&#160; <em>In</em> <em>dem</em> превращается в <em>im</em>.</p>\n\n<p><em>Ich lebe <strong>im Irak</strong>/<strong>in der Schweiz</strong>/<strong>im Kosovo</strong>/<strong>in den USA</strong>.</em></p>\n\n<p>Если ты говоришь о группе островов, ты можешь также использовать предлог <em>auf</em> + дательный падеж:</p>\n\n<p><em>Ich lebe <strong>auf den Philippinen</strong>.</em></p>\n\n\n\n<p><strong><em>Wohin</em></strong> <strong><em>reist</em></strong> <strong><em>du</em></strong><strong><em>?</em></strong></p>\n\n<p>Здесь используется не предлог <em>nach</em>, а предлог <em>in</em> + винительный падеж:</p>\n\n<p><em>Ich reise <strong>in den Irak</strong>/<strong>in die Schweiz</strong>/<strong>ins Kosovo</strong> (ins = in + das)/<strong>in die USA</strong>.</em></p>\n\n<p>Если ты едешь на острова, ты также можешь использовать предлог <em>auf</em> + винительный падеж:</p>\n\n<p><em>Ich reise <strong>auf die Philippinen</strong>.</em></p>\n\n\n\n<p><strong>Названия стран </strong></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>без артикля</td>\n\t\t\t<td>с артиклем</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Woher ...?</strong></td>\n\t\t\t<td>aus</td>\n\t\t\t<td>aus + артикль в дательном падеже</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Wo ...?</strong></td>\n\t\t\t<td>in</td>\n\t\t\t<td>in + артикль в дательном падеже</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Wohin …?</strong></td>\n\t\t\t<td>nach</td>\n\t\t\t<td>in + артикль в винительном падеже</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40490017, "shortTitle": "Possessivartikel", "name": "Possessivartikel", "text": "<p><strong>Wiederholung: Possessivartikel </strong></p>\n\n<p><em>Ich habe <strong>meinen </strong>Bruder angerufen. Aber <strong>mein</strong> Bruder kann nicht kommen.</em></p>\n\n<p>Um einen Besitz oder eine Zugehörigkeit auszudrücken, verwendet man die Possessivartikel anstelle der unbestimmten Artikel.</p>\n\n<p>Hier siehst du eine Übersicht über die verschiedenen Personen und die entsprechenden Possessivartikel:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Person</td>\n\t\t\t<td>Possessivartikel</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ich</td>\n\t\t\t<td>mein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>du</td>\n\t\t\t<td>dein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>er/es</td>\n\t\t\t<td>sein</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td>ihr</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>wir</td>\n\t\t\t<td>unser</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>ihr</td>\n\t\t\t<td>euer</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>sie</td>\n\t\t\t<td>ihr</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Sie</td>\n\t\t\t<td>Ihr</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Wiederholung: Deklination der Possessivartikel</strong></p>\n\n<p>Die Endungen der Possessivartikel sind im Singular identisch mit den Endungen der unbestimmten Artikel:</p>\n\n<ul>\n\t<li>Im Nominativ und im Akkusativ erhält der&#160;Possessivartikel&#160;die Endung <em>-e</em>, wenn er&#160;vor einem femininen Nomen oder einem Nomen im Plural steht.</li>\n\t<li>Im Akkusativ erhält der&#160;Possessivartikel&#160;die Endung <em>-en</em>, wenn er&#160;vor einem maskulinen Nomen steht.</li>\n</ul>\n\n\n\n<p>Personalpronomen: ich<br>\nPossessivartikel: mein<br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td>Akkusativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>mein Bruder</td>\n\t\t\t<td>mein<strong><em>en</em></strong> Bruder</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>mein<strong>e </strong>Schwester</td>\n\t\t\t<td>mein<strong>e</strong> Schwester</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>mein Kind</td>\n\t\t\t<td>mein Kind</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>mein<strong>e</strong> Eltern</td>\n\t\t\t<td>mein<strong>e</strong> Eltern</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Personalpronomen: ihr<br>\nPossessivartikel: euer&#160;</p>\n\n<p><br>\nAchte auf die unregelmäßigen Formen von <em>euer</em>, wenn du eine Endung anfügst:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Nominativ</td>\n\t\t\t<td>Akkusativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>euer Bruder</td>\n\t\t\t<td><strong><em>euren</em></strong> Bruder</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong><em>eure </em></strong>Schwester</td>\n\t\t\t<td><strong><em>eure</em></strong> Schwester</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>euer Kind</td>\n\t\t\t<td>euer Kind</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong><em>eure</em></strong> Eltern</td>\n\t\t\t<td><strong><em>eure</em></strong> Eltern</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\t\t\tder Possessivartikel: Der Possessivartikel ist ein Artikelwort, das einen Besitz oder eine Zugehörigkeit ausdrückt.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": null}, {"id": 40400619, "shortTitle": "Unbestimmt oder bestimmt?", "name": "Unbestimmt oder bestimmt?", "text": "<p><em>Das ist <strong>eine</strong> Tasche. </em></p>\n\n<p>Man verwendet den unbestimmten Artikel, …</p>\n\n<ul>\n\t<li>wenn man sagt, um welche Art von Gegenstand oder Person es sich allgemein handelt.</li>\n\t<li>wenn der Gegenstand oder die Person noch nicht bekannt ist und vorher noch nicht benannt wurde.</li>\n</ul>\n\n\n\n<p><em>Das ist <strong>die</strong> Tasche von Jenny.</em></p>\n\n<p>Man verwendet den bestimmten Artikel, …</p>\n\n<ul>\n\t<li>wenn man über einen bestimmten Gegenstand oder über eine bestimmte Person spricht, die dem Sprecher und dem Zuhörer schon bekannt ist.</li>\n\t<li>wenn man genauere Informationen über den Gegenstand hat, z. B. wenn man sagt, wem etwas gehört.</li>\n</ul>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>der bestimmte Artikel : Die Artikel <em>der</em>, <em>die</em>, <em>das</em> sind bestimmte Artikel.</p>\n\n\t\t\t<p>der unbestimmte Artikel : Die Artikel <em>ein</em>, <em>eine</em> sind unbestimmte Artikel.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": null}, {"id": 40450014, "shortTitle": "Wortbildung: Berufe", "name": "Wortbildung: Berufe", "text": "<p>Im Deutschen unterscheiden sich Berufsbezeichnungen von Männern und Frauen normalerweise voneinander.</p>\n\n<p>Meistens bildet man die feminine Form, indem man an die maskuline Form die Endung <em>-in</em> anhängt. Im Gegensatz zu maskulinen Berufsbezeichnungen haben feminine Berufsbezeichnungen mit <em>-in</em> einen regelmäßigen Plural:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>feminin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>der Lehrer</td>\n\t\t\t<td>die Lehrer<strong>in</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>die Lehrer</td>\n\t\t\t<td>die Lehrer<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>feminin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>der Ingenieur</td>\n\t\t\t<td>die Ingenieur<strong>in</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>die Ingenieure</td>\n\t\t\t<td>die Ingenieur<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>feminin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>der Pilot</td>\n\t\t\t<td>die Pilotin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>die Piloten</td>\n\t\t\t<td>die Pilot<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>feminin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>der Computerexperte*</td>\n\t\t\t<td>die Computerexpert<strong>in</strong>*</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>die Computerexperten</td>\n\t\t\t<td>die Computerexpert<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>* Wenn die maskuline Berufsbezeichnung auf <em>-e</em> endet, ersetzt man bei der femininen Bezeichnung das <em>-e</em> durch <em>-in</em>.</p>\n\n\n\n<p>Manchmal erhält die feminine Form zusätzlich einen Umlaut:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>feminin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>der Arzt</td>\n\t\t\t<td>die <strong><em>Ä</em></strong>rzt<strong>in</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>die Ärzte</td>\n\t\t\t<td>die <strong><em>Ä</em></strong>rzt<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>feminin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>der Koch</td>\n\t\t\t<td>die K<strong><em>ö</em></strong>ch<strong>in</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>die Köche</td>\n\t\t\t<td>die K<strong><em>ö</em></strong>ch<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>feminin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>der Anwalt</td>\n\t\t\t<td>die Anw<strong><em>ä</em></strong>lt<strong>in</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>die Anwälte</td>\n\t\t\t<td>die Anw<strong><em>ä</em></strong>lt<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Es gibt auch einige feminine Berufsbezeichnungen, die ganz anders gebildet werden:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>feminin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>der Bankkaufmann</td>\n\t\t\t<td>die Bankkauf<strong>frau</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>die Bankkaufmänner</td>\n\t\t\t<td>die Bankkauf<strong>frauen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>maskulin</td>\n\t\t\t<td>feminin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Singular</td>\n\t\t\t<td>der Krankenpfleger</td>\n\t\t\t<td>die Kranken<strong>schwester</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Plural</td>\n\t\t\t<td>die Krankenpfleger</td>\n\t\t\t<td>die Kranken<strong>schwestern</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Wenn man von einer Berufsgruppe spricht, zu der Männer und Frauen gehören, verwendet man oft den maskulinen Plural, das sogenannte „generische Maskulin“. Um den unterschiedlichen Geschlechtern gerecht zu werden, gebraucht man mittlerweile allerdings immer häufiger andere Pluralformen. Üblich sind z. B. geschlechtsneutrale Bildungen oder Formen mit dem sogenannten Gendersternchen oder auch dem Doppelpunkt. Diese Schreibungen mit Sternchen oder Doppelpunkt sind aber noch nicht offiziell anerkannt.&#160;</p>\n\n<p><em>Viele <strong>Lehrer*innen</strong> (oder: <strong>Lehrer:innen</strong>) &#160;arbeiten auch am Wochenende.&#160;</em></p>\n\n<p><em><strong>Bankkaufleute</strong> arbeiten in einer Bank.</em>&#160;</p>\n", "ru": {"name": "Словообразование: профессии", "text": "<p>В немецком языке названия профессий имеют различное написание для лиц мужского и женского пола.</p>\n\n<p>В большинстве случаев форма женского рода образуется за счет прибавления окончания <em>-</em><em>in</em> к названию профессии мужского рода. Множественное число названия профессий женского рода на <em>-</em><em>in</em> образуют по общим правилам. Названия профессий мужского рода образуют множественное число различными способами.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>Женский род</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ед. число</td>\n\t\t\t<td>der Lehrer</td>\n\t\t\t<td>die Lehrer<strong>in</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число</td>\n\t\t\t<td>die Lehrer</td>\n\t\t\t<td>die Lehrer<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>Женский род</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ед. число</td>\n\t\t\t<td>der Ingenieur</td>\n\t\t\t<td>die Ingenieur<strong>in</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число</td>\n\t\t\t<td>die Ingenieure</td>\n\t\t\t<td>die Ingenieur<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>Женский род</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ед. число</td>\n\t\t\t<td>der Pilot</td>\n\t\t\t<td>die Pilotin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число</td>\n\t\t\t<td>die Piloten</td>\n\t\t\t<td>die Pilot<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>Женский род</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ед. число</td>\n\t\t\t<td>der Computerexperte*</td>\n\t\t\t<td>die Computerexpert<strong>in</strong>*</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число</td>\n\t\t\t<td>die Computerexperten</td>\n\t\t\t<td>die Computerexpert<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>*Если название профессии в мужском роде оканчивается на <em>-e</em>, то в форме женского рода <em>-e</em> заменяется на <em>-in</em>.</p>\n\n\n\n<p>Иногда корневая гласная&#160;в форме женского рода меняется на умлаут:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>Женский род</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ед. число</td>\n\t\t\t<td>der Arzt</td>\n\t\t\t<td>die <strong><em>Ä</em></strong>rzt<strong>in</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число</td>\n\t\t\t<td>die Ärzte</td>\n\t\t\t<td>die <strong><em>Ä</em></strong>rzt<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>Женский род</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ед. число</td>\n\t\t\t<td>der Koch</td>\n\t\t\t<td>die K<strong><em>ö</em></strong>ch<strong>in</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число</td>\n\t\t\t<td>die Köche</td>\n\t\t\t<td>die K<strong><em>ö</em></strong>ch<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>Женский род</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ед. число</td>\n\t\t\t<td>der Anwalt</td>\n\t\t\t<td>die Anw<strong><em>ä</em></strong>lt<strong>in</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число</td>\n\t\t\t<td>die Anwälte</td>\n\t\t\t<td>die Anw<strong><em>ä</em></strong>lt<strong>innen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Существуют также другие способы образования названий профессий женского рода:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>Женский род</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ед. число</td>\n\t\t\t<td>der Bankkaufmann</td>\n\t\t\t<td>die Bankkauf<strong>frau</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число</td>\n\t\t\t<td>die Bankkaufmänner</td>\n\t\t\t<td>die Bankkauf<strong>frauen</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Мужской род</td>\n\t\t\t<td>Женский род</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Ед. число</td>\n\t\t\t<td>der Krankenpfleger</td>\n\t\t\t<td>die Kranken<strong>schwester</strong></td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число</td>\n\t\t\t<td>die Krankenpfleger</td>\n\t\t\t<td>die Kranken<strong>schwestern</strong></td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Если говорят о профессиональной группе, в которую входят как мужчины, так и женщины, то обычно используют множественное число названия профессии мужского рода,&#160;так называемый “общий мужской род”. Чтобы сохранить справедливость в отношении обоих полов, в наше время все чаще используют другие формы множественного числа, например, гендерно-нейтральную: с так называемой гендерной звездочкой или двоеточием. Такое написание, тем не менее, не является официальным.</p>\n\n<p><em>Viele <strong>Ärzte und Ärztinnen</strong> arbeiten auch nachts.</em></p>\n\n<p><strong><em>Bankkaufleute</em></strong><em> arbeiten in einer Bank.</em></p>\n"}}, {"id": 40405741, "shortTitle": "Wortbildung: Komposita", "name": "Wortbildung: Komposita", "text": "<p><strong>Komposita: zusammengesetzte Nomen</strong></p>\n\n<p>Im Deutschen kannst du zwei oder mehr Nomen zu einem neuen Wort mit einer anderen Bedeutung verbinden. Du findest im Deutschen sehr viele dieser Komposita, die fester Bestandteil des deutschen Wortschatzes sind.</p>\n\n<p>Ein Kompositum besteht aus einem Grundwort, das immer am Ende der Wortverbindung steht, und einem oder mehreren Bestimmungswörtern, die das Grundwort näher erklären. Der Artikel des Grundwortes ist auch der Artikel des Kompositums.<br>\n<br>\nSieh dir einige Komposita an, die man aus dem Grundwort <em>Schrank</em> mit verschiedenen Bestimmungswörtern bilden kann:&#160;</p>\n\n<p><em>der Spiegel + <strong>der Schrank</strong>:&#160;<br>\n<strong>der</strong> Spiegel<strong>schrank</strong></em><br>\n(ein Schrank mit Spiegeltüren)<br>\n(a cupboard with mirrored doors)</p>\n\n<p>die Küche + <em><strong>der Schrank</strong></em>:&#160;<br>\n<em><strong>der</strong></em> Küchen<em><strong>schrank</strong></em>*<br>\n(ein Schrank, der in der Küche steht)<br>\n(a cupboard that stands in the kitchen)</p>\n\n<p>das Schlafzimmer + der <em><strong>Schrank</strong></em>:&#160;<br>\n<em><strong>der</strong></em> Schlafzimmer<em><strong>schrank</strong></em><br>\n(ein Schrank, der im Schlafzimmer steht)<br>\n(a cupboard that stands in the bedroom)</p>\n\n<p>die Bücher + <em><strong>der Schrank</strong></em>:&#160;<br>\n<em><strong>der</strong></em> Bücher<em><strong>schrank</strong></em><br>\n(ein Schrank, in dem Bücher stehen)<br>\n&#160;(a cupboard used to keep books)</p>\n\n<p>* Wenn man ein Wort aus zwei oder mehr Nomen zusammensetzt, wird zwischen dem Bestimmungswort und dem Grundwort manchmal ein Laut eingefügt. Nach <em>-e</em> (z. B. bei <em>Küche</em>) ist das oft ein <em>-n</em>. In vielen Fällen verwendet man ein <em>-s</em>, manchmal auch <em>-es</em>, ­<em>-ens</em> oder <em>-er</em>. Da du Komposita aber normalerweise nicht selbst bildest, sondern sie genauso lernst wie andere Wörter auch, brauchst du dir dazu keine Regeln zu merken.</p>\n\n<p>Das Bestimmungswort ist oft ein Nomen, es kann aber auch ein Verb oder ein Adjektiv sein, z. B.:<br>\n<br>\n<em>schlafen + <strong>das Zimmer:&#160;</strong><br>\n<strong>das</strong> Schlaf<strong>zimmer</strong></em></p>\n\n<p><em>tanken + <strong>die Stelle:&#160;</strong><br>\n<strong>die</strong> Tank<strong>stelle</strong></em></p>\n\n<p><em>hoch + <strong>das Haus:&#160;</strong><br>\n<strong>das</strong> Hoch<strong>haus</strong></em></p>\
