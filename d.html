\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td style=\"height:25px; width:92px\">\n\t\t\t<p>die Monate</p>\n\n\t\t\t<p>die Wochen</p>\n\n\t\t\t<p>die Jahre</p>\n\t\t\t</td>\n\t\t\t<td style=\"height:25px; width:132px\">\n\t\t\t<p><em>seit drei Monate<strong>n</strong></em></p>\n\n\t\t\t<p><em>seit drei Wochen</em></p>\n\n\t\t\t<p><em>seit drei Jahre<strong>n</strong></em></p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Поскольку действие, событие или ситуация еще продолжаются, в предложении с предлогом <em>seit</em> обычно используется настоящее время.</p>\n\n<p>Präsens:&#160;<em>Nico <strong>wohnt</strong> seit drei Wochen bei Inge.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"0\" cellspacing=\"0\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td style=\"width:614px\">\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>die Präposition: Предлоги - это короткие слова, которые соединяют другие слова или группы слов. Они указывают на взаимосвязь между живыми существами, &#160;неодушевленными предметами или явлениями.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 39134715, "shortTitle": "Präpositionen: während", "name": "Temporale Präpositionen: während", "text": "<p><strong><em>während</em> als Präposition</strong></p>\n\n\n\n<p><strong>Während</strong> <strong>sie arbeiteten</strong><em><strong>,</strong> mussten die Bergleute einen Helm tragen..</em></p>\n\n<p>Das Wort <em>während</em> kennst du schon als Konjunktion, die einen Nebensatz einleitet. Man benutzt <em>während</em>, wenn zwei Zustände oder Handlungen gleichzeitig andauern oder stattfinden.<br>\n<br>\nDu kannst <em>während</em> auch als Präposition verwenden. Dann steht nach <em>während</em> kein Nebensatz, sondern ein Nomen.</p>\n\n<p><strong>Während der Arbeit</strong>&#160;<em>mussten die Bergleute einen Helm tragen.</em></p>\n\n<p><br>\nNach der Präposition <em>während</em> steht das Nomen normalerweise im Genitiv.</p>\n\n<p>Beispiele:</p>\n\n<p><strong><em>Während der Industrialisierung</em></strong><em> sind viele Menschen ins Ruhrgebiet gezogen.</em></p>\n\n<p><strong><em>Während des Aufschwungs</em></strong><em> hatte die Region fast 6 Millionen Einwohner.</em></p>\n\n<p><strong><em>Während des Wohnungsbauprojekts</em></strong><em> hat Selma viel über das Ruhrgebiet gelernt.</em></p>\n\n\n\n<p>In der gesprochenen Sprache benutzt man aber oft den Dativ.</p>\n\n<p><strong>Genitiv</strong>: <strong><em>Während des Praktikums</em></strong><em> lernt Selma viel über Architektur.</em></p>\n\n<p><strong>Dativ</strong>: <strong><em>Während dem Praktikum</em></strong><em> lernt Selma sehr viel über Architektur.</em></p>\n\n\n", "ru": null}, {"id": 40585492, "shortTitle": "Wechselpräpositionen", "name": "Wechselpräpositionen (3)", "text": "<p><strong>Wechselpräpositionen mit Akkusativ</strong></p>\n\n<p>Die meisten Präpositionen verlangen immer denselben Fall. Es gibt jedoch Präpositionen, die den Kasus wechseln können. Manchmal stehen sie mit Dativ und manchmal mit Akkusativ. Deshalb heißen diese Präpositionen Wechselpräpositionen. Es gibt neun Wechselpräpositionen:&#160;<em>in</em>,<em> an</em>,<em> unter</em>,<em> über</em>,<em> auf, vor</em>,<em> hinter</em>,<em> neben </em>und<em> zwischen.&#160;</em>Sie verlangen den Akkusativ, wenn sie eine Richtung angeben und auf die Frage <em>Wohin …?</em> antworten.&#160;</p>\n\n\n\n<p><strong><em>Wohin</em></strong><em> legen die Männer das Regal?<br>\nSie legen das Regal <strong>in den Lastwagen</strong>.</em></p>\n\n<p>Selma und ihre Familie packen ihre Sachen ein und laden sie in den LKW:</p>\n\n<p><em>Ibrahim stellt die Kiste <strong>in den Lastwagen</strong>.<br>\nAya stellt den Spiegel <strong>an die Wand</strong>.<br>\nSelma stellt die Tasche <strong>unter den Tisch</strong>.<br>\nAya hängt die Jacken <strong>über den Stuhl</strong>.<br>\nSelma setzt den Teddy <strong>auf die Tasche</strong>.<br>\nIbrahim legt den Teppich <strong>vor den Schrank</strong>.<br>\nSelma stellt die Stühle <strong>hinter das Regal</strong>.<br>\nAya legt die Lampe <strong>neben den Schrank</strong>.<br>\nIbrahim stellt die Kiste <strong>zwischen die Stühle</strong>.</em></p>\n\n<p><strong>Kurzformen:</strong></p>\n\n<p>Einige Präpositionen werden mit dem folgenden Artikel zu Kurzformen zusammengezogen.</p>\n\n<p><em>in + das = <strong>ins</strong><br>\nan + das = <strong>ans</strong></em></p>\n\n<p>Manchmal wirst du auch andere Kurzformen hören, die aber nicht immer verwendet werden.</p>\n\n<p><strong>Richtungsverben</strong></p>\n\n<p>1. Die Verben <em>legen</em>, <em>stellen</em> und <em>setzen</em> beschreiben eine räumliche Bewegung und verlangen fast immer ...</p>\n\n<ul>\n\t<li>... ein Akkusativobjekt:<br>\n\t<em>Aya legt <strong>die Bücher</strong> in die Kiste.</em></li>\n\t<li>... eine Ergänzung, die die Frage <em>Wohin ...?</em> beantwortet.<br>\n\t<em>Aya legt die Bücher <strong>in die Kiste</strong>.</em></li>\n</ul>\n\n<p>Deshalb werden diese Verben sehr häufig mit einer Wechselpräposition kombiniert, der der Akkusativ folgt.&#160;</p>\n\n\n\n<p>2. Man braucht Wechselpräpositionen mit Akkusativ auch, wenn man ausdrücken möchte, wohin etwas gelegt, gestellt oder gesetzt werden soll. Dann verwendet man die Verben <em>sollen</em> (ohne zweites Verb), <em>kommen</em> oder <em>gehören</em>.&#160;</p>\n\n<p><em>Die Lampe soll <strong>über den Tisch</strong>.<br>\nDer Teddy kommt <strong>auf das Bett</strong>.<br>\nDas Familienfoto gehört <strong>an die Wand</strong>.</em><br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\t\t\tdie <span class=\"invalid_placeholder\">Wechselpräposition</span>: Einige lokale Präpositionen sind Wechselpräpositionen, die mit zwei verschiedenen Fällen gebraucht werden können. Wenn sie auf die Frage <em>Wo ...?</em> antworten, verlangen sie den Dativ. Antworten sie auf die Frage <em>Wohin ...?</em>, regieren sie den Akkusativ.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Предлоги: двойное управление", "text": "<p><strong>Предлоги с двойным управлением: винительный падеж</strong></p>\n\n<p>Большинство предлогов управляют одним и тем же падежом. Но есть также предлоги, которые в различных контекстах требуют постановку существительного в разные падежи: иногда в дательный, а иногда в винительный. Такие предлоги называются предлогами с двойным управлением. Предлогов с двойным управлением в немецком языке девять: <em>in</em>,<em> an</em>,<em> unter</em>,<em> über</em>,<em> auf, vor</em>,<em> hinter</em>,<em> neben </em>und<em> zwischen.</em></p>\n\n<p>Предлоги с двойным управлением используются с винительным падежом при указании направления движения в ответе на вопрос <em>Wohin</em><em> …?</em></p>\n\n\n\n<p><strong><em>Wohin</em></strong><em> legen die Männer das Regal?<br>\nSie legen das Regal <strong>in den Lastwagen</strong>.</em></p>\n\n<p>Сельма и ее семья упаковывают свои вещи и загружают их в грузовик:</p>\n\n<p><em>Ibrahim stellt die Kiste <strong>in den Lastwagen</strong>.<br>\nAya stellt den Spiegel <strong>an die Wand</strong>.<br>\nSelma stellt die Tasche <strong>unter den Tisch</strong>.<br>\nAya hängt die Jacken <strong>über den Stuhl</strong>.<br>\nSelma setzt den Teddy <strong>auf die Tasche</strong>.<br>\nIbrahim legt den Teppich <strong>vor den Schrank</strong>.<br>\nSelma stellt die Stühle <strong>hinter das Regal</strong>.<br>\nAya legt die Lampe <strong>neben den Schrank</strong>.<br>\nIbrahim stellt die Kiste <strong>zwischen die Stühle</strong>.</em></p>\n\n\n\n<p><strong>Слияние предлогов с артиклями</strong></p>\n\n<p>Некоторые предлоги сливаются с артиклями, образуя сокращенные формы:</p>\n\n<p><em>in + das = <strong>ins</strong><br>\nan + das = <strong>ans</strong></em></p>\n\n<p>Существуют и другие варианты слияний, которые используются редко.</p>\n\n\n\n<p><strong>Глаголы движения в пространстве </strong></p>\n\n\n\n<p>1. Переходные глаголы <em>legen</em>, <em>stellen</em> и <em>setzen</em> описывают движение в пространстве и почти всегда сопровождаются...</p>\n\n<p>●&#160;&#160;&#160;&#160; ... дополнением в винительном падеже:<br>\n<em>Aya legt <strong>die Bücher</strong> in die Kiste.</em></p>\n\n<p>●&#160;&#160;&#160;&#160; ... обстоятельством места, отвечающим на вопрос <em>Wohin ...?<br>\nAya legt die Bücher <strong>in die Kiste</strong>.</em></p>\n\n<p>С такими глаголами часто используются предлоги с двойным управлением, требующие винительный падеж.</p>\n\n\n\n<p>2. Предлоги с винительным падежом используются также для выражения необходимости изменения местоположения. В таких случаях используются модальный глагол <em>sollen</em> (без второго глагола), а также глаголы <em>kommen</em> и <em>geh</em><em>ören</em>.</p>\n\n<p><em>Die Lampe soll <strong>über den Tisch</strong>.<br>\nDer Teddy kommt <strong>auf das Bett</strong>.<br>\nDas Familienfoto gehört <strong>an die Wand</strong>.</em></p>\n\n\n\n<p><br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>die Wechselpräposition: Некоторые предлоги места&#160;управляют двумя падежами. При указании на местонахождение (<em>Wo</em><em> ...?) </em>они требуют дательный падеж. При указании на направление (<em>Wohin</em><em> ...?)</em> – винительный.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n"}}, {"id": 40585806, "shortTitle": "Wechselpräpositionen", "name": "Wechselpräpositionen (4)", "text": "<p><strong>Wechselpräpositionen mit Dativ</strong></p>\n\n<p>Die neun Wechselpräpositionen <em>in</em>,<em> an</em>,<em> unter</em>,<em> über</em>,<em> auf, vor</em>,<em> hinter</em>,<em> neben </em>und<em> zwischen</em> stehen mit dem Dativ, wenn sie auf die Frage <em>Wo ...?</em> antworten.</p>\n\n\n\n<p><strong><em>Wo</em></strong><em> sitzt Ibrahim?<br>\nIbrahim sitzt <strong>auf dem Sofa</strong>.</em></p>\n\n<p>Selma und ihre Familie haben ihre neue Wohnung eingerichtet:</p>\n\n<p><em>Das Sofa steht <strong>im Wohnzimmer</strong>. (im = in + dem)<br>\nEin großes Bild hängt <strong>an der Wand</strong>.<br>\nDas Sofa steht <strong>unter dem Bild</strong>.<br>\nDas Bild hängt <strong>über dem Sofa</strong>.<br>\nEine kleine Pflanze steht <strong>auf dem Tisch</strong>.<br>\nEin kleiner Tisch steht <strong>vor dem Sofa</strong>.<br>\nDie kleine Lampe steht <strong>hinter einer großen Pflanze</strong>.<br>\nDie Lampe steht <strong>neben dem Sofa</strong>.<br>\nDie Pflanze steht <strong>zwischen der Tür und dem Sofa</strong>.</em></p>\n\n<p><strong>Kurzformen</strong><br>\nEinige Präpositionen werden mit dem folgenden Artikel zu Kurzformen zusammengezogen:</p>\n\n<p><em>in + dem = <strong>im</strong></em></p>\n\n<p><em>an + dem = <strong>am</strong></em></p>\n\n<p>Manchmal wirst du auch andere Kurzformen hören, die aber nicht immer verwendet werden.</p>\n\n<p><strong>Positionsverben</strong><br>\nDie Verben <em>liegen</em>, <em>stehen</em> und <em>sitzen</em> beschreiben eine räumliche Lage und verlangen fast immer eine Ergänzung, die die Frage <em>Wo ...?</em> beantwortet. Deshalb werden diese Verben sehr häufig mit einer Wechselpräposition kombiniert, der der Dativ folgt.</p>\n\n\n", "ru": {"name": "Предлоги: двойное управление", "text": "<p><strong>Предлоги с двойным управлением: дательный падеж</strong></p>\n\n<p>Девять предлогов с двойным управлением <em>in</em>,<em> an</em>,<em> unter</em>,<em> über</em>,<em> auf</em><em>,</em><em> vor</em>,<em> hinter</em>,<em> neben</em> и<em> zwischen</em> управляют дательным падежом в ответах на вопрос <em>Wo</em><em> ...?</em>.</p>\n\n<p><strong></strong></p>\n\n<p><strong><em>Wo</em></strong><em> sitzt Ibrahim?<br>\nIbrahim sitzt <strong>auf dem Sofa</strong>.</em></p>\n\n<p>Сельма и ее семья обставили новую квартиру:</p>\n\n<p><em>Das Sofa steht <strong>im Wohnzimmer</strong>. (im = in + dem)<br>\nEin großes Bild hängt <strong>an der Wand</strong>.<br>\nDas Sofa steht <strong>unter dem Bild</strong>.<br>\nDas Bild hängt <strong>über dem Sofa</strong>.<br>\nEine kleine Pflanze steht <strong>auf dem Tisch</strong>.<br>\nEin kleiner Tisch steht <strong>vor dem Sofa</strong>.<br>\nDie kleine Lampe steht <strong>hinter einer großen Pflanze</strong>.<br>\nDie Lampe steht <strong>neben dem Sofa</strong>.<br>\nDie Pflanze steht <strong>zwischen der Tür und dem Sofa</strong>.</em></p>\n\n\n\n<p><strong>Слияние предлогов с артиклями</strong></p>\n\n<p>Некоторые предлоги сливаются с артиклями, образуя сокращенные формы:</p>\n\n<p><em>in + dem = <strong>im</strong><br>\nan + dem = <strong>am</strong></em></p>\n\n<p>Существуют и другие варианты слияний, которые используются редко.</p>\n\n\n\n<p><strong>Глаголы положения в пространстве </strong></p>\n\n<p>Непереходные глаголы <em>liegen</em>, <em>stehen</em> и <em>sitzen</em> описывают положение в пространстве и почти всегда сопровождаются обстоятельством места, отвечающим на вопрос <em>Wo</em><em> ...?.</em> С такими глаголами часто используются предлоги с двойным управлением, требующие дательный падеж.</p>\n"}}]}, {"key": "adjectivesAndAdverbs", "headline": "Adjektive und Adverbien", "grammars": [{"id": 40463362, "shortTitle": "Adjektive nach „sein“", "name": "Adjektive nach „sein“", "text": "<p><strong><em>Ich bin groß. – Emma ist klein.</em></strong></p>\n\n<p><strong></strong></p>\n\n<p>Adjektive beschreiben ein Lebewesen, einen Gegenstand oder eine Situation. Sehr oft verwendet man sie mit dem Verb <em>sein</em>. Das Adjektiv steht dann meist hinter dem Verb.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Subjekt</td>\n\t\t\t<td>\n\t\t\t<p><em>sein&#160;</em><span style=\"background-color:transparent\">(konjugiert)</span></p>\n\t\t\t</td>\n\t\t\t<td>Adjektiv</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Das Haus</td>\n\t\t\t<td>ist</td>\n\t\t\t<td>alt.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Zu vielen Adjektiven lässt sich ein Gegenteil finden, z. B.:</p>\n\n<p><em>Nico ist <strong>groß</strong>. – Emma ist <strong>klein</strong>.</em></p>\n\n<p><em>Das Auto ist <strong>alt</strong>. – Das Fahrrad ist <strong>neu</strong>.</em></p>\n\n<p><em>Die Wohnung ist <strong>billig</strong>. – Das Haus ist <strong>teuer</strong>.</em><br>\n<br>\nAm besten lernt man Adjektive immer in Paaren. Adjektive schreibt man klein.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\t\t\tdas Adjektiv: Adjektive sind Wörter, mit denen man Lebewesen, Gegenstände oder Situationen beschreibt.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Прилагательные после sein", "text": "<p><strong><em>Ich bin groß. – Emma ist klein.</em></strong></p>\n\n<p><strong></strong></p>\n\n<p>Прилагательные обозначают признаки живых существ, предметов или явлений. Очень часто они используются с глаголом <em>sein</em>. Прилагательное в предложении в большинстве случаев стоит после глагола.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>Субъект</td>\n\t\t\t<td><em>sein</em>&#160;(спрягаемая форма)</td>\n\t\t\t<td>прилагательное</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Das Haus</td>\n\t\t\t<td>ist</td>\n\t\t\t<td>alt.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p>Многие прилагательные имеют антонимы, например:</p>\n\n<p><em>Nico ist <strong>groß</strong>. – Emma ist <strong>klein</strong>.</em></p>\n\n<p><em>Das Auto ist <strong>alt</strong>. – Das Fahrrad ist <strong>neu</strong>.</em></p>\n\n<p><em>Die Wohnung ist <strong>billig</strong>. – Das Haus ist <strong>teuer</strong>.</em><br>\n<br>\nЛучше всего учить прилагательные в парах с&#160;антонимами. Прилагательные пишутся с маленькой буквы.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>das Adjektiv: Прилагательные – это слова, которые обозначают признаки живых существ, предметов или явлений. &#160;</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40574908, "shortTitle": "Adverbien: gerne", "name": "Adverbien: gerne", "text": "<p><strong>Vorlieben ausdrücken mit dem Adverb <em>gerne</em></strong></p>\n\n<p>Adverbien bezeichnen die näheren Umstände einer Tätigkeit, eines Vorgangs oder Zustands. Dabei beziehen sich Adverbien entweder auf ein ganzes Wort im Satz (z. B. ein Verb) oder auf den ganzen Satz. Adverbien werden nicht konjugiert oder dekliniert.</p>\n\n<p>Mit dem Adverb <em>gerne</em> kannst du beschreiben, was du magst oder was dir Spaß macht. Mit dem Komparativ <em>lieber</em> und dem Superlativ <em>am liebsten</em> kannst du die Aussage noch steigern.</p>\n\n<p><em>Ich spiele <strong>gerne</strong> Basketball.</em></p>\n\n<p><em>Aber Fußball spiele ich <strong>lieber</strong> als Basketball.</em></p>\n\n<p><em>Golf spiele ich <strong>am liebsten</strong>.</em></p>\n\n\n\n\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:<br>\n\t\t\tdas Adverb: Ein Adverb beschreibt, wann, wo oder wie etwas geschieht. Es bezieht sich auf ein anderes Wort im Satz (z.B. ein Verb oder ein Adjektiv) oder auf den ganzen Satz.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": null}, {"id": 40577550, "shortTitle": "Adverbien: Graduierung", "name": "Adverbien: Graduierung (1)", "text": "<p><strong>Adverbien, die eine Intensität ausdrücken</strong></p>\n\n<p>Bestimmte Adverbien oder adverbiale Ausdrücke, die aus mehreren Wörtern bestehen, kann man verwenden, um die Bedeutung eines Adjektivs oder eines Verbs zu verstärken oder abzuschwächen.</p>\n\n<p>Intensität der Gradadverbien:<br>\n</p>\n\n<p>Mit Negation:<br>\n</p>\n\n<p>Zwischen <em>nicht sehr</em>, <em>nicht besonders</em> und <em>nicht so</em> gibt es kaum einen Unterschied. Die Intonation und die Mimik sagen hier oft mehr aus als die Worte selbst.<br>\n<br>\nDiese Gradadverbien kombiniert man häufig mit Adjektiven.</p>\n\n<p>besonders:<br>\n<em>Die Schiffsfahrt zum Binger Mäuseturm war <strong>besonders schön</strong>.</em></p>\n\n<p>sehr:<br>\n<em>Die Stadtführung war <strong>sehr interessant</strong>. </em></p>\n\n<p>ziemlich:<br>\n<em>Das Wetter war <strong>ziemlich schlecht</strong>.</em></p>\n\n<p>etwas/ein bisschen:<br>\n<em>Am Anfang war der Ausflug <strong>etwas langweilig</strong>.</em></p>\n\n\n\n<p>Man kombiniert <em>etwas</em> bzw. <em>ein bisschen</em> nur mit Adjektiven, die eine negative Bedeutung haben. Manchmal ergänzt man außerdem noch <em>zu</em>:<br>\n<em>Die Leute in der Gruppe waren mir <strong>ein bisschen zu</strong> <strong>alt</strong>.</em><br>\n<br>\nZur Negation von Adjektiven verwendet man oft diese adverbialen Ausdrücke:</p>\n\n<p>nicht sehr/nicht besonders:<br>\n<em>Die anderen Leute in der Gruppe waren <strong>nicht sehr interessant</strong>.</em></p>\n\n<p>nicht so:<br>\n<em>Das Essen war <strong>nicht so gut</strong>.</em></p>\n\n<p>gar nicht:<br>\n<em>Gespräche über Krankheiten finde ich <strong>gar nicht angenehm</strong>.</em></p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p><span style=\"background-color:transparent\">Grammatische Begriffe&#160;auf Deutsch:</span></p>\n\n\t\t\t<p><span style=\"background-color:transparent\">das Adverb: Ein Adverb beschreibt, wann, wo oder wie etwas geschieht. Es kann auch die Intensität einer Eigenschaft oder einer Handlung ausdrücken. Ein Adverb bezieht sich auf ein anderes Wort im Satz (z. B. ein Verb oder ein Adjektiv) oder auf den ganzen Satz.</span></p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Наречия: мера и степень", "text": "<p><strong>Наречия, выражающие интенсивность </strong></p>\n\n<p>Определенные наречия или наречные выражения, состоящие из нескольких слов, можно использовать, чтобы усилить или ослабить значение прилагательного или глагола.<br>\n<br>\nИнтенсивность наречий меры и степени:<br>\n<br>\n</p>\n\n<p>С отрицанием:<br>\n</p>\n\n<p>Между <em>nicht</em><em> sehr</em>, <em>nicht</em><em> besonders</em> и <em>nicht</em><em> so</em> практически нет разницы.&#160; Интонация и мимика здесь часто имеют большее значение, чем сами слова. &#160;</p>\n\n<p>Следующие наречия меры и степени часто комбинируют с прилагательными:</p>\n\n<p><br>\nbesonders:<br>\n<em>Die Schiffsfahrt zum Binger Mäuseturm war <strong>besonders schön</strong>.</em><br>\n<br>\nsehr:<br>\n<em>Die Stadtführung war <strong>sehr interessant</strong>. </em><br>\n<br>\nziemlich:<br>\n<em>Das Wetter war <strong>ziemlich schlecht</strong>.</em><br>\n<br>\netwas/ein bisschen:<br>\n<em>Am Anfang war der Ausflug <strong>etwas langweilig</strong>.</em></p>\n\n<p><br>\nНаречия <em>etwas</em> или <em>ein</em><em> bisschen</em> добавляют к прилагательным, имеющим отрицательное значение. Иногда к ним еще добавляют <em>zu</em>:<br>\n<em>Die Leute in der Gruppe waren mir <strong>ein bisschen zu</strong> <strong>alt</strong>.</em></p>\n\n<p><br>\n<br>\nСледующие наречные выражения часто используются для отрицания прилагательных:<br>\n<br>\nnicht sehr/nicht besonders:<br>\n<em>Die anderen Leute in der Gruppe waren <strong>nicht sehr interessant</strong>.</em><br>\n<br>\nnicht so:<br>\n<em>Das Essen war <strong>nicht so gut</strong>.</em><br>\n<br>\ngar nicht:<br>\n<em>Gespräche über Krankheiten finde ich <strong>gar nicht angenehm</strong>.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>das Adverb: Наречие указывает на способ, место и время совершения действия. Оно также может выражать интенсивность качества или действия.&#160;Наречие относится к другому слову в предложении (например, к глаголу или прилагательному) или ко всему предложению в целом.<span style=\"background-color:transparent\"></span></p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40607674, "shortTitle": "Adverbien: Graduierung", "name": "Adverbien: Graduierung (2)", "text": "<p>Tarek und Yanis unterhalten sich über Fußball:</p>\n\n<p><strong>Tarek</strong><em>: Das Fußballspiel gestern war <strong>echt</strong> spannend. Ich war <strong>total</strong> nervös, ob sie noch gewinnen. </em></p>\n\n<p><strong>Yanis</strong>:<em> Ich war auch <strong>mega</strong> aufgeregt. Aber dann haben sie ja <strong>super</strong>gut gespielt. </em></p>\n\n<p>Tarek und Yanis sprechen informell und emotional miteinander. Sie verwenden Adverbien, um die Adjektive zu verstärken:</p>\n\n<p><strong><em>echt</em></strong><em> spannend</em> (sehr spannend)</p>\n\n<p><strong><em>total</em></strong><em> nervös</em> (sehr nervös)</p>\n\n<p><strong><em>mega</em></strong><em> aufgeregt</em> (sehr aufgeregt)</p>\n\n<p><strong><em>super</em></strong><em>gut</em> (sehr gut)</p>\n\n\n\n<p>Viele dieser Adverbien benutzen vor allem junge Leute in informellen Situationen. Man kann mit diesen Wörtern oft nicht nur Adjektive, sondern auch manche Verben verstärken:</p>\n\n<p><em>Ich habe mich <strong>echt/super/total/voll</strong> … gefreut.</em></p>\n\n<p>Vor allem das Wort<em> super </em>wird häufig als Adjektiv gebraucht:<br>\n<em>Das war <strong>super/mega</strong>.</em></p>\n\n<p><em>Das ist ein <strong>super</strong> Team.</em></p>\n\n<p>Im formellen Kontext benutzt du weniger und neutralere Adverbien, um etwas zu verstärken:<br>\n<em>Das ist ein <strong>wirklich</strong> gutes Angebot.</em></p>\n\n<p><em>Die Tätigkeit ist <strong>überaus</strong> interessant.</em></p>\n\n<p><em>Wir sind Ihnen <strong>sehr</strong> dankbar.</em><br>\n&#160;</p>\n", "ru": {"name": "Наречия: мера и степень", "text": "<p>Тарек и Янис говорят о футболе:</p>\n\n<p><strong>Tarek</strong><em>: Das Fußballspiel gestern war <strong>echt</strong> spannend. Ich war <strong>total</strong> nervös, ob sie noch gewinnen. </em></p>\n\n<p><strong>Yanis</strong>:<em> Ich war auch <strong>mega</strong> aufgeregt. Aber dann haben sie ja <strong>super</strong>gut gespielt.</em></p>\n\n<p><br>\nТарек и Янис используют разговорную лексику и эмоционально окрашенные выражения. Для усиления прилагательных они используют наречия:</p>\n\n<p><strong><em>echt</em></strong><em> spannend</em> (очень интересный)</p>\n\n<p><strong><em>total</em></strong><em> nervös</em> (очень нервный)</p>\n\n<p><strong><em>mega</em></strong><em> aufgeregt</em> (очень взволнованный)</p>\n\n<p><strong><em>super</em></strong><em>gut</em> (очень хорошо)</p>\n\n<p><br>\nМногие такие наречия употребляются преимущественно молодыми людьми в неформальной обстановке. Эти слова могут придавать дополнительную экспрессивную окраску не только прилагательным, но и глаголам:</p>\n\n<p><em>Ich habe mich <strong>echt/super/total/voll</strong> … gefreut.</em></p>\n\n<p>Очень часто слово <em>super</em> используется как прилагательное:</p>\n\n<p><em>Das war <strong>super/mega</strong>.<br>\nDas ist ein <strong>super</strong> Team.</em></p>\n\n<p>В формальном контексте наречия реже используются для усиления высказываний и они более нейтральные:</p>\n\n<p><em>Das ist ein <strong>wirklich</strong> gutes Angebot.</em></p>\n\n<p><em>Die Tätigkeit ist <strong>überaus</strong> interessant.</em></p>\n\n<p><em>Wir sind Ihnen <strong>sehr</strong> dankbar.</em><br>\n&#160;</p>\n"}}, {"id": 39120859, "shortTitle": "Adverbien: Gründe", "name": "Adverbien: Gründe", "text": "<p><em>Nico wollte nicht mehr in Spanien studieren, <strong>deshalb/deswegen/darum</strong> ist er nach Deutschland gekommen.</em></p>\n\n<p><em>Nico hatte eine Fahrradpanne, <strong>deshalb/deswegen/darum</strong> nahm Lisa ihn mit. </em></p>\n\n<p><em>Nico und Lisa standen im Stau, <strong>deshalb/deswegen/darum</strong> kamen sie zu spät zum Deutschkurs.</em></p>\n\n<p>Die Wörter <em>deshalb</em>, <em>deswegen</em> und <em>darum</em> sind Adverbien, mit denen man Hauptsätze verbinden kann. Diese Adverbien heißen „Konjunktionaladverbien\" oder „satzverbindende\" Adverbien.</p>\n\n<p>Die Adverbien <em>deshalb</em>, <em>deswegen</em> und <em>darum</em> leiten&#160;<strong>eine Folge</strong> ein: Die Aussage im ersten Satz ist <strong>der Grund</strong> für die Folge im zweiten Satz. Die drei Adverbien haben die gleiche Bedeutung, und du kannst sie austauschen. Sie stehen am Beginn eines Hauptsatzes auf Position 1, auf Position 2 folgt dann das Verb.</p>\n\n<p><em>Meine EC-Karte&#160;ist weg,<strong> deshalb</strong> </em><strong>beantrage<em> ich eine neue Karte bei der Bank.</em></strong></p>\n\n<p><em>Ich möchte einen Job in Deutschland finden.<strong> Darum</strong> </em><strong>lerne<em> ich Deutsch.</em></strong></p>\n\n<p><em>Ich habe Freunde in Deutschland,<strong> deswegen</strong> </em><strong>bin<em> ich in Deutschland.</em></strong></p>\n\n\n", "ru": null}, {"id": 40447308, "shortTitle": "Adverbien: Reihenfolge", "name": "Adverbien: Reihenfolge", "text": "<p>Wenn du sagen möchtest, in welcher Reihenfolge du etwas machst, kannst du Zeitadverbien wie <em>zuerst</em>,<em> dann</em> und <em>danach</em> verwenden.</p>\n\n\n\n<p><strong><em>Zuerst</em></strong><em> sehen Nico und Emma fern.</em></p>\n\n<p><strong><em>Dann/Danach</em></strong><em> essen Nico und Emma Eis.*</em></p>\n\n<p><strong><em>Dann/Danach</em></strong><em> spielen sie zusammen.*</em></p>\n\n<p>* Die Wörter <em>dann</em> und <em>danach</em> haben die gleiche Bedeutung. Es spielt keine Rolle, ob du <em>dann</em> oder <em>danach</em> benutzt.</p>\n\n<p>Die Zeitadverbien <em>zuerst</em>, <em>dann</em> und <em>danach</em> stehen häufig am Satzanfang vor dem konjugierten Verb.</p>\n", "ru": {"name": "Наречия: порядок действий", "text": "<p>Для выражения хронологической последовательности используются наречия времени <em>zuerst</em>, <em>dann</em> и <em>danach</em>.</p>\n\n<p><strong><em>Zuerst</em></strong><em> sehen Nico und Emma fern.</em></p>\n\n<p><strong><em>Dann/Danach</em></strong><em> essen Nico und Emma Eis.*</em></p>\n\n<p><strong><em>Dann/Danach</em></strong><em> spielen sie zusammen.*</em></p>\n\n<p>* Слова <em>dann</em> и <em>danach</em> имеют одинаковое значение. Ты можешь использовать любое из них.</p>\n\n<p>Наречия времени <em>zuerst</em>, <em>dann</em> и <em>danach</em> часто стоят в начале предложения перед спрягаемым глаголом.</p>\n"}}, {"id": 39120229, "shortTitle": "Fragewörter: wo(r)-", "name": "Fragewörter: wo(r)- (1)", "text": "<p><strong>Fragewörter aus Präpositionen</strong></p>\n\n<p>Wenn du nach einer Sache oder einer Handlung (Nomen) fragen willst, die mit einer Präposition mit dem Satz verbunden ist (z. B. ein nominalisierter Infinitiv), kannst du ein Fragewort aus <em>wo</em>- + Präposition bilden.</p>\n\n<p><em>Wo<strong>zu</strong> brauchen Max und Tarek Zeit?</em></p>\n\n<p><em>Max und Tarek brauchen Zeit <strong>zum</strong> Planen.</em></p>\n\n<p><em>Wo<strong>bei</strong> vergisst du oft die Zeit?</em></p>\n\n<p><em>Ich vergesse <strong>beim</strong> Telefonieren oft die Zeit.</em></p>\n\n<p><em>Wo<strong>von</strong> bekommst du Kopfschmerzen?</em></p>\n\n<p><em>Ich bekomme <strong>vom</strong> Lesen Kopfschmerzen.</em></p>\n", "ru": {"name": "Предлоги + дательный падеж", "text": "<p><strong>Обзор: Предлоги с дательным падежом</strong></p>\n\n\n\n<p>После некоторых предлогов всегда стоит дательный падеж. Тебе уже знакомы следующие предлоги:</p>\n\n<p><strong><em>aus</em></strong><em>: Tarek kommt <strong>aus der Türkei</strong>.</em></p>\n\n<p><strong><em>nach</em></strong><em>: <strong>Nach dem Essen</strong> lerne ich Deutsch.</em></p>\n\n<p><strong><em>von</em></strong><em>: Das Haus ist in der Nähe <strong>vom Bahnhof</strong>. (vom = von + dem)</em></p>\n\n<p><strong><em>bei</em></strong><em>: Selma wohnt <strong>bei ihnen</strong>.</em></p>\n\n<p><strong><em>zu</em></strong><em>: Nico geht <strong>zum Deutschkurs</strong>. (zum = zu + dem)</em></p>\n\n<p><strong><em>mit</em></strong><em>: Nico fährt <strong>mit dem Bus</strong>.</em></p>\n\n<p><strong><em>ab</em></strong><em>: Tarek hat <strong>ab dem ersten Februar</strong> eine Woche Urlaub.</em></p>\n\n\n\n<p>Предлоги, управляющие двумя падежами, требуют дательного падежа, если их используют для ответа на вопрос о местонахождении <em>Wo ...?</em>:</p>\n\n\n\n<p><strong><em>in</em></strong><em>: Nico, Inge und Tarek sind <strong>im Restaurant</strong>. (im = in + dem)</em></p>\n\n<p><strong><em>an</em></strong><em>: Nico und Inge sitzen <strong>am Tisch</strong>. (am = an + dem)</em></p>\n\n<p><strong><em>unter</em></strong><em>: Nicos Füße sind <strong>unter dem Tisch</strong>.</em></p>\n\n<p><strong><em>über</em></strong><em>: Die Lampe hängt nicht <strong>über dem Tisch</strong> von Nico und Inge.</em></p>\n\n<p><strong><em>auf</em></strong><em>: Das Essen steht <strong>auf dem Tisch</strong>.</em></p>\n\n<p><strong><em>vor</em></strong><em>: Die Blumenvase steht <strong>vor dem Teller</strong> von Inge.</em></p>\n\n<p><strong><em>hinter</em></strong><em>: Das Kuchenregal steht <strong>hinter dem Stuhl </strong>von Inge.</em></p>\n\n<p><strong><em>neben</em></strong><em>: Nicos Messer liegt <strong>neben dem Teller</strong>.</em></p>\n\n<p><strong><em>zwischen</em></strong><em>: Der Orangensaft steht <strong>zwischen dem Teller und der Blumenvase</strong>.</em></p>\n"}}, {"id": 39126425, "shortTitle": "Fragewörter: wo(r)-", "name": "Fragewörter: wo(r)- (2)", "text": "<p><em><strong>Wofür</strong> interessierst du dich?</em></p>\n\n<p><em><strong>Woran</strong> denkst du?</em></p>\n\n<p><em><strong>Wovon</strong> träumst du?</em></p>\n\n<p>Verben mit Präpositionen und Präpositionaladverbien wie <strong><em>dafür, daran, damit</em> </strong>kennst du schon.<br>\n<br>\nPräpositionaladverbien für Fragen bildet man so ähnlich:</p>\n\n<p><strong><em>wo</em></strong> + Präposition (zum Beispiel: <em>für, von, mit</em>): <strong><em>wofür</em></strong>, <strong><em>wovon</em></strong>, <strong><em>womit</em></strong></p>\n\n<p><strong><em>wo</em></strong> +<strong><em> r</em></strong> + Präposition (zum Beispiel: <em>an, über</em>), wenn die Präposition mit einem Vokal beginnt: <strong><em>woran</em></strong>, <strong><em>worüber</em></strong><br>\n<br>\nBei den Antworten musst du den richtigen Kasus nach den Präpositionen verwenden:</p>\n\n<p><em>Ich interessiere mich für den Film. </em>(<em>für</em> + Akkusativ)</p>\n\n<p><em>Ich denke an den Urlaub. (an </em>+ Akkusativ)</p>\n\n<p><em>Ich träume von einer Karriere. (von </em>+ Dativ)</p>\n", "ru": null}, {"id": 39126453, "shortTitle": "Fragewörter: wo(r)-", "name": "Fragewörter: wo(r)- (3)", "text": "<p><strong><em>Wovon </em></strong><em>willst du denn leben?</em></p>\n\n<p><em>Sag, <strong>wovon</strong> du leben willst!</em><br>\n<br>\nFragewörter mit Präpositionen kannst du auch für indirekte Fragen verwenden. Dabei steht das Verb wie bei allen Nebensätzen am Ende des Satzes.<br>\n<br>\n<em>Geld verdienen <strong>mit </strong></em>+ Dativ</p>\n\n<p><strong><em>Womit</em></strong><em> würdest du lieber dein Geld verdienen – mit Architektur oder mit Schauspielerei?</em></p>\n\n<p><em>Ich möchte wissen, <strong>womit</strong> du lieber dein Geld verdienen würdest!</em></p>\n\n<p><em>– Ich würde lieber <strong>mit</strong> Architektur mein Geld verdienen. </em></p>\n\n\n\n<p><em>leben <strong>von </strong></em>+ Dativ</p>\n\n<p><strong><em>Wovon</em></strong><em> willst du denn leben?</em></p>\n\n<p><em>Sag, <strong>wovon</strong> du leben willst!</em></p>\n\n<p><em>– Ich will <strong>von</strong> meinem Gehalt leben.</em></p>\n\n\n\n<p><em>träumen <strong>von</strong> + Dativ</em></p>\n\n<p><em><strong>Wovon </strong>träumst du?</em></p>\n\n<p><em>Erzähl mir, <strong>wovon </strong>du träumst.</em></p>\n\n<p><em>– Ich träume <strong>von</strong> einer Karriere.</em></p>\n", "ru": null}, {"id": 40597237, "shortTitle": "Präpositionaladverbien", "name": "Präpositionaladverbien", "text": "<p>Herr Balder erzählt:</p>\n\n<p><em>Ich habe viel Stress bei meiner Arbeit. Manchmal <strong>ärgere</strong> ich mich <strong>darüber</strong>. (= über den Stress bei der Arbeit) &#160;</em></p>\n\n<p><em>Ich interessiere mich sehr für Kultur. Meine Frau <strong>interessiert</strong> sich auch <strong>dafür</strong>. (= für Kultur)</em></p>\n\n<p>Bei Verben mit festen Präpositionen kann die Präposition und das folgende Nomen manchmal durch bestimmte Adverbien ersetzt werden. Diese Adverbien wie z. B. <em>darüber</em> und <em>dafür</em> nennt man Präpositionaladverbien. Du kannst sie verwenden, um den Satz kürzer zu machen. Der Bezug oder Kontext muss dafür klar sein, indem er entweder unmittelbar vorher benannt wurde oder in einem Nebensatz folgt:</p>\n\n\n\n\n\n<p>Präpositionaladverbien bildest du so:</p>\n\n<p><strong><em>da</em></strong> + Präposition, z. B.:</p>\n\n<p><strong><em>da</em></strong><em>für, <strong>da</strong>mit, <strong>da</strong>von</em></p>\n\n<p>Beginnt die Präposition mit einem Vokal, dann fügst du zur besseren Aussprache -<em>r-</em> ein:</p>\n\n<p><strong><em>da</em></strong> + r + Präposition, z. B.:</p>\n\n<p><strong>dar</strong>über, <strong>dar</strong>auf, <strong>dar</strong>an</p>\n\n<p><em>Erinnerst du dich <strong>an</strong> <strong>deinen ersten Sprachkurs</strong>? - Ja, ich erinnere mich <strong>daran</strong>.</em> (= an den Sprachkurs)</p>\n\n<p><em>Ärgerst du dich <strong>über</strong> <strong>schlechtes Wetter</strong>? - Nein, ich ärgere mich nicht <strong>darüber</strong>.</em> (= über schlechtes Wetter)</p>\n\n<p><em>Denkst du oft <strong>an</strong> <strong>deine Arbeit</strong>? – Ja, ich denke oft <strong>daran</strong>.</em> (= an die Arbeit)<br>\n&#160;</p>\n\n<p>Wichtig: Präpositionaladverbien kann man nur für Dinge und Sachverhalte verwenden. Bei Lebewesen&#160;verwendet man das Personalpronomen:</p>\n\n<p><em>Denkst du oft <strong>an deinen Vater</strong>? – Ja, ich denke oft an <strong>ihn</strong>. </em>(= an meinen Vater)</p>\n\n<p><em>Ärgerst du dich <strong>über deine Schwester</strong>? – Nein, ich ärgere mich nicht über<strong> sie</strong>. </em>(<em>= über meine Schwester</em>)</p>\n", "ru": null}, {"id": 39134984, "shortTitle": "Relativadverb: wo", "name": "Relativadverb: wo", "text": "<p><strong>Relativsätze, die mit <em>wo</em> eingeleitet werden</strong></p>\n\n<p><em>Nabil kommt aus dem <strong>Irak</strong>, <strong>wo</strong> er Mathematik und Chemie unterrichtet hat.</em><br>\n<br>\nWenn ein Relativsatz eine lokale Bedeutung hat, also genauere Informationen zu einem Ort gibt, kann man ihn mit dem Relativadverb <em>wo</em> einleiten.</p>\n\n<p>Beispiele:</p>\n\n<p><em>Nabil träumt von einem eigenen <strong>Geschäft</strong>, <strong>wo</strong> er Lebensmittel aus dem Irak verkaufen möchte.</em></p>\n\n<p><em>Ibrahim schlägt einen Waschsalon mit Café in <strong>Uninähe</strong> vor, <strong>wo</strong> es viele Studenten gibt.</em><br>\n<br>\nIn diesen Beispielen ist das Bezugswort ein Nomen. Es kann aber auch eine andere <span class=\"editable placeholder\" data-fromselection=\"true\" data-id=\"39134971\" data-title=\"Ortsangabe, -n (f.)\" data-type=\"GLOSSARY\" title=\"undefined\">Ortsangabe</span>sein, z. B. ein Adverb.</p>\n\n<p><em>Ich fühle mich <strong>da</strong> zu Hause, <strong>wo</strong> meine Freunde sind.</em></p>\n", "ru": {"name": "Предлоги места", "text": "<p>При использовании предлогов места, следует обращать внимание на два аспекта:</p>\n\n<ul>\n\t<li><span dir=\"LTR\"></span>Отвечает твое предложение на вопрос <em>Wo</em><em> …? </em>(местонахождение) или на вопрос <em>Wohin</em><em> …?</em> &#160;(направление)?</li>\n\t<li><span dir=\"LTR\"></span>Стоит после предлога винительный или дательный падеж?</li>\n</ul>\n\n<p>В таблице приведены артикли в винительном и дательном падежах:</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>Винительный падеж</td>\n\t\t\t<td>Дательный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мужской род:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(der)</td>\n\t\t\t<td>den/einen</td>\n\t\t\t<td>dem/einem</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Женский род:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(die)</td>\n\t\t\t<td>die/eine</td>\n\t\t\t<td>der/einer</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Средний род:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(das)</td>\n\t\t\t<td>das/ein</td>\n\t\t\t<td>dem/einem</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>Мн. число:</td>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>(die)</td>\n\t\t\t<td>die/ -</td>\n\t\t\t<td>den/ -</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n\n<p><strong>Предлоги </strong><strong>c</strong><strong> двойным управлением</strong></p>\n\n<p>Предлоги с&#160;двойным управлением в различных контекстах требуют постановку существительного в разные падежи: иногда в дательный, а иногда в винительный.</p>\n\n<p>a) Местонахождение: <em>Wo …?</em></p>\n\n<p>Предлоги c двойным управлением <em>in</em> /<em> an</em> /<em> unter</em> /<em> über</em> /<em> auf </em>/<em> vor </em>/<em> hinter</em> /<em> neben</em> / <em>zwischen </em>+ <strong>дательный</strong> <strong>падеж</strong></p>\n\n<p>(das Zentrum:)<em> Der Bahnhof ist <strong>im Zentrum</strong>.</em> (im = in + dem)<br>\n(die Universität:)<em> Die Oper ist <strong>neben der Universität</strong>.</em></p>\n\n<p>b) Направление: <em>Wohin …?</em></p>\n\n<p>Предлоги c двойным управлением <em>in</em> /<em> an</em> /<em> unter</em> /<em> über</em> /<em> auf </em>/<em> vor </em>/<em> hinter</em> /<em> neben</em> / <em>zwischen </em>+ <strong>винительный</strong> <strong>падеж</strong></p>\n\n<p>(die Goethestraße:)<em> Ihr geht <strong>in die Goethestraße</strong>.</em><br>\n(der Marktplatz:)<em> Ihr geht <strong>über den Marktplatz</strong>.</em></p>\n\n\n\n<p><strong>Предлоги с одним падежным управлением </strong></p>\n\n<p>Все прочие предлоги или предложные выражения управляют одним падежом, то есть после них существительное стоит всегда в одном и том же падеже, преимущественно дательном или винительном. Такие предлоги с дательным падежом могут отвечать также на вопрос&#160;<em>Wohin … ?</em>&#160;Вот примеры:</p>\n\n<p>a) <em>zu&#160;</em>+ дательный падеж</p>\n\n<p>(der Bahnhof:) <em>Ihr geht <strong>zum Bahnhof</strong>.</em> (zum = zu dem)<br>\n(die Touristeninformation:) <em>Ihr geht <strong>zur Touristeninformation</strong>.</em> (zur = zu der)<br>\n(das Schloss:) <em>Ihr geht <strong>zum Schloss</strong>.</em> (zum = zu dem)<br>\n(die Parkplätze:) <em>Ihr geht <strong>zu den Parkplätzen</strong>.</em></p>\n\n<p>Если хотят особо выделить конечный пункт пути, используют&#160; <em>bis zu</em>:<br>\n<em>Ihr geht geradeaus <strong>bis zum Bahnhof</strong>. Dann geht ihr links <strong>in die Hauptstraße</strong>.</em></p>\n\n<p>b) <em>an</em> + дательный падеж +&#160;<em>vorbei</em></p>\n\n<p>(der Supermarkt:) <em>Ihr geht <strong>am Supermarkt vorbei</strong>.</em> (am = an + dem)<br>\n(die Sprachschule:) <em>Ihr geht <strong>an der Sprachschule vorbei</strong>.</em>'<br>\n(das Theater:) <em>Ihr geht <strong>am Theater vorbei</strong>. </em>(am = an + dem)<br>\n(die Hochhäuser:) <em>Ihr geht <strong>an den Hochhäusern vorbei</strong>.</em></p>\n\n<p>c) <em>durch</em>&#160;+ винительный падеж</p>\n\n<p>(der Park:) <em>Ihr geht</em> <strong><em>durch den Park</em></strong>.<br>\n(die Fußgängerzone:) <em>Ihr geht</em> <strong><em>durch die Fußgängerzone</em></strong>.<br>\n(das Tor:) <em>Ihr geht <strong>durch das Tor</strong>.</em><br>\n(die Straßen): <em>Ihr geht <strong>durch die Straßen</strong>.</em></p>\n"}}, {"id": 40468718, "shortTitle": "Vergleiche: wie/als", "name": "Vergleiche: wie/als (1)", "text": "<p><strong>Gleichheit ausdrücken:</strong><br>\n<em>so </em>+ Adjektiv (Grundform/Positiv) +<em> wie</em></p>\n\n<p>Wenn man ausdrücken möchte, dass zwei &#160;Lebewesen oder Dinge in einer bestimmten Eigenschaft gleich sind, verwendet man <em>(genau)so</em> + Grundform des Adjektivs + <em>wie</em>:</p>\n\n<p><em>Sebastian kocht <strong>so gut wie</strong> Lisa.</em></p>\n\n<p><em>Max arbeitet <strong>genauso viel wie</strong> Tarek.</em></p>\n\n\n\n<p><strong>Ungleichheit ausdrücken:</strong><br>\nAdjektiv (Komparativ) + <em>als</em></p>\n\n<p>Wenn zwei Lebewesen oder Dinge in einer bestimmten Eigenschaft unterschiedlich sind, verwendet man den Komparativ + <em>als</em>:</p>\n\n<p><em>Tarek kocht <strong>besser als</strong> Sebastian.</em></p>\n\n<p><em>Max putzt <strong>mehr als </strong>Inge.</em></p>\n\n\n\n<p>Auch mit&#160;<em>nicht</em>&#160;kann man eine Ungleichheit ausdrücken:</p>\n\n<p><em>Lisa schläft </em><strong>nicht<em> so viel wie</em></strong><em> Emma.</em></p>\n", "ru": {"name": "Сравнения: wie/als", "text": "<p><strong>Выражаем</strong> <strong>тождественность</strong><strong>:</strong></p>\n\n<p><em>so</em> + прилагательное (начальная форма, положительная степень сравнения) + <em>wie</em></p>\n\n<p>Если нужно выразить, что два существа или предмета обладают&#160; каким-либо качеством в одинаковой степени, используют&#160; <em>(</em><em>genau</em><em>)</em><em>so</em> + начальная форма прилагательного + <em>wie</em>:</p>\n\n<p><em>Sebastian kocht <strong>so gut wie</strong> Lisa.<br>\nMax arbeitet <strong>genauso viel wie</strong> Tarek.</em></p>\n\n\n\n<p><strong>Выражаем неравенство:</strong></p>\n\n<p>Прилагательное&#160;(сравнительная степень) + <em>als</em></p>\n\n<p>Если нужно выразить, что два существа или предмета обладают&#160; каким-либо качеством в различной степени, используют сравнительную степень + <em>als</em>:</p>\n\n<p><em>Tarek kocht <strong>besser als</strong> Sebastian.</em></p>\n\n<p><em>Max putzt <strong>mehr als </strong>Inge.</em></p>\n\n\n\n<p>Неравенство&#160;можно также выразить при помощи <em>nicht:</em></p>\n\n<p><em>Lisa schläft&#160;</em><strong>nicht&#160;<em>so viel wie</em></strong><em><em>&#160;</em>Emma.</em></p>\n"}}, {"id": 39135643, "shortTitle": "Vermutungen äußern", "name": "Vermutungen äußern", "text": "<p><strong>Vermutungen äußern: <em>dass</em>-Sätze</strong></p>\n\n<p>Du kannst die Verben <em>vermuten</em> und <em>annehmen</em> benutzen, um Vermutungen auszudrücken. Nach diesen Verben folgt meistens ein <em>dass</em>-Satz.</p>\n\n<p>Beispiele:</p>\n\n<p><strong>Ich vermute, dass</strong> <em>Nico keine Probleme mit Yara haben wird.</em></p>\n\n<p><strong>Ich nehme an, dass</strong><em> Nico in der Wohngemeinschaft bleibt.</em></p>\n\n\n\n<p><strong>Vermutungen äußern: Adverbien</strong></p>\n\n<p>Du kannst auch Adverbien verwenden, die eine Vermutung ausdrücken, z. B. <em>wahrscheinlich</em>, <em>vermutlich</em> oder <em>vielleicht</em>. Diese Adverbien stehen oft (aber nicht immer) am Satzanfang vor dem konjugierten Verb.</p>\n\n<p>Beispiele:</p>\n\n<p><strong>Wahrscheinlich</strong> <em>wird Nico der Unterricht an der Berufsschule gefallen.</em></p>\n\n<p><strong>Vermutlich</strong> <em>werden Nicos Eltern ihn nicht in Deutschland besuchen.</em></p>\n\n<p><strong>Vielleicht</strong> <em>werden Selmas Eltern Nico als Freund ihrer Tochter akzeptieren.</em></p>\n", "ru": null}, {"id": 39121190, "shortTitle": "Wortbildung: Adjektive", "name": "Wortbildung: Adjektive", "text": "<p>Mit Adjektiven kannst du jemanden oder etwas beschreiben. Du kannst sagen, wie jemand oder etwas ist oder welche Eigenschaften&#160;jemand oder etwas hat.</p>\n\n<p>Wenn jemand etwas ist oder eine bestimmte Eigenschaft hat, verwendet man oft ein Adjektiv mit der Endung <em>-voll</em> oder <em>-reich</em>.</p>\n\n<p><em>Jacques <strong>hat Humor</strong>. = Jacques ist <strong>humorvoll</strong>.</em></p>\n\n<p><em>Max und Tarek <strong>haben Erfolg</strong> im Beruf. = Max und Tarek sind <strong>erfolgreich</strong>.</em></p>\n\n\n\n<p><strong>Verneinung</strong></p>\n\n<p>Adjektive mit dem Präfix&#160;<em>un-</em> oder dem Suffix&#160;<em>-los</em> benutzt man, wenn jemand etwas <strong>nicht</strong> ist oder eine bestimmte Eigenschaft <strong>nicht</strong> hat.</p>\n\n<p>Wenn man ein <strong>Adjektiv</strong> verneint, benutzt man oft die Vorsilbe <em>un-</em>.</p>\n\n<p>Beispiele:</p>\n\n<p><em>Jacques ist <strong>sensibel</strong>. Aber mein Mann ist leider sehr <strong>unsensibel</strong>.</em></p>\n\n<p><em>Jacques ist <strong>sportlich</strong>. Aber mein Mann ist leider sehr <strong>unsportlich</strong>.</em></p>\n\n<p><em>Mein Mann ist <strong>ehrlich</strong>. Aber ich glaube, dass Jacques <strong>unehrlich</strong> ist.</em></p>\n\n<p>Man kann aber nicht alle Adjektive mit <em>un-</em> verneinen.</p>\n\n<p>Beispiele:</p>\n\n<p><em>Jacques ist <strong>groß</strong>. Mein Mann ist <strong>nicht groß</strong>/<strong>klein</strong>.</em></p>\n\n<p><em>Jacques ist <strong>schlank</strong>. Mein Mann ist <strong>nicht schlank/dick</strong>.</em></p>\n\n<p>Wenn das Adjektiv aus einem <strong>Nomen</strong> (z. B. das Gefühl) gebildet wird, verwendet man oft die Endung <em>-los</em>.</p>\n\n<p><em>Jacques ist <strong>gefühlvoll</strong>. Aber mein Mann ist leider sehr <strong>gefühllos</strong>.</em></p>\n\n<p><em>Jacques ist <strong>verständnisvoll</strong>. Aber mein Mann ist oft <strong>verständnislos</strong>.</em></p>\n", "ru": null}, {"id": 40459405, "shortTitle": "Zeitangaben: dies-/nächst-", "name": "Zeitangaben: dies-/nächst-", "text": "<p><em>Kannst du <strong>diese Woche</strong>? – Nein, aber <strong>nächste Woche</strong> habe ich Zeit.</em></p>\n\n<p>Neben den Zeitangaben, die du schon kennst, kannst du auch Zeitangaben mithilfe der Wörter <em>dies-</em> und <em>nächst-</em> machen. Diese kombinierst du mit einem Nomen, z. B. <em>Monat, Woche</em> oder <em>Jahr</em>. Die Zeitangaben stehen oft im Akkusativ. &#160;Deshalb musst du auf die Endungen achten.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;Akkusativ</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;maskulin (<strong>der</strong>)</td>\n\t\t\t<td>&#160;dies<em><strong>en</strong></em> Monat<br>\n\t\t\t&#160;nächst<strong><em>en</em></strong> Monat</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;feminin (<strong>die</strong>)</td>\n\t\t\t<td>&#160;dies<em><strong>e</strong></em> Woche<br>\n\t\t\t&#160;nächst<strong><em>e</em></strong> Woche</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;neutral (<strong>das</strong>)</td>\n\t\t\t<td>&#160;dies<strong><em>es</em></strong> Jahr<br>\n\t\t\t&#160;nächst<strong><em>es</em></strong> Jahr</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Временные данные: dies-/nächst-", "text": "<p><em>Kannst du <strong>diese Woche</strong>? – Nein, aber <strong>nächste Woche</strong> habe ich Zeit.</em></p>\n\n<p>Помимо уже известных тебе выражений, указывающих на время, ты можешь использовать слова <em>dies</em><em>- </em>и <em>n</em><em>ä</em><em>chst</em>- в сочетании с существительными <em>Monat</em><em>,</em> <em>Woche</em> или <em>Jahr</em>. Обстоятельство времени обычно стоит в винительном падеже. Поэтому необходимо обращать внимание на окончания.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>&#160;</td>\n\t\t\t<td>&#160;Винительный падеж</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;Мужской род (<strong>der</strong>)</td>\n\t\t\t<td>&#160;dies<em><strong>en</strong></em> Monat<br>\n\t\t\t&#160;nächst<strong><em>en</em></strong> Monat</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;Женский род (<strong>die</strong>)</td>\n\t\t\t<td>&#160;dies<em><strong>e</strong></em> Woche<br>\n\t\t\t&#160;nächst<strong><em>e</em></strong> Woche</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>&#160;Средний род (<strong>das</strong>)</td>\n\t\t\t<td>&#160;dies<strong><em>es</em></strong> Jahr<br>\n\t\t\t&#160;nächst<strong><em>es</em></strong> Jahr</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 40492766, "shortTitle": "Zeitangaben: Wann ...? ", "name": "Zeitangaben: Wann ...? ", "text": "<p>Nach Zeitangaben fragt man oft mit dem Fragewort <em>wann</em>:</p>\n\n<p><em>Wann spielt ihr Fußball?</em></p>\n\n<p>Bei Uhrzeiten antwortet man …</p>\n\n<ul>\n\t<li>mit <em><strong>um</strong></em>, wenn es sich um einen <strong>Zeitpunkt </strong>handelt:<br>\n\t<em>Das Fußballtraining beginnt <strong>um </strong>zwei Uhr.</em></li>\n\t<li>mit <em><strong>von … bis …</strong></em>, wenn es sich um einen <strong>Zeitraum </strong>handelt:<br>\n\t<em>Wir spielen <strong>von</strong> zwei <strong>bis </strong>vier Uhr Fußball.</em></li>\n</ul>\n\n<p>Bei Wochentagen antwortet man ...</p>\n\n<ul>\n\t<li>mit <em><strong>am</strong></em>, wenn es sich um einen <strong>einmaligen </strong>Termin handelt:<br>\n\t<em>Am Freitag spielen wir Fußball.</em></li>\n\t<li>mit einem Adverb, wenn es sich um einen <strong>regelmäßigen</strong> Termin handelt:<br>\n\t<em><strong>Freitags </strong>spielen wir Fußball. (= <strong>Jeden Freitag</strong> spielen wir Fußball.)</em></li>\n\t<li>mit <strong>von ... bis ...</strong>, wenn es sich um einen <strong>Zeitraum </strong>handelt:<br>\n\t<em>Ich muss von Montag bis Freitag arbeiten.</em></li>\n</ul>\n\n<p>Bei Monaten und Jahreszeiten antwortet man ...</p>\n\n<ul>\n\t<li>mit <em><strong>im</strong></em>, wenn es sich um einen <strong>Zeitpunkt </strong>handelt:<br>\n\t<em>Im Januar fahre ich Ski.<br>\n\tIm Sommer gehe ich regelmäßig joggen.</em></li>\n\t<li>mit <em><strong>von … bis …</strong></em>, wenn es sich um einen <strong>Zeitraum</strong> handelt:<br>\n\t<em>Von Oktober bis April hat das Schwimmbad geschlossen.</em></li>\n</ul>\n", "ru": {"name": "Временные данные: Wann... ?", "text": "\n\n<p>Спрашивая о времени, часто используют вопросительное слово <em>wann</em>:</p>\n\n<p><em>Wann</em> <em>spielt</em> <em>ihr</em> <em>Fu</em><em>ß</em><em>ball</em><em>?</em></p>\n\n\n\n<p>Время по часам указывают с помощью…</p>\n\n<ul>\n\t<li><strong><em>um</em></strong>, если речь идет о <strong>моменте</strong> времени:</li>\n</ul>\n\n<p><em>&#160; &#160; &#160; &#160; &#160; Das Fußballtraining beginnt <strong>um</strong> zwei Uhr.</em></p>\n\n<ul>\n\t<li><strong><em>von</em></strong><strong><em> … </em></strong><strong><em>bis</em></strong><strong><em> …</em></strong>, если речь идет о <strong>периоде</strong> времени:</li>\n</ul>\n\n<p><em>&#160; &#160; &#160; &#160; &#160; Wir spielen <strong>von</strong> zwei <strong>bis</strong> vier Uhr Fußball.</em></p>\n\n\n\n<p>Дни недели указывают с помощью...</p>\n\n<ul>\n\t<li><strong><em>am</em></strong>, если речь идет об <strong>однократном</strong> событии:</li>\n</ul>\n\n<p><em>&#160; &#160; &#160; &#160; &#160; Am Freitag spielen wir Fußball.</em></p>\n\n<ul>\n\t<li>наречия, если речь идет о <strong>регулярно повторяющемся</strong> событии:</li>\n</ul>\n\n<p>&#160;&#160; &#160; &#160; &#160; &#160;<em><strong>Freitags</strong> spielen wir Fußball. (= <strong>Jeden Freitag</strong> spielen wir Fußball.)</em></p>\n\n<ul>\n\t<li><strong><em>von</em></strong><strong><em> ... </em></strong><strong><em>bis</em></strong><strong><em> ...</em></strong>, если речь идет о<strong> периоде</strong> времени:</li>\n</ul>\n\n<p><em>&#160; &#160; &#160; &#160; &#160; Ich muss von Montag bis Freitag arbeiten.</em></p>\n\n\n\n<p>Месяцы и времена года указывают с помощью...</p>\n\n<ul>\n\t<li><strong><em>im</em></strong>, если речь идет о моменте <strong>времени</strong>:</li>\n</ul>\n\n<p><em>&#160; &#160; &#160; &#160; &#160; Im Januar fahre ich Ski.</em></p>\n\n<p><em>&#160; &#160; &#160;&#160; &#160; &#160;Im Sommer gehe ich regelmäßig joggen.</em></p>\n\n<ul>\n\t<li><strong><em>von</em></strong><strong><em> … </em></strong><strong><em>bis</em></strong><strong><em> …</em></strong>, если речь идет о <strong>периоде </strong>времени:</li>\n</ul>\n\n<p><em>&#160; &#160; &#160; &#160; &#160; Von Oktober bis April hat das Schwimmbad geschlossen.</em></p>\n"}}, {"id": 40493672, "shortTitle": "Zeitangaben: Wie lange ...?", "name": "Zeitangaben: Wie lange ...?", "text": "<p>Nach einer Zeitdauer fragt man mit <em>wie lange</em>:</p>\n\n<p><em>Wie lange trainierst du?</em>&#160;<br>\noder:&#160;<br>\n<em>Wie lange dauert das Training?</em></p>\n\n<p>Häufig antwortet man mit ...</p>\n\n<ul>\n\t<li>der Angabe der Zeitdauer + <em><strong>lang</strong></em>:<br>\n\t<em>Ich trainiere eine halbe Stunde lang.</em><br>\n\t(Das Wort <em>lang</em> kann man auch weglassen: <em>Ich trainiere eine halbe Stunde.</em>)</li>\n\t<li>dem Verb <em><strong>dauern</strong></em> und der Angabe der Zeitdauer:<br>\n\t<em>Das Training <strong>dauert </strong>zwei Stunden.</em></li>\n</ul>\n", "ru": {"name": "Временные данные: Wie lange... ?", "text": "<p>Спрашивая о продолжительности чего-либо, используют слова&#160;<em>wie</em> <em>lange</em>:</p>\n\n<p><em>Wie lange trainierst du?</em></p>\n\n<p>или:</p>\n\n<p><em>Wie lange dauert das Training?</em></p>\n\n\n\n<p>Часто в ответе используют...</p>\n\n<ul>\n\t<li>отрезок времени + <strong><em>lang</em></strong>:</li>\n</ul>\n\n<p><em>&#160; &#160; &#160; &#160; &#160; Ich trainiere eine halbe Stunde lang.</em></p>\n\n<ul>\n\t<li>Слово <em>lang</em> можно опустить: <em>Ich trainiere eine halbe Stunde.</em>)</li>\n</ul>\n\n<ul>\n\t<li>глагол <strong><em>dauern</em></strong> + отрезок времени:</li>\n</ul>\n\n<p><em>&#160; &#160; &#160; &#160; &#160; Das Training <strong>dauert</strong> zwei Stunden.</em></p>\n"}}, {"id": 40586203, "shortTitle": "Zeitangaben: Wie oft ...?", "name": "Zeitangaben: Wie oft ...?", "text": "<p><strong>Zusammenfassung: Zeitangaben zu <em>Wie oft ...</em>?</strong></p>\n\n<p>Nach wiederholten Ereignissen oder Aktivitäten fragt man mit <em>Wie oft ...</em>?:<br>\n<br>\nHäufig antwortet man mit ...</p>\n\n<p>... dem Artikelwort <strong><em>jeden</em></strong><em>/<strong>jede</strong>/<strong>jedes</strong></em>:<br>\n<em>Yara arbeitet <strong>jeden</strong> Tag. (<strong>der</strong> Tag -&gt; <strong>jeder</strong> Tag -&gt; </em>Akkusativ:<em> <strong>jeden</strong> Tag)<br>\nMax, Tarek und Yara treffen sich <strong>jede</strong> Woche. (<strong>die</strong> Woche -&gt; <strong>jede</strong> Woche)<br>\nNico besucht Inge <strong>jedes</strong> Wochenende. (<strong>das</strong> Wochenende -&gt; <strong>jedes</strong> Wochenende)</em></p>\n\n<p>... mit einer Angabe der Häufigkeit&#160;(<em>einmal, zweimal, dreimal ...</em>) und der Präposition <strong><em>pro</em></strong>:<br>\n<em>Nina putzt zweimal <strong>pro</strong> Woche.</em></p>\n\n<p><em>...&#160;</em>mit Zeitadverbien, die angeben, wie oft jemand etwas macht:<br>\n<em>Wir fahren <strong>fast immer</strong> mit dem Fahrrad. Wir fahren <strong>selten</strong> mit dem Auto.</em></p>\n\n\n\n<p>Diese Adverbien stehen meistens hinter dem konjugierten Verb. Wenn du sie stark betonen möchtest, kannst du sie aber auch an den Satzanfang stellen.<br>\n<em>Wir fahren <strong>manchmal</strong> mit dem Bus.<br>\n<strong>Manchmal</strong> fahren wir mit dem Bus.</em></p>\n", "ru": {"name": "Временные данные: Wie oft... ?", "text": "<p><strong>Обзор: Указание частоты совершения действия&#160;в ответе на вопрос <em>Wie oft ...?</em></strong></p>\n\n<p>О повторяющихся действиях и событиях спрашивают <em>Wie</em> <em>oft</em><em> ...?</em>:</p>\n\n<p>На этот вопрос часто отвечают с помощью ...</p>\n\n<p>... определительного местоимения&#160; <strong><em>jeden</em></strong><em>/</em><strong><em>jede</em></strong><em>/</em><strong><em>jedes</em></strong>:<br>\n<em>Yara arbeitet <strong>jeden</strong> Tag. (<strong>der</strong> Tag -&gt; <strong>jeder</strong> Tag -&gt; </em>Винительный падеж: <em><strong>jeden</strong> Tag)<br>\nMax, Tarek und Yara treffen sich <strong>jede</strong> Woche. (<strong>die</strong> Woche -&gt; <strong>jede</strong> Woche)<br>\nNico besucht Inge <strong>jedes</strong> Wochenende. (<strong>das</strong> Wochenende -&gt; <strong>jedes</strong> Wochenende)</em></p>\n\n<p>... числительного (<em>einmal</em>, <em>zweimal</em>, <em>dreimal</em> ...) с предлогом &#160;<strong><em>pro</em></strong>:<br>\n<em>Nina putzt zweimal <strong>pro</strong> Woche.</em></p>\n\n<p><em>... </em>наречий времени, указывающих на частоту или периодичность:<br>\n<em>Wir fahren <strong>fast immer</strong> mit dem Fahrrad. Wir fahren <strong>selten</strong> mit dem Auto.</em></p>\n\n\n\n<p>Эти наречия чаще всего стоят за спрягаемым глаголом. Поставив наречия в начало предложения, ты придашь им дополнительное значение.<br>\n<em>Wir fahren <strong>manchmal</strong> mit dem Bus.</em><br>\n<strong><em>Manchmal</em></strong><em> fahren wir mit dem Bus.</em></p>\n"}}, {"id": 40405325, "shortTitle": "zu + Adjektiv", "name": "zu + Adjektiv (1)", "text": "<p><br>\n<em>Wir suchen ein Haus mit vier Zimmern, Küche und Bad.</em><br>\n&#160;</p>\n\n<p><br>\n<em>Das Haus ist schön. Aber es ist <strong>zu klein</strong>.</em></p>\n\n<p><br>\n<br>\n<em>Das Haus ist schön. Aber es ist <strong>zu groß</strong>. Und es ist <strong>zu teuer</strong>!</em></p>\n\n<p><br>\nMit <em>zu</em> + Adjektiv drückt man aus, dass man das Maß, die Größe oder die Intensität von etwas nicht gut oder nicht richtig findet. Das heißt, man hält etwas für nicht passend oder nicht akzeptabel.</p>\n\n<p><em>Das Haus ist <strong>zu</strong> teuer.</em></p>\n\n<p>Das kann bedeuten:</p>\n\n<p>1. Der Preis für das Haus ist unangemessen hoch.</p>\n\n<p>2. Der Preis ist angemessen, aber ich habe nicht genug Geld, um das Haus zu bezahlen.</p>\n", "ru": {"name": "zu + прилагательное", "text": "\n\n<p><em>Wir suchen ein Haus mit vier Zimmern, Küche und Bad.</em></p>\n\n\n\n<p><em>Das Haus ist schön. Aber es ist <strong>zu klein</strong>.</em></p>\n\n\n\n<p><em>Das Haus ist schön. Aber es ist <strong>zu groß</strong>. Und es ist <strong>zu teuer</strong>!</em></p>\n\n\n\n<p>Конструкция <em>zu</em> + прилагательное выражает негативную оценку масштабов, степени или интенсивности чего-либо. Используя такую конструкцию, говорящий дает понять, что считает что-либо неуместным или неприемлемым.</p>\n\n<p><em>Das Haus ist <strong>zu</strong> teuer.</em></p>\n\n<p>Это может означать:</p>\n\n<p>1. Стоимость дома несоразмерно высока.</p>\n\n<p>2. Цена приемлемая, но у меня недостаточно денег для покупки дома.</p>\n"}}, {"id": 40485775, "shortTitle": "zu + Adjektiv", "name": "zu + Adjektiv (2)", "text": "<p>Mit <em>zu</em> + Adjektiv drückt man aus, dass man das Maß, die Größe oder die Intensität von etwas nicht gut oder nicht richtig findet. Das heißt, man hält etwas für nicht passend oder nicht akzeptabel.</p>\n\n<p><em>Das Hemd ist <strong>zu</strong> teuer.</em></p>\n\n<p>Das kann bedeuten:</p>\n\n<p>1. Der Preis für das Hemd ist unangemessen hoch.</p>\n\n<p>2. Der Preis ist angemessen, aber ich habe nicht genug Geld, um das Hemd zu bezahlen. Oder ich bin nicht bereit, für dieses Hemd so viel Geld auszugeben.</p>\n\n<p>In diesem Fall wird die subjektive Bedeutung betont: Für mich persönlich ist das Hemd zu teuer. Um das deutlicher zu machen, kann man zusätzlich das Personalpronomen im Dativ verwenden:</p>\n\n<p><em>Das Hemd ist <strong>mir</strong> zu teuer.</em></p>\n\n\n\n<p>Wenn man über Kleidung spricht, benutzt man diese Konstruktion häufig:</p>\n\n<p><em>Das Kleid ist <strong>mir</strong> zu groß.</em></p>\n\n<p><em>Die Schuhe sind <strong>mir</strong> zu klein.</em></p>\n\n<p><em>Die Hose ist <strong>mir</strong> zu lang.</em></p>\n\n<p><em>Der Rock ist <strong>mir</strong> zu kurz.</em></p>\n", "ru": null}]}, {"key": "sentenceStructure", "headline": "Satzbau", "grammars": [{"id": 39134924, "shortTitle": "Adversative Verbindungen", "name": "Adversative Verbindungen", "text": "<p><strong>Adversative Verbindungen</strong></p>\n\n<p>Adversative Konjunktionen verwendet man, um eine Einschränkung, einen Widerspruch oder einen Gegensatz auszudrücken. Zwei Konjunktionen, die man oft benutzt, sind <em>aber</em> und <em>doch</em>.</p>\n\n<p><em>Ich möchte eine eigene Praxis eröffnen, <strong>aber</strong> <strong>ich</strong> <strong>habe</strong> nicht genug Geld.</em></p>\n\n<p><em>Ich möchte eine eigene Praxis eröffnen, <strong>doch</strong> <strong>ich</strong> <strong>habe</strong> nicht genug Geld.</em></p>\n\n<p>Eine Einschränkung oder einen Gegensatz kannst du auch mit dem Adverb <em>jedoch</em> ausdrücken.</p>\n\n<p><em>Ich möchte eine eigene Praxis eröffnen, <strong>jedoch</strong> <strong>habe</strong> <strong>ich</strong> nicht genug Geld.</em></p>\n\n<p>Die Konjunktionen <em>aber </em>und<em> doch</em> stehen zwischen zwei Hauptsätzen. In beiden Hauptsätzen verändert sich die Reihenfolge der Satzteile nicht, wenn man die Sätze mit <em>aber </em>und <em>doch </em>&#160;verbindet. Deshalb sagt man, dass <em>aber</em> auf Position 0 steht.</p>\n\n<p>Bei Sätzen mit <em>jedoch</em> ist das in der Regel anders: <em>jedoch</em> steht meist auf Position 1 und dann folgt das konjugierte Verb. Man benutzt <em>jedoch</em> besonders in formellen Situationen und in geschriebenen Texten.</p>\n\n<p>Mehr Beispiele:</p>\n\n<p><em>Ich habe Informationen von der Bank bekommen, <strong>aber ich verstehe</strong> sie nicht.</em></p>\n\n<p><em>Ich habe Informationen von der Bank bekommen, <strong>jedoch verstehe ich</strong> sie nicht.<br>\n<br>\nIch bin ausgebildeter Arzt, <strong>aber meine Ausbildung</strong> <strong>ist</strong> in Deutschland noch nicht anerkannt.</em></p>\n\n<p><em>Ich bin ausgebildeter Arzt, <strong>jedoch ist meine Ausbildung</strong> in Deutschland noch nicht anerkannt.</em><br>\n<br>\nManchmal steht <em>aber</em> oder <em>jedoch</em> auch auf der dritten Position. Dann setzt man zwischen den beiden Hauptsätzen oft einen Punkt. Du kannst die Sätze aber auch mit Komma verbinden, besonders wenn das Subjekt in beiden Teilsätzen gleich ist. Im zweiten Teilsatz wird das Subjekt dann weggelassen.</p>\n\n<p>Beispiele:</p>\n\n<p><em>Ich bin kein reicher Mann, <strong>aber</strong> ich kann viel arbeiten.</em></p>\n\n<p><em>Ich bin kein reicher Mann. Ich kann <strong>aber</strong> viel arbeiten.<br>\nIch bin kein reicher Mann, kann <strong>aber</strong> viel arbeiten.</em></p>\n\n<p><em>Ich bin kein reicher Mann, <strong>jedoch</strong> kann ich viel arbeiten.</em></p>\n\n<p><em>Ich bin kein reicher Mann. Ich kann <strong>jedoch</strong> viel arbeiten.<br>\nIch bin kein reicher Mann, kann <strong>jedoch</strong> viel arbeiten.</em></p>\n", "ru": null}, {"id": 40555418, "shortTitle": "Doppelkonjunktionen", "name": "Doppelkonjunktionen (1)", "text": "<p><strong>Mehrteilige Konjunktionen: <em>zwar ... aber</em></strong></p>\n\n<p><em>Ich komme </em><strong>zwar</strong> aus Spanien, <strong>aber</strong> Deutschland ist mein Zuhause.</p>\n\n<p>Mit <em>zwar ... aber</em> drückt man eine Einschränkung aus: Zunächst macht man eine Aussage, die eine bestimmte Vermutung auslöst. Dann schränkt man diese Aussage ein. Wenn Yara sagt, dass sie aus Spanien kommt, vermutet man, dass sie Spanien als ihr Zuhause betrachtet. Dann sagt sie etwas, das nicht unbedingt zu dieser Vermutung passt: Deutschland ist ihr Zuhause, nicht Spanien. Das Wort <em>zwar</em> kann auch weggelassen werden, die Einschränkung wird dann aber weniger betont.</p>\n\n<p><em>zwar</em> … <em>aber</em> ist ein Beispiel für sogenannte Doppelkonjunktionen oder mehrteilige Konjunktionen. Das sind Konjunktionen, die mindestens aus zwei Teilen bestehen. Solche Konjunktionen mit voneinander getrennten Teilen verbinden gleichrangige Sätze oder Satzteile miteinander.</p>\n\n\n\n<p>Sätze:</p>\n\n<p>Wenn Doppelkonjunktionen zwei Sätze verbinden, dann hat jeder Satz in der Regel ein eigenes Subjekt und ein eigenes Verb.</p>\n\n<p><em>Tarek kommt aus der Türkei. – Er spricht meistens Deutsch.</em></p>\n\n<p><em>Tarek kommt zwar aus der Türkei, aber er spricht meistens Deutsch.</em></p>\n\n\n\n<p>Satzteile:</p>\n\n<p>Wenn Doppelkonjunktionen zwei Satzteile verbinden, haben sie oft ein gemeinsames Subjekt und/oder ein gemeinsames Verb.</p>\n\n<p><em>Deutschland war für Yara fremd. – Deutschland war für Yara interessant.</em></p>\n\n<p><em>Deutschland war für Yara zwar fremd, aber interessant.</em></p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe &#160;auf Deutsch:<br>\n\t\t\tdie Konjunktion: Konjunktionen (z. B. <em>und, oder, aber</em>) verbinden Sätze oder Satzteile miteinander.&#160;</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": {"name": "Двойные союзы", "text": "<p><strong>Двойные</strong> <strong>союзы</strong>: <strong><em>zwar ... aber</em></strong></p>\n\n<p><em>Ich komme </em><strong>zwar</strong> aus Spanien, <strong>aber</strong> Deutschland ist mein Zuhause.</p>\n\n<p>Двойной союз <em>zwar</em><em> ... </em><em>aber</em> выражает противопоставление. Предложение начинается с высказывания, которое позволяет сделать определенные выводы. Эти выводы опровергает, однако, второе высказывание. Когда Яра говорит, что она из Испании, можно предположить, что Испанию она считает своим домом. Но ее последующие слова не подкрепляют предположение: своим домом она считает не Испанию, а Германию. Если слово <em>zwar</em> опустить, противопоставление будет менее выраженным. &#160;&#160;</p>\n\n\n\n<p><em>zwar</em> … <em>aber</em>&#160; это пример так называемых двойных союзов. Такие союзы состоят минимум&#160; из двух частей, отделенных друг от друга в предложении. Они&#160;соединяют между собой равнозначные простые предложения в составе сложного или однородные члены предложения.</p>\n\n\n\n<p>Предложения:</p>\n\n<p>Когда двойные союзы соединяют два предложения, каждое из них имеет, как правило, собственное подлежащее и сказуемое.</p>\n\n\n\n<p><em>Tarek kommt aus der Türkei. – Er spricht meistens Deutsch.</em></p>\n\n<p><em>Tarek kommt zwar aus der Türkei, aber er spricht meistens Deutsch.</em></p>\n\n\n\n<p>Члены предложения:</p>\n\n<p>Когда двойные союзы соединяют два члена предложения, в предложении у них общее подлежащее и/или сказуемое.</p>\n\n\n\n<p><em>Deutschland war für Yara fremd. – Deutschland war für Yara interessant.</em></p>\n\n<p><em>Deutschland war für Yara zwar fremd, aber interessant.</em></p>\n\n\n\n\n\n<table border=\"1\" cellpadding=\"0\" cellspacing=\"0\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td style=\"width:614px\">\n\t\t\t<p>Грамматические термины немецкого языка:</p>\n\n\t\t\t<p>die Konjunktion: Союзы (например, <em>und</em>, <em>oder</em>, <em>aber</em>) соединяют между собой простые предложения в составе сложного или однородные члены предложения.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"}}, {"id": 39121068, "shortTitle": "Doppelkonjunktionen", "name": "Doppelkonjunktionen (2)", "text": "<p><strong>Mehrteilige Konjunktionen: <em>nicht nur ... sondern auch</em></strong></p>\n\n<p><em>Selma: „Ich interessiere mich <strong>nicht nur</strong> für Technik, <strong>sondern</strong> ich bin auch kreativ.“</em></p>\n\n<p><em>= „Ich interessiere mich für Technik <strong>und</strong> ich bin kreativ.“</em></p>\n\n<p>Man verwendet <em>nicht nur ... sondern auch</em>, wenn man mehrere Dinge aufzählen&#160;möchte. Selma sagt mit diesem Satz, dass sie mehr als eine Sache gut kann. Sie könnte auch die Konjunktion <em>und</em> benutzen. Aber mit <em>nicht nur ... sondern auch</em> betont&#160;sie beide Fähigkeiten stärker.</p>\n\n<p>Die Wörter<em> nicht nur ... sondern</em> <em>auch</em> werden zusammen als Konjunktion benutzt. Eine solche Konjunktion heißt „mehrteilige Konjunktion“ oder „Doppelkonjunktion“. Mehrteilige Konjunktionen verbinden gleichrangige Sätze oder Satzteile.<br>\n<br>\nManchmal sind das Verb und/oder das Subjekt in beiden Teilen gleich. Dann musst du sie nicht wiederholen:</p>\n\n<p><em>Ich bin <strong>nicht nur</strong> sportlich, <strong>sondern</strong> (ich bin) <strong>auch</strong> gut in Mathematik.</em></p>\n\n<p><em>= Ich bin <strong>nicht nur</strong> sportlich, <strong>sondern auch</strong> gut in Mathematik.</em></p>\n\n<p><em>Ich kann <strong>nicht nur</strong> malen, <strong>sondern</strong> (ich kann) <strong>auch</strong> zeichnen.</em></p>\n\n<p><em>= Ich kann <strong>nicht nur</strong> malen, <strong>sondern auch</strong> zeichnen.</em></p>\n", "ru": null}, {"id": 39121341, "shortTitle": "Doppelkonjunktionen", "name": "Doppelkonjunktionen (3)", "text": "<p><strong>Mehrteilige Konjunktionen: <em>entweder ... oder</em></strong></p>\n\n\n\n<p><strong><em>Entweder</em></strong><em> du redest mit mir <strong>oder</strong> ich bleibe den ganzen Tag hier vor deinem Haus stehen.</em></p>\n\n<p>Selma kann zwischen zwei Möglichkeiten wählen:</p>\n\n<p>Möglichkeit 1: Sie redet mit Nico.</p>\n\n<p>Möglichkeit 2: Sie redet nicht mit Nico. Dann bleibt er den ganzen Tag vor ihrem Haus stehen.</p>\n\n<p>Man benutzt also <em>entweder ... oder</em>, wenn es zwei Möglichkeiten gibt, von denen nur eine passieren oder stimmen kann. Oft bedeutet das, dass man wählen muss. <em>Entweder ... oder</em> hat die gleiche Bedeutung wie <em>oder</em>, aber mit <em>entweder</em> kann man die Bedeutung verstärken.</p>\n\n<p>Manchmal sind das Verb und/oder das Subjekt in beiden Teilen gleich. Dann musst du sie nicht wiederholen:</p>\n\n<p><strong><em>Entweder</em></strong><em> wir treffen uns heimlich in der WG <strong>oder</strong> (wir treffen uns) in der Stadt.</em></p>\n\n<p><em>= <strong>Entweder</strong> wir treffen uns heimlich in der WG <strong>oder</strong> in der Stadt.</em></p>\n\n<p>Das Wort <em>entweder</em> ist besonders stark, wenn es am Satzanfang steht. So kann man einer anderen Person sagen, dass sie wählen muss.</p>\n\n<p><strong><em>Entweder</em></strong><em> du sprichst mit mir <strong>oder</strong> ich rufe dich nie mehr an!</em></p>\n\n<p><em>entweder</em> kann aber auch in der Mitte des ersten Satzes stehen. Dann ist die Bedeutung nicht so stark.</p>\n\n<p><em>Ich rufe dich <strong>entweder</strong> an <strong>oder</strong> ich schicke dir eine Nachricht.</em></p>\n", "ru": null}, {"id": 39126827, "shortTitle": "Doppelkonjunktionen", "name": "Doppelkonjunktionen (4)", "text": "<p><strong>Mehrteilige Konjunktionen: <em>je ... desto</em></strong></p>\n\n<p><em>Wenn es <strong>heiß</strong> ist, trinke ich <strong>viel</strong>.<br>\nWenn es <strong>heißer</strong> ist, trinke ich <strong>mehr</strong>.<br>\nWenn es <strong>noch heißer</strong> ist, trinke ich <strong>noch mehr</strong>.</em></p>\n\n<p>Das kannst du auch in einem Satz sagen:</p>\n\n<p><strong><em>Je heißer</em></strong><em> es ist, <strong>desto mehr</strong> trinke ich.</em></p>\n\n<p>Die Doppelkonjunktion <em>je ... desto</em> drückt eine Beziehung zwischen zwei Faktoren (z. B. Temperatur und Wasserverbrauch) aus. Wenn der erste Faktor (die Temperatur) sich verändert, verändert der zweite Faktor (der Wasserverbrauch) sich auch.<br>\n<br>\n<strong>Satzstruktur</strong></p>\n\n<p>Nach <em>je</em> und nach <em>desto</em> steht der Komparativ.</p>\n\n<p><strong><em>Je</em></strong><em> schnell<strong>er</strong> ich laufe, <strong>desto </strong>müde<strong>r </strong>bin ich danach.</em></p>\n\n<p><em>je</em> leitet einen Nebensatz ein. Das konjugierte Verb steht deshalb im ersten Teilsatz am Ende.</p>\n\n<p><em>desto</em> leitet einen Hauptsatz ein. Das konjugierte Verb steht hinter dem Komparativ.</p>\n\n<p><em>Je kälter es <strong>ist</strong>, desto öfter <strong>habe</strong> ich Kopfschmerzen.</em></p>\n\n\n", "ru": null}, {"id": 39133121, "shortTitle": "Doppelkonjunktionen", "name": "Doppelkonjunktionen (5)", "text": "<p><strong>Mehrteilige Konjunktionen: <em>weder ... noch</em></strong></p>\n\n<p>Zwei negative Aussagen kannst du mit der mehrteiligen Konjunktion <em>weder ... noch ...</em> verbinden.</p>\n\n<p><em>Mit 20 Jahren durfte Inge <strong>nicht</strong> in der Öffentlichkeit rauchen und sie durfte <strong>keinen</strong> Alkohol trinken.</em></p>\n\n<p><em>= Mit 20 Jahren durfte Inge <strong>weder</strong> in der Öffentlichkeit rauchen <strong>noch</strong> Alkohol trinken.</em><br>\n<br>\nOft sind Subjekt und/oder konjugiertes Verb in beiden Aussagen gleich. Auch andere Satzteile können gleich sein. Diese Satzteile musst du dann im zweiten Teil nicht wiederholen.</p>\n\n<p>Beispiele:</p>\n\n<p><strong><em>Ich trinke</em></strong><em> keinen Wein. <strong>Ich trinke</strong> kein Bier.<br>\n= <strong>Ich trinke</strong> weder Wein noch Bier.</em></p>\n\n<p><strong><em>Mit 16 Jahren darf man</em></strong><em> nicht wählen. <strong>Mit 16 Jahren darf man</strong> keine Spirituosen kaufen.<br>\n= <strong>Mit 16 Jahren darf man</strong> weder wählen noch Spirituosen kaufen.</em></p>\n\n<p><strong><em>Kinder dürfen</em></strong><em> nicht Auto <strong>fahren</strong>. <strong>Kinder dürfen</strong> nicht Motorrad <strong>fahren</strong>.<br>\n= <strong>Kinder dürfen</strong> weder Auto noch Motorrad <strong>fahren</strong>.</em></p>\n\n<p><em>Inge <strong>trinkt heute keinen Alkohol</strong>. Jacques <strong>trinkt heute keinen Alkohol.</strong><br>\n= Weder Inge noch Jacques <strong>trinken heute Alkohol.</strong></em><br>\n<br>\nWenn sich das konjugierte Verb in beiden Aussagen unterscheidet, dann steht <em>weder</em> meist am Satzanfang oder hinter dem konjugierten Verb. <em>noch </em>steht direkt vor dem zweiten konjugierten Verb. Das Subjekt kann man im zweiten Satzteil in der Regel nicht weglassen, vor allem wenn noch ein Objekt folgt.</p>\n\n<p><em>Ich trinke keinen Alkohol. Ich rauche keine Zigaretten.<br>\n<strong>Weder trinke ich</strong> Alkohol <strong>noch rauche ich</strong> Zigaretten.<br>\n<strong>Ich trinke weder</strong> Alkohol <strong>noch rauche ich</strong> Zigaretten.</em></p>\n", "ru": null}, {"id": 40609044, "shortTitle": "Finalsätze: damit", "name": "Finalsätze: damit", "text": "<p><strong>Finale Nebensätze, die mit <em>damit</em></strong> <strong>eingeleitet werden</strong></p>\n\n<p>Finale Nebensätze sind von einem übergeordneten Satz abhängig, in dem meist eine Handlung beschrieben wird.</p>\n\n<p>Handlung: <em>Wir kaufen einen Saugroboter.</em></p>\n\n<p>Der finale Nebensatz gibt den Zweck, die Absicht oder das Ziel der beschriebenen Handlung oder des Sachverhalts an.&#160;Er wird mit <em>damit</em> eingeleitet und durch ein Komma vom übergeordneten Satz abgetrennt. Das Verb des finalen Nebensatzes wird konjugiert und steht am Satzende.</p>\n\n<p><em>Wir kaufen einen Saugroboter, <strong>damit die Wohnung schneller sauber wird</strong>.</em><br>\n&#160;</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\n\t\t\t<p>die <span class=\"invalid_placeholder\">Konjunktion</span>:&#160;Konjunktionen verbinden Sätze oder Satzteile miteinander.&#160; Man unterscheidet zwei Arten von Konjunktionen:</p>\n\n\t\t\t<p>1. Konjunktionen, die gleichrangige Sätze oder Satzteile miteinander verbinden, z. B.: <em>und</em>, <em>oder</em>, <em>aber</em>. Man nennt sie auch nebenordnende Konjunktionen.</p>\n\n\t\t\t<p>2. Konjunktionen, die untergeordnete Sätze mit übergeordneten Sätzen verbinden, z. B.: <em>weil</em>, <em>dass</em>. Man nennt sie auch unterordnende Konjunktionen.</p>\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n", "ru": null}, {"id": 40608964, "shortTitle": "Finalsätze: um ... zu ", "name": "Finalsätze: um ... zu (1)", "text": "<p><strong>Finalsätze, die mit <em>um ... zu</em> eingeleitet werden</strong></p>\n\n<p>Finalsätze sind von einem übergeordneten Satz abhängig, in dem meist eine Handlung beschrieben wird.</p>\n\n<p>Handlung: <em>Wir kaufen einen Saugroboter.</em></p>\n\n<p>Der Finalsatz gibt den Zweck, die Absicht oder das Ziel der beschriebenen Handlung oder des Sachverhalts&#160;an. Er wird durch ein Komma vom übergeordneten Satz abgetrennt.</p>\n\n<p><em>Wir kaufen einen Saugroboter, <strong>um Zeit zu sparen</strong>.</em><br>\n<br>\nEin finaler Nebensatz mit <em>um … zu</em> wird mit der Konjunktion <em>um</em> eingeleitet. Das Verb des Finalsatzes steht am Satzende. Man verwendet die Infinitivform des Verbs (+ <em>zu</em>). Das Verb wird also nicht konjugiert. Handelt es sich um ein trennbares Verb, wird <em>zu</em> hinter dem Präfix in das Verb eingefügt.</p>\n\n<p><em>Ich brauche eine große Tasche, <strong>um die leeren Flaschen weg</strong>zu<strong>bringen</strong>.</em></p>\n\n<p>Der Finalsatz mit <em>um ... zu</em> hat kein eigenes Subjekt. Deshalb ist diese Satzstruktur nur möglich, wenn das Subjekt im übergeordneten Satz und im Finalsatz identisch ist.</p>\n\n<p><strong><em>Ich</em></strong><em> hole einen Besen. <strong>Ich </strong>kehre die Terrasse.</em></p>\n\n<p><strong><em>Ich </em></strong><em>hole einen Besen, um die Terrasse zu kehren.</em></p>\n\n<p>Wenn das Subjekt nicht identisch ist, kannst du einen finalen Nebensatz verwenden, der mit der Konjunktion <em>damit</em> eingeleitet wird.</p>\n\n\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:500px\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t<p>Grammatische Begriffe auf Deutsch:</p>\n\t\t\tder Infinitiv: Der Infinitiv ist die Grundform des Verbs, die nicht konjugiert ist. In dieser Form steht ein Verb normalerweise in Vokabellisten oder im Wörterbuch. Deutsche Verben enden im Infinitiv meist auf <em>-(e)n</em>.</td>\n\t\t</tr>\n\t</tbody>\n</table>\n\n\n", "ru": {"name": "Придаточное цели: um ... zu", "text": "<p><strong>Придаточное цели с инфинитивной конструкцией&#160;<em>um ... zu</em></strong></p>\n\n<p>Придаточные цели зависят от главного предложения, в котором обычно описывается действие.</p>\n\n<p>Действие: <em>Wir kaufen einen Saugroboter.</em></p>\n\n<p>Придаточное цели уточняет смысл, намерение или цель описываемых действий или ситуаций. Придаточное цели отделяется от главного предложения запятой.</p>\n\n<p><em>
